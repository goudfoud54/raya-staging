<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Eatime360 — TEST</title>
<script src="../theme.js"></script>
<script>(function(){var t=localStorage.getItem('eatime_theme');document.documentElement.setAttribute('data-theme',t==='light'?'light':'dark');})();</script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root, [data-theme="dark"]{--gold:#c8a035;--bg:#0b0b15;--card:#15151f;--surface:#1c1c28;--line:rgba(255,255,255,.06);--line-2:rgba(255,255,255,.14);--text:#e8e8ec;--muted:#7b7b8a;--ok:#3fb87f;--bad:#c45a5a}
[data-theme="light"]{--gold:#c8a035;--bg:#f5f5f7;--card:#ffffff;--surface:#f0f0f3;--line:rgba(0,0,0,.06);--line-2:rgba(0,0,0,.12);--text:#1a1a1f;--muted:#6b6b78;--ok:#2a8f5f;--bad:#b04444}
html,body{height:100%}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,sans-serif;background:var(--bg);min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:30px 20px;color:var(--text)}
.hidden{display:none!important}
a{color:var(--gold);text-decoration:none}
button{cursor:pointer;border:none;background:none;color:var(--text);font-family:inherit}

.test{background:#b03a3a;color:#fff;padding:6px 16px;border-radius:20px;font-size:11px;font-weight:700;margin-bottom:18px;letter-spacing:.04em}
.logo{color:var(--gold);font-size:30px;font-weight:800;text-align:center;margin-bottom:4px}
.logo span{display:block;font-size:13px;color:var(--muted);font-weight:400;margin-top:4px;letter-spacing:.05em}

.btn{padding:12px 22px;border-radius:10px;background:var(--gold);color:#1a1a1a;font-weight:700;font-size:14px;border:none}
.btn.ghost{background:transparent;color:var(--text);border:1px solid var(--line-2)}
.btn.sm{padding:7px 14px;font-size:12px}

/* LOGIN VIEW */
.auth{margin-top:40px;display:flex;flex-direction:column;gap:12px;align-items:center;width:100%;max-width:320px}
.auth input{width:100%;padding:13px 18px;border-radius:10px;border:1px solid var(--line-2);background:var(--surface);color:var(--text);font-size:15px;text-align:center;outline:none}
.auth input:focus{border-color:var(--gold)}
.auth .btn{width:100%}
.err{color:var(--bad);font-size:12.5px;min-height:18px;text-align:center}
.alt{color:var(--muted);font-size:12.5px;margin-top:4px}
.alt a{color:var(--gold);cursor:pointer}

/* APP VIEW */
.user-bar{display:flex;align-items:center;gap:12px;margin-top:18px;padding:10px 18px;background:var(--card);border:1px solid var(--line);border-radius:30px;font-size:13px}
.user-bar .av{width:32px;height:32px;border-radius:50%;background:var(--gold);color:#111;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px}
.role-tag{padding:2px 9px;border-radius:20px;background:rgba(200,160,53,.15);color:var(--gold);font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.05em}
.modules{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:18px;max-width:740px;width:100%;margin-top:32px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:26px 20px;text-align:center;text-decoration:none;color:var(--text);transition:.2s;cursor:pointer;display:block}
.card:hover{border-color:rgba(200,160,53,.5);transform:translateY(-2px)}
.card .ic{font-size:30px;margin-bottom:10px}
.card .nm{font-weight:700;font-size:15px}
.card .ds{color:var(--muted);font-size:12px;margin-top:4px}
.footer{margin-top:30px;color:var(--muted);font-size:11px;text-align:center}
</style>
</head>
<body>
<div class="test">ENVIRONNEMENT DE TEST</div>

<!-- LOGIN -->
<div id="loginView" class="hidden">
  <div class="logo">Eatime360<span id="lblView">Connexion à ton compte</span></div>
  <div id="loginBlock" class="auth">
    <input type="email" id="loginEmail" placeholder="Email" autocomplete="email">
    <input type="password" id="loginPw" placeholder="Mot de passe" autocomplete="current-password" onkeydown="if(event.key==='Enter')login()">
    <button class="btn" onclick="login()">Se connecter</button>
    <div class="err" id="err"></div>
    <div class="alt">Pas de compte ? <a onclick="showSignup()">Créer un compte</a></div>
  </div>
  <div id="signupBlock" class="auth hidden">
    <input type="text" id="signupName" placeholder="Nom complet">
    <input type="email" id="signupEmail" placeholder="Email" autocomplete="email">
    <input type="password" id="signupPw" placeholder="Mot de passe (8 caractères min)" autocomplete="new-password">
    <button class="btn" onclick="signup()">Créer mon compte</button>
    <div class="err" id="err2"></div>
    <div class="alt">Déjà inscrit ? <a onclick="showLogin()">Se connecter</a></div>
  </div>
</div>

<!-- APP (after login) -->
<div id="appView" class="hidden" style="width:100%;display:flex;flex-direction:column;align-items:center">
  <div class="logo">Eatime360<span>Tableau de bord</span></div>
  <div class="user-bar">
    <div class="av" id="userAv">?</div>
    <div><div id="userName" style="font-weight:600">—</div><div style="color:var(--muted);font-size:11px" id="userEmail">—</div></div>
    <span class="role-tag" id="userRole">—</span>
    <button class="btn ghost sm" onclick="logout()">↩ Déconnexion</button>
  </div>
  <div class="modules" id="modules"></div>
  <div class="footer">Eatime360 · v6.2 · Planning : rôles persistants · tooltips pictos · coûts réactifs · accordéon stable · fix faux positif ★</div>
</div>

<script>
const SUPA_URL='https://ynnqvtfayrdteqtgxeuk.supabase.co';
const SUPA_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InlubnF2dGZheXJkdGVxdGd4ZXVrIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzk4OTE1MTQsImV4cCI6MjA5NTQ2NzUxNH0._mfVAGexu7ew38UQk6adn42az4Gt_J3ePxR6O6wuWHc';
const sb=supabase.createClient(SUPA_URL,SUPA_KEY);
let ME=null,MAINT={};

const MODULES=[
  {id:'salaries',ic:'👥',nm:'Gestion Salariés',ds:'Fiches, dispos, contraintes, docs'},
  {id:'calendrier',ic:'📅',nm:'Calendrier RH',ds:'Fins essai/CDD, visites med, RDV, sanctions'},
  {id:'avertissements',ic:'⚠️',nm:'Avertissements',ds:'Sanctions, procédure légale, lettres PDF', adminOnly:true},
  {id:'pilotage',ic:'📋',nm:'Pilotage d\'équipe',ds:'Kanban tâches assignées aux salariés'},
  {id:'planning',ic:'📅',nm:'Planning',ds:'Grille hebdo, auto-fill, vérifs'},
  {id:'badgeuse',ic:'⏱',nm:'Badgeuse',ds:'Kiosk de pointage (1 par snack)'},
  {id:'dispos',ic:'📆',nm:'Mes indispos',ds:'Espace salarié — demandes'},
  {id:'moi',ic:'👤',nm:'Mon Espace',ds:'Planning, indispos, pointages perso'},
  {id:'haccp',ic:'🌡',nm:'HACCP',ds:'T°, huiles, réception, nettoyage'},
  {id:'haccp-kiosk',ic:'📱',nm:'HACCP Kiosque',ds:'Saisie terrain par PIN salarié'},
  {id:'finance',ic:'📈',nm:'Finance',ds:'CA, dépenses, trésorerie, marge'},
  {id:'stock',ic:'📦',nm:'Stock (admin)',ds:'Référentiel, dashboard, feuille de besoin'},
  {id:'stock-kiosk',ic:'📱',nm:'Stock Kiosque',ds:'Inventaire terrain par PIN salarié'},
  {id:'facturation',ic:'🧾',nm:'Facturation',ds:'BL, factures, suivi des paiements'},
  {id:'parametres',ic:'⚙',nm:'Paramètres',ds:'Identité, couleurs, accès, permissions'}
];
const ROLE_LBL={super_admin:'Super admin',admin:'Admin',manager:'Manager',salarie:'Salarié'};
// Defaults si org.permissions absent
const DEFAULT_PERMS={moi:['*'],'import-contrats':['admin','manager'],salaries:['admin'],calendrier:['admin','manager'],avertissements:['admin'],pilotage:['admin','manager'],planning:['admin','manager'],badgeuse:['*'],dispos:['*'],haccp:['admin','manager'],'haccp-kiosk':['*'],finance:['admin'],stock:['admin','manager'],'stock-kiosk':['*'],facturation:['admin'],parametres:['admin']};

function showSignup(){document.getElementById('loginBlock').classList.add('hidden');document.getElementById('signupBlock').classList.remove('hidden');document.getElementById('lblView').textContent='Créer un compte';document.getElementById('err').textContent='';document.getElementById('err2').textContent='';}
function showLogin(){document.getElementById('signupBlock').classList.add('hidden');document.getElementById('loginBlock').classList.remove('hidden');document.getElementById('lblView').textContent='Connexion à ton compte';document.getElementById('err').textContent='';document.getElementById('err2').textContent='';}

async function login(){
  const email=document.getElementById('loginEmail').value.trim();
  const password=document.getElementById('loginPw').value;
  if(!email||!password){document.getElementById('err').textContent='Email + mot de passe requis';return;}
  document.getElementById('err').textContent='Connexion…';
  const{error}=await sb.auth.signInWithPassword({email,password});
  if(error){document.getElementById('err').textContent=error.message;return;}
  await loadProfileAndShow();
}
async function signup(){
  const email=document.getElementById('signupEmail').value.trim();
  const password=document.getElementById('signupPw').value;
  const name=document.getElementById('signupName').value.trim();
  if(!email||!password||password.length<8){document.getElementById('err2').textContent='Email + mdp 8+ caractères requis';return;}
  document.getElementById('err2').textContent='Création du compte…';
  const{error}=await sb.auth.signUp({email,password,options:{data:{full_name:name}}});
  if(error){document.getElementById('err2').textContent=error.message;return;}
  await sb.auth.signInWithPassword({email,password});
  await loadProfileAndShow();
}
let ORG=null;
async function loadProfileAndShow(){
  const{data:{session}}=await sb.auth.getSession();
  if(!session)return;
  const{data:profile,error}=await sb.from('profiles').select('*').eq('id',session.user.id).maybeSingle();
  if(error||!profile){document.getElementById('err').textContent='Profil introuvable.';await sb.auth.signOut();return;}
  ME=profile;
  // Si rôle salarie → redirection auto vers Mon Espace
  if(profile.role==='salarie' && !location.search.includes('stay')){
    location.href='moi/';return;
  }
  // Charge l'org pour le thème + permissions + état maintenance global
  const[orgRes,modRes]=await Promise.all([
    sb.from('organizations').select('*').eq('id',profile.organization_id).maybeSingle(),
    sb.from('system_modules').select('module_id,en_maintenance,message_maintenance'),
  ]);
  ORG=orgRes.data||{};
  MAINT={};(modRes.data||[]).forEach(m=>{MAINT[m.module_id]={en_maintenance:m.en_maintenance,message:m.message_maintenance};});
  applyTheme();
  // BLOCAGE si org suspendue (sauf super_admin)
  if(ORG.suspended===true && ME.role!=='super_admin'){
    showSuspended();
    return;
  }
  showApp();
}
function showSuspended(){
  document.getElementById('loginView').classList.add('hidden');
  document.body.innerHTML=`
    <div style="min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:30px;text-align:center;background:var(--bg)">
      <div style="font-size:54px;margin-bottom:14px">🚫</div>
      <div style="color:var(--bad);font-size:22px;font-weight:700;margin-bottom:10px">Votre compte est suspendu</div>
      <div style="color:var(--muted);max-width:420px;font-size:14px;line-height:1.5;margin-bottom:24px">L'accès à votre organisation a été temporairement suspendu.<br>Merci de contacter le service client pour régulariser la situation.</div>
      ${ORG.suspended_reason?`<div style="background:var(--card);border:1px solid var(--line);padding:10px 16px;border-radius:8px;font-size:12px;color:var(--muted);margin-bottom:24px">Motif : ${ORG.suspended_reason}</div>`:''}
      <button class="btn ghost" style="padding:10px 18px;border-radius:10px;background:transparent;color:var(--text);border:1px solid var(--line-2);font-weight:600;font-size:13px;cursor:pointer" onclick="logout()">↩ Déconnexion</button>
    </div>`;
}
function applyTheme(){
  if(ORG.couleur_primaire) document.documentElement.style.setProperty('--gold',ORG.couleur_primaire);
}
async function logout(){await sb.auth.signOut();ME=null;location.reload();}

function showApp(){
  document.getElementById('loginView').classList.add('hidden');
  document.getElementById('appView').classList.remove('hidden');
  document.getElementById('userName').textContent=ME.full_name||ME.email||'—';
  document.getElementById('userEmail').textContent=ME.email||'';
  document.getElementById('userRole').textContent=ROLE_LBL[ME.role]||ME.role;
  document.getElementById('userAv').textContent=(ME.full_name||ME.email||'?').charAt(0).toUpperCase();
  // Logo (remplace l'avatar si défini, sans fond coloré)
  const avEl=document.getElementById('userAv');
  if(ORG.logo_url){avEl.innerHTML=`<img src="${ORG.logo_url}" style="max-width:32px;max-height:32px;object-fit:contain">`;avEl.style.background='transparent';}
  else{avEl.style.background='';}
  // Permissions depuis l'org (ou defaults)
  const perms=ORG.permissions||DEFAULT_PERMS;
  const isSuper=ME.role==='super_admin';
  const allowed=MODULES.filter(m=>{
    if(isSuper)return true;
    const rs=perms[m.id]||[];
    return rs.includes('*')||rs.includes(ME.role);
  });
  document.getElementById('modules').innerHTML=allowed.map(m=>{
    const mt=MAINT[m.id];
    const blocked=mt && mt.en_maintenance && !isSuper;
    if(blocked){
      return `<div class="card" style="opacity:.5;cursor:not-allowed;position:relative" title="${(mt.message||'Module en maintenance').replace(/"/g,'&quot;')}"><div style="position:absolute;top:8px;right:8px;background:var(--bad);color:#fff;font-size:9.5px;font-weight:700;padding:2px 8px;border-radius:20px;text-transform:uppercase;letter-spacing:.05em">🔧 Maintenance</div><div class="ic" style="filter:grayscale(1)">${m.ic}</div><div class="nm">${m.nm}</div><div class="ds" style="color:var(--bad);font-size:11px">${mt.message||'Indisponible'}</div></div>`;
    }
    const badgeSuper=mt && mt.en_maintenance && isSuper ? '<div style="position:absolute;top:8px;right:8px;background:var(--warn);color:#111;font-size:9.5px;font-weight:700;padding:2px 8px;border-radius:20px;text-transform:uppercase;letter-spacing:.05em">🔧 Maint (super)</div>' : '';
    return `<a class="card" href="${m.id}/" style="position:relative">${badgeSuper}<div class="ic">${m.ic}</div><div class="nm">${m.nm}</div><div class="ds">${m.ds}</div></a>`;
  }).join('')||'<div style="color:var(--muted);text-align:center;padding:30px">Aucun module accessible avec ton rôle.</div>';
}

sb.auth.getSession().then(({data})=>{
  if(data.session) loadProfileAndShow();
  else document.getElementById('loginView').classList.remove('hidden');
});
</script>
<script defer src="assistant-widget.js?v=4.8"></script>
</body>
</html>
