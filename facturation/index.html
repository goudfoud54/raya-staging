<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<script>(function(){var t=localStorage.getItem("eatime_theme");document.documentElement.setAttribute("data-theme",t==="light"?"light":"dark");})();</script>
<title>Eatime360 — Facturation</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../access.js?v=6.30"></script>
<script src="../utils.js?v=1.2"></script>
<link rel="stylesheet" href="../ui.css?v=1">
<script src="../ui.js?v=1"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.31/jspdf.plugin.autotable.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root, [data-theme="dark"]{--gold:#c8a035;--bg:#0b0b15;--card:#15151f;--surface:#1c1c28;--line:rgba(255,255,255,.06);--line-2:rgba(255,255,255,.14);--text:#e8e8ec;--muted:#7b7b8a;--ok:#3fb87f;--warn:#e0a93a;--bad:#c45a5a;--info:#5b9cff}
[data-theme="light"]{--gold:#c8a035;--bg:#f5f5f7;--card:#ffffff;--surface:#f0f0f3;--line:rgba(0,0,0,.06);--line-2:rgba(0,0,0,.12);--text:#1a1a1f;--muted:#6b6b78;--ok:#2a8f5f;--warn:#b8841f;--bad:#b04444;--info:#4a7fbd}
html,body{height:100%}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;font-size:14px}
a{color:var(--gold);text-decoration:none}
.hidden{display:none!important}
/* Style de base commun à tous les champs du module : fond + texte du thème, lisible en clair comme en sombre.
   Les classes spécifiques (.toolbar, .fld, .line-row, .lock…) ne surchargent que taille/largeur/alignement.
   Corrige le bug d'illisibilité des conteneurs sans style dédié (ex. .grid4 du formulaire de paiement). */
input,select,textarea{font-family:inherit;color:var(--text);background:var(--surface);border:1px solid var(--line-2);border-radius:7px;padding:9px 11px;font-size:13px;outline:none}
button{font-family:inherit;color:var(--text);cursor:pointer;border:none;background:none}
.btn{padding:9px 14px;border-radius:8px;background:var(--gold);color:#1a1a1a;font-weight:600;font-size:13px;border:none;display:inline-flex;align-items:center;gap:6px}
.btn.ghost{background:transparent;color:var(--text);border:1px solid var(--line-2)}
.btn.bad{background:var(--bad);color:#fff}
.btn.ok{background:var(--ok);color:#111}
.btn.sm{padding:6px 11px;font-size:12px}
.lock{position:fixed;inset:0;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:20px}
.lock h1{color:var(--gold);font-size:22px}
.lock input{padding:12px 16px;border-radius:10px;border:1px solid var(--line-2);background:var(--surface);color:var(--text);font-size:14px;width:280px;outline:none;text-align:center}
.err{color:var(--bad);font-size:12px;min-height:16px}
.header{display:flex;align-items:center;justify-content:space-between;padding:14px 24px;border-bottom:1px solid var(--line);flex-wrap:wrap;gap:10px}
.brand{color:var(--gold);font-weight:700;font-size:16px}
.brand small{color:var(--muted);font-weight:400;font-size:12px;margin-left:8px}
.tabs{display:flex;gap:2px;padding:0 24px;border-bottom:1px solid var(--line);overflow-x:auto}
.tabs button{padding:11px 16px;border-bottom:2px solid transparent;color:var(--muted);font-weight:600;font-size:13px;white-space:nowrap}
.tabs button.active{color:var(--gold);border-color:var(--gold)}
.wrap{max-width:1400px;margin:0 auto;padding:24px 24px 60px}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:18px;align-items:center}
.toolbar select,.toolbar input{padding:8px 12px;border-radius:7px;border:1px solid var(--line-2);background:var(--surface);color:var(--text);font-size:13px;outline:none}
.grid{display:grid;gap:14px}
.grid.cards{grid-template-columns:repeat(auto-fill,minmax(220px,1fr))}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:18px}
.kpi .lbl{color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.05em;font-weight:600}
.kpi .val{font-size:28px;font-weight:800;margin-top:6px}
.kpi .sub{color:var(--muted);font-size:11.5px;margin-top:4px}
.kpi.ok .val{color:var(--ok)} .kpi.bad .val{color:var(--bad)} .kpi.warn .val{color:var(--warn)} .kpi.info .val{color:var(--info)}
table.tbl{width:100%;border-collapse:collapse;font-size:13px;background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden}
table.tbl th,table.tbl td{padding:9px 12px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle}
table.tbl th{font-size:10.5px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.05em;background:var(--surface)}
table.tbl tr:last-child td{border-bottom:none}
table.tbl tr:hover{background:rgba(127,127,127,.04)}
table.tbl tfoot td{background:var(--surface);font-weight:700}
.badge{display:inline-block;padding:2px 8px;border-radius:20px;font-size:10.5px;font-weight:700;text-transform:uppercase}
.badge.ok{background:rgba(63,184,127,.15);color:var(--ok)}
.badge.bad{background:rgba(196,90,90,.15);color:var(--bad)}
.badge.warn{background:rgba(224,169,58,.15);color:var(--warn)}
.badge.info{background:rgba(91,156,255,.15);color:var(--info)}
.section{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:20px;margin-bottom:16px}
.section h3{font-size:11.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;margin-bottom:14px;font-weight:600}
.fld{margin-bottom:12px}
.fld label{display:block;font-size:11.5px;color:var(--muted);margin-bottom:5px;font-weight:500}
.fld input,.fld textarea,.fld select{width:100%;padding:9px 11px;border-radius:7px;border:1px solid var(--line-2);background:var(--surface);color:var(--text);font-size:13px;outline:none}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
.grid4{display:grid;grid-template-columns:2fr 1fr 1fr 1fr;gap:8px;align-items:center}
@media(max-width:700px){.grid2,.grid3,.grid4{grid-template-columns:1fr}}
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.7);display:flex;align-items:center;justify-content:center;z-index:100;padding:20px}
.modal{background:var(--card);border:1px solid var(--line-2);border-radius:14px;padding:24px;max-width:780px;width:100%;max-height:90vh;overflow-y:auto}
.modal h2{font-size:16px;font-weight:700;margin-bottom:14px}
.modal-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:18px}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#222;border:1px solid var(--line-2);padding:11px 22px;border-radius:10px;font-size:13px;opacity:0;transition:.25s;z-index:200;color:#fff}
.toast.show{opacity:1}
.line-row{display:grid;grid-template-columns:3fr 1fr 1fr 1fr 1fr auto;gap:8px;align-items:center;padding:6px 0;border-bottom:1px solid var(--line)}
.line-row input,.line-row select{padding:7px 9px;border-radius:6px;border:1px solid var(--line-2);background:var(--surface);color:var(--text);font-size:12.5px}
</style>
</head>
<body>

<div id="lock" class="lock hidden">
  <h1>Facturation</h1>
  <div style="color:var(--muted);font-size:13px">Connexion requise</div>
  <input type="email" id="loginEmail" placeholder="Email">
  <input type="password" id="loginPw" placeholder="Mot de passe" onkeydown="if(event.key==='Enter')login()">
  <button class="btn" onclick="login()">Se connecter</button>
  <div class="err" id="err"></div>
  <a href="../" style="font-size:12px;color:var(--muted)">← Portail</a>
</div>

<div id="app" class="hidden">
  <div class="header">
    <div class="brand">Eatime360 <small>· Facturation · v0.7 — facture par regroupement de bons + lignes à l'écran (même source que le PDF)</small></div>
    <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">
      <a href="../" class="btn ghost sm">Portail</a>
      <button class="btn ghost sm" onclick="logout()">↩</button>
    </div>
  </div>
  <div class="tabs">
    <button data-tab="dashboard" class="active" onclick="setTab('dashboard')">📊 Dashboard</button>
    <button data-tab="factures" onclick="setTab('factures')">🧾 Factures</button>
    <button data-tab="bls" onclick="setTab('bls')">📦 Bons de livraison</button>
    <button data-tab="clients" onclick="setTab('clients')">👥 Clients</button>
    <button data-tab="catalogue" onclick="setTab('catalogue')">📚 Catalogue produits</button>
    <button data-tab="parametres" onclick="setTab('parametres')">⚙ Paramètres facturation</button>
  </div>
  <div class="wrap" id="content"></div>
</div>

<div id="modalHost"></div>
<div class="toast" id="toast"></div>

<script>
const SUPA_URL='https://ynnqvtfayrdteqtgxeuk.supabase.co';
const SUPA_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InlubnF2dGZheXJkdGVxdGd4ZXVrIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzk4OTE1MTQsImV4cCI6MjA5NTQ2NzUxNH0._mfVAGexu7ew38UQk6adn42az4Gt_J3ePxR6O6wuWHc';
const sb=supabase.createClient(SUPA_URL,SUPA_KEY);
let ME=null,ORG={},TAB='dashboard';
const S={clients:[],produits:[],factures:[],bls:[],fparam:null};
const TVA_TAUX=[0,5.5,10,20];
const STATUTS={emise:'Émise',partiel:'Partiel',paye:'Payée',annulee:'Annulée'};
const MODES={cb:'CB',especes:'Espèces',virement:'Virement',cheque:'Chèque',autre:'Autre'};

let tt;function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('show'),2200);}
function val(id){const e=document.getElementById(id);return e?(e.value||'').trim():'';}
function num(id){const v=val(id);return v===''?null:parseFloat(v.replace(',','.'));}
/* fmtD factorisé dans utils.js (C3) */
function eur(n){if(n==null||isNaN(n))return'0,00 €';return Number(n).toLocaleString('fr-FR',{minimumFractionDigits:2,maximumFractionDigits:2})+' €';}
function nameClient(id){const c=S.clients.find(x=>x.id===id);return c?c.nom:'—';}

async function login(){const{error}=await sb.auth.signInWithPassword({email:val('loginEmail'),password:val('loginPw')});if(error){document.getElementById('err').textContent=error.message;return;}await loadProfileAndShow();}
async function loadProfileAndShow(){
  const{data:{session}}=await sb.auth.getSession();if(!session)return;
  const{data:profile}=await sb.from('profiles').select('*').eq('id',session.user.id).maybeSingle();
  if(!profile){document.getElementById('err').textContent='Profil introuvable.';await sb.auth.signOut();return;}
  ME=profile;
  const{data:org}=await sb.from('organizations').select('*').eq('id',profile.organization_id).maybeSingle();ORG=org||{};
  // Accès contrôlé par la config org (access.js), plus de liste de rôles codée en dur.
  if(!EatimeAccess.canAccessModule('facturation', profile, ORG.permissions)){document.body.innerHTML=EatimeAccess.renderAccessDenied('Facturation');return;}
  if(ORG.couleur_primaire) document.documentElement.style.setProperty('--gold',ORG.couleur_primaire);
  if(ORG.suspended && ME.role!=='super_admin'){document.body.innerHTML='<div style="min-height:100vh;display:flex;align-items:center;justify-content:center;color:var(--bad);font-size:18px;text-align:center;padding:20px">🚫 Organisation suspendue.</div>';return;}
  document.getElementById('lock').classList.add('hidden');document.getElementById('app').classList.remove('hidden');
  await loadCommonData();render();
}
async function logout(){await sb.auth.signOut();location.reload();}
sb.auth.getSession().then(({data})=>{if(data.session)loadProfileAndShow();else document.getElementById('lock').classList.remove('hidden');});

async function loadCommonData(){
  const[c,p,fp]=await Promise.all([
    sb.from('clients').select('*').eq('organization_id',ORG.id).order('nom'),
    sb.from('produits').select('*').eq('organization_id',ORG.id).order('nom'),
    sb.from('fact_parametres').select('*').eq('organization_id',ORG.id).maybeSingle(),
  ]);
  S.clients=c.data||[];S.produits=p.data||[];S.fparam=fp.data||null;
}
function setTab(t){TAB=t;document.querySelectorAll('.tabs button').forEach(b=>b.classList.toggle('active',b.dataset.tab===t));render();}

function render(){
  const el=document.getElementById('content');
  if(TAB==='dashboard') return renderDashboard(el);
  if(TAB==='factures') return renderFactures(el);
  if(TAB==='bls') return renderBLs(el);
  if(TAB==='clients') return renderClients(el);
  if(TAB==='catalogue') return renderCatalogue(el);
  if(TAB==='parametres') return renderParametres(el);
}

// ─────── DASHBOARD ───────
async function renderDashboard(el){
  el.innerHTML='<div style="color:var(--muted)">Chargement…</div>';
  const{data:facs}=await sb.from('factures').select('*,clients(nom),fact_paiements(montant)').eq('organization_id',ORG.id).order('date_facture',{ascending:false});
  const F=facs||[];
  let totTTC=0,totEncaisse=0,totRestant=0,nbEmis=0,nbPaye=0;
  F.forEach(f=>{
    const ttc=Number(f.total_ttc)||0;totTTC+=ttc;
    const paye=encaisseFacture(f);
    totEncaisse+=Math.min(paye,ttc);
    totRestant+=Math.max(0,ttc-paye);
    if(f.statut==='emise'||f.statut==='partiel')nbEmis++;
    if(f.statut==='paye')nbPaye++;
  });
  const annee=new Date().getFullYear();
  const cetteAnnee=F.filter(f=>new Date(f.date_facture).getFullYear()===annee);
  let html=`<h2 style="font-size:18px;font-weight:700;margin-bottom:6px">Dashboard Facturation</h2>
    <div style="color:var(--muted);font-size:12.5px;margin-bottom:18px">${F.length} factures total · année ${annee} : ${cetteAnnee.length}</div>
    <div class="grid cards" style="margin-bottom:24px">
      <div class="kpi ok"><div class="lbl">CA TTC total</div><div class="val">${eur(totTTC)}</div></div>
      <div class="kpi info"><div class="lbl">Encaissé</div><div class="val">${eur(totEncaisse)}</div></div>
      <div class="kpi ${totRestant>0?'warn':'ok'}"><div class="lbl">Restant dû</div><div class="val">${eur(totRestant)}</div></div>
      <div class="kpi"><div class="lbl">À encaisser</div><div class="val">${nbEmis}</div><div class="sub">factures émises/partiels</div></div>
      <div class="kpi ok"><div class="lbl">Payées</div><div class="val">${nbPaye}</div></div>
    </div>
    <div class="section"><h3>Factures non soldées</h3>
      <table class="tbl"><thead><tr><th>N°</th><th>Client</th><th>Date</th><th>TTC</th><th>Reste dû</th><th>Statut</th></tr></thead><tbody>
        ${F.filter(f=>f.statut==='emise'||f.statut==='partiel').slice(0,10).map(f=>{const paye=encaisseFacture(f);const rest=Math.max(0,Number(f.total_ttc)-paye);return `<tr onclick="openFacture('${f.id}')" style="cursor:pointer"><td><b>${f.numero||'?'}</b></td><td>${f.clients?.nom||'—'}</td><td>${fmtD(f.date_facture)}</td><td>${eur(f.total_ttc)}</td><td style="color:var(--warn);font-weight:700">${eur(rest)}</td><td><span class="badge ${f.statut==='paye'?'ok':f.statut==='partiel'?'warn':'info'}">${STATUTS[f.statut]}</span></td></tr>`;}).join('')||'<tr><td colspan="6" style="text-align:center;color:var(--muted);padding:18px">✓ Tout est encaissé</td></tr>'}
      </tbody></table>
    </div>`;
  el.innerHTML=html;
}

// ─────── FACTURES ───────
async function renderFactures(el){
  el.innerHTML=`<div class="toolbar">
    <input id="fac_search" placeholder="Rechercher numéro/client…" oninput="filterFactures()">
    <select id="fac_stat" onchange="filterFactures()"><option value="">Tous statuts</option>${Object.entries(STATUTS).map(([k,v])=>`<option value="${k}">${v}</option>`).join('')}</select>
    <div style="flex:1"></div>
    <button class="btn" onclick="openFactureForm()">+ Nouvelle facture</button>
  </div><div id="facList">Chargement…</div>`;
  const{data}=await sb.from('factures').select('*,clients(nom),fact_paiements(montant)').eq('organization_id',ORG.id).order('date_facture',{ascending:false});
  S.factures=data||[];
  renderFacturesList();
}
function renderFacturesList(){
  const q=val('fac_search').toLowerCase(),fs=val('fac_stat');
  let list=S.factures;
  if(fs) list=list.filter(f=>f.statut===fs);
  if(q) list=list.filter(f=>((f.numero||'')+' '+(f.clients?.nom||'')).toLowerCase().includes(q));
  let html=`<table class="tbl"><thead><tr><th>N°</th><th>Date</th><th>Client</th><th>HT</th><th>TTC</th><th>Payé</th><th>Statut</th><th></th></tr></thead><tbody>`;
  if(!list.length) html+='<tr><td colspan="8" style="text-align:center;color:var(--muted);padding:30px">Aucune facture</td></tr>';
  else list.forEach(f=>{
    const paye=encaisseFacture(f);
    const stat=f.statut==='paye'?'ok':f.statut==='partiel'?'warn':f.statut==='annulee'?'bad':'info';
    html+=`<tr><td><b>${f.numero||'?'}</b></td><td>${fmtD(f.date_facture)}</td><td>${f.clients?.nom||'—'}</td><td>${eur(f.total_ht)}</td><td><b>${eur(f.total_ttc)}</b></td><td style="color:${paye>=Number(f.total_ttc)?'var(--ok)':'var(--warn)'}">${eur(paye)}</td><td><span class="badge ${stat}">${STATUTS[f.statut]||f.statut}</span></td><td><button class="btn ghost sm" onclick="openFacture('${f.id}')" data-tip="Voir la facture" aria-label="Voir la facture">👁</button> <button class="btn ghost sm" onclick="downloadFacturePDF('${f.id}')" data-tip="Télécharger le PDF" aria-label="Télécharger le PDF">📄</button></td></tr>`;
  });
  html+='</tbody></table>';
  document.getElementById('facList').innerHTML=html;
}
function filterFactures(){renderFacturesList();}

async function openFacture(id){
  const{data:f}=await sb.from('factures').select('*,clients(*),fact_paiements(*)').eq('id',id).maybeSingle();
  if(!f){toast('Facture introuvable');return;}
  const model=await buildFactureModel(f); // MÊME chemin que le PDF (buildFactureModel → factureModel) : écran = PDF
  const paiements=f.fact_paiements||[];
  const totPaye=encaisseFacture(f);
  const restant=Math.max(0,Number(f.total_ttc)-totPaye);
  // Lignes regroupées par bon de livraison (comme le PDF), ou à plat pour une facture manuelle.
  const lignesHtml=model.groups.length?model.groups.map(g=>{
    const head=g.titre?`<tr><td colspan="5" style="background:var(--surface);font-weight:600;color:var(--gold);font-size:12px;padding:6px 8px">${g.titre}</td></tr>`:'';
    return head+g.lignes.map(l=>`<tr><td>${l.nom||'?'}</td><td style="text-align:right">${l.qte}</td><td style="text-align:right">${eur(l.puHT)}</td><td style="text-align:center">${_fmtTva(l.tva)}</td><td style="text-align:right"><b>${eur(l.totalHT)}</b></td></tr>`).join('');
  }).join(''):'<tr><td colspan="5" style="text-align:center;color:var(--muted)">Aucune ligne</td></tr>';
  // Ventilation TVA seulement si elle se reconcilie au centime (même garde-fou que le PDF) ; sinon dire pourquoi.
  const tvaHtml=model.tvaReconciles
    ?Object.values(model.tvaByRate).sort((a,b)=>a.taux-b.taux).map(t=>`<div style="color:var(--muted);font-size:12.5px">TVA ${_fmtTva(t.taux)} sur ${eur(t.base)} HT : <b>${eur(t.montant)}</b></div>`).join('')
    :`<div style="color:var(--warn);font-size:12px">Ventilation par taux non affichée : certaines lignes n'ont pas de taux de TVA (bon antérieur au réglage). TVA globale : <b>${eur(model.tvaStockee)}</b>.</div>`;
  document.getElementById('modalHost').innerHTML=`<div class="modal-bg" onclick="if(event.target===this)closeModal()"><div class="modal" style="max-width:880px">
    <div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:18px">
      <div><h2 style="font-size:20px;margin-bottom:4px">Facture ${f.numero}</h2><div style="color:var(--muted);font-size:13px">${f.clients?.nom||'—'} · ${fmtD(f.date_facture)}${f.bl_ids&&f.bl_ids.length?` · ${f.bl_ids.length} bon${f.bl_ids.length>1?'s':''}`:''}</div></div>
      <div style="text-align:right">
        <div style="font-size:24px;font-weight:800">${eur(f.total_ttc)}</div>
        <div style="color:var(--muted);font-size:12px">HT ${eur(f.total_ht)}</div>
        <span class="badge ${f.statut==='paye'?'ok':f.statut==='partiel'?'warn':f.statut==='annulee'?'bad':'info'}" style="margin-top:6px">${STATUTS[f.statut]}</span>
      </div>
    </div>
    <div class="grid2" style="margin-bottom:14px">
      <div class="kpi"><div class="lbl">Encaissé</div><div class="val" style="font-size:18px;color:var(--ok)">${eur(totPaye)}</div></div>
      <div class="kpi"><div class="lbl">Reste dû</div><div class="val" style="font-size:18px;color:${restant>0?'var(--warn)':'var(--ok)'}">${eur(restant)}</div></div>
    </div>
    <div class="section"><h3>Lignes</h3>

async function addPaiement(facId,totalTTC){
  const mt=parseFloat(val('p_mt'));if(isNaN(mt)||mt<=0){toast('Montant invalide');return;}
  // Garde-fou : une facture migrée porte son encaissement dans le cache montant_paye, SANS détail.
  // Y insérer un premier règlement recalculerait montant_paye depuis les seules lignes, écrasant
  // l'historique (perte de donnée comptable). On bloque explicitement — blocage visible > écrasement
  // silencieux — plutôt que de matérialiser nous-mêmes l'historique (une écriture, à valider avec le patron).
  const{data:avant}=await sb.from('factures').select('montant_paye,fact_paiements(id)').eq('id',facId).maybeSingle();
  if(avant&&!(avant.fact_paiements||[]).length&&Number(avant.montant_paye||0)>0){
    toast('Encaissement historique de '+eur(avant.montant_paye)+' sans détail : saisissez-le d\'abord comme ligne de règlement.');return;
  }
  const{error}=await sb.from('fact_paiements').insert({organization_id:ORG.id,facture_id:facId,date_paiement:val('p_date'),montant:mt,mode:val('p_mode')});
  if(error){toast(error.message);return;}
  // Recalcule le cache depuis le détail (source de vérité) → jamais de double comptage à l'affichage.
  const{data:paiements}=await sb.from('fact_paiements').select('montant').eq('facture_id',facId);
  const totPaye=(paiements||[]).reduce((a,p)=>a+Number(p.montant||0),0);
  const{error:eF}=await sb.from('factures').update({statut:statutFacture(totalTTC,totPaye),montant_paye:totPaye}).eq('id',facId);if(eF){toast('Erreur : '+eF.message);return;}
  toast('✓ Paiement enregistré');openFacture(facId);renderFactures(document.getElementById('content'));
}
async function delPaiement(id,facId){
  if(!confirm('Supprimer ce paiement ?'))return;
  const{error}=await sb.from('fact_paiements').delete().eq('id',id);if(error){toast('Erreur : '+error.message);return;}
  const{data:f}=await sb.from('factures').select('total_ttc').eq('id',facId).maybeSingle();
  const{data:paiements}=await sb.from('fact_paiements').select('montant').eq('facture_id',facId);
  const totPaye=(paiements||[]).reduce((a,p)=>a+Number(p.montant||0),0);
  // Recalcule le cache depuis le détail restant. Supprimer le dernier règlement écrit montant_paye=0,
  // et le repli d'encaisseFacture renvoie alors 0 : le cache s'auto-répare. NE PAS router par encaisseFacture ici.
  const{error:eF}=await sb.from('factures').update({statut:statutFacture(f.total_ttc,totPaye),montant_paye:totPaye}).eq('id',facId);if(eF){toast('Erreur : '+eF.message);return;}
  openFacture(facId);
}
async function annulerFacture(id){
  if(!confirm('Annuler cette facture ? (statut "annulée", non supprimée)'))return;
  const{error}=await sb.from('factures').update({statut:'annulee'}).eq('id',id);if(error){toast('Erreur : '+error.message);return;}
  toast('Facture annulée');closeModal();renderFactures(document.getElementById('content'));
}

function updateLigne(i,field,v){
  CURRENT_LIGNES[i][field]=field==='designation'?v:parseFloat(v.replace(',','.'))||0;
  // Auto-complétion : si désignation matche un produit, prendre son prix
  if(field==='designation'){

    if(p){CURRENT_LIGNES[i].prix_unitaire_ht=Number(p.prix_revente||0);CURRENT_LIGNES[i].tva_pct=Number(p.tva||5.5);}

async function saveFacture(){
  if(!val('nf_cl')){toast('Client requis');return;}
  if(!CURRENT_LIGNES.length||CURRENT_LIGNES.every(l=>!l.designation)){toast('Au moins une ligne');return;}
  const annee=new Date(val('nf_date')).getFullYear();
  const{data:numData,error:eNum}=await sb.rpc('next_facture_number',{p_org:ORG.id,p_annee:annee});if(eNum){toast('Erreur numérotation : '+eNum.message);return;}
  const n=numData||1;
  const prefix=S.fparam?.prefix_numero||'';
  const numero=`${prefix}${annee}-${String(n).padStart(3,'0')}`;
  let totHT=0,totTTC=0;
  const lignes=CURRENT_LIGNES.filter(l=>l.designation).map((l,idx)=>{
    const ht=(l.quantite||0)*(l.prix_unitaire_ht||0);
    const ttc=ht*(1+Number(l.tva_pct)/100);
    totHT+=ht;totTTC+=ttc;
    return {designation:l.designation,quantite:l.quantite,prix_unitaire_ht:l.prix_unitaire_ht,tva_pct:l.tva_pct,total_ht:+ht.toFixed(2),total_ttc:+ttc.toFixed(2),ordre:idx};
  });
  // NB : `factures` n'a pas de colonne `lignes` (A2) — les lignes vivent dans la table factures_lignes.
  const{data:fac,error}=await sb.from('factures').insert({organization_id:ORG.id,numero,client_id:val('nf_cl'),date_facture:val('nf_date'),total_ht:+totHT.toFixed(2),total_ttc:+totTTC.toFixed(2),statut:'emise'}).select().single();
  if(error){toast('Erreur création facture : '+error.message);return;}
  // Insert lignes structurées
  const lignesPayload=lignes.map(l=>({...l,organization_id:ORG.id,facture_id:fac.id}));
  const{error:errL}=await sb.from('factures_lignes').insert(lignesPayload);
  if(errL){toast('Facture créée mais lignes non enregistrées : '+errL.message);}
  else toast(`✓ Facture ${numero} créée`);
  closeModal();renderFactures(document.getElementById('content'));
}

// ─────── PDF (fonctions PURES, testables ; aucune dépendance jsPDF/DOM) ───────
const _MOIS=['janvier','février','mars','avril','mai','juin','juillet','août','septembre','octobre','novembre','décembre'];
function _dateLong(s){if(!s)return'';const[y,m,d]=String(s).split('-').map(Number);if(!m)return String(s);return `${d} ${_MOIS[m-1]} ${y}`;}
function _hexToRgb(hex){hex=String(hex||'').trim().replace('#','');if(hex.length===3)hex=hex.split('').map(c=>c+c).join('');if(!/^[0-9a-fA-F]{6}$/.test(hex))return null;const n=parseInt(hex,16);return[(n>>16)&255,(n>>8)&255,n&255];}
function _relLum(rgb){const a=rgb.map(v=>{v/=255;return v<=0.03928?v/12.92:Math.pow((v+0.055)/1.055,2.4);});return 0.2126*a[0]+0.7152*a[1]+0.0722*a[2];}
function _contrast(a,b){const l1=_relLum(a),l2=_relLum(b);return (Math.max(l1,l2)+0.05)/(Math.min(l1,l2)+0.05);}
function _textColorFor(rgb){return _relLum(rgb)>0.5?[17,17,17]:[255,255,255];} // noir/blanc lisible sur ce fond
function _fmtTva(t){return String(t).replace('.',',')+' %';}
// Formatage € SANS espace fine insécable (U+202F/U+00A0) que la police jsPDF rend « / » → espace simple.
function _eurPdf(n){const s=(n==null||isNaN(n))?'0,00':Number(n).toLocaleString('fr-FR',{minimumFractionDigits:2,maximumFractionDigits:2});return s.replace(/[  ]/g,' ')+' €';}
// Alerte de contraste pour l'interface (deux directions) :
//  - texte auto (noir/blanc) sur le fond coloré ≥ 4.5 ; - couleur en TEXTE sur blanc ≥ 3.
function _colorContrastIssue(hex){const rgb=_hexToRgb(hex);if(!rgb)return 'Couleur invalide';const onFill=_contrast(rgb,_textColorFor(rgb));const asText=_contrast(rgb,[255,255,255]);
  // Seuil 3.0 : texte de facture large/gras (AA « grand texte »). Deux directions : texte sur le fond coloré, et couleur en TEXTE sur blanc (libellés, filets).
  if(asText<3)return 'trop claire : peu lisible en texte/libellé sur fond blanc';if(onFill<3)return 'contraste faible du texte sur ce fond à l\'impression';return null;}

// Modèle de facture : groupé par bon de livraison, TVA par ligne via le catalogue, ventilation par taux.
// PUR : reçoit facture + BLs + produits + params ; ne touche ni au DOM ni à la base. `tR` fait foi pour la ligne.
function factureModel(facture,bls,produits,par){
  par=par||{};
  const prod=new Map((produits||[]).map(p=>[p.nom,p]));
  const defTva=par.tva_defaut!=null?Number(par.tva_defaut):5.5;
  const tvaOf=nom=>{const p=prod.get(nom);return p&&p.tva!=null?Number(p.tva):defTva;};
  const groups=[];
  if(facture.bl_ids&&facture.bl_ids.length&&bls&&bls.length){
    const ordered=[...bls].sort((a,b)=>String(a.date_livraison||'').localeCompare(String(b.date_livraison||'')));
    for(const bl of ordered){
      const lignes=(bl.lignes||[]).map(l=>{
        const qte=Number(l.qte!=null?l.qte:(l.quantite||0));
        const puHT=+Number(l.r!=null?l.r:(l.prix_unitaire_ht||l.pu_ht||0)).toFixed(2);
        const totalHT=+Number(l.tR!=null?l.tR:((l.r||0)*qte)).toFixed(2); // tR = source de vérité de la ligne
        // Taux : celui STOCKÉ sur la ligne (ce qui a été facturé) prioritaire ; sinon catalogue ; sinon défaut.
        const tva=l.tva!=null?Number(l.tva):tvaOf(l.nom);
        return {nom:l.nom||l.designation||'',qte,puHT,tva,totalHT,totalTTC:+(totalHT*(1+tva/100)).toFixed(2)};
      });
      groups.push({titre:'Livraison du '+_dateLong(bl.date_livraison),lignes});
    }
  }else{
    const fl=facture._lignes||[];
    const lignes=fl.map(l=>{
      const qte=Number(l.quantite!=null?l.quantite:(l.qte||1));
      const puHT=+Number(l.prix_unitaire_ht!=null?l.prix_unitaire_ht:(l.pu_ht||0)).toFixed(2);
      const totalHT=+Number(l.total_ht!=null?l.total_ht:(qte*puHT)).toFixed(2);
      const tva=Number(l.tva_pct!=null?l.tva_pct:(l.tva!=null?l.tva:defTva));
      return {nom:l.designation||l.nom||'',qte,puHT,tva,totalHT,totalTTC:+(totalHT*(1+tva/100)).toFixed(2)};
    });
    if(lignes.length)groups.push({titre:null,lignes});
  }
  const tvaByRate={};
  for(const g of groups)for(const l of g.lignes){const k=String(l.tva);if(!tvaByRate[k])tvaByRate[k]={taux:l.tva,base:0,montant:0};tvaByRate[k].base=+(tvaByRate[k].base+l.totalHT).toFixed(2);}
  for(const k in tvaByRate)tvaByRate[k].montant=+(tvaByRate[k].base*tvaByRate[k].taux/100).toFixed(2);
  const calcHT=+Object.values(tvaByRate).reduce((a,t)=>a+t.base,0).toFixed(2);
  const calcTVA=+Object.values(tvaByRate).reduce((a,t)=>a+t.montant,0).toFixed(2);
  const calcTTC=+(calcHT+calcTVA).toFixed(2);
  // Total affiché = valeur STOCKÉE (autorité comptable + html archivé) ; le calcul peut différer d'1 centime (arrondis).
  const totalHT=facture.total_ht!=null?Number(facture.total_ht):calcHT;
  const totalTTC=facture.total_ttc!=null?Number(facture.total_ttc):calcTTC;
  // La ventilation par taux n'est FIABLE que si elle se reconcilie avec la TVA stockée. Sur d'anciennes factures
  // sans taux stocké sur la ligne et dont le catalogue a évolué depuis, elle serait fausse → on ne l'affiche pas.
  const tvaStockee=+(totalTTC-totalHT).toFixed(2);
  const tvaReconciles=Math.abs(calcTVA-tvaStockee)<=0.02;
  return {groups,tvaByRate,calcHT,calcTVA,calcTTC,totalHT,totalTTC,tvaStockee,tvaReconciles};
}

// ─────── Encaissement : SOURCE DE VÉRITÉ UNIQUE ───────
// `fact_paiements` (le détail des règlements) fait foi. `montant_paye` n'est qu'un cache dénormalisé,
// utile uniquement pour l'historique migré qui n'a pas de détail. montant_paye EST la somme de fact_paiements :
// les additionner double chaque règlement (bug du premier encaissement réel sur 2026-07-002).
// Règle : s'il existe au moins une ligne de règlement → on ne compte QUE celles-ci ; sinon repli sur le cache.
function encaisseFacture(f){
  const dp=Array.isArray(f&&f.fact_paiements)?f.fact_paiements:[];
  if(dp.length) return +dp.reduce((a,p)=>a+Number(p.montant||0),0).toFixed(2);
  return +Number((f&&f.montant_paye)||0).toFixed(2);
}
// Statut dérivé du même total encaissé — une seule formule, réutilisée par les chemins d'écriture.
function statutFacture(totalTTC,encaisse){
  return encaisse>=Number(totalTTC)?'paye':encaisse>0?'partiel':'emise';
}

// SOURCE UNIQUE des lignes affichables d'une facture (écran ET PDF passent par ici → jamais deux rendus
// qui divergent). Charge selon l'origine — bons de livraison (bl_ids) ou lignes manuelles (factures_lignes,
// posées sur f._lignes) — puis délègue au modèle PUR factureModel (groupé par livraison + ventilation TVA).
async function buildFactureModel(f){
  let bls=[];
  if(f.bl_ids&&f.bl_ids.length){ const{data}=await sb.from('bons_livraison').select('id,date_livraison,lignes').in('id',f.bl_ids); bls=data||[]; }
  else{ const{data}=await sb.from('factures_lignes').select('*').eq('facture_id',f.id).order('ordre'); f._lignes=data||[]; }
  return factureModel(f, bls, S.produits, S.fparam||{});
}

// ═══ BL — fonctions PURES (testées : tests/bl_test.js) ═══════════════════════════════════════════
// Totaux/ marge d'une ligne, TOUJOURS recalculés depuis qte × prix (jamais les valeurs stockées, qui
// peuvent dater d'avant une modification). Arrondi 2 déc. (centimes) pour les nouveaux bons.
function blLineTotals(line){
  const qte=Number(line.qte)||0, a=Number(line.a)||0, r=Number(line.r)||0;
  const tA=+(qte*a).toFixed(2), tR=+(qte*r).toFixed(2);
  return { tA, tR, marge:+(tR-tA).toFixed(2) };
}
function blTotals(lignes){
  let tA=0,tR=0;
  (lignes||[]).forEach(l=>{const t=blLineTotals(l);tA+=t.tA;tR+=t.tR;});
  tA=+tA.toFixed(2); tR=+tR.toFixed(2);
  return { total_achat:tA, total_revente:tR, marge:+(tR-tA).toFixed(2), marge_pct: tR>0 ? +(((tR-tA)/tR)*100).toFixed(1) : 0 };
}
// SOURCE DE VÉRITÉ UNIQUE du « facturé » : la présence de l'id du bon dans le bl_ids d'une facture
// NON annulée. Le booléen bons_livraison.facture n'est PLUS lu (colonne héritée). Map id → {id,numero}.
function blFactureIndex(factures){
  const idx=new Map();
  (factures||[]).forEach(f=>{
    if(!f || f.statut==='annulee' || !Array.isArray(f.bl_ids)) return;
    f.bl_ids.forEach(bid=>{ if(bid!=null && !idx.has(bid)) idx.set(bid,{id:f.id,numero:f.numero}); });
  });
  return idx;
}
function blEditable(blId, idx){ return !(idx && idx.get && idx.get(blId)); } // facturé (non annulé) → non modifiable
// Validation d'un ENREGISTREMENT : désignation, quantité > 0, et taux de TVA EXPLICITE sur chaque ligne
// (c'est ce qui manquait avant le 28/03 et empêche une ventilation de TVA fiable). Renvoie la liste d'erreurs.
function validateBLLignes(lignes){
  if(!Array.isArray(lignes)||!lignes.length) return ['Au moins une ligne'];
  const errs=[];
  lignes.forEach((l,i)=>{
    if(!l || !String(l.nom||'').trim()) errs.push('Ligne '+(i+1)+' : désignation manquante');
    if(!(Number(l.qte)>0)) errs.push('Ligne '+(i+1)+' : quantité invalide');
    if(l.tva==null || l.tva==='' || isNaN(Number(l.tva))) errs.push('Ligne '+(i+1)+' : taux de TVA obligatoire');
  });
  return errs;
}

// Pré-remplissage depuis les lignes DÉJÀ FACTURÉES du même client (ce qui a réellement été livré/facturé),
// PAS depuis le catalogue produits (qui a dérivé depuis mars → taux faux). Désignation → {a,r,tva} le plus récent.
function buildBLPrefill(clientId){
  BL_PREFILL={};
  (S.bls||[]).filter(b=>b.client_id===clientId).sort((a,b)=>String(b.date_livraison||'').localeCompare(String(a.date_livraison||''))).forEach(b=>{
    (Array.isArray(b.lignes)?b.lignes:[]).forEach(l=>{ if(l.nom && !(l.nom in BL_PREFILL)) BL_PREFILL[l.nom]={a:Number(l.a)||0,r:Number(l.r)||0,tva:(l.tva==null?'':String(l.tva))}; });
  });
}
function openBLForm(bl){
  bl=bl||null;

  const clientId=bl?bl.client_id:(S.clients[0]?.id||'');

function renderBLLignes(){
  const c=document.getElementById('bl_lignes'); if(!c) return;
  const COLS='style="display:grid;grid-template-columns:2.2fr .8fr 1fr 1fr 1fr 1fr 1fr auto;gap:6px;align-items:center;padding:3px 0"';
  let html=`<div ${COLS} class="bl-head" style="display:grid;grid-template-columns:2.2fr .8fr 1fr 1fr 1fr 1fr 1fr auto;gap:6px;font-size:10.5px;color:var(--muted);text-transform:uppercase;font-weight:600;padding:2px 0"><div>Désignation</div><div>Qté</div><div>PU achat</div><div>PU revente</div><div>TVA</div><div style="text-align:right">Total HT</div><div style="text-align:right">Marge</div><div></div></div>`;
  BL_LIGNES.forEach((l,i)=>{
    const t=blLineTotals(l);
    html+=`<div ${COLS}>
      <input type="text" value="${String(l.nom||'').replace(/"/g,'&quot;')}" onchange="updateBLLigne(${i},'nom',this.value)" list="blProdList" placeholder="Désignation">
      <input type="number" step="0.01" value="${l.qte}" onchange="updateBLLigne(${i},'qte',this.value)">
      <input type="number" step="0.0001" value="${l.a}" onchange="updateBLLigne(${i},'a',this.value)">
      <input type="number" step="0.0001" value="${l.r}" onchange="updateBLLigne(${i},'r',this.value)">
      <select onchange="updateBLLigne(${i},'tva',this.value)"><option value="">— TVA —</option>${TVA_TAUX.map(x=>`<option value="${x}" ${String(l.tva)===String(x)?'selected':''}>${x}%</option>`).join('')}</select>
      <div style="text-align:right;font-weight:600">${eur(t.tR)}</div>
      <div style="text-align:right;color:${t.marge>=0?'var(--ok)':'var(--warn)'}">${eur(t.marge)}</div>
      <button class="btn ghost sm" onclick="removeBLLigne(${i})" aria-label="Supprimer la ligne">✕</button>
    </div>`;
  });
  const names=[...new Set([...Object.keys(BL_PREFILL), ...S.produits.map(p=>p.nom)])];
  html+=`<datalist id="blProdList">${names.map(n=>`<option value="${String(n).replace(/"/g,'&quot;')}"></option>`).join('')}</datalist>`;
  c.innerHTML=html;
  const tot=blTotals(BL_LIGNES);
  document.getElementById('bl_tA').textContent=eur(tot.total_achat);
  document.getElementById('bl_tR').textContent=eur(tot.total_revente);
  document.getElementById('bl_marge').textContent=eur(tot.marge)+(tot.total_revente>0?` (${tot.marge_pct}%)`:'');
}
function updateBLLigne(i,field,v){
  if(field==='nom'){
    BL_LIGNES[i].nom=v;
    const pf=BL_PREFILL[v]; // pré-remplissage depuis les lignes passées du client (n'écrase pas une valeur déjà saisie)
    if(pf){ if(!Number(BL_LIGNES[i].a)) BL_LIGNES[i].a=pf.a; if(!Number(BL_LIGNES[i].r)) BL_LIGNES[i].r=pf.r; if(BL_LIGNES[i].tva===''||BL_LIGNES[i].tva==null) BL_LIGNES[i].tva=pf.tva; }
  } else if(field==='tva'){ BL_LIGNES[i].tva=v; }
  else { BL_LIGNES[i][field]=parseFloat(String(v).replace(',','.'))||0; }
  renderBLLignes();
}
function addBLLigne(){ BL_LIGNES.push({nom:'',qte:1,a:0,r:0,tva:''}); renderBLLignes(); }
function removeBLLigne(i){ BL_LIGNES.splice(i,1); renderBLLignes(); }
async function saveBL(){
  const clientId=val('bl_cl'); if(!clientId){toast('Client requis');return;}
  const date=val('bl_date'); if(!date){toast('Date requise');return;}
  // Verrou AU MOMENT de l'enregistrement (re-dérivé de bl_ids) — pas seulement à l'affichage.
  if(BL_EDIT_ID && BL_INDEX && BL_INDEX.get(BL_EDIT_ID)){ const f=BL_INDEX.get(BL_EDIT_ID); toast('Ce bon est désormais sur la facture '+(f.numero||'')+' — enregistrement refusé.'); return; }
  const errs=validateBLLignes(BL_LIGNES); if(errs.length){ toast(errs[0]); return; }
  // Recalcul SYSTÉMATIQUE des totaux de ligne et du bon (jamais les valeurs saisies/stockées).
  const lignes=BL_LIGNES.map(l=>{const t=blLineTotals(l);return {nom:String(l.nom).trim(),qte:Number(l.qte),a:Number(l.a),r:Number(l.r),tA:t.tA,tR:t.tR,tva:Number(l.tva)};});
  const tot=blTotals(BL_LIGNES);
  // On n'écrit PAS `facture` : le « facturé » est dérivé de bl_ids (source unique). La colonne reste héritée.
  const payload={organization_id:ORG.id,client_id:clientId,date_livraison:date,lignes,total_achat:tot.total_achat,total_revente:tot.total_revente};
  const{error}=BL_EDIT_ID?await sb.from('bons_livraison').update(payload).eq('id',BL_EDIT_ID):await sb.from('bons_livraison').insert(payload);
  if(error){toast('Erreur : '+error.message);return;}
  toast('✓ Bon enregistré'); closeModal(); renderBLs(document.getElementById('content'));
}

// LOGO_DATA : undefined = inchangé, null = retiré, string = nouveau data URL (base64 PNG).
let LOGO_DATA=undefined;
function onLogoPick(ev){
  const file=ev.target.files&&ev.target.files[0]; if(!file)return;
  if(!/^image\//.test(file.type)){toast('Choisis un fichier image');return;}
  const reader=new FileReader();
  reader.onload=()=>{const img=new Image();img.onload=()=>{
    const maxW=320, scale=Math.min(1,maxW/img.width);
    const w=Math.max(1,Math.round(img.width*scale)), h=Math.max(1,Math.round(img.height*scale));
    const cv=document.createElement('canvas');cv.width=w;cv.height=h;
    cv.getContext('2d').drawImage(img,0,0,w,h); // PNG → conserve la transparence (pas de fond noir)
    LOGO_DATA=cv.toDataURL('image/png');
    const prev=document.getElementById('fp_logo_prev');if(prev){prev.src=LOGO_DATA;prev.style.display='block';}
    document.getElementById('fp_logo_info').textContent=`Nouveau logo prêt (~${Math.round(LOGO_DATA.length*0.75/1024)} ko).`;
  };img.onerror=()=>toast('Image illisible');img.src=reader.result;};
  reader.readAsDataURL(file);
}
function removeLogo(){LOGO_DATA=null;const prev=document.getElementById('fp_logo_prev');if(prev)prev.style.display='none';const i=document.getElementById('fp_logo_info');if(i)i.textContent='Logo retiré (sera enregistré au clic sur Enregistrer).';}
function checkColorContrast(){
  const el=document.getElementById('fp_color_warn');if(!el)return;
  const msgs=[];const ia=_colorContrastIssue(val('fp_accent'));const ib=_colorContrastIssue(val('fp_bandeau'));
  if(ia)msgs.push('Accent — '+ia);if(ib)msgs.push('Bandeau — '+ib);
  el.innerHTML=msgs.length?('⚠️ '+msgs.join(' · ')):'';el.style.display=msgs.length?'block':'none';
}

  const payload={organization_id:ORG.id,raison_sociale:val('fp_rs'),forme_juridique:val('fp_fj')||null,siret:val('fp_sir')||null,rcs:val('fp_rcs')||null,num_tva:val('fp_tva')||null,ape_code:val('fp_ape')||null,capital_social:num('fp_cap'),adresse:val('fp_adr')||null,code_postal:val('fp_cp')||null,ville:val('fp_vil')||null,telephone:val('fp_tel')||null,email:val('fp_em')||null,iban:val('fp_iban')||null,bic:val('fp_bic')||null,banque:val('fp_bk')||null,conditions_paiement:val('fp_cond')||null,penalites_retard:val('fp_pen')||null,mentions_complementaires:val('fp_mt')||null,prefix_numero:val('fp_pre')||'',couleur_accent:val('fp_accent')||null,couleur_bandeau:val('fp_bandeau')||null,mode_reglement:val('fp_reglement')||null};
  if(LOGO_DATA!==undefined) payload.logo_url=LOGO_DATA; // n'écrit le logo que s'il a changé (sinon préservé)
  const{error}=await sb.from('fact_parametres').upsert(payload,{onConflict:'organization_id'});
  if(error){toast(error.message);return;}toast('✓ Paramètres enregistrés');LOGO_DATA=undefined;await loadCommonData();
}
