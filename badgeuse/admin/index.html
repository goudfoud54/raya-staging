<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Raya — Badgeuse · Admin</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--gold:#c8a035;--bg:#0b0b15;--card:#15151f;--surface:#1c1c28;--line:rgba(255,255,255,.06);--line-2:rgba(255,255,255,.12);--text:#e8e8ec;--muted:#7b7b8a;--ok:#3fb87f;--warn:#e0a93a;--bad:#c45a5a;--pause:#5b9cff}
html,body{height:100%}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;font-size:14px}
a{color:var(--gold);text-decoration:none}
.hidden{display:none!important}
button{cursor:pointer;border:none;background:none;color:var(--text);font-family:inherit}
.btn{padding:9px 16px;border-radius:8px;background:var(--gold);color:#1a1a1a;font-weight:600;font-size:13px;border:1px solid transparent}
.btn:hover{filter:brightness(1.07)}
.btn.ghost{background:transparent;color:var(--text);border-color:var(--line-2)}
.btn.sm{padding:6px 11px;font-size:12px}

.lock{position:fixed;inset:0;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;z-index:100}
.lock h1{color:var(--gold);font-size:22px}
.lock input{padding:13px 18px;border-radius:10px;border:1px solid var(--line-2);background:var(--surface);color:#fff;font-size:15px;text-align:center;width:260px;outline:none}
.err{color:var(--bad);font-size:12px;min-height:16px}

.header{display:flex;align-items:center;justify-content:space-between;padding:14px 28px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--bg);z-index:10}
.brand{color:var(--gold);font-weight:700;font-size:16px}
.brand small{color:var(--muted);font-weight:400;font-size:12px;margin-left:8px}
.wrap{max-width:1180px;margin:0 auto;padding:24px 28px 60px}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:end;margin-bottom:18px}
.fld label{display:block;font-size:11px;color:var(--muted);margin-bottom:4px}
.fld input,.fld select{padding:9px 12px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:#fff;font-size:13px;outline:none}
.count{color:var(--muted);font-size:12px;margin-left:auto;align-self:center}

table{width:100%;border-collapse:separate;border-spacing:0;background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden}
th{text-align:left;padding:12px 16px;font-size:11px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;background:rgba(255,255,255,.015);border-bottom:1px solid var(--line)}
td{padding:12px 16px;border-bottom:1px solid var(--line);font-size:13px}
tr:last-child td{border-bottom:none}
.tag{display:inline-block;padding:2px 9px;border-radius:20px;font-size:10.5px;font-weight:600}
.tag.arrivee{background:rgba(63,184,127,.15);color:var(--ok)}
.tag.sortie{background:rgba(224,169,58,.15);color:var(--warn)}
.tag.pause_debut{background:rgba(91,156,255,.15);color:var(--pause)}
.tag.pause_fin{background:rgba(91,156,255,.10);color:var(--pause)}
.av{width:26px;height:26px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-weight:700;color:#111;font-size:11px;vertical-align:middle;margin-right:8px}
.sumrow{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin-bottom:18px}
.sum{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.sum .lbl{color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.06em}
.sum .val{font-size:22px;font-weight:700;margin-top:4px}
</style>
</head>
<body>
<div style="background:#b03a3a;color:#fff;text-align:center;padding:6px;font-size:12px;font-weight:700">ENVIRONNEMENT DE TEST — base séparée, aucune donnée de production</div>

<div id="lock" class="lock">
  <h1>Badgeuse · Admin</h1>
  <input type="password" id="pw" placeholder="Mot de passe" onkeydown="if(event.key==='Enter')unlock()">
  <button class="btn" onclick="unlock()">Entrer</button>
  <div class="err" id="pwerr"></div>
  <a href="../../" style="color:var(--muted);font-size:12px">← Portail</a>
</div>

<div id="app" class="hidden">
  <div class="header">
    <div class="brand">Raya <small>· Badgeuse Admin · <span id="ver" style="font-size:10px;color:var(--muted)"></span></small></div>
    <div style="display:flex;gap:8px">
      <button class="btn ghost" onclick="exportCSV()">Export CSV</button>
      <a href="../" class="btn ghost">→ Kiosk</a>
      <a href="../../" class="btn ghost">Portail</a>
    </div>
  </div>
  <div class="wrap">
    <div class="sumrow">
      <div class="sum"><div class="lbl">Pointages affichés</div><div class="val" id="kCount">0</div></div>
      <div class="sum"><div class="lbl">Arrivées</div><div class="val" id="kArr" style="color:var(--ok)">0</div></div>
      <div class="sum"><div class="lbl">Sorties</div><div class="val" id="kSor" style="color:var(--warn)">0</div></div>
      <div class="sum"><div class="lbl">Pauses</div><div class="val" id="kPau" style="color:var(--pause)">0</div></div>
    </div>
    <div class="toolbar">
      <div class="fld"><label>Restaurant</label><select id="fResto" onchange="render()"><option value="">Tous</option></select></div>
      <div class="fld"><label>Salarié</label><select id="fSal" onchange="render()"><option value="">Tous</option></select></div>
      <div class="fld"><label>Type</label><select id="fType" onchange="render()"><option value="">Tous</option><option value="arrivee">Arrivée</option><option value="sortie">Sortie</option><option value="pause_debut">Pause début</option><option value="pause_fin">Pause fin</option></select></div>
      <div class="fld"><label>Du</label><input type="date" id="fFrom" onchange="render()"></div>
      <div class="fld"><label>Au</label><input type="date" id="fTo" onchange="render()"></div>
      <span class="count" id="count"></span>
    </div>
    <table>
      <thead><tr><th>Date · Heure</th><th>Salarié</th><th>Snack</th><th>Type</th><th></th></tr></thead>
      <tbody id="tbody"></tbody>
    </table>
  </div>
</div>

<script>
const SUPA_URL='https://ynnqvtfayrdteqtgxeuk.supabase.co';
const SUPA_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InlubnF2dGZheXJkdGVxdGd4ZXVrIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzk4OTE1MTQsImV4cCI6MjA5NTQ2NzUxNH0._mfVAGexu7ew38UQk6adn42az4Gt_J3ePxR6O6wuWHc';
const sb=supabase.createClient(SUPA_URL,SUPA_KEY);
const ADMIN_PW='Rayan1301';
const VERSION='v0.1 · 29 mai';

const TYP_LBL={arrivee:'Arrivée',sortie:'Sortie',pause_debut:'Pause début',pause_fin:'Pause fin'};
let S={restos:[],salaries:[],pts:[]};

function unlock(){
  if(document.getElementById('pw').value===ADMIN_PW){sessionStorage.setItem('bdg_ok','1');showApp();}
  else document.getElementById('pwerr').textContent='Mot de passe incorrect';
}
function showApp(){
  document.getElementById('lock').classList.add('hidden');
  document.getElementById('app').classList.remove('hidden');
  document.getElementById('ver').textContent=VERSION;
  // défaut : 7 derniers jours
  const to=new Date(),from=new Date();from.setDate(to.getDate()-7);
  document.getElementById('fFrom').value=from.toISOString().slice(0,10);
  document.getElementById('fTo').value=to.toISOString().slice(0,10);
  loadAll();
}
if(sessionStorage.getItem('bdg_ok')==='1') showApp();

async function loadAll(){
  const[r,s,p]=await Promise.all([
    sb.from('restaurants').select('*').eq('actif',true).order('nom'),
    sb.from('salaries').select('id,nom,prenom,couleur').order('nom'),
    sb.from('pointages').select('*').order('ts',{ascending:false}).limit(5000)
  ]);
  S.restos=r.data||[];S.salaries=s.data||[];S.pts=p.data||[];
  document.getElementById('fResto').innerHTML='<option value="">Tous</option>'+S.restos.map(x=>`<option value="${x.id}">${x.nom}</option>`).join('');
  document.getElementById('fSal').innerHTML='<option value="">Tous</option>'+S.salaries.map(x=>`<option value="${x.id}">${[x.prenom,x.nom].filter(Boolean).join(' ')}</option>`).join('');
  render();
}
const salById=id=>S.salaries.find(x=>x.id===id)||{nom:'?'};
const restoById=id=>S.restos.find(x=>x.id===id)||{nom:'—'};
const initials=s=>((s.prenom||'').charAt(0)+(s.nom||'').charAt(0)).toUpperCase()||'?';

function filtered(){
  const fr=document.getElementById('fResto').value, fs=document.getElementById('fSal').value, ft=document.getElementById('fType').value;
  const ff=document.getElementById('fFrom').value, ft2=document.getElementById('fTo').value;
  return S.pts.filter(p=>{
    if(fr && p.restaurant_id!==fr) return false;
    if(fs && p.salarie_id!==fs) return false;
    if(ft && p.type!==ft) return false;
    const d=p.ts.slice(0,10);
    if(ff && d<ff) return false;
    if(ft2 && d>ft2) return false;
    return true;
  });
}
function render(){
  const list=filtered();
  document.getElementById('count').textContent=list.length+' pointage'+(list.length>1?'s':'');
  document.getElementById('kCount').textContent=list.length;
  document.getElementById('kArr').textContent=list.filter(p=>p.type==='arrivee').length;
  document.getElementById('kSor').textContent=list.filter(p=>p.type==='sortie').length;
  document.getElementById('kPau').textContent=list.filter(p=>p.type.startsWith('pause')).length;
  document.getElementById('tbody').innerHTML=list.slice(0,500).map(p=>{
    const s=salById(p.salarie_id), r=restoById(p.restaurant_id);
    const d=new Date(p.ts);
    return `<tr>
      <td><b>${d.toLocaleDateString('fr-FR')}</b> · ${d.toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'})}</td>
      <td><span class="av" style="background:${s.couleur||'#444'}">${initials(s)}</span>${[s.prenom,s.nom].filter(Boolean).join(' ')||s.nom}</td>
      <td>${(r.nom||'').replace('Raya ','')}</td>
      <td><span class="tag ${p.type}">${TYP_LBL[p.type]||p.type}</span></td>
      <td><button class="btn ghost sm" onclick="delPoint('${p.id}')">Suppr.</button></td>
    </tr>`;
  }).join('')||'<tr><td colspan="5" style="text-align:center;color:var(--muted);padding:30px">Aucun pointage</td></tr>';
}
async function delPoint(id){
  if(!confirm('Supprimer ce pointage ?'))return;
  await sb.from('pointages').delete().eq('id',id);
  loadAll();
}

function exportCSV(){
  const list=filtered();
  const head='Date,Heure,Salarie,Snack,Type\n';
  const rows=list.map(p=>{
    const s=salById(p.salarie_id),r=restoById(p.restaurant_id),d=new Date(p.ts);
    const nm=[s.prenom,s.nom].filter(Boolean).join(' ')||s.nom;
    return `${d.toLocaleDateString('fr-FR')},${d.toLocaleTimeString('fr-FR')},"${nm}","${r.nom||''}",${TYP_LBL[p.type]||p.type}`;
  }).join('\n');
  const blob=new Blob(['﻿'+head+rows],{type:'text/csv;charset=utf-8'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`pointages_${new Date().toISOString().slice(0,10)}.csv`;a.click();
}
</script>
</body>
</html>
