<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0,user-scalable=no">
<script>(function(){var t=localStorage.getItem("eatime_theme");var th=t==="light"?"light":"dark";document.documentElement.setAttribute("data-theme",th);document.documentElement.style.colorScheme=th;})();</script>
<title>Raya — Badgeuse</title>
<meta name="color-scheme" content="dark light">
<meta name="theme-color" content="#c8a035">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../utils.js?v=1.2"></script>
<script src="../kiosk-shared.js?v=1"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;touch-action:manipulation}
:root, [data-theme="dark"]{--gold:#c8a035;--bg:#0b0b15;--card:#15151f;--surface:#1c1c28;--line:rgba(255,255,255,.06);--line-2:rgba(255,255,255,.14);--text:#e8e8ec;--muted:#7b7b8a;--ok:#3fb87f;--warn:#e0a93a;--bad:#c45a5a;--pause:#5b9cff}
[data-theme="light"]{--gold:#c8a035;--bg:#f5f5f7;--card:#ffffff;--surface:#f0f0f3;--line:rgba(0,0,0,.06);--line-2:rgba(0,0,0,.12);--text:#1a1a1f;--muted:#6b6b78;--ok:#2a8f5f;--warn:#b8841f;--bad:#b04444;--info:#4a7fbd}
html,body{height:100%}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;font-size:15px;overflow:hidden}
.hidden{display:none!important}
button{cursor:pointer;border:none;background:none;color:var(--text);font-family:inherit}
button:disabled{cursor:default}

.err{color:var(--bad);font-size:13px;min-height:18px}

/* ── KIOSK ── */
.k-head{display:flex;align-items:center;justify-content:space-between;padding:18px 28px;border-bottom:1px solid var(--line)}
.k-left{display:flex;align-items:center;gap:12px}
.k-home{width:38px;height:38px;border-radius:10px;background:var(--surface);border:1px solid var(--line-2);font-size:17px;display:flex;align-items:center;justify-content:center;text-decoration:none;flex-shrink:0}
.k-snack{color:var(--gold);font-weight:700;font-size:20px}
.k-snack small{color:var(--muted);font-weight:400;font-size:12px;display:block;letter-spacing:.05em;text-transform:uppercase;margin-bottom:2px}
.k-right{display:flex;align-items:center;gap:14px}
.k-clock{font-size:22px;font-weight:600;letter-spacing:.5px}
.k-clock small{color:var(--muted);font-size:11px;display:block;text-align:right}
.net-pill{font-size:11px;font-weight:700;padding:5px 11px;border-radius:20px;white-space:nowrap}
.net-on{background:rgba(63,184,127,.15);color:var(--ok)}
.net-off{background:rgba(196,90,90,.15);color:var(--bad)}
.k-body{padding:24px 28px;overflow-y:auto;height:calc(100vh - 80px);-webkit-overflow-scrolling:touch;display:flex;align-items:center;justify-content:center}
.k-hint{color:var(--muted);font-size:14px;text-align:center;margin-bottom:18px}

/* ── PAVÉ NUMÉRIQUE (écran d'accueil) ── */
.kp-wrap{display:flex;flex-direction:column;align-items:center;gap:6px}
.pin-dots{display:flex;gap:16px;margin:8px 0 18px}
.pd{width:20px;height:20px;border-radius:50%;border:2px solid var(--line-2);transition:transform .15s ease,background .15s,border-color .15s}
.pd.on{background:var(--gold);border-color:var(--gold);transform:scale(1.2)}
.pin-err{color:var(--bad);font-size:14px;font-weight:600;height:20px;margin-bottom:6px}
.pad{display:grid;grid-template-columns:repeat(3,96px);gap:14px}
.pad button{width:96px;height:80px;border-radius:16px;background:var(--surface);border:1px solid var(--line-2);font-size:26px;font-weight:600}
.pad button:active{background:var(--gold);color:#111}
.pad button.cx{background:transparent;border-color:transparent;color:var(--muted);font-size:20px}

/* ── ACTION MODAL ── */
.modal{position:fixed;inset:0;background:rgba(0,0,0,.85);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:100;gap:18px}
.modal .who{font-size:18px;font-weight:600}
.modal .who small{color:var(--muted);font-size:12px;display:block;text-transform:uppercase;letter-spacing:.06em;margin-bottom:6px}
.acts{display:flex;flex-direction:column;gap:14px;width:90%;max-width:380px}
.act{padding:22px;border-radius:14px;background:var(--surface);border:1px solid var(--line-2);font-size:18px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:14px}
.act .ico{font-size:26px}
.act-arrivee{border-color:var(--ok);color:var(--ok)}
.act-pause{border-color:var(--pause);color:var(--pause)}
.act-reprise{border-color:var(--ok);color:var(--ok)}
.act-sortie{border-color:var(--warn);color:var(--warn)}
.cancel{margin-top:4px;color:var(--muted);font-size:13px;padding:10px 24px}

/* ── BANNIÈRE MISE À JOUR ── */
/* body.upd-open réserve l'espace en bas quand la bannière est visible : elle ne doit JAMAIS
   recouvrir un bouton d'action (ex. Valider/Terminer en bas d'écran sur les autres kiosques). */
body.upd-open{padding-bottom:64px}
.upd-bar{position:fixed;left:0;right:0;bottom:0;background:var(--gold);color:#1a1a1a;padding:12px 20px;display:flex;align-items:center;justify-content:center;gap:12px;font-size:14px;font-weight:600;z-index:300}
.upd-bar button{background:#1a1a1a;color:var(--gold);padding:8px 16px;border-radius:8px;font-weight:700;font-size:13px;border:none}
.upd-bar .upd-close{background:transparent;color:#1a1a1a;padding:4px 8px;font-size:16px;font-weight:700}

/* ── SUCCESS ── */
.suc{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:rgba(0,0,0,.92);z-index:200;gap:20px}
.suc .ck{width:100px;height:100px;border-radius:50%;background:var(--ok);display:flex;align-items:center;justify-content:center;font-size:56px;color:#fff;animation:pop .4s ease-out}
.suc .msg{font-size:22px;font-weight:600}
.suc .who2{color:var(--muted);font-size:14px}
@keyframes pop{0%{transform:scale(0)}80%{transform:scale(1.15)}100%{transform:scale(1)}}

@media(max-width:480px){
  .k-head{padding:14px}
  .k-body{padding:14px}
  .pad{grid-template-columns:repeat(3,84px)}
  .pad button{width:84px;height:70px;font-size:22px}
}
/* Tab A9 8.7" (1340×800, DPR~2 → ~670×400 CSS px en portrait, ~800-900 en paysage selon la barre
   système) : le pavé numérique est maintenant l'écran principal — cibles tactiles généreuses (le
   digitizer d'entrée de gamme est moins précis), pas de liste à faire défiler. */
@media(min-width:481px) and (max-width:1024px){
  .pad{grid-template-columns:repeat(3,104px);gap:16px}
  .pad button{width:104px;height:88px;font-size:28px}
}
</style>
</head>
<body>

<!-- KIOSK -->
<div id="kiosk" class="hidden">
  <div class="k-head">
    <div class="k-left">
      <a href="../kiosk/" class="k-home" title="Retour au menu">🏠</a>
      <div class="k-snack"><small>Pointage</small><span id="k-snack-name">—</span></div>
    </div>
    <div class="k-right">
      <span class="net-pill" id="net-pill">—</span>
      <div class="k-clock"><span id="k-clock">--:--:--</span><small id="k-date">—</small></div>
    </div>
  </div>
  <div class="k-body">
    <div class="kp-wrap">
      <div class="k-hint">Tape ton code (4 chiffres)</div>
      <div class="pin-dots" id="pin-dots"><div class="pd"></div><div class="pd"></div><div class="pd"></div><div class="pd"></div></div>
      <div class="pin-err" id="pin-err"></div>
      <div class="pad">
        <button onclick="pinKey('1')">1</button><button onclick="pinKey('2')">2</button><button onclick="pinKey('3')">3</button>
        <button onclick="pinKey('4')">4</button><button onclick="pinKey('5')">5</button><button onclick="pinKey('6')">6</button>
        <button onclick="pinKey('7')">7</button><button onclick="pinKey('8')">8</button><button onclick="pinKey('9')">9</button>
        <button class="cx" onclick="clearAll()">✕</button><button onclick="pinKey('0')">0</button><button onclick="pinKey('B')">⌫</button>
      </div>
    </div>
  </div>
</div>

<!-- ACTION MODAL -->
<div id="act" class="modal hidden">
  <div class="who"><small>Que veux-tu faire ?</small><span id="act-who">—</span></div>
  <div class="acts" id="acts"></div>
  <button class="cancel" onclick="closeAct()">Annuler</button>
</div>

<!-- BANNIÈRE MISE À JOUR -->
<div id="updBar" class="upd-bar hidden">
  <span>🆕 Nouvelle version disponible</span>
  <button data-upd-reload>Recharger</button>
  <button class="upd-close" data-upd-close aria-label="Fermer">✕</button>
</div>

<!-- SUCCÈS -->
<div id="suc" class="suc hidden">
  <div class="ck">✓</div>
  <div class="msg" id="suc-msg">Pointé</div>
  <div class="who2" id="suc-who">—</div>
</div>

<script>
const SUPA_URL='https://ynnqvtfayrdteqtgxeuk.supabase.co';
const SUPA_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InlubnF2dGZheXJkdGVxdGd4ZXVrIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzk4OTE1MTQsImV4cCI6MjA5NTQ2NzUxNH0._mfVAGexu7ew38UQk6adn42az4Gt_J3ePxR6O6wuWHc';
const sb=supabase.createClient(SUPA_URL,SUPA_KEY);
const VERSION='v0.9 · option "badgeage libre" (Paramètres > Organisation) pour badger sur n\'importe quel snack';

let SNACK={id:null,nom:null,organization_id:null};
let curSal=null, curLast=null, pinBuf='';
let BADGEUSE_LIBRE=false; // org.badgeuse_libre : si true, un salarié peut badger sur n'importe quel snack de l'org

// ===== INIT =====
// Config + reconfig ne vivent plus ici : le SEUL point d'entrée pour tout ça est désormais le hub
// (/kiosk/) — un appareil sans config connue (ni clé unifiée, ni ancienne clé badgeuse_snack_*)
// est renvoyé là-bas plutôt que de repasser par un écran de setup dupliqué ici.
async function init(){
  const cfg=EatimeKiosk.getSnackConfig('badgeuse');
  SNACK.id=cfg.id;SNACK.nom=cfg.nom;SNACK.organization_id=cfg.organization_id;
  if(!SNACK.id){location.href='../kiosk/';return;}
  if(!SNACK.organization_id){
    const{data:r}=await sb.from('restaurants').select('organization_id').eq('id',SNACK.id).maybeSingle();
    if(r&&r.organization_id){SNACK.organization_id=r.organization_id;EatimeKiosk.setSnackConfig({id:SNACK.id,nom:SNACK.nom,organization_id:r.organization_id});}
  }
  // Paramètre org : badgeage libre (n'importe quel snack) ou restreint au snack d'affectation.
  // Best-effort : si la lecture échoue (réseau), on reste sur le comportement restreint par défaut.
  try{
    const{data:orgCfg}=await sb.from('organizations').select('badgeuse_libre').eq('id',SNACK.organization_id).maybeSingle();
    BADGEUSE_LIBRE=!!(orgCfg&&orgCfg.badgeuse_libre);
  }catch(e){BADGEUSE_LIBRE=false;}
  document.getElementById('k-snack-name').textContent=SNACK.nom||'?';
  document.getElementById('kiosk').classList.remove('hidden');
  startClock();
  EatimeKiosk.initWakeLock();
  EatimeKiosk.watchOnline(renderNetPill);
  // Le pointage en cours (modale #act ouverte) bloque le retour auto au hub — jamais interrompre
  // un salarié en train de choisir son action.
  EatimeKiosk.initIdleReturn(10, ()=>!document.getElementById('act').classList.contains('hidden'));
  await EatimeKiosk.registerSW(); // câble lui-même #updBar si une vraie nouvelle version est détectée
}

function renderNetPill(online){
  const el=document.getElementById('net-pill');
  el.textContent=online?'🟢 En ligne':'🔴 Hors-ligne';
  el.className='net-pill '+(online?'net-on':'net-off');
}

// ===== CLOCK =====
function startClock(){
  const upd=()=>{
    const d=new Date();
    const pad=n=>String(n).padStart(2,'0');
    document.getElementById('k-clock').textContent=`${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`;
    document.getElementById('k-date').textContent=d.toLocaleDateString('fr-FR',{weekday:'long',day:'numeric',month:'long'});
  };
  upd();setInterval(upd,1000);
}

const fullName=s=>[s.prenom,s.nom].filter(Boolean).join(' ');
function stateOf(last){
  if(!last) return 'absent';
  if((Date.now()-new Date(last.ts).getTime())>18*3600*1000) return 'absent'; // périmé (même seuil que create-pointage)
  if(last.type==='sortie') return 'absent';
  if(last.type==='pause_debut') return 'pause';
  return 'present'; // arrivee ou pause_fin
}
async function fetchLastPointage(sid){
  const{data}=await sb.from('pointages').select('type,ts').eq('salarie_id',sid).order('ts',{ascending:false}).limit(1);
  return (data&&data[0])||null;
}

// ===== PIN DIRECT =====
// v6.18 : PIN strict 4 chiffres (fini le 4-6 du S11) → validation systématiquement automatique,
// pas besoin de bouton "Valider".
function renderDots(){
  document.querySelectorAll('#pin-dots .pd').forEach((d,i)=>d.classList.toggle('on',i<pinBuf.length));
}
function pinKey(k){
  if(k==='B'){pinBuf=pinBuf.slice(0,-1);renderDots();return;}
  if(pinBuf.length>=4)return;
  pinBuf+=k;renderDots();
  if(pinBuf.length===4)checkPin();
}
function clearAll(){pinBuf='';renderDots();document.getElementById('pin-err').textContent='';}

let _pinErrTimer=null;
function flashErr(msg){
  const el=document.getElementById('pin-err');
  el.textContent=msg;
  clearTimeout(_pinErrTimer);
  _pinErrTimer=setTimeout(()=>{el.textContent='';},2500);
}

async function checkPin(){
  if(pinBuf.length<4)return;
  document.getElementById('pin-err').textContent='';
  // Recherche org-wide (style Skello) : verify-pin retrouve le salarié à partir du seul code, sans
  // qu'on ait besoin de le désigner au préalable dans une liste.
  const res=await verifyPin(SUPA_URL,SUPA_KEY,SNACK.organization_id,SNACK.id,pinBuf);
  if(res.status===429){
    flashErr('Trop de tentatives. Réessaie dans '+Math.ceil((res.retry||60)/60)+' min.');
    pinBuf='';renderDots();return;
  }
  // status:0 = réseau indisponible/trop lent (offline franc OU tablette sans route). NE PAS afficher
  // "Code inconnu" ici : le salarié croirait son PIN faux et retenterait jusqu'au rate-limit.
  if(res.status===0){
    flashErr('Réseau indisponible — réessaie');
    pinBuf='';renderDots();return;
  }
  if(!res.ok || !res.salarie){
    flashErr('Code inconnu'); // pas de distinction "PIN existe mais mauvais snack" vs "PIN inexistant" : aucune fuite d'info
    pinBuf='';renderDots();return;
  }
  // Vérification d'affectation snack : verify-pin cherche sur toute l'organisation, donc on reproduit
  // ici le filtre qu'assurait auparavant la grille (salarié affecté à CE snack, ou multi-snack).
  // Sauf si l'org a activé "badgeage libre" (Paramètres > Organisation) : l'affectation snack ne sert
  // alors plus qu'au planning, pas à restreindre où le salarié peut badger (ex: dépannage entre snacks).
  if(!BADGEUSE_LIBRE){
    const{data:sinfo}=await sb.from('salaries').select('snack_origine_id,est_multi').eq('id',res.salarie.id).maybeSingle();
    if(!sinfo || (sinfo.snack_origine_id!==SNACK.id && !sinfo.est_multi)){
      flashErr('Code inconnu');
      pinBuf='';renderDots();return;
    }
  }
  curSal=res.salarie;
  curLast=await fetchLastPointage(curSal.id);
  showActions(); // pinBuf reste en mémoire : nécessaire à doPoint() pour la re-vérification serveur (create-pointage)
}

// ===== ACTIONS =====
function showActions(){
  const st=stateOf(curLast);
  let acts=[];
  if(st==='absent') acts=[{t:'arrivee',lbl:'Arrivée',ico:'✅',cls:'act-arrivee'}];
  else if(st==='present') acts=[{t:'pause_debut',lbl:'Pause',ico:'☕',cls:'act-pause'},{t:'sortie',lbl:'Sortie',ico:'🚪',cls:'act-sortie'}];
  else if(st==='pause') acts=[{t:'pause_fin',lbl:'Reprise',ico:'▶️',cls:'act-reprise'},{t:'sortie',lbl:'Sortie',ico:'🚪',cls:'act-sortie'}];
  document.getElementById('act-who').textContent='Bonjour '+(curSal.prenom||fullName(curSal));
  document.getElementById('acts').innerHTML=acts.map(a=>`<button class="act ${a.cls}" onclick="doPoint('${a.t}','${a.lbl}')"><span class="ico">${a.ico}</span><span>${a.lbl}</span></button>`).join('');
  document.getElementById('act').classList.remove('hidden');
}
function closeAct(){
  document.getElementById('act').classList.add('hidden');
  curSal=null;curLast=null;pinBuf='';renderDots();
}

async function doPoint(type,lbl){
  document.getElementById('act').classList.add('hidden');
  // S11 suite : le pointage passe par create-pointage (service_role) qui re-vérifie le PIN
  // (déjà en mémoire dans pinBuf depuis checkPin), la cohérence org/resto, la séquence d'état
  // et bloque les doubles-tap — un insert direct via la clé anon ne garantissait plus rien de tout ça.
  const res=await createPointage(SUPA_URL,SUPA_KEY,SNACK.organization_id,SNACK.id,curSal.id,type,pinBuf);
  const who=fullName(curSal);
  pinBuf='';renderDots();
  if(!res.ok){
    let msg=res.error||'Erreur inconnue';
    if(res.status===429) msg='Trop de tentatives. Réessaie dans '+Math.ceil((res.retry||60)/60)+' min.';
    alert('⚠️ '+msg);curSal=null;curLast=null;return;
  }
  // Succès
  document.getElementById('suc-msg').textContent=lbl+' enregistrée'; // Arrivée/Pause/Reprise/Sortie : toutes féminines
  document.getElementById('suc-who').textContent=who+' · '+new Date().toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'});
  document.getElementById('suc').classList.remove('hidden');
  setTimeout(()=>{document.getElementById('suc').classList.add('hidden');curSal=null;curLast=null;},2200);
}

init();
</script>
<script defer src="../assistant-widget.js?v=4.9"></script>
</body>
</html>
