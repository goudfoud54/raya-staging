<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script>(function(){var t=localStorage.getItem("eatime_theme");document.documentElement.setAttribute("data-theme",t==="light"?"light":"dark");})();</script>
<title>Invitation — Eatime360</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root, [data-theme="dark"]{--gold:#c8a035;--bg:#0b0b15;--card:#15151f;--surface:#1c1c28;--line:rgba(255,255,255,.06);--line-2:rgba(255,255,255,.14);--text:#e8e8ec;--muted:#7b7b8a;--bad:#c45a5a;--ok:#3fb87f}
[data-theme="light"]{--gold:#c8a035;--bg:#f5f5f7;--card:#ffffff;--surface:#f0f0f3;--line:rgba(0,0,0,.06);--line-2:rgba(0,0,0,.12);--text:#1a1a1f;--muted:#6b6b78;--ok:#2a8f5f;--warn:#b8841f;--bad:#b04444;--info:#4a7fbd}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:30px;max-width:420px;width:100%}
.logo{color:var(--gold);font-size:24px;font-weight:800;text-align:center;margin-bottom:6px}
.logo small{display:block;color:var(--muted);font-weight:400;font-size:12px;margin-top:4px}
.invitee{background:var(--surface);border:1px solid var(--line-2);border-radius:10px;padding:14px;margin:18px 0;font-size:13px;color:var(--muted)}
.invitee b{color:var(--text)}
.fld{margin-bottom:12px}
.fld label{display:block;font-size:11.5px;color:var(--muted);margin-bottom:5px;font-weight:500}
.fld input{width:100%;padding:11px 14px;border-radius:10px;border:1px solid var(--line-2);background:var(--surface);color:var(--text);font-size:14px;outline:none}
.fld input:focus{border-color:var(--gold)}
.btn{width:100%;padding:13px;border-radius:10px;background:var(--gold);color:#1a1a1a;font-weight:700;font-size:14px;border:none;cursor:pointer}
.err{color:var(--bad);font-size:13px;text-align:center;min-height:18px;margin-top:10px}
.ok{color:var(--ok);font-weight:600;font-size:14px;text-align:center;padding:12px}
.tag{display:inline-block;padding:2px 9px;border-radius:20px;background:rgba(200,160,53,.15);color:var(--gold);font-size:11px;font-weight:600;text-transform:uppercase}
</style>
</head>
<body>
<div class="card">
  <div class="logo">Eatime360<small>Invitation</small></div>
  <div id="content"><div style="text-align:center;color:var(--muted);padding:20px">Chargement de l'invitation…</div></div>
</div>
<script>
const SUPA_URL='https://ynnqvtfayrdteqtgxeuk.supabase.co';
const SUPA_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InlubnF2dGZheXJkdGVxdGd4ZXVrIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzk4OTE1MTQsImV4cCI6MjA5NTQ2NzUxNH0._mfVAGexu7ew38UQk6adn42az4Gt_J3ePxR6O6wuWHc';
const sb=supabase.createClient(SUPA_URL,SUPA_KEY);
const ROLE_LBL={super_admin:'Super admin',admin:'Admin',manager:'Manager',salarie:'Salarié'};
let INVITE=null;

async function init(){
  const params=new URLSearchParams(location.search);
  const token=params.get('token');
  if(!token){show('<div class="err">Lien d\'invitation invalide.</div>');return;}
  const{data:inv,error}=await sb.rpc('get_invitation_public',{p_token:token});
  if(error){show('<div class="err">Erreur: '+error.message+'</div>');return;}
  if(!inv){show('<div class="err">Invitation introuvable ou expirée.</div>');return;}
  if(inv.accepted_at){show('<div class="ok">✓ Invitation déjà acceptée.<br><br><a href="../" style="color:var(--gold)">Se connecter</a></div>');return;}
  if(inv.expires_at && new Date(inv.expires_at)<new Date()){show('<div class="err">Cette invitation a expiré.</div>');return;}
  inv.token=token;
  INVITE=inv;
  if(inv.org_couleur_primaire) document.documentElement.style.setProperty('--gold',inv.org_couleur_primaire);
  show(`
    <div class="invitee">
      Tu as été invité à rejoindre <b>${inv.org_nom}</b> en tant que <span class="tag">${ROLE_LBL[inv.role]}</span>
    </div>
    <div class="fld"><label>Nom complet</label><input type="text" id="name"></div>
    <div class="fld"><label>Email (de l'invitation)</label><input type="email" id="email" value="${inv.email}" readonly style="opacity:.6"></div>
    <div class="fld"><label>Choisis un mot de passe (8 caractères min)</label><input type="password" id="pw" autocomplete="new-password" onkeydown="if(event.key==='Enter')accept()"></div>
    <button class="btn" onclick="accept()">Créer mon compte</button>
    <div class="err" id="err"></div>
  `);
}
function show(html){document.getElementById('content').innerHTML=html;}
async function accept(){
  const name=document.getElementById('name').value.trim();
  const pw=document.getElementById('pw').value;
  if(!pw||pw.length<8){document.getElementById('err').textContent='Mot de passe 8 caractères min';return;}
  document.getElementById('err').textContent='Création du compte…';
  const{error}=await sb.auth.signUp({
    email:INVITE.email,
    password:pw,
    options:{data:{full_name:name,invite_token:INVITE.token}}
  });
  if(error){
    // Cas fréquent : un compte auth existe déjà pour cet email (ancien test, ou salarié
    // retiré puis réinvité — removeUser() ne supprime que profiles, pas auth.users).
    // On tente de se connecter avec le mot de passe saisi pour rattacher l'invitation
    // à ce compte existant plutôt que d'afficher l'erreur brute de Supabase.
    if(/already registered|already exists/i.test(error.message)){
      document.getElementById('err').textContent='Un compte existe déjà pour cet email — connexion…';
      const{error:loginErr}=await sb.auth.signInWithPassword({email:INVITE.email,password:pw});
      if(loginErr){
        document.getElementById('err').innerHTML='Un compte existe déjà avec cet email, mais ce mot de passe ne correspond pas au compte existant.<br><br>Connecte-toi avec ton mot de passe existant depuis <a href="../" style="color:var(--gold)">la page de connexion</a> (utilise "mot de passe oublié" si besoin), puis redemande l\'invitation à ton admin si l\'accès n\'apparaît pas.';
        return;
      }
      const{data:linkRes,error:linkErr}=await sb.rpc('accept_invitation_existing_user',{p_token:INVITE.token,p_full_name:name});
      if(linkErr||!linkRes||!linkRes.ok){
        document.getElementById('err').textContent=(linkErr&&linkErr.message)||(linkRes&&linkRes.error)||'Erreur de rattachement du compte';
        return;
      }
      show(`<div class="ok">✓ Compte existant rattaché !<br><br>Bienvenue dans <b>${INVITE.org_nom}</b>.<br><br><a href="../" style="color:var(--gold);font-weight:700">Accéder au tableau de bord →</a></div>`);
      return;
    }
    document.getElementById('err').textContent=error.message;
    return;
  }
  // Auto-login + redirection
  await sb.auth.signInWithPassword({email:INVITE.email,password:pw});
  show(`<div class="ok">✓ Compte créé !<br><br>Bienvenue dans <b>${INVITE.org_nom}</b>.<br><br><a href="../" style="color:var(--gold);font-weight:700">Accéder au tableau de bord →</a></div>`);
}
init();
</script>
</body>
</html>
