<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<script>(function(){var t=localStorage.getItem("eatime_theme");var th=t==="light"?"light":"dark";document.documentElement.setAttribute("data-theme",th);document.documentElement.style.colorScheme=th;})();</script>
<title>Stock — Kiosque</title>
<meta name="color-scheme" content="dark light">
<meta name="theme-color" content="#c8a035">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../utils.js?v=1.3"></script>
<script src="../kiosk-shared.js?v=1"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
.hidden{display:none!important}
:root, [data-theme="dark"]{--gold:#c8a035;--bg:#0b0b15;--card:#15151f;--surface:#1c1c28;--line:rgba(255,255,255,.06);--line-2:rgba(255,255,255,.14);--text:#e8e8ec;--muted:#7b7b8a;--ok:#3fb87f;--warn:#e0a93a;--bad:#c45a5a}
[data-theme="light"]{--gold:#c8a035;--bg:#f5f5f7;--card:#ffffff;--surface:#f0f0f3;--line:rgba(0,0,0,.06);--line-2:rgba(0,0,0,.12);--text:#1a1a1f;--muted:#6b6b78;--ok:#2a8f5f;--warn:#b8841f;--bad:#b04444}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;overflow-x:hidden}
.scr{min-height:100vh;display:flex;flex-direction:column;padding:20px;max-width:560px;margin:0 auto}
h1{color:var(--gold);font-size:32px;font-weight:800;text-align:center;margin-bottom:8px}
h1 small{display:block;font-size:13px;color:var(--muted);font-weight:400;margin-top:6px}
.hint{color:var(--muted);text-align:center;font-size:14px;margin-bottom:22px}
.back{position:absolute;top:58px;left:14px;background:none;border:1px solid var(--line-2);color:var(--text);padding:8px 14px;border-radius:8px;font-size:13px;cursor:pointer}
.kiosk-topbar{position:fixed;top:0;left:0;right:0;display:flex;justify-content:space-between;align-items:center;padding:10px 16px;z-index:50}
.hub-home{width:36px;height:36px;border-radius:9px;background:var(--card);border:1px solid var(--line);color:var(--text);display:flex;align-items:center;justify-content:center;text-decoration:none;font-size:16px}
.net-pill{font-size:11px;font-weight:700;padding:5px 11px;border-radius:20px;white-space:nowrap}
.net-on{background:rgba(63,184,127,.15);color:var(--ok)}
.net-off{background:rgba(196,90,90,.15);color:var(--bad)}
body.upd-open{padding-bottom:64px}
.upd-bar{position:fixed;left:0;right:0;bottom:0;background:var(--gold);color:#1a1a1a;padding:12px 20px;display:flex;align-items:center;justify-content:center;gap:12px;font-size:14px;font-weight:600;z-index:300}
.upd-bar button{background:#1a1a1a;color:var(--gold);padding:8px 16px;border-radius:8px;font-weight:700;font-size:13px;border:none;cursor:pointer}
.upd-bar .upd-close{background:transparent;color:#1a1a1a;padding:4px 8px;font-size:16px;font-weight:700}
.tile{background:var(--card);border:1px solid var(--line);padding:24px;border-radius:14px;text-align:center;cursor:pointer;transition:.15s;font-size:16px;font-weight:600;color:inherit}
.tile:hover,.tile:active{border-color:var(--gold);transform:translateY(-2px)}
.tile .ic{font-size:42px;margin-bottom:10px;display:block}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;max-width:340px;margin:0 auto}
.pad button{padding:24px;font-size:24px;font-weight:700;background:var(--card);border:1px solid var(--line);color:var(--text);border-radius:14px;cursor:pointer}
.pad button:active{background:var(--gold);color:#1a1a1a}
.pad .clr{background:rgba(196,90,90,.12);color:var(--bad);border-color:rgba(196,90,90,.3)}
.pad .ok{background:var(--gold);color:#1a1a1a;font-weight:800;border:none}
.pin-display{font-size:36px;letter-spacing:.4em;text-align:center;color:var(--gold);font-weight:800;margin:18px 0;min-height:46px}
.err{color:var(--bad);font-size:14px;text-align:center;margin-top:10px}
.ok-msg{color:var(--ok);font-weight:700;text-align:center;font-size:18px;padding:30px}
.user{background:var(--surface);padding:10px 14px;border-radius:10px;font-size:13px;text-align:center;margin-bottom:18px;color:var(--gold)}
.cat-block{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:12px}
.cat-title{font-weight:700;font-size:15px;color:var(--gold);margin-bottom:10px;display:flex;justify-content:space-between;align-items:center}
.cat-title small{font-size:11px;color:var(--muted);font-weight:400}
.prod-row{display:grid;grid-template-columns:1fr 100px;gap:10px;align-items:center;padding:10px 4px;border-bottom:1px solid var(--line)}
.prod-row:last-child{border-bottom:none}
.prod-name{font-size:14px;color:var(--text)}
.prod-name small{display:block;color:var(--muted);font-size:11px;margin-top:2px}
.prod-input{width:100%;padding:12px;border-radius:8px;border:1px solid var(--line-2);background:var(--surface);color:var(--text);font-size:18px;text-align:center;font-weight:700;outline:none}
.prod-input:focus{border-color:var(--gold)}
.prod-input.done{border-color:var(--ok);background:rgba(63,184,127,.1)}
.cmt-toggle{background:none;border:1px solid var(--line-2);border-radius:6px;padding:1px 6px;font-size:13px;line-height:1.4;cursor:pointer;vertical-align:middle;margin-left:4px}
.cmt-toggle.has{border-color:var(--gold);background:rgba(200,160,53,.16)}
.cmt-wrap{grid-column:1/-1;margin-top:8px}
.cmt-field{width:100%;padding:11px 12px;border-radius:8px;border:1px solid var(--line-2);background:var(--surface);color:var(--text);font-size:14px;outline:none}
.cmt-field:focus{border-color:var(--gold)}
.cmt-hint{color:var(--warn);font-size:11px;margin-top:4px}
/* Mode « commentaire seul » : le champ texte EST le champ principal de la ligne (pleine largeur). */
.cmt-only-input{grid-column:1/-1;width:100%;padding:12px;border-radius:8px;border:1px solid var(--line-2);background:var(--surface);color:var(--text);font-size:15px;outline:none}
.cmt-only-input:focus{border-color:var(--gold)}
.cmt-only-input.done{border-color:var(--ok);background:rgba(63,184,127,.1)}
.btn{padding:16px;border-radius:10px;background:var(--gold);color:#1a1a1a;font-weight:700;font-size:16px;border:none;cursor:pointer;width:100%}
.btn.ghost{background:transparent;color:var(--text);border:1px solid var(--line-2)}
.progress{height:8px;background:var(--line);border-radius:4px;overflow:hidden;margin:14px 0}
.progress-bar{height:100%;background:var(--gold);transition:.3s}
.cat-tabs{display:flex;gap:6px;overflow-x:auto;padding:8px 0;margin-bottom:12px;-webkit-overflow-scrolling:touch}
.cat-tab{padding:8px 14px;background:var(--card);border:1px solid var(--line);border-radius:20px;color:var(--text);font-size:13px;font-weight:600;white-space:nowrap;cursor:pointer}
.cat-tab.active{background:var(--gold);color:#1a1a1a;border-color:var(--gold)}
.cat-tab .num{margin-left:6px;font-size:11px;opacity:.7}
</style>
</head>
<body>
<div class="kiosk-topbar">
  <a href="../kiosk/" class="hub-home" title="Retour au menu">🏠</a>
  <span class="net-pill" id="net-pill">—</span>
</div>
<div id="scr"></div>
<div id="updBar" class="upd-bar hidden">
  <span>🆕 Nouvelle version disponible</span>
  <button data-upd-reload>Recharger</button>
  <button class="upd-close" data-upd-close aria-label="Fermer">✕</button>
</div>
<script>
const SUPA_URL='https://ynnqvtfayrdteqtgxeuk.supabase.co';
const SUPA_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InlubnF2dGZheXJkdGVxdGd4ZXVrIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzk4OTE1MTQsImV4cCI6MjA5NTQ2NzUxNH0._mfVAGexu7ew38UQk6adn42az4Gt_J3ePxR6O6wuWHc';
const sb=supabase.createClient(SUPA_URL,SUPA_KEY);
let SALARIE=null,PIN='',SNACK_ID=null,SNACK=null,SNACKS=[],PRODUITS=[],STOCK_MAX={},SAISIES_TODAY={},CMT_MODE={};

// Config partagée avec badgeuse/HACCP/hub (kiosk-shared.js) : plus de picker local ici — un
// appareil non configuré est renvoyé vers le hub, seul endroit qui gère setup + reconfig.
async function init(){
  const cfg=EatimeKiosk.getSnackConfig('stock');
  SNACK_ID=cfg.id;
  if(!SNACK_ID){location.href='../kiosk/';return;}
  const{data:snacks}=await sb.from('restaurants').select('id,nom,organization_id');SNACKS=snacks||[];
  SNACK=SNACKS.find(s=>s.id===SNACK_ID);
  if(!SNACK){EatimeKiosk.clearSnackConfig();location.href='../kiosk/';return;}
  await loadStockData();
  pinScreen();
  EatimeKiosk.initWakeLock();
  EatimeKiosk.watchOnline(renderNetPill);
  EatimeKiosk.initIdleReturn(10, ()=>!!SALARIE);
  await EatimeKiosk.registerSW();
}
// Charge produits + stock_max + saisies du jour + mode commentaire. Rejoué à CHAQUE connexion PIN
// (cf. validatePin) et pas seulement au boot : une tablette reste ouverte des jours, et un changement
// admin (nouveau produit, désactivation, passage en « commentaire seul ») doit être visible dès le
// salarié suivant sans reload manuel. ⚠ On n'écrase un cache que si SA requête a réussi : un reload
// partiel (réseau capricieux) ne doit jamais vider l'inventaire sous les pieds d'un salarié qui vient
// de s'authentifier — on garde alors les données précédemment chargées.
async function loadStockData(){
  const today=todayYMD(); // jour métier local — même base que date_saisie écrit + l'alerte stock
  const[p,m,s,c]=await Promise.all([
    sb.from('stock_produits').select('*').eq('actif',true).eq('organization_id',SNACK.organization_id).order('categorie').order('nom'),
    sb.from('stock_max').select('*').eq('actif',true).eq('restaurant_id',SNACK_ID),
    sb.from('stock_saisies').select('*').eq('restaurant_id',SNACK_ID).eq('date_saisie',today),
    // Mode commentaire par produit (optionnel / obligatoire), indépendant de actif → requête dédiée.
    sb.from('stock_max').select('produit_id,mode_commentaire').eq('restaurant_id',SNACK_ID).neq('mode_commentaire','aucun'),
  ]);
  if(!p.error && p.data){ PRODUITS=p.data; }
  if(!m.error && m.data){ STOCK_MAX={};m.data.forEach(x=>{STOCK_MAX[x.produit_id]=x;}); }
  if(!s.error && s.data){ SAISIES_TODAY={};s.data.forEach(x=>{SAISIES_TODAY[x.produit_id]=x;}); }
  if(!c.error && c.data){ CMT_MODE={};c.data.forEach(x=>{CMT_MODE[x.produit_id]=x.mode_commentaire;}); }
}
function renderNetPill(online){
  const el=document.getElementById('net-pill');
  el.textContent=online?'🟢 En ligne':'🔴 Hors-ligne';
  el.className='net-pill '+(online?'net-on':'net-off');
}

function pinScreen(){
  PIN='';SALARIE=null;
  document.getElementById('scr').innerHTML=`<div class="scr">
    <h1>Stock<small>${SNACK?.nom||''}</small></h1>
    <div class="hint">Saisis ton code PIN pour commencer l'inventaire</div>
    <div class="pin-display" id="pinDisp"></div>
    <div class="pad">
      <button onclick="addPin('1')">1</button><button onclick="addPin('2')">2</button><button onclick="addPin('3')">3</button>
      <button onclick="addPin('4')">4</button><button onclick="addPin('5')">5</button><button onclick="addPin('6')">6</button>
      <button onclick="addPin('7')">7</button><button onclick="addPin('8')">8</button><button onclick="addPin('9')">9</button>
      <button class="clr" onclick="clrPin()">C</button><button onclick="addPin('0')">0</button><button class="ok" onclick="validatePin()">OK</button>
    </div>
    <div class="err" id="pinErr"></div>
  </div>`;
}
function addPin(d){if(PIN.length<6){PIN+=d;document.getElementById('pinDisp').textContent='•'.repeat(PIN.length);}}
function clrPin(){PIN='';document.getElementById('pinDisp').textContent='';document.getElementById('pinErr').textContent='';}
async function validatePin(){
  if(!PIN){document.getElementById('pinErr').textContent='Code requis';return;}
  // S11 : vérification du PIN côté serveur (rate-limit par tablette) via edge function verify-pin.
  // On recharge la config EN PARALLÈLE de la vérif PIN → le salarié qui se connecte voit toujours
  // l'état admin le plus frais (produits/mode commentaire/saisies du jour), coût latence ~nul.
  const[res]=await Promise.all([
    verifyPin(SUPA_URL,SUPA_KEY,SNACK.organization_id,SNACK.id,PIN),
    loadStockData(),
  ]);
  const clear=()=>{PIN='';document.getElementById('pinDisp').textContent='';};
  if(res.status===429){document.getElementById('pinErr').textContent='Trop de tentatives. Réessaie dans '+Math.ceil((res.retry||60)/60)+' min.';clear();return;}
  if(!res.ok){document.getElementById('pinErr').textContent=res.error||'Code inconnu';clear();return;}
  SALARIE=res.salarie;
  inventaireScreen();
}

function inventaireScreen(){
  // Toutes les catégories (groupées, empilées de haut en bas)
  const cats=[...new Set(PRODUITS.map(p=>p.categorie||'Divers'))].sort();
  const totalAFaire=PRODUITS.length;
  const totalFait=Object.keys(SAISIES_TODAY).length;
  const pct=totalAFaire?Math.round(totalFait/totalAFaire*100):0;
  document.getElementById('scr').innerHTML=`<div class="scr">
    <button class="back" onclick="pinScreen()">↩ Sortir</button>
    <h1>Inventaire<small>${SNACK?.nom||''}</small></h1>
    <div class="user">👋 ${SALARIE.prenom||''} ${SALARIE.nom} · ${new Date().toLocaleDateString('fr-FR')}</div>
    <div style="text-align:center;font-size:13px;color:var(--muted);margin-bottom:6px" id="cptr">${totalFait} / ${totalAFaire} produits saisis</div>
    <div class="progress"><div class="progress-bar" style="width:${pct}%"></div></div>
    <div id="prodList"></div>
    <div class="err" id="finishErr" style="margin:10px 0"></div>
    <button class="btn" onclick="finishInventaire()" style="margin-top:8px">✓ Terminer l'inventaire</button>
  </div>`;
  renderProdList();
}
function renderProdList(){
  const cats=[...new Set(PRODUITS.map(p=>p.categorie||'Divers'))].sort();
  let html='';
  cats.forEach(c=>{
    const list=PRODUITS.filter(p=>(p.categorie||'Divers')===c);
    const nb=list.length;
    const fait=list.filter(p=>SAISIES_TODAY[p.id]).length;
    html+=`<div class="cat-block" id="cat-${cssId(c)}">
      <div class="cat-title">${c}<small><span class="cat-counter">${fait}/${nb}</span></small></div>`;
    list.forEach(p=>{
      const cur=SAISIES_TODAY[p.id];
      const max=STOCK_MAX[p.id];
      const qte=cur&&cur.quantite!=null?cur.quantite:'';
      const mode=CMT_MODE[p.id]||'aucun';
      const cmtVal=cur&&cur.commentaire?String(cur.commentaire):'';
      if(mode==='obligatoire'){
        // « Commentaire seul » : PAS de quantité. Champ texte directement visible (le champ principal
        // de la ligne). Compte comme saisi seulement s'il est rempli (done si commentaire présent).
        html+=`<div class="prod-row">
          <div class="prod-name">${p.nom} <span title="Commentaire uniquement" style="font-size:12px">📝</span><small>${p.conditionnement||''} · remarque requise</small></div>
          <input type="text" class="cmt-only-input ${cmtVal?'done':''}" data-pid="${p.id}" data-cat="${cssId(c)}" maxlength="300" value="${cmtVal.replace(/"/g,'&quot;')}" placeholder="Saisir la remarque…" onblur="saveCommentOnly('${p.id}',this.value)">
        </div>`;
        return;
      }
      // 💬 discret uniquement si mode 'optionnel' (commentaire EN PLUS de la quantité).
      const hasCmt=mode==='optionnel';
      const cmtBtn=hasCmt?` <button type="button" id="cmtbtn-${p.id}" class="cmt-toggle ${cmtVal?'has':''}" onclick="toggleCmt('${p.id}')" title="Ajouter un commentaire" aria-label="Commentaire">💬</button>`:'';
      const cmtWrap=hasCmt?`<div class="cmt-wrap" id="cmt-${p.id}" style="${cmtVal?'':'display:none'}"><input type="text" class="cmt-field" data-pid="${p.id}" maxlength="300" value="${cmtVal.replace(/"/g,'&quot;')}" placeholder="Remarque (ex: rupture, produit abîmé…)" onblur="saveComment('${p.id}',this.value)"></div>`:'';
      html+=`<div class="prod-row">
        <div class="prod-name">${p.nom}${cmtBtn}<small>${p.conditionnement||''}${max?' · max '+max.quantite_max:''}</small></div>
        <input type="number" step="0.5" class="prod-input ${cur?'done':''}" value="${qte}" placeholder="—" data-pid="${p.id}" data-cat="${cssId(c)}" onfocus="this.select()" onblur="saveSaisie('${p.id}',this.value)" inputmode="decimal">${cmtWrap}
      </div>`;
    });
    html+='</div>';
  });
  if(!PRODUITS.length) html='<div style="text-align:center;color:var(--muted);padding:20px">Aucun produit configuré pour ce snack</div>';
  document.getElementById('prodList').innerHTML=html;
}
function cssId(s){return s.replace(/[^a-zA-Z0-9]/g,'_');}
// Feedback d'erreur NON bloquant sur une cellule (pas d'alert() qui gèle la tablette) : bordure
// rouge + petit message sous l'input. La cellule N'EST PAS marquée "done" tant que la base n'a pas
// confirmé → le compteur reflète la réalité et l'obligation de saisie complète bloque la fin.
function markSaisieError(pid,text){
  const inp=document.querySelector(`input[data-pid="${pid}"]`);
  if(!inp)return;
  inp.classList.remove('done');
  inp.style.borderColor='var(--bad)';inp.style.background='rgba(196,90,90,.12)';
  let msg=inp.closest('.prod-row').querySelector('.saisie-err');
  if(!msg){msg=document.createElement('div');msg.className='saisie-err';msg.style.cssText='grid-column:1/-1;color:var(--bad);font-size:11px;margin-top:4px';inp.closest('.prod-row').appendChild(msg);}
  msg.textContent=text||'⚠ Non enregistré (réseau ?) — retape la valeur';
}
function clearSaisieError(pid){
  const inp=document.querySelector(`input[data-pid="${pid}"]`);
  if(!inp)return;
  inp.style.borderColor='';inp.style.background='';
  const row=inp.closest('.prod-row');const msg=row&&row.querySelector('.saisie-err');if(msg)msg.remove();
}
async function saveSaisie(pid,vTxt){
  const v=parseFloat((vTxt||'').replace(',','.'));
  if(isNaN(v)){
    // Vider une cellule = supprimer la saisie. On ne retire de la mémoire QUE si la base confirme.
    if(SAISIES_TODAY[pid]){
      const{error}=await sb.from('stock_saisies').delete().eq('id',SAISIES_TODAY[pid].id);
      if(error){markSaisieError(pid);return;}
      delete SAISIES_TODAY[pid];
    }
    clearSaisieError(pid);refreshCounters(pid);return;
  }
  if(v<0){markSaisieError(pid,'⚠ Quantité négative impossible');return;} // saisie invalide
  if(SAISIES_TODAY[pid]){
    const{error}=await sb.from('stock_saisies').update({quantite:v}).eq('id',SAISIES_TODAY[pid].id);
    if(error){markSaisieError(pid);return;} // avant : erreur avalée → cellule "done" verte mais base non mise à jour
    SAISIES_TODAY[pid].quantite=v;
  } else {
    // À la création, on embarque un éventuel commentaire déjà tapé (produit avec commentaire activé)
    // pour ne pas le perdre si le salarié a écrit la remarque avant de saisir la quantité.
    const cf=document.querySelector(`.cmt-field[data-pid="${pid}"]`);
    const commentaire=cf?((cf.value||'').trim()||null):null;
    const{data,error}=await sb.from('stock_saisies').insert({organization_id:SNACK.organization_id,restaurant_id:SNACK.id,produit_id:pid,quantite:v,commentaire,date_saisie:todayYMD()}).select().single();
    if(error){markSaisieError(pid);return;}
    SAISIES_TODAY[pid]=data;
  }
  clearSaisieError(pid);refreshCounters(pid);
}
// Ouvre/replie le champ commentaire d'un produit (visible d'emblée s'il contient déjà une remarque).
function toggleCmt(pid){
  const w=document.getElementById('cmt-'+pid); if(!w)return;
  const show=(w.style.display==='none'||!w.style.display);
  w.style.display=show?'block':'none';
  if(show){const f=w.querySelector('.cmt-field');if(f)f.focus();}
}
// Enregistre le commentaire. Peut être ajouté/modifié même sans changer la quantité : si une saisie
// existe déjà → simple update du champ ; sinon il faut une quantité (quantite NOT NULL) → on crée la
// ligne avec la quantité déjà tapée, ou on invite à saisir la quantité d'abord (sans perdre le texte).
async function saveComment(pid,txt){
  const comment=(txt||'').trim()||null;
  const ex=SAISIES_TODAY[pid];
  if(ex){
    if((ex.commentaire||null)===comment){clearCmtHint(pid);return;} // inchangé
    const{error}=await sb.from('stock_saisies').update({commentaire:comment}).eq('id',ex.id);
    if(error){markCmtHint(pid,'⚠ Commentaire non enregistré (réseau ?)');return;}
    ex.commentaire=comment;clearCmtHint(pid);markCmtSaved(pid);
    return;
  }
  if(!comment){clearCmtHint(pid);return;}
  const qInp=document.querySelector(`input.prod-input[data-pid="${pid}"]`);
  const qv=parseFloat((qInp&&qInp.value||'').replace(',','.'));
  if(isNaN(qv)){ markCmtHint(pid,'Saisis d\'abord la quantité pour enregistrer ce commentaire'); return; }
  const{data,error}=await sb.from('stock_saisies').insert({organization_id:SNACK.organization_id,restaurant_id:SNACK.id,produit_id:pid,quantite:qv,commentaire:comment,date_saisie:todayYMD()}).select().single();
  if(error){markCmtHint(pid,'⚠ Commentaire non enregistré (réseau ?)');return;}
  SAISIES_TODAY[pid]=data;clearCmtHint(pid);refreshCounters(pid);markCmtSaved(pid);
}
function markCmtSaved(pid){
  const btn=document.getElementById('cmtbtn-'+pid);
  if(btn) btn.classList.toggle('has', !!(SAISIES_TODAY[pid]&&SAISIES_TODAY[pid].commentaire));
  const f=document.querySelector(`.cmt-field[data-pid="${pid}"]`);
  if(f){const o=f.style.borderColor;f.style.borderColor='var(--ok)';setTimeout(()=>{f.style.borderColor=o;},900);}
}
function markCmtHint(pid,text){ const w=document.getElementById('cmt-'+pid); if(!w)return; let h=w.querySelector('.cmt-hint'); if(!h){h=document.createElement('div');h.className='cmt-hint';w.appendChild(h);} h.textContent=text; }
function clearCmtHint(pid){ const w=document.getElementById('cmt-'+pid); if(!w)return; const h=w.querySelector('.cmt-hint'); if(h)h.remove(); }
// Mode « commentaire seul » : enregistre UNIQUEMENT la remarque (quantite=NULL). Le produit est
// considéré saisi quand la remarque est non vide ; vider le champ supprime la saisie (comme une qté).
async function saveCommentOnly(pid,txt){
  const comment=(txt||'').trim();
  const d=todayYMD(); // date_saisie = jour métier local (pas UTC)
  if(!comment){
    if(SAISIES_TODAY[pid]){
      const{error}=await sb.from('stock_saisies').delete().eq('id',SAISIES_TODAY[pid].id);
      if(error){markSaisieError(pid);return;}
      delete SAISIES_TODAY[pid];
    }
    clearSaisieError(pid);refreshCounters(pid);return;
  }
  if(SAISIES_TODAY[pid]){
    if((SAISIES_TODAY[pid].commentaire||'')===comment){clearSaisieError(pid);return;}
    const{error}=await sb.from('stock_saisies').update({commentaire:comment}).eq('id',SAISIES_TODAY[pid].id);
    if(error){markSaisieError(pid);return;}
    SAISIES_TODAY[pid].commentaire=comment;
  } else {
    const{data,error}=await sb.from('stock_saisies').insert({organization_id:SNACK.organization_id,restaurant_id:SNACK.id,produit_id:pid,quantite:null,commentaire:comment,date_saisie:d}).select().single();
    if(error){markSaisieError(pid);return;}
    SAISIES_TODAY[pid]=data;
  }
  clearSaisieError(pid);refreshCounters(pid);
}
function refreshCounters(pid){
  // Compteurs par catégorie
  const cats=[...new Set(PRODUITS.map(p=>p.categorie||'Divers'))].sort();
  cats.forEach(c=>{
    const nb=PRODUITS.filter(p=>(p.categorie||'Divers')===c).length;
    const fait=PRODUITS.filter(p=>(p.categorie||'Divers')===c && SAISIES_TODAY[p.id]).length;
    const block=document.getElementById('cat-'+cssId(c));
    if(block){const ctr=block.querySelector('.cat-counter');if(ctr)ctr.textContent=`${fait}/${nb}`;}
  });
  // Total + barre
  const totalFait=Object.keys(SAISIES_TODAY).length;
  const totalAFaire=PRODUITS.length;
  const cptr=document.getElementById('cptr');if(cptr)cptr.textContent=`${totalFait} / ${totalAFaire} produits saisis`;
  document.querySelector('.progress-bar').style.width=(totalAFaire?(totalFait/totalAFaire*100):0)+'%';
  // Indicateur visuel sur l'input
  if(pid){
    const inp=document.querySelector(`input[data-pid="${pid}"]`);
    if(inp){if(SAISIES_TODAY[pid])inp.classList.add('done');else inp.classList.remove('done');}
  }
  // Reset erreur si elle existait
  const err=document.getElementById('finishErr');if(err)err.textContent='';
}
function finishInventaire(){
  const totalFait=Object.keys(SAISIES_TODAY).length;
  const totalAFaire=PRODUITS.length;
  // OBLIGER de tout remplir
  if(totalFait<totalAFaire){
    const manquants=PRODUITS.filter(p=>!SAISIES_TODAY[p.id]);
    // Mettre en évidence les inputs vides
    document.querySelectorAll('.prod-input').forEach(inp=>{
      const pid=inp.dataset.pid;
      if(!SAISIES_TODAY[pid]){inp.style.borderColor='var(--bad)';inp.style.background='rgba(196,90,90,.12)';}
    });
    const err=document.getElementById('finishErr');
    if(err){
      err.style.background='rgba(196,90,90,.12)';
      err.style.border='1px solid rgba(196,90,90,.3)';
      err.style.borderRadius='8px';
      err.style.padding='12px';
      err.style.fontSize='14px';
      err.innerHTML=`⚠ Inventaire incomplet : ${manquants.length} produit${manquants.length>1?'s':''} non saisi${manquants.length>1?'s':''}.<br><br>Tu dois remplir <b>toutes les cellules</b> avant de terminer (mets <b>0</b> si tu n'as plus rien).<br><br>Premier manquant : <b>${manquants[0].nom}</b>`;
    }
    // Scroller jusqu'au premier manquant
    const firstEmpty=document.querySelector(`input[data-pid="${manquants[0].id}"]`);
    if(firstEmpty){firstEmpty.scrollIntoView({behavior:'smooth',block:'center'});firstEmpty.focus();}
    return;
  }
  document.getElementById('scr').innerHTML=`<div class="scr" style="justify-content:center">
    <div style="text-align:center;font-size:80px">✓</div>
    <div class="ok-msg">Inventaire complet enregistré !</div>
    <div style="text-align:center;color:var(--muted);font-size:14px;margin-bottom:24px">Merci ${SALARIE.prenom||SALARIE.nom} ✨</div>
    <div style="display:flex;flex-direction:column;gap:10px">
      <button class="btn" onclick="pinScreen()">Sortir</button>
    </div>
  </div>`;
  setTimeout(()=>{if(document.querySelector('.ok-msg'))pinScreen();},8000);
}

init();
</script>
</body>
</html>
