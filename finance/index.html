<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Eatime360 — Finance</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.31/jspdf.plugin.autotable.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>
<script src="https://cdn.sheetjs.com/xlsx-0.20.1/package/dist/xlsx.full.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--gold:#c8a035;--bg:#0b0b15;--card:#15151f;--surface:#1c1c28;--line:rgba(255,255,255,.06);--line-2:rgba(255,255,255,.14);--text:#e8e8ec;--muted:#7b7b8a;--ok:#3fb87f;--warn:#e0a93a;--bad:#c45a5a;--info:#5b9cff}
html,body{height:100%}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;font-size:14px}
a{color:var(--gold);text-decoration:none}
.hidden{display:none!important}
input,select,textarea,button{font-family:inherit;color:var(--text)}
button{cursor:pointer;border:none;background:none}
.btn{padding:9px 14px;border-radius:8px;background:var(--gold);color:#1a1a1a;font-weight:600;font-size:13px;border:none;display:inline-flex;align-items:center;gap:6px}
.btn.ghost{background:transparent;color:var(--text);border:1px solid var(--line-2)}
.btn.bad{background:var(--bad);color:#fff}
.btn.ok{background:var(--ok);color:#111}
.btn.sm{padding:6px 11px;font-size:12px}

.lock{position:fixed;inset:0;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:20px}
.lock h1{color:var(--gold);font-size:22px}
.lock input{padding:12px 16px;border-radius:10px;border:1px solid var(--line-2);background:var(--surface);font-size:14px;width:280px;outline:none;text-align:center}
.err{color:var(--bad);font-size:12px;min-height:16px}

.header{display:flex;align-items:center;justify-content:space-between;padding:14px 24px;border-bottom:1px solid var(--line);flex-wrap:wrap;gap:10px}
.brand{color:var(--gold);font-weight:700;font-size:16px}
.brand small{color:var(--muted);font-weight:400;font-size:12px;margin-left:8px}

.tabs{display:flex;gap:2px;padding:0 24px;border-bottom:1px solid var(--line);overflow-x:auto}
.tabs button{padding:11px 16px;border-bottom:2px solid transparent;color:var(--muted);font-weight:600;font-size:13px;white-space:nowrap}
.tabs button.active{color:var(--gold);border-color:var(--gold)}
.tabs button:hover{color:var(--text)}

.wrap{max-width:1400px;margin:0 auto;padding:24px 24px 60px}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:18px;align-items:center}
.toolbar select,.toolbar input{padding:8px 12px;border-radius:7px;border:1px solid var(--line-2);background:var(--surface);color:var(--text);font-size:13px;outline:none}

.grid{display:grid;gap:14px}
.grid.cards{grid-template-columns:repeat(auto-fill,minmax(220px,1fr))}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:18px}
.kpi .lbl{color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.05em;font-weight:600}
.kpi .val{font-size:28px;font-weight:800;margin-top:6px}
.kpi .sub{color:var(--muted);font-size:11.5px;margin-top:4px}
.kpi.ok .val{color:var(--ok)} .kpi.bad .val{color:var(--bad)} .kpi.warn .val{color:var(--warn)} .kpi.info .val{color:var(--info)}

table.tbl{width:100%;border-collapse:collapse;font-size:13px;background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden}
table.tbl th,table.tbl td{padding:9px 12px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle}
table.tbl th{font-size:10.5px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.05em;background:var(--surface)}
table.tbl tr:last-child td{border-bottom:none}
table.tbl tr:hover{background:rgba(255,255,255,.02)}
table.tbl tfoot td{background:var(--surface);font-weight:700}
.badge{display:inline-block;padding:2px 8px;border-radius:20px;font-size:10.5px;font-weight:700;text-transform:uppercase}
.badge.ok{background:rgba(63,184,127,.15);color:var(--ok)}
.badge.bad{background:rgba(196,90,90,.15);color:var(--bad)}
.badge.warn{background:rgba(224,169,58,.15);color:var(--warn)}
.badge.info{background:rgba(91,156,255,.15);color:var(--info)}

.section{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:20px;margin-bottom:16px}
.section h3{font-size:11.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;margin-bottom:14px;font-weight:600}
.fld{margin-bottom:12px}
.fld label{display:block;font-size:11.5px;color:var(--muted);margin-bottom:5px;font-weight:500}
.fld input,.fld textarea,.fld select{width:100%;padding:9px 11px;border-radius:7px;border:1px solid var(--line-2);background:var(--surface);color:var(--text);font-size:13px;outline:none}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
@media(max-width:700px){.grid2,.grid3{grid-template-columns:1fr}}

.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.7);display:flex;align-items:center;justify-content:center;z-index:100;padding:20px}
.modal{background:var(--card);border:1px solid var(--line-2);border-radius:14px;padding:24px;max-width:640px;width:100%;max-height:90vh;overflow-y:auto}
.modal h2{font-size:16px;font-weight:700;margin-bottom:14px}
.modal-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:18px}

.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#222;border:1px solid var(--line-2);padding:11px 22px;border-radius:10px;font-size:13px;opacity:0;transition:.25s;z-index:200}
.toast.show{opacity:1}

.chart-box{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:18px;height:300px;position:relative}
</style>
</head>
<body>

<div id="lock" class="lock hidden">
  <h1>Finance</h1>
  <div style="color:var(--muted);font-size:13px">Réservé aux admins</div>
  <input type="email" id="loginEmail" placeholder="Email">
  <input type="password" id="loginPw" placeholder="Mot de passe" onkeydown="if(event.key==='Enter')login()">
  <button class="btn" onclick="login()">Se connecter</button>
  <div class="err" id="err"></div>
  <a href="../" style="font-size:12px;color:var(--muted)">← Portail</a>
</div>

<div id="app" class="hidden">
  <div class="header">
    <div class="brand">Eatime360 <small>· Finance · v0.1</small></div>
    <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">
      <select id="snackSelect" onchange="onSnackChange()" style="padding:7px 11px;border-radius:7px;border:1px solid var(--line-2);background:var(--surface);color:var(--text);font-size:12.5px"></select>
      <select id="periodSelect" onchange="onPeriodChange()" style="padding:7px 11px;border-radius:7px;border:1px solid var(--line-2);background:var(--surface);color:var(--text);font-size:12.5px">
        <option value="month_cur">Mois en cours</option>
        <option value="month_prev">Mois précédent</option>
        <option value="ytd">Année en cours</option>
        <option value="last_30">30 derniers jours</option>
        <option value="last_90">90 derniers jours</option>
      </select>
      <a href="../" class="btn ghost sm">Portail</a>
      <button class="btn ghost sm" onclick="logout()">↩</button>
    </div>
  </div>
  <div class="tabs">
    <button data-tab="dashboard" class="active" onclick="setTab('dashboard')">📊 Dashboard</button>
    <button data-tab="ca" onclick="setTab('ca')">💰 CA quotidien</button>
    <button data-tab="depenses" onclick="setTab('depenses')">📤 Dépenses</button>
    <button data-tab="treso" onclick="setTab('treso')">🏦 Trésorerie</button>
    <button data-tab="banque" onclick="setTab('banque')">💳 Banque (import)</button>
    <button data-tab="marge" onclick="setTab('marge')">📈 Marge & Ratios</button>
    <button data-tab="categories" onclick="setTab('categories')">🏷 Catégories</button>
  </div>
  <div class="wrap" id="content"></div>
</div>

<div id="modalHost"></div>
<div class="toast" id="toast"></div>

<script>
const SUPA_URL='https://ynnqvtfayrdteqtgxeuk.supabase.co';
const SUPA_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InlubnF2dGZheXJkdGVxdGd4ZXVrIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzk4OTE1MTQsImV4cCI6MjA5NTQ2NzUxNH0._mfVAGexu7ew38UQk6adn42az4Gt_J3ePxR6O6wuWHc';
const sb=supabase.createClient(SUPA_URL,SUPA_KEY);
let ME=null,ORG={},SNACK=null,PERIOD='month_cur';
let TAB='dashboard';
const S={snacks:[],categories:[],salaries:[]};

const TYPES_CAT={achat:'Achat matière',charge_fixe:'Charge fixe',charge_variable:'Charge variable',taxe:'Taxe',autre:'Autre'};
const MODES_DEP={virement:'Virement',cb:'CB',cheque:'Chèque',especes:'Espèces',prelevement:'Prélèvement',autre:'Autre'};
const MODES_ENC={cb:'CB',especes:'Espèces',tickets_resto:'Tickets resto',cheque:'Chèque',virement:'Virement',autre:'Autre'};
const STATUTS={a_payer:'À payer',paye:'Payé',retard:'En retard',litige:'Litige'};
const SERVICES={midi:'Midi',soir:'Soir',total:'Total jour'};

let tt;function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('show'),2200);}
function val(id){const e=document.getElementById(id);return e?(e.value||'').trim():'';}
function num(id){const v=val(id);return v===''?null:parseFloat(v);}
function eur(n){if(n==null||isNaN(n))return'—';return Number(n).toLocaleString('fr-FR',{maximumFractionDigits:0})+' €';}
function pct(n){if(n==null||isNaN(n))return'—';return n.toFixed(1)+' %';}
function fmtD(d){if(!d)return'—';return new Date(d).toLocaleDateString('fr-FR');}

async function login(){
  const{error}=await sb.auth.signInWithPassword({email:val('loginEmail'),password:val('loginPw')});
  if(error){document.getElementById('err').textContent=error.message;return;}
  await loadProfileAndShow();
}
async function loadProfileAndShow(){
  const{data:{session}}=await sb.auth.getSession();if(!session)return;
  const{data:profile}=await sb.from('profiles').select('*').eq('id',session.user.id).maybeSingle();
  if(!profile||!['admin','super_admin','manager'].includes(profile.role)){document.getElementById('err').textContent='Accès refusé.';await sb.auth.signOut();return;}
  ME=profile;
  const{data:org}=await sb.from('organizations').select('*').eq('id',profile.organization_id).maybeSingle();
  ORG=org||{};
  if(ORG.couleur_primaire) document.documentElement.style.setProperty('--gold',ORG.couleur_primaire);
  if(ORG.suspended && ME.role!=='super_admin'){document.body.innerHTML='<div style="min-height:100vh;display:flex;align-items:center;justify-content:center;color:var(--bad);font-size:18px;text-align:center;padding:20px">🚫 Organisation suspendue. Contacter le service client.</div>';return;}
  document.getElementById('lock').classList.add('hidden');
  document.getElementById('app').classList.remove('hidden');
  await loadCommonData();
  render();
}
async function logout(){await sb.auth.signOut();location.reload();}
sb.auth.getSession().then(({data})=>{if(data.session)loadProfileAndShow();else document.getElementById('lock').classList.remove('hidden');});

async function loadCommonData(){
  const[r,c,sa]=await Promise.all([
    sb.from('restaurants').select('id,nom').order('nom'),
    sb.from('fin_categories').select('*').eq('actif',true).order('type').order('ordre'),
    sb.from('salaries').select('id,nom,prenom,taux_horaire_brut,coef_charges_perso').eq('actif',true),
  ]);
  S.snacks=r.data||[];S.categories=c.data||[];S.salaries=sa.data||[];
  const sel=document.getElementById('snackSelect');
  sel.innerHTML='<option value="">Tous les snacks</option>'+S.snacks.map(x=>`<option value="${x.id}">${x.nom}</option>`).join('');
}
function onSnackChange(){const id=val('snackSelect');SNACK=id?S.snacks.find(x=>x.id===id):null;render();}
function onPeriodChange(){PERIOD=val('periodSelect');render();}
function setTab(t){TAB=t;document.querySelectorAll('.tabs button').forEach(b=>b.classList.toggle('active',b.dataset.tab===t));render();}

function periodRange(){
  const now=new Date();let from,to;
  if(PERIOD==='month_cur'){from=new Date(now.getFullYear(),now.getMonth(),1);to=new Date(now.getFullYear(),now.getMonth()+1,0);}
  else if(PERIOD==='month_prev'){from=new Date(now.getFullYear(),now.getMonth()-1,1);to=new Date(now.getFullYear(),now.getMonth(),0);}
  else if(PERIOD==='ytd'){from=new Date(now.getFullYear(),0,1);to=now;}
  else if(PERIOD==='last_30'){from=new Date(now);from.setDate(from.getDate()-30);to=now;}
  else if(PERIOD==='last_90'){from=new Date(now);from.setDate(from.getDate()-90);to=now;}
  const iso=d=>d.toISOString().slice(0,10);
  return {from:iso(from),to:iso(to)};
}
function periodLbl(){
  const r=periodRange();const f=new Date(r.from),t=new Date(r.to);
  return f.toLocaleDateString('fr-FR')+' → '+t.toLocaleDateString('fr-FR');
}

function render(){
  const el=document.getElementById('content');
  if(TAB==='dashboard') return renderDashboard(el);
  if(TAB==='ca') return renderCA(el);
  if(TAB==='depenses') return renderDepenses(el);
  if(TAB==='treso') return renderTreso(el);
  if(TAB==='banque') return renderBanque(el);
  if(TAB==='marge') return renderMarge(el);
  if(TAB==='categories') return renderCategories(el);
}

// ─────── DASHBOARD ───────
async function renderDashboard(el){
  el.innerHTML='<div style="color:var(--muted)">Chargement…</div>';
  const r=periodRange();
  let qCa=sb.from('fin_ca_journalier').select('*').gte('date',r.from).lte('date',r.to);
  let qDep=sb.from('fin_depenses').select('*,fin_categories(nom,type)').gte('date_facture',r.from).lte('date_facture',r.to);
  let qEnc=sb.from('fin_encaissements').select('*').gte('date',r.from).lte('date',r.to);
  if(SNACK){qCa=qCa.eq('restaurant_id',SNACK.id);qDep=qDep.eq('restaurant_id',SNACK.id);qEnc=qEnc.eq('restaurant_id',SNACK.id);}
  const[ca,dep,enc]=await Promise.all([qCa,qDep,qEnc]);
  const CA=ca.data||[],DEP=dep.data||[],ENC=enc.data||[];
  // KPI
  const sumCAttc=CA.filter(x=>x.service==='total'||x.service==null).reduce((a,x)=>a+(Number(x.ca_ttc)||0),0)
    || CA.reduce((a,x)=>a+(Number(x.ca_ttc)||0),0); // fallback
  const sumCAht=CA.reduce((a,x)=>a+(Number(x.ca_ht)||0),0);
  const sumDep=DEP.reduce((a,x)=>a+(Number(x.montant_ttc)||0),0);
  const sumAchats=DEP.filter(x=>x.fin_categories?.type==='achat').reduce((a,x)=>a+(Number(x.montant_ht)||0),0);
  const sumChargesFixes=DEP.filter(x=>x.fin_categories?.type==='charge_fixe').reduce((a,x)=>a+(Number(x.montant_ttc)||0),0);
  const aPayer=DEP.filter(x=>x.statut==='a_payer'||x.statut==='retard').reduce((a,x)=>a+(Number(x.montant_ttc)||0),0);
  const retard=DEP.filter(x=>x.statut==='retard').length;
  const foodCost=sumCAht>0?(sumAchats/sumCAht)*100:0;
  // Salaires : approx via planning si data dispo (non implémenté côté period)
  let html=`<h2 style="font-size:18px;font-weight:700;margin-bottom:6px">Dashboard financier</h2>
    <div style="color:var(--muted);font-size:12.5px;margin-bottom:18px">${periodLbl()}${SNACK?' · '+SNACK.nom:' · tous snacks'}</div>
    <div class="grid cards" style="margin-bottom:24px">
      <div class="kpi ok"><div class="lbl">CA TTC</div><div class="val">${eur(sumCAttc)}</div><div class="sub">${CA.length} saisies</div></div>
      <div class="kpi"><div class="lbl">CA HT</div><div class="val">${eur(sumCAht)}</div></div>
      <div class="kpi bad"><div class="lbl">Dépenses TTC</div><div class="val">${eur(sumDep)}</div><div class="sub">${DEP.length} factures</div></div>
      <div class="kpi warn"><div class="lbl">Achats matières HT</div><div class="val">${eur(sumAchats)}</div></div>
      <div class="kpi info"><div class="lbl">Charges fixes</div><div class="val">${eur(sumChargesFixes)}</div></div>
      <div class="kpi ${foodCost>35?'bad':foodCost>30?'warn':'ok'}"><div class="lbl">Food cost (achats/CA HT)</div><div class="val">${pct(foodCost)}</div><div class="sub">cible &lt; 30 %</div></div>
      <div class="kpi ${aPayer>0?'warn':''}"><div class="lbl">À payer</div><div class="val">${eur(aPayer)}</div><div class="sub">${retard} en retard</div></div>
      <div class="kpi"><div class="lbl">Encaissements</div><div class="val">${eur(ENC.reduce((a,x)=>a+(Number(x.montant)||0),0))}</div></div>
    </div>
    <div class="chart-box" style="margin-bottom:16px"><canvas id="chartCa"></canvas></div>
    <div class="grid grid2">
      <div class="section"><h3>Prochaines échéances</h3>
        <table class="tbl"><thead><tr><th>Échéance</th><th>Fournisseur</th><th>Montant</th><th>Statut</th></tr></thead><tbody>
          ${(DEP.filter(x=>x.statut==='a_payer'||x.statut==='retard').sort((a,b)=>(a.date_echeance||'9').localeCompare(b.date_echeance||'9')).slice(0,8).map(x=>`<tr><td>${fmtD(x.date_echeance)}</td><td>${x.fournisseur||'—'}</td><td><b>${eur(x.montant_ttc)}</b></td><td>${x.statut==='retard'?'<span class="badge bad">Retard</span>':'<span class="badge warn">À payer</span>'}</td></tr>`).join(''))||'<tr><td colspan="4" style="text-align:center;color:var(--muted);padding:14px">Aucune échéance en attente</td></tr>'}
        </tbody></table>
      </div>
      <div class="section"><h3>Répartition des dépenses</h3>
        <div style="position:relative;height:240px"><canvas id="chartDep"></canvas></div>
      </div>
    </div>`;
  el.innerHTML=html;
  // Graph CA par jour
  const byDay={};CA.forEach(x=>{if(x.service==='total'||x.service==null||CA.filter(c=>c.date===x.date&&c.service!=='total').length===0){byDay[x.date]=(byDay[x.date]||0)+(Number(x.ca_ttc)||0);}});
  const labels=Object.keys(byDay).sort();
  new Chart(document.getElementById('chartCa').getContext('2d'),{type:'line',data:{labels:labels.map(d=>new Date(d).toLocaleDateString('fr-FR',{day:'2-digit',month:'short'})),datasets:[{label:'CA TTC',data:labels.map(d=>byDay[d]),borderColor:'#c8a035',backgroundColor:'rgba(200,160,53,.15)',tension:.3,fill:true}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{labels:{color:'#e8e8ec'}},title:{display:true,text:'Évolution du CA TTC',color:'#e8e8ec'}},scales:{x:{ticks:{color:'#7b7b8a'},grid:{color:'rgba(255,255,255,.04)'}},y:{ticks:{color:'#7b7b8a',callback:v=>v.toLocaleString('fr-FR')+'€'},grid:{color:'rgba(255,255,255,.04)'}}}}});
  // Donut dépenses
  const byCat={};DEP.forEach(x=>{const n=x.fin_categories?.nom||'(sans catégorie)';byCat[n]=(byCat[n]||0)+(Number(x.montant_ttc)||0);});
  const cats=Object.keys(byCat);
  new Chart(document.getElementById('chartDep').getContext('2d'),{type:'doughnut',data:{labels:cats,datasets:[{data:cats.map(c=>byCat[c]),backgroundColor:['#c8a035','#5b9cff','#3fb87f','#c45a5a','#e0a93a','#8b5cf6','#06b6d4','#f59e0b','#10b981','#ef4444','#84cc16','#a855f7','#f97316','#06b6d4','#64748b']}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{position:'right',labels:{color:'#e8e8ec',font:{size:10}}}}}});
}

// ─────── CA QUOTIDIEN ───────
async function renderCA(el){
  el.innerHTML=`<div class="toolbar">
    <button class="btn" onclick="openCA()">+ Saisir CA</button>
    <button class="btn ghost sm" onclick="openCABulk()">+ Saisie rapide multi-jours</button>
  </div><div id="caList">Chargement…</div>`;
  const r=periodRange();
  let q=sb.from('fin_ca_journalier').select('*,restaurants(nom)').gte('date',r.from).lte('date',r.to).order('date',{ascending:false}).order('service');
  if(SNACK) q=q.eq('restaurant_id',SNACK.id);
  const{data}=await q;
  const list=data||[];
  let html=`<table class="tbl"><thead><tr><th>Date</th><th>Snack</th><th>Service</th><th>CA TTC</th><th>CA HT</th><th>Couverts</th><th>Ticket moy</th><th>Notes</th><th></th></tr></thead><tbody>`;
  let totTtc=0,totHt=0,totCouv=0;
  if(!list.length) html+='<tr><td colspan="9" style="text-align:center;color:var(--muted);padding:30px">Aucune saisie sur la période</td></tr>';
  else list.forEach(x=>{totTtc+=Number(x.ca_ttc)||0;totHt+=Number(x.ca_ht)||0;totCouv+=Number(x.nb_couverts)||0;

  let qCa=sb.from('fin_ca_journalier').select('*').gte('date',r.from).lte('date',r.to);

  let qPl=sb.from('planning_creneaux').select('salarie_id,heure_debut,heure_fin,date').gte('date',r.from).lte('date',r.to);
  if(SNACK){qCa=qCa.eq('restaurant_id',SNACK.id);qDep=qDep.eq('restaurant_id',SNACK.id);qPl=qPl.eq('restaurant_id',SNACK.id);}
  const[ca,dep,pl]=await Promise.all([qCa,qDep,qPl]);
  const CA=ca.data||[],DEP=dep.data||[],PL=pl.data||[];
  // CA
  const caTtc=CA.reduce((a,x)=>a+(Number(x.ca_ttc)||0),0);
  const caHt=CA.reduce((a,x)=>a+(Number(x.ca_ht)||0),0);
  // Achats matières
  const achatsHt=DEP.filter(x=>x.fin_categories?.type==='achat').reduce((a,x)=>a+(Number(x.montant_ht)||0),0);
  // Charges fixes / variables / taxes
  const fixesTtc=DEP.filter(x=>x.fin_categories?.type==='charge_fixe').reduce((a,x)=>a+(Number(x.montant_ttc)||0),0);
  const varTtc=DEP.filter(x=>x.fin_categories?.type==='charge_variable').reduce((a,x)=>a+(Number(x.montant_ttc)||0),0);
  const taxesTtc=DEP.filter(x=>x.fin_categories?.type==='taxe').reduce((a,x)=>a+(Number(x.montant_ttc)||0),0);
  // Masse salariale via planning + taux salaires
  const tauxOf=sid=>{const s=S.salaries.find(x=>x.id===sid);return Number(s?.taux_horaire_brut)||0;};
  const coefOf=sid=>{const s=S.salaries.find(x=>x.id===sid);const cp=Number(s?.coef_charges_perso);return isFinite(cp)&&cp>0?cp:(Number(ORG.coef_charges)||1.42);};
  const _toMin=t=>{if(!t)return null;const[h,m]=t.slice(0,5).split(':').map(Number);return h*60+m;};
  const _dur=(d,f)=>{let a=_toMin(d),b=_toMin(f);if(a==null||b==null)return 0;if(b<=a)b+=24*60;return b-a;};
  let masseSalBrut=0,masseSalCharge=0;
  PL.forEach(c=>{const h=_dur(c.heure_debut,c.heure_fin)/60;const tx=tauxOf(c.salarie_id);const cf=coefOf(c.salarie_id);masseSalBrut+=h*tx;masseSalCharge+=h*tx*cf;});
  // Ratios
  const foodCost=caHt>0?(achatsHt/caHt)*100:0;
  const ratioSal=caTtc>0?(masseSalCharge/caTtc)*100:0;
  const prime=foodCost+ratioSal; // PRIME COST cible <65%
  // EBE estimé
  const ebe=caHt - achatsHt - masseSalCharge - fixesTtc - varTtc;
  const margeBrute=caHt - achatsHt;
  const tauxMargeBrute=caHt>0?(margeBrute/caHt)*100:0;
  let html=`<h2 style="font-size:18px;font-weight:700;margin-bottom:6px">Marge & ratios</h2>
    <div style="color:var(--muted);font-size:12.5px;margin-bottom:18px">${periodLbl()}${SNACK?' · '+SNACK.nom:' · tous snacks'}</div>
    <div class="grid cards" style="margin-bottom:18px">
      <div class="kpi ok"><div class="lbl">CA HT</div><div class="val">${eur(caHt)}</div><div class="sub">${eur(caTtc)} TTC</div></div>
      <div class="kpi"><div class="lbl">Marge brute</div><div class="val">${eur(margeBrute)}</div><div class="sub">${pct(tauxMargeBrute)}</div></div>
      <div class="kpi ${foodCost>35?'bad':foodCost>30?'warn':'ok'}"><div class="lbl">Food cost %</div><div class="val">${pct(foodCost)}</div><div class="sub">achats HT / CA HT · cible &lt; 30 %</div></div>
      <div class="kpi ${ratioSal>40?'bad':ratioSal>35?'warn':'ok'}"><div class="lbl">Masse salariale %</div><div class="val">${pct(ratioSal)}</div><div class="sub">chargée / CA TTC · cible &lt; 35 %</div></div>
      <div class="kpi ${prime>65?'bad':prime>60?'warn':'ok'}"><div class="lbl">Prime cost</div><div class="val">${pct(prime)}</div><div class="sub">food + masse · cible &lt; 60 %</div></div>
      <div class="kpi ${ebe<0?'bad':ebe<caHt*0.05?'warn':'ok'}"><div class="lbl">EBE estimé</div><div class="val">${eur(ebe)}</div><div class="sub">CA - achats - salaires - charges</div></div>
    </div>
    <div class="section"><h3>Décomposition</h3>
      <table class="tbl"><thead><tr><th>Poste</th><th>Montant</th><th>% du CA HT</th></tr></thead><tbody>
        <tr><td><b>Chiffre d'affaires HT</b></td><td><b>${eur(caHt)}</b></td><td>100 %</td></tr>
        <tr><td style="padding-left:24px">− Achats matières HT</td><td style="color:var(--bad)">${eur(achatsHt)}</td><td>${pct(foodCost)}</td></tr>
        <tr><td><b>= Marge brute</b></td><td><b>${eur(margeBrute)}</b></td><td><b>${pct(tauxMargeBrute)}</b></td></tr>
        <tr><td style="padding-left:24px">− Masse salariale chargée (planning)</td><td style="color:var(--bad)">${eur(masseSalCharge)}</td><td>${pct(caHt>0?(masseSalCharge/caHt)*100:0)}</td></tr>
        <tr><td style="padding-left:24px">− Charges fixes TTC</td><td style="color:var(--bad)">${eur(fixesTtc)}</td><td>${pct(caHt>0?(fixesTtc/caHt)*100:0)}</td></tr>
        <tr><td style="padding-left:24px">− Charges variables TTC</td><td style="color:var(--bad)">${eur(varTtc)}</td><td>${pct(caHt>0?(varTtc/caHt)*100:0)}</td></tr>
        <tr><td style="padding-left:24px">− Taxes TTC</td><td style="color:var(--bad)">${eur(taxesTtc)}</td><td>${pct(caHt>0?(taxesTtc/caHt)*100:0)}</td></tr>
        <tr style="background:rgba(63,184,127,.08)"><td><b>= EBE estimé</b></td><td><b style="color:${ebe>=0?'var(--ok)':'var(--bad)'}">${eur(ebe)}</b></td><td><b>${pct(caHt>0?(ebe/caHt)*100:0)}</b></td></tr>
      </tbody></table>
    </div>
    <div style="color:var(--muted);font-size:11.5px;margin-top:14px;line-height:1.5">
      <b>Notes :</b> Masse salariale calculée depuis le planning (heures × taux horaire × coef charges individuel ou org).
      Taxes inclues séparément (TVA, impôts). EBE = approximation : pour le résultat net comptable, voir comptable.
    </div>`;
  el.innerHTML=html;
}

// ─── Parser flexible relevés ───
function detectBankFormat(headers){
  const H=headers.map(h=>(h||'').toString().toLowerCase().trim());
  const has=k=>H.some(h=>h.includes(k));
  if(has('date opération')&&has('libellé opération')) return 'bnp';
  if(has('date')&&has('libellé')&&has('débit')&&has('crédit')) return 'ca_lcl_sg';
  if(has('dateop')&&has('label')) return 'boursobank';
  if(has('date d\'opération')&&has('montant')) return 'generic_signed';
  return 'unknown';
}
function findColIdx(headers,patterns){
  const H=headers.map(h=>(h||'').toString().toLowerCase().trim());
  for(const p of patterns){const i=H.findIndex(h=>h.includes(p));if(i>=0)return i;}
  return -1;
}
function parseDateFR(s){if(s==null||s==='')return null;
  // Si Excel retourne un Date object natif
  if(s instanceof Date && !isNaN(s)){return s.getFullYear()+'-'+String(s.getMonth()+1).padStart(2,'0')+'-'+String(s.getDate()).padStart(2,'0');}
  s=s.toString().trim();
  // Si Excel retourne un serial number (jours depuis 1900)
  if(/^\d{4,5}(\.\d+)?$/.test(s)){const n=parseFloat(s);if(n>20000&&n<60000){const d=new Date(Date.UTC(1899,11,30)+n*86400000);return d.toISOString().slice(0,10);}}
  // DD/MM/YYYY, DD-MM-YYYY, DD.MM.YYYY (BNP)
  let m=s.match(/^(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{2,4})$/);
  if(m){let y=+m[3];if(y<100)y+=2000;return `${y}-${String(+m[2]).padStart(2,'0')}-${String(+m[1]).padStart(2,'0')}`;}
  // YYYY-MM-DD
  m=s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/);
  if(m) return `${m[1]}-${String(+m[2]).padStart(2,'0')}-${String(+m[3]).padStart(2,'0')}`;
  return null;
}
function parseAmount(s){if(s==null||s==='')return 0;
  let str=s.toString().trim().replace(/\s/g,'').replace(/€/g,'').replace(/EUR/gi,'');
  // FR: virgule = decimal, point = thousand separator
  if(str.includes(',')) str=str.replace(/\./g,'').replace(',','.');
  const n=parseFloat(str);return isNaN(n)?0:n;}

let IMP_DATA=null,IMP_HEADERS=null,IMP_MAPPING=null,IMP_FORMAT=null;
async function parseImportFile(ev){
  const f=ev.target.files[0];if(!f)return;
  const ext=f.name.split('.').pop().toLowerCase();
  let rows;
  if(ext==='csv'||ext==='tsv'||ext==='txt'){
    // Lecture comme texte, détection séparateur
    const text=await f.text();
    const sep=text.includes(';')?';':text.includes('\t')?'\t':',';
    const parsed=Papa.parse(text,{delimiter:sep,skipEmptyLines:true});
    rows=parsed.data;
  } else {
    // Excel
    const buf=await f.arrayBuffer();
    const wb=XLSX.read(buf,{type:'array'});
    const sheet=wb.Sheets[wb.SheetNames[0]];
    rows=XLSX.utils.sheet_to_json(sheet,{header:1,defval:''});
  }
  if(!rows||rows.length<2){document.getElementById('imp_preview').innerHTML='<span style="color:var(--bad)">Fichier vide ou illisible</span>';return;}
  // Détection ligne d'en-tête (cherche celle qui contient "date" ou "libellé")
  let headerIdx=0;
  for(let i=0;i<Math.min(10,rows.length);i++){
    const r=rows[i].map(c=>(c||'').toString().toLowerCase());
    if(r.some(c=>c.includes('date'))&&r.some(c=>c.includes('lib')||c.includes('label')||c.includes('montant')||c.includes('débit')||c.includes('credit'))){headerIdx=i;break;}
  }
  const headers=rows[headerIdx];
  const data=rows.slice(headerIdx+1).filter(r=>r.some(c=>c!==''&&c!=null));
  IMP_HEADERS=headers;IMP_DATA=data;IMP_FORMAT=detectBankFormat(headers);
  // Auto mapping
  IMP_MAPPING={
    date:findColIdx(headers,['date opération','date d\'opération','date op','dateop','date']),
    libelle:findColIdx(headers,['libellé opération','libellé','label','description','intitulé']),
    debit:findColIdx(headers,['débit','debit']),
    credit:findColIdx(headers,['crédit','credit']),
    montant:findColIdx(headers,['montant','amount']),
    reference:findColIdx(headers,['référence','reference','ref','n° opération']),
  };
  let preview=`<div style="background:var(--surface);border:1px solid var(--line-2);border-radius:8px;padding:12px;margin-top:8px">
    <div style="font-size:13px;margin-bottom:8px"><b>${data.length} lignes détectées</b> · Format : <span style="color:var(--gold)">${IMP_FORMAT==='unknown'?'générique':IMP_FORMAT.toUpperCase()}</span></div>
    <div class="grid3" style="margin-bottom:8px">
      <div class="fld"><label>Colonne Date</label><select id="map_date" onchange="updateMapping()">${headers.map((h,i)=>`<option value="${i}" ${i===IMP_MAPPING.date?'selected':''}>${h||'(col '+i+')'}</option>`).join('')}</select></div>
      <div class="fld"><label>Colonne Libellé</label><select id="map_lib" onchange="updateMapping()">${headers.map((h,i)=>`<option value="${i}" ${i===IMP_MAPPING.libelle?'selected':''}>${h||'(col '+i+')'}</option>`).join('')}</select></div>
      <div class="fld"><label>Référence (opt)</label><select id="map_ref" onchange="updateMapping()"><option value="-1">—</option>${headers.map((h,i)=>`<option value="${i}" ${i===IMP_MAPPING.reference?'selected':''}>${h||'(col '+i+')'}</option>`).join('')}</select></div>
    </div>
    <div class="grid3" style="margin-bottom:8px">
      <div class="fld"><label>Débit (si séparé)</label><select id="map_deb" onchange="updateMapping()"><option value="-1">—</option>${headers.map((h,i)=>`<option value="${i}" ${i===IMP_MAPPING.debit?'selected':''}>${h||'(col '+i+')'}</option>`).join('')}</select></div>
      <div class="fld"><label>Crédit (si séparé)</label><select id="map_cre" onchange="updateMapping()"><option value="-1">—</option>${headers.map((h,i)=>`<option value="${i}" ${i===IMP_MAPPING.credit?'selected':''}>${h||'(col '+i+')'}</option>`).join('')}</select></div>
      <div class="fld"><label>OU Montant signé</label><select id="map_mt" onchange="updateMapping()"><option value="-1">—</option>${headers.map((h,i)=>`<option value="${i}" ${i===IMP_MAPPING.montant?'selected':''}>${h||'(col '+i+')'}</option>`).join('')}</select></div>
    </div>
    <div style="margin-top:10px"><b>Aperçu (5 premières lignes) :</b></div>
    <table class="tbl" style="margin-top:6px"><thead><tr><th>Date</th><th>Libellé</th><th>Débit</th><th>Crédit</th></tr></thead><tbody>
      ${data.slice(0,5).map(r=>{const d=parseDateFR(r[IMP_MAPPING.date]);const lib=r[IMP_MAPPING.libelle]||'';let deb=0,cre=0;if(IMP_MAPPING.debit>=0)deb=parseAmount(r[IMP_MAPPING.debit]);if(IMP_MAPPING.credit>=0)cre=parseAmount(r[IMP_MAPPING.credit]);if(IMP_MAPPING.montant>=0){const m=parseAmount(r[IMP_MAPPING.montant]);if(m<0)deb=-m;else cre=m;}return `<tr><td style="font-size:11.5px">${d||'<span style=\"color:var(--bad)\">?</span>'}</td><td style="font-size:11.5px;max-width:280px;word-break:break-word">${lib}</td><td style="color:var(--bad);font-size:11.5px">${deb>0?eur(deb):''}</td><td style="color:var(--ok);font-size:11.5px">${cre>0?eur(cre):''}</td></tr>`;}).join('')}
    </tbody></table>
  </div>`;
  document.getElementById('imp_preview').innerHTML=preview;
  document.getElementById('imp_btn').disabled=false;
  document.getElementById('imp_btn').style.opacity=1;
}
function updateMapping(){
  IMP_MAPPING.date=+document.getElementById('map_date').value;
  IMP_MAPPING.libelle=+document.getElementById('map_lib').value;
  IMP_MAPPING.reference=+document.getElementById('map_ref').value;
  IMP_MAPPING.debit=+document.getElementById('map_deb').value;
  IMP_MAPPING.credit=+document.getElementById('map_cre').value;
  IMP_MAPPING.montant=+document.getElementById('map_mt').value;
  // Re-render preview
  const ev={target:{files:[document.getElementById('imp_file').files[0]]}};
  // Just refresh preview rows
  const data=IMP_DATA||[];
  const preview=`<table class="tbl" style="margin-top:6px"><thead><tr><th>Date</th><th>Libellé</th><th>Débit</th><th>Crédit</th></tr></thead><tbody>${data.slice(0,5).map(r=>{const d=parseDateFR(r[IMP_MAPPING.date]);const lib=r[IMP_MAPPING.libelle]||'';let deb=0,cre=0;if(IMP_MAPPING.debit>=0)deb=parseAmount(r[IMP_MAPPING.debit]);if(IMP_MAPPING.credit>=0)cre=parseAmount(r[IMP_MAPPING.credit]);if(IMP_MAPPING.montant>=0){const m=parseAmount(r[IMP_MAPPING.montant]);if(m<0)deb=-m;else cre=m;}return `<tr><td style="font-size:11.5px">${d||'?'}</td><td style="font-size:11.5px;max-width:280px;word-break:break-word">${lib}</td><td style="color:var(--bad);font-size:11.5px">${deb>0?eur(deb):''}</td><td style="color:var(--ok);font-size:11.5px">${cre>0?eur(cre):''}</td></tr>`;}).join('')}</tbody></table>`;
  const cont=document.getElementById('imp_preview');
  const tbl=cont.querySelector('table');if(tbl)tbl.outerHTML=preview;
}
async function doImport(){
  const compteId=val('imp_co');if(!compteId){toast('Compte requis');return;}
  if(!IMP_DATA||!IMP_DATA.length){toast('Aucune donnée à importer');return;}
  // Charger règles pour catégorisation auto
  const{data:reglesData}=await sb.from('fin_regles_catego').select('*').eq('actif',true).eq('organization_id',ORG.id).order('priorite',{ascending:false});
  const regles=reglesData||[];
  // Construire transactions
  const toInsert=[];
  IMP_DATA.forEach(r=>{
    const d=parseDateFR(r[IMP_MAPPING.date]);
    const lib=(r[IMP_MAPPING.libelle]||'').toString().trim();
    if(!d||!lib)return;
    let deb=0,cre=0;
    if(IMP_MAPPING.debit>=0)deb=Math.abs(parseAmount(r[IMP_MAPPING.debit]));
    if(IMP_MAPPING.credit>=0)cre=Math.abs(parseAmount(r[IMP_MAPPING.credit]));
    if(IMP_MAPPING.montant>=0 && deb===0 && cre===0){
      const m=parseAmount(r[IMP_MAPPING.montant]);
      if(m<0)deb=-m;else cre=m;
    }
    if(deb===0 && cre===0)return;
    const ref=IMP_MAPPING.reference>=0?(r[IMP_MAPPING.reference]||'').toString().trim():null;
    // Catégorisation auto via règles
    const libLower=lib.toLowerCase();
    let catId=null,statut='non_categorisee';
    for(const rule of regles){if(libLower.includes(rule.pattern.toLowerCase())){catId=rule.categorie_id;statut='categorisee';break;}}
    toInsert.push({organization_id:ORG.id,compte_id:compteId,date_operation:d,libelle:lib,reference:ref,debit:deb,credit:cre,categorie_id:catId,statut});
  });
  if(!toInsert.length){toast('Aucune ligne valide');return;}
  // Créer import record
  const{data:imp}=await sb.from('fin_imports_bancaires').insert({organization_id:ORG.id,compte_id:compteId,nom_fichier:document.getElementById('imp_file').files[0].name,format_detecte:IMP_FORMAT,nb_lignes:toInsert.length,imported_by:ME.id}).select().single();
  // Insert trx (upsert pour dédup)
  let nbNew=0,nbDup=0;
  // On insère ligne par ligne pour gérer les conflicts (unique index)
  for(const tx of toInsert){
    const{error}=await sb.from('fin_transactions_bancaires').insert({...tx,import_id:imp?.id});
    if(error){if(error.code==='23505')nbDup++;else console.error(error);}
    else nbNew++;
  }
  if(imp) await sb.from('fin_imports_bancaires').update({nb_nouvelles:nbNew,nb_dupliquees:nbDup}).eq('id',imp.id);
  toast(`Import OK · ${nbNew} nouvelles, ${nbDup} doublons ignorés`);closeModal();renderBanque(document.getElementById('content'));
}

async function openRegles(){
  const{data:regles}=await sb.from('fin_regles_catego').select('*,fin_categories(nom)').order('priorite',{ascending:false});
  const list=regles||[];
  document.getElementById('modalHost').innerHTML=`<div class="modal-bg" onclick="if(event.target===this)closeModal()"><div class="modal" style="max-width:680px">
    <h2>⚙ Règles de catégorisation auto</h2>
    <p style="color:var(--muted);font-size:12.5px;margin-bottom:14px">Si un libellé de transaction contient le pattern, la catégorie est appliquée automatiquement à l'import.</p>
    <table class="tbl" style="margin-bottom:14px"><thead><tr><th>Pattern (contenu dans libellé)</th><th>Catégorie</th><th>Priorité</th><th>Actif</th><th></th></tr></thead><tbody>
    ${list.map(r=>`<tr><td><code style="background:var(--surface);padding:2px 6px;border-radius:4px;font-size:11.5px">${r.pattern}</code></td><td>${r.fin_categories?.nom||'—'}</td><td>${r.priorite}</td><td>${r.actif?'<span class="badge ok">Oui</span>':'<span class="badge bad">Non</span>'}</td><td><button class="btn ghost sm" onclick="delRegle('${r.id}')">✕</button></td></tr>`).join('')||'<tr><td colspan="5" style="text-align:center;color:var(--muted);padding:18px">Aucune règle</td></tr>'}
    </tbody></table>
    <h3 style="font-size:11.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;margin-bottom:10px;font-weight:600">+ Ajouter une règle</h3>
    <div class="grid3">
      <div class="fld"><label>Pattern (en minuscules)</label><input id="rg_pat" placeholder="ex: edf, urssaf, metro"></div>
      <div class="fld"><label>Catégorie</label><select id="rg_cat">${S.categories.map(c=>`<option value="${c.id}">${c.nom}</option>`).join('')}</select></div>
      <div class="fld"><label>Priorité</label><input type="number" id="rg_pri" value="1"></div>
    </div>
    <div class="modal-actions"><button class="btn ghost" onclick="closeModal()">Fermer</button><button class="btn" onclick="saveRegle()">Créer la règle</button></div>
  </div></div>`;
}
async function saveRegle(){
  const pat=val('rg_pat').toLowerCase();
  if(!pat){toast('Pattern requis');return;}
  const{error}=await sb.from('fin_regles_catego').insert({organization_id:ORG.id,pattern:pat,categorie_id:val('rg_cat'),priorite:num('rg_pri')||1});
  if(error){toast(error.message);return;}toast('Règle créée ✓');openRegles();
}
async function delRegle(id){if(!confirm('Supprimer cette règle ?'))return;await sb.from('fin_regles_catego').delete().eq('id',id);openRegles();}

function closeModal(){document.getElementById('modalHost').innerHTML='';}
</script>
