  onStep&&onStep('Lecture du PDF (couche texte)…',30,true);
  const buf=await file.arrayBuffer(); const pdf=await pdfjsLib.getDocument({data:buf}).promise; const page=await pdf.getPage(1);
  const scale=3; const vp=page.getViewport({scale});
  const tc=await page.getTextContent();
  if(!tc||!tc.items||tc.items.length<20) return {error:'__notext__'};   // pas de couche texte → fallback OCR
  // position (centre) de chaque item en pixels canvas
  const items=tc.items.map(it=>{ const t=pdfjsLib.Util.transform(vp.transform,it.transform); const fh=Math.hypot(t[2],t[3])||10; const w=(it.width||0)*scale; return {str:(it.str||'').trim(), cx:t[4]+w/2, cy:t[5]-fh/2}; }).filter(it=>it.str);
  // en-têtes de mois (tolérants)
  const heads=[]; for(const it of items){ const pm=cfaParseMonth(it.str); if(pm) heads.push({mi:pm.mi,y:pm.y,cx:it.cx,cy:it.cy}); }
  // anti-collision : un libellé de jour (« mar » = mardi) peut matcher un mois. Les vrais en-têtes portent
  // une année → s'il y en a assez, on ne garde que ceux-là (élimine le bruit jour-de-semaine).
  const wy=heads.filter(h=>h.y!=null); if(wy.length>=3 && wy.length<heads.length) heads.splice(0,heads.length,...wy);
  if(!heads.length) return {error:'Aucun en-tête de mois détecté'};
  const base=parseInt((ALT.annee||schoolYears()[1]).split('-')[0]); heads.forEach(h=>{ if(h.y==null) h.y=h.mi>=8?base:base+1; });
  // largeur de bloc-mois = espacement médian entre colonnes d'en-têtes → assignation 2D jour→mois
  const xs=heads.map(h=>h.cx).slice().sort((a,b)=>a-b); const cols=[]; xs.forEach(x=>{ if(!cols.length||x-cols[cols.length-1]>40*scale) cols.push(x); });
  let colgap=190*scale/3; if(cols.length>1){ const g=[]; for(let i=1;i<cols.length;i++)g.push(cols[i]-cols[i-1]); g.sort((a,b)=>a-b); colgap=g[g.length>>1]; }
  const half=colgap*0.6;
  const assign=(x,y)=>{ const cand=heads.filter(h=>h.cy<y-2 && Math.abs(h.cx-x)<half); if(cand.length) return cand.reduce((a,b)=>b.cy>a.cy?b:a); return heads.reduce((a,b)=>(Math.abs(b.cx-x)+Math.abs(b.cy-y)<Math.abs(a.cx-x)+Math.abs(a.cy-y))?b:a); };
  // rendu canvas pour l'échantillonnage des couleurs
  onStep&&onStep('Lecture des couleurs…',70,true);
  const cv=document.createElement('canvas'); cv.width=vp.width; cv.height=vp.height; const ctx=cv.getContext('2d',{willReadFrequently:true}); ctx.fillStyle='#fff'; ctx.fillRect(0,0,cv.width,cv.height);
  await page.render({canvasContext:ctx,viewport:vp,background:'#ffffff'}).promise;
  const img=ctx.getImageData(0,0,cv.width,cv.height); const rad=Math.max(4,Math.round(scale*2.5));
  const samples=[];
  for(const it of items){ if(!/^\d{1,2}$/.test(it.str))continue; const n=parseInt(it.str); if(n<1||n>31)continue;
    const h=assign(it.cx,it.cy); const last=new Date(h.y,h.mi+1,0).getDate(); if(n>last)continue;
    const date=`${h.y}-${String(h.mi+1).padStart(2,'0')}-${String(n).padStart(2,'0')}`;
    samples.push({date,rgb:cfaSampleCell(img,Math.round(it.cx),Math.round(it.cy),rad),d:n});
  }
  if(!samples.length) return {error:'Aucune case-jour localisée'};
  return cfaFinalize(samples,cfaCluster(samples),'pdf');
}
// EMPLOI DU TEMPS TEXTUEL (ex. CFA Restauration 54) : PDF à couche texte listant, par « Semaine
// calendaire : N », des lignes « Lun 22/09/2025 08:30 - 10:30 Technologie (B5) ». RÈGLE MÉTIER (Rayan) :
// on ne marque QUE les JOURS D'ÉCOLE (≥1 créneau de cours au CFA) → catégorie `ecole` ; tout le reste
// (Entreprise, jours non listés, week-ends) = RIEN. Parseur TEXTE = le plus fiable (dates + libellés).
async function cfaFromTimetable(file,onStep){
  onStep&&onStep('Lecture de l\'emploi du temps (texte)…',30,true);
  let pdf; try{ pdf=await pdfjsLib.getDocument({data:await file.arrayBuffer()}).promise; }catch(_){ return {error:'__notimetable__'}; }
  const lines=[];
  for(let p=1;p<=pdf.numPages;p++){
    const page=await pdf.getPage(p); const tc=await page.getTextContent();
    if(!tc||!tc.items||!tc.items.length) continue;
    const its=tc.items.map(it=>({str:(it.str||''),x:it.transform[4],y:it.transform[5]})).filter(it=>it.str&&it.str.trim()!=='');
    its.sort((a,b)=>b.y-a.y||a.x-b.x);                        // haut→bas, puis gauche→droite
    let cur=[],cy=null;
    const flush=()=>{ if(cur.length){ cur.sort((a,b)=>a.x-b.x); lines.push(cur.map(i=>i.str).join(' ').replace(/\s+/g,' ').trim()); cur=[]; } };
    for(const it of its){ if(cy===null||Math.abs(it.y-cy)<=4){ cur.push(it); if(cy===null)cy=it.y; } else { flush(); cur=[it]; cy=it.y; } }
    flush();
  }
  if(!lines.length) return {error:'__notimetable__'};
  const full=lines.join('\n');
  // signature « emploi du temps » : dates jj/mm/aaaa + plages horaires + « Semaine calendaire »
  const nDates=(full.match(/\b\d{2}\/\d{2}\/\d{4}\b/g)||[]).length;
  const nTimes=(full.match(/\d{1,2}:\d{2}\s*[-–]\s*\d{1,2}:\d{2}/g)||[]).length;
  if(nDates<3 || nTimes<3 || !/semaine\s+calendaire/i.test(full)) return {error:'__notimetable__'};
  onStep&&onStep('Analyse des jours d\'école…',70,true);
  const timeRe=/\d{1,2}:\d{2}\s*[-–]\s*\d{1,2}:\d{2}/;
  const dayHasCourse={}, allDates=[]; let cur=null;
  for(const ln of lines){
    if(/semaine\s+calendaire/i.test(ln)){ cur=null; continue; }   // frontière de semaine
    const dm=ln.match(/^(?:lun|mar|mer|jeu|ven|sam|dim)\.?\s+(\d{2})\/(\d{2})\/(\d{4})/i);
    let rest=ln;
    if(dm){ cur=`${dm[3]}-${dm[2]}-${dm[1]}`; if(!(cur in dayHasCourse)){ dayHasCourse[cur]=false; allDates.push(cur); } rest=ln.slice(dm[0].length); }
    if(!cur) continue;
    if(timeRe.test(rest)){                                       // un créneau (plage horaire) sur ce jour
      const desc=rest.replace(/.*\d{1,2}:\d{2}\s*[-–]\s*\d{1,2}:\d{2}/,'').trim();
      const isEnt=/entreprise/i.test(desc)||/entreprise/i.test(rest);   // jour « Entreprise » = pas l'école
      if(!isEnt) dayHasCourse[cur]=true;                         // ≥1 cours CFA → jour d'école
    }
  }
  const ecoleDates=Object.keys(dayHasCourse).filter(d=>dayHasCourse[d]).sort();
  const entrepriseDates=Object.keys(dayHasCourse).filter(d=>!dayHasCourse[d]).sort();
  if(!ecoleDates.length) return {error:'Emploi du temps lu, mais aucun jour d\'école détecté. Tu peux remplir au pinceau.'};
  allDates.sort();
  if(CFA_DEBUG){ console.log('%c[CFA debug] emploi du temps — jours listés:'+allDates.length+' · ÉCOLE:'+ecoleDates.length+' · exclus(entreprise/vide):'+entrepriseDates.length,'color:#b8860b;font-weight:bold');
    console.log('[CFA debug] école:',ecoleDates); console.log('[CFA debug] exclus:',entrepriseDates);
    window._cfaDebug={fmt:'timetable',ecoleDates,entrepriseDates,allDates}; }
  return {timetable:true, fmt:'PDF texte — emploi du temps', ecoleDates, entrepriseDates, allDates};
}
async function cfaDetect(file,onStep){
  const ext=(file.name||'').split('.').pop().toLowerCase();
  // V1 : Excel non parsé ici (intercepté en amont par onCfaFile → consigne « exporte en PDF »).
  // cfaFromExcel + helpers thème/tint restent dans le fichier mais ne sont plus appelés pour la détection.
  if(['xlsx','xls','xlsm','xlsb','xltx','xltm'].includes(ext)) return {error:'__excel__'};
  if(ext==='pdf' || file.type==='application/pdf'){
    const tt=await cfaFromTimetable(file,onStep);        // 0) emploi du temps TEXTUEL (jours d'école)
    if(tt && tt.timetable) return tt;
    if(tt && tt.error && tt.error!=='__notimetable__') return tt;   // emploi du temps lu mais vide → erreur claire
    const v=await cfaFromPdfVector(file,onStep);        // 1) couleurs LUES dans le PDF (le plus fiable)
    if(!(v&&v.error==='__novector__')) return v;
    const r=await cfaFromPdfText(file,onStep);          // 2) secours : couleur échantillonnée sur le rendu
    if(!(r&&r.error==='__notext__')) return r;
    onStep&&onStep('PDF scanné — OCR…',20,true);         // 3) dernier recours : PDF image → Tesseract
    const id=await cfaPdfToImageData(file); return await cfaFromImage(id,onStep);
  }
  onStep&&onStep('Chargement de l\'image…',20,true);
  return await cfaFromImage(await cfaImgToImageData(file),onStep);
}

// — Mémoire du mapping couleur→catégorie PAR ORGANISATION (aucune palette fixe ; on apprend de l'user) —
let _cfaMappings=[];
const CFA_MATCH_DELTAE=24;   // tolérance de match d'un cluster à un mapping mémorisé (> seuil de clustering)
async function cfaLoadMappings(){
  try{
    const {data}=await EatimeScope.from('cfa_color_mappings').select('id,source_label,rgb,categorie').eq('organization_id',ME.organization_id);
    _cfaMappings=(data||[]).map(m=>{ const rgb=(m.rgb||'').split(',').map(Number); return {id:m.id,source:m.source_label||null,rgb,lab:cfaRgb2lab(rgb[0]||255,rgb[1]||255,rgb[2]||255),categorie:m.categorie}; });
  }catch(e){ _cfaMappings=[]; }
  return _cfaMappings;
}
// Cherche dans les mappings de l'org la catégorie d'une couleur proche (ΔE Lab). Priorité au même CFA/source.
function cfaGuessCategory(rgb,source){
  if(!rgb||!_cfaMappings.length)return null;
  const lab=cfaRgb2lab(rgb[0],rgb[1],rgb[2]);
  const pool=_cfaMappings.filter(m=>!source||!m.source||m.source===source);
  let best=null,bd=1e9; for(const m of (pool.length?pool:_cfaMappings)){ const d=cfaDE(lab,m.lab); if(d<bd){bd=d;best=m;} }
  return (best && bd<CFA_MATCH_DELTAE)?best.categorie:null;
}
// À la validation : mémorise (ou met à jour) le mapping couleur→catégorie pour cette org. Non bloquant.
async function cfaSaveMappings(map){
  try{
    const det=window._cfaDet; if(!det||!det.clusters)return;
    const source=(val('alt_cfa')||'').trim()||null; const ops=[];
    for(const c of det.clusters){
      if(c.id==='weekend' || c.id==='ferie' || !c.rgb)continue;   // 'weekend'/'ferie' sont auto → pas mémorisés couleur
      const cat=map[c.id]; if(!cat||cat==='ignore')continue;
      const lab=cfaRgb2lab(c.rgb[0],c.rgb[1],c.rgb[2]);
      let near=null,bd=1e9; for(const m of _cfaMappings){ if(m.source!=null && m.source!==source)continue; const d=cfaDE(lab,m.lab); if(d<bd){bd=d;near=m;} }
      if(near && bd<16){ ops.push(EatimeScope.from('cfa_color_mappings').update({rgb:c.rgb.join(','),categorie:cat,source_label:source,updated_at:new Date().toISOString()}).eq('id',near.id)); near.categorie=cat; near.lab=lab; }
      else { ops.push(EatimeScope.from('cfa_color_mappings').insert({organization_id:ME.organization_id,source_label:source,rgb:c.rgb.join(','),categorie:cat})); _cfaMappings.push({id:null,source,rgb:c.rgb,lab,categorie:cat}); }
    }
    if(ops.length) await Promise.allSettled(ops);
  }catch(e){ console.warn('[cfa] sauvegarde mapping:',e); }
}

// ── OCR du planning CFA (Mistral vision via edge function cfa-ocr) — IMPORT EN MÉMOIRE (aperçu) ──
const ALT_MONTHS={janvier:0,'février':1,fevrier:1,mars:2,avril:3,mai:4,juin:5,juillet:6,'août':7,aout:7,septembre:8,octobre:9,novembre:10,'décembre':11,decembre:11};
// "decembre-25" / "octobre-26" → {mi, year} en lisant le suffixe d'année du nom
function cfaMonthYear(nom){
  const mm=(nom||'').toLowerCase().match(/[a-zàâäéèêëîïôöûüç]+/); if(!mm) return null;
  const mi=ALT_MONTHS[mm[0]]; if(mi==null) return null;
  const yy=(nom||'').match(/(\d{2,4})\s*$/); let y=yy?parseInt(yy[1]):null;
  if(y!=null && y<100) y=2000+y;
  if(y==null){ const base=parseInt((ALT.annee||schoolYears()[1]).split('-')[0]); y=mi>=8?base:base+1; }
  return {mi,year:y};
}
const ALT_CAT_DEF={ecole:'ecole',examen:'examen',weekend:'ignore',entreprise:'ignore'};   // « weekend » lu par l'OCR → ignoré (non renseigné), jamais « repos »
const ALT_CAT_META={ecole:{lbl:'Bleu clair → École',ic:'🎓',col:'#5b9cff'},examen:{lbl:'Bleu foncé encadré → Examen',ic:'📝',col:'#2e5496'},weekend:{lbl:'Gris → Week-end / férié',ic:'😴',col:'#9aa0aa'},entreprise:{lbl:'Blanc → Entreprise',ic:'🏢',col:'#cfd4da'}};
// Transforme la sortie OCR en {date: categorie} avec garde-fous DÉTERMINISTES.
function processCfaMois(mois){
  const byDate={};
  (mois||[]).forEach(m=>{ const my=cfaMonthYear(m.nom); if(!my)return;
    (m.jours||[]).forEach(j=>{ const d=parseInt(j.d); if(!d)return; const last=new Date(my.year,my.mi+1,0).getDate(); if(d<1||d>last)return;
      const date=`${my.year}-${String(my.mi+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
      let t=(j.t||j.c||'entreprise').toString().toLowerCase();
      if(!['ecole','examen','weekend','entreprise'].includes(t)) t='entreprise';
      // (plus de forçage des samedis/dimanches en « week-end » — v0.23 : un samedi de cours reste « école »)
      byDate[date]=t;
    });
  });
  // filtre examen : ne garder « examen » que sur des BLOCS de ≥ 3 jours consécutifs (vraies semaines d'exam) ; sinon → école
  const ex=Object.keys(byDate).filter(d=>byDate[d]==='examen').sort(); let run=[];
  const flush=()=>{ if(run.length<3) run.forEach(d=>{ byDate[d]='ecole'; }); run=[]; };
  for(let i=0;i<ex.length;i++){ if(i>0 && (new Date(ex[i])-new Date(ex[i-1]))===86400000) run.push(ex[i]); else { flush(); run=[ex[i]]; } }
  flush();
  return byDate;
}
// ── Overlay de progression bloquant + annulation + récupération d'erreur ──
let _cfaAbort=null, _cfaBusy=false;
function showCfaProgress(){ const o=document.getElementById('cfaProgress'); if(o)o.classList.add('on'); }
function hideCfaProgress(){ const o=document.getElementById('cfaProgress'); if(o)o.classList.remove('on'); const f=document.getElementById('cfaProgFill'); if(f){f.classList.remove('indet');f.style.marginLeft='0';f.style.width='0';} }
function setCfaStep(label,pct,indet){ const s=document.getElementById('cfaProgStep'),f=document.getElementById('cfaProgFill'); if(s&&label!=null)s.textContent=label; if(f){ f.classList.toggle('indet',!!indet); if(!indet){f.style.marginLeft='0';f.style.width=(pct||0)+'%';} } }
function cancelCfaOcr(){ if(_cfaAbort){ try{_cfaAbort.abort();}catch(_){} } }
// V1 — on n'essaie PLUS de parser les fichiers Excel (formules, couleurs de thème, mises en page variables) :
// on redirige vers l'export PDF (un Excel → PDF devient un PDF vectoriel → chemin PDF déjà fiable).
function cfaIsExcel(file){ const ext=((file&&file.name)||'').split('.').pop().toLowerCase(); return ['xlsx','xls','xlsm','xlsb','xltx','xltm'].includes(ext); }
function showCfaExcelHint(){

async function onCfaFile(ev){
  const file=ev.target.files[0]; if(!file)return; ev.target.value='';
  // L'import remplace l'aperçu : s'il contient des modifications non enregistrées, on demande d'abord.
  if(!await altLeaveGuard('importer un autre calendrier')) return;
  if(cfaIsExcel(file)){ showCfaExcelHint(); return; }   // pas de parsing Excel en V1 — consigne PDF (sans erreur)
  if(_cfaBusy) return;                                  // anti double-clic / double-fichier
  _cfaBusy=true; const btn=document.getElementById('cfaOcrBtn'); if(btn)btn.disabled=true;
  _cfaAbort=new AbortController();
  showCfaProgress();
  try{
    // 1) Détection DÉTERMINISTE côté client (Excel / PDF / image) — zéro API.
    let det;
    try{ det=await cfaDetect(file,(l,p,i)=>setCfaStep(l,p,i)); }
    catch(e){ det={error:(e&&e.message)||String(e)}; }
    if(_cfaAbort.signal.aborted) throw new DOMException('aborted','AbortError');
    // Emploi du temps TEXTUEL : catégories déjà connues (jours d'école) → application DIRECTE,
    // sans modale de mapping couleur (il n'y a pas de couleur à mapper).
    if(det && det.timetable){ hideCfaProgress(); applyTimetable(det); return; }
    // 2) Secours vision (uniquement si activé ET si la détection déterministe n'a rien donné).
    const empty=det.error || !det.byDate || !Object.keys(det.byDate).length;
    if(empty && CFA_USE_VISION_FALLBACK){
      setCfaStep('Secours : analyse IA…',0,true);
      const dataUrl=await cfaFileToImage(file);
      const {data:sess}=await sb.auth.getSession();
      const r=await fetch(SUPA_URL+'/functions/v1/cfa-ocr',{method:'POST',signal:_cfaAbort.signal,
        headers:{'Authorization':'Bearer '+(sess?.session?.access_token||''),'Content-Type':'application/json','apikey':SUPA_KEY},
        body:JSON.stringify({image:dataUrl})});
      const data=await r.json().catch(()=>null);
      if(r.ok && data && data.ok){
        const bd=processCfaMois(data.mois||[]); const byDate={}; const present={};
        Object.entries(bd).forEach(([d,c])=>{ byDate[d]={cluster:c,rgb:null,conf:0.5}; present[c]=(present[c]||0)+1; });
        det={byDate,clusters:Object.entries(present).map(([id,n])=>({id,n,rgb:null,conf:0.5})),fmt:'vision (secours)',lowRate:1};
      }
    }
    setCfaStep('Reconstitution du calendrier…',92);
    await new Promise(res=>setTimeout(res,150));
    hideCfaProgress();
    if(det.error==='__excel__'){ showCfaExcelHint(); return; }   // garde défensive (Excel normalement intercepté en amont)
    if(det.error || !det.byDate || !Object.keys(det.byDate).length){
      toast('Détection impossible : '+(det.error||'aucune case détectée')+'. Tu peux remplir au pinceau.'); return;
    }
    await cfaLoadMappings();   // mappings couleur→catégorie déjà appris par cette org → pré-remplissage auto
    showCfaClusters(det);
  }catch(e){
    hideCfaProgress();
    if(e && e.name==='AbortError') toast('Analyse annulée.');
    else toast('Échec de l\'analyse : '+((e&&e.message)||e)+'. Tu peux réessayer ou remplir au pinceau.');
  }finally{
    _cfaBusy=false; _cfaAbort=null; if(btn)btn.disabled=false;
  }
}
// Application DIRECTE d'un emploi du temps textuel → aperçu EN MÉMOIRE (validation-first inchangée).
// On ne marque QUE les jours d'école ; tout le reste reste libre (ALT.jours est remis à zéro d'abord).
function applyTimetable(det){
  const dates=(det.ecoleDates||[]).slice(); if(!dates.length){ toast('Aucun jour d\'école détecté.'); return; }
  const span=(det.allDates&&det.allDates.length?det.allDates:dates).slice().sort();
  const dMin=new Date(span[0]+'T00:00:00'), dMax=new Date(span[span.length-1]+'T00:00:00');
  ALT.period={debut:`${dMin.getFullYear()}-${String(dMin.getMonth()+1).padStart(2,'0')}-01`,
    fin:`${dMax.getFullYear()}-${String(dMax.getMonth()+1).padStart(2,'0')}-${String(new Date(dMax.getFullYear(),dMax.getMonth()+1,0).getDate()).padStart(2,'0')}`};
  ALT.jours={}; dates.forEach(d=>{ ALT.jours[d]={type:'ecole',source:'pdf-texte'}; });   // RIEN d'autre
  ALT.dirty=true; markAltDirty(); renderAltCalendar();
  toast(`✓ ${dates.length} jour(s) d'école détecté(s) (aperçu) — le reste reste libre. Vérifie puis « 💾 Enregistrer le calendrier ».`);
}
async function cfaFileToImage(file){
  if(file.type==='application/pdf'){
    const buf=await file.arrayBuffer(); const pdf=await pdfjsLib.getDocument({data:buf}).promise; const page=await pdf.getPage(1);
    const vp=page.getViewport({scale:2.5}); const cv=document.createElement('canvas'); cv.width=vp.width; cv.height=vp.height;
    const ctx=cv.getContext('2d'); ctx.fillStyle='#ffffff'; ctx.fillRect(0,0,cv.width,cv.height);   // fond blanc (sinon transparence → couleurs lavées)
    await page.render({canvasContext:ctx,viewport:vp,background:'#ffffff'}).promise; return cv.toDataURL('image/png');
  }
  return await new Promise((res,rej)=>{ const r=new FileReader(); r.onload=()=>res(r.result); r.onerror=rej; r.readAsDataURL(file); });
}
// ⚠ prefillWeekends (« Pré-remplir les week-ends » en repos) RETIRÉ en v0.23, bouton compris : le
// week-end est un jour d'entreprise en restauration. Ne pas le réintroduire (verrou : alternance_export_test).
// ── Contrôle contre le total que le document annonce lui-même ─────────────────────────────────
// Ces calendriers portent leur propre compte (« Année 1 : Période Ecole 93 jours - 744 heures »).
// C'est la SEULE garantie qui vaille, quelle que soit la méthode de lecture : si l'extraction
// retombe dessus, on peut proposer ; sinon il faut le dire et ne rien pré-remplir en silence.
// Un import qui propose un résultat faux sans le signaler est pire qu'un import qui échoue : le
// patron valide, et un alternant se retrouve placé en entreprise un jour d'école toute l'année.
// Fonction PURE (testée par tests/cfa_vector_test.js). Renvoie null si le document n'annonce rien.
function cfaControleTotal(det,map){
  const a=det&&det.annonce; if(!a||!a.jours) return null;
  let n=0; for(const v of Object.values(det.byDate||{})){ const t=map[v.cluster]; if(t==='ecole'||t==='examen') n++; }
  return {annonce:a.jours,heures:a.heures||null,trouve:n,ecart:n-a.jours,ok:n===a.jours};
}
// Modale d'association CLUSTER DE COULEUR DÉTECTÉ → catégorie (l'humain donne le sens).
const CFA_MAP_TYPES=[['ecole','🎓 École'],['examen','📝 Examen'],['entreprise','🏢 Entreprise'],['vacances','🏖️ Vacances'],['ferie','🎌 Férié'],['repos','😴 Repos'],['ignore','— Ignorer —']];
function showCfaClusters(det){
  window._cfaDet=det;
  const rgbCss=rgb=>rgb?`rgb(${rgb[0]},${rgb[1]},${rgb[2]})`:'repeating-linear-gradient(45deg,#9994,#9994 4px,#5554 4px,#5554 8px)';
  // tri par effectif décroissant. Plus de groupe « week-end » réservé ni de « repos » proposé par défaut (v0.23).
  const clusters=(det.clusters||[]).slice().sort((a,b)=>b.n-a.n);
  const src=(val('alt_cfa')||'').trim()||null; let nMem=0;
  const rows=clusters.map(c=>{
    // pré-remplissage : 1) mapping déjà appris par l'org (couleur proche) ; 2) sinon vision (id=catégorie) ; 3) sinon « ignorer »
    const auto=(c.id==='weekend'||c.id==='ferie'); const guess=!auto?cfaGuessCategory(c.rgb,src):null; if(guess)nMem++;
    const def=guess||(c.id==='ferie'?'ferie':(c.id!=='weekend'&&CFA_MAP_TYPES.find(t=>t[0]===c.id)?c.id:'ignore'));
    const lowPct=Math.round((1-(c.conf||1))*100);
    // Repère visuel : la couleur dont l'effectif tombe pile sur le total annoncé est, sauf
    // surprise, celle de l'école. On le SIGNALE sans le décider à la place de l'utilisateur.
    const colle=(det.annonce&&det.annonce.jours===c.n)?' <span style="color:#2e9e5b;font-weight:600" title="Cet effectif correspond exactement au total annoncé par le document">✅ = total annoncé</span>':'';
    return `<div style="display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--line)">
      <span style="width:24px;height:24px;border-radius:6px;border:1px solid var(--line-2);background:${rgbCss(c.rgb)}"></span>
      <span style="flex:1;font-size:13px">${c.id==='weekend'?'Week-end / férié':(c.id==='ferie'?'🎌 Jours « FERIE »':'Couleur détectée')}${guess?' <span style="color:var(--gold)" title="Pré-rempli depuis ce que tu as déjà mappé">✨ mémorisé</span>':''} <span style="color:var(--muted)">(${c.n} j${lowPct>20?` · ⚠ ${lowPct}% incertain`:''})</span>${colle}</span>
      <select class="cfa-map" data-c="${c.id}" style="background:var(--surface);color:var(--text);border:1px solid var(--line-2);border-radius:7px;padding:6px 8px">${CFA_MAP_TYPES.map(t=>`<option value="${t[0]}" ${def===t[0]?'selected':''}>${t[1]}</option>`).join('')}</select>
    </div>`;}).join('');
  const lowRate=Math.round((det.lowRate||0)*100);
  // Bandeau : ce que le document annonce, et quelles pages ont été retenues. Un calendrier qui
  // couvre plusieurs années scolaires ne doit pas être agrégé en silence.
  const a=det.annonce;
  const cible=a?`<div style="background:var(--surface-2,#0002);border:1px solid var(--line-2);border-radius:8px;padding:9px 11px;margin:0 0 12px;font-size:12.5px;line-height:1.55">
      📄 Le document annonce <b>${a.jours} jours d'école</b>${a.heures?` (${a.heures} h)`:''}${a.annee?` pour son « Année ${a.annee} »`:''}.
      Choisis la couleur qui compte <b>${a.jours} j</b> ci-dessous — c'est celle de l'école.
    </div>`:`<div class="orange-box" style="margin:0 0 12px;font-size:12.5px">⚠ Ce document <b>n'annonce aucun total</b> : impossible de vérifier automatiquement le résultat. Relis le calendrier avant de valider.</div>`;
  const gard=(det.pagesGardees||[]), ign=(det.pagesIgnorees||[]);
  const pages=(gard.length||ign.length)?`<div style="color:var(--muted);font-size:12px;margin:-6px 0 12px;line-height:1.5">
      ${gard.map(p=>`✅ page ${p.page} retenue (${p.periode}, ${p.jours} j)`).join(' · ')}
      ${ign.length?`<br>⤫ ${ign.map(p=>`page ${p.page} ignorée — ${p.raison}`).join(' · ')}`:''}
    </div>`:'';
  const dbgBanner=(CFA_DEBUG&&det.debug)?`<div style="background:#b8860b22;border:1px solid var(--gold);border-radius:8px;padding:8px 10px;margin:0 0 12px;font-size:11.5px;font-family:monospace;line-height:1.5">🐞 <b>DEBUG</b> · colonnes-mois: <b>${det.debug.nblocks}</b> · lignes-jours: <b>${det.debug.rows}</b> · jours: ${det.debug.days} · <b>NON-VIDES: ${det.debug.nonEmpty}</b><br>séparateurs V: ${(det.debug.vlines||[]).length} · H: ${(det.debug.hlines||[]).length} · pas mois: ${det.debug.monthPitch}px · sous-cols/mois: ${det.debug.subsPer}<br>clusters: ${Object.entries(det.debug.perCluster).map(([k,v])=>k+'×'+v).join(' · ')}<br><span style="color:var(--muted)">détail par jour → console (console.table) + <code>window._cfaDebug</code></span></div>`:'';
  document.getElementById('modalHost').innerHTML=`<div class="modal-bg" onclick="if(event.target===this)closeModal()"><div class="modal" style="max-width:520px">
    <h2 style="margin-top:0">🎓 Détection du planning CFA <span style="font-size:12px;color:var(--muted);font-weight:400">(${det.fmt})</span></h2>
    ${dbgBanner}
    ${cible}
    ${pages}
    <div style="color:var(--muted);font-size:12.5px;margin:-8px 0 14px;line-height:1.5">Chaque <b style="color:var(--text)">couleur</b> de ton planning a été regroupée. Indique ce qu'elle représente. <b style="color:var(--text)">Rien n'est appliqué au planning</b> — tu corriges au pinceau puis tu valides.${nMem?` <span style="color:var(--gold)">✨ ${nMem} couleur(s) pré-remplie(s) depuis tes imports précédents.</span>`:''}${lowRate>0?` <span style="color:var(--warn)">~${lowRate}% des cases sont incertaines (surlignées à corriger).</span>`:''}</div>
    ${rows||'<div style="color:var(--muted)">Aucune couleur détectée.</div>'}
    <div class="modal-actions"><button class="btn ghost" onclick="closeModal()">Annuler</button><button class="btn" onclick="applyCfaClusters()">Pré-remplir le calendrier (aperçu)</button></div>
  </div></div>`;
}
function applyCfaClusters(forcer){
  const map=window._cfaMapForce||{}; if(!window._cfaMapForce) document.querySelectorAll('.cfa-map').forEach(s=>map[s.dataset.c]=s.value);
  const det=window._cfaDet;
  // ── Contrôle contre le total annoncé, AVANT toute écriture dans l'aperçu ──
  // On ne pré-remplit jamais un résultat qui contredit le document sans l'avoir dit.
  if(!forcer && det){
    const ctl=cfaControleTotal(det,map);
    if(ctl && !ctl.ok){
      window._cfaMapForce=map;   // on garde le choix de l'utilisateur pour le bouton « quand même »
      document.getElementById('modalHost').innerHTML=`<div class="modal-bg" onclick="if(event.target===this)closeModal()"><div class="modal" style="max-width:520px">
        <h2 style="margin-top:0">⚠️ Le compte ne tombe pas juste</h2>
        <div style="font-size:13.5px;line-height:1.65;margin-bottom:14px">
          Le document annonce <b>${ctl.annonce} jours d'école</b>${ctl.heures?` (${ctl.heures} h)`:''}, mais la couleur que tu as désignée en compte <b>${ctl.trouve}</b>
          — soit <b>${ctl.ecart>0?'+':''}${ctl.ecart} jour(s)</b> d'écart.<br><br>
          Le plus probable est que la couleur choisie ne soit pas la bonne. <b>Rien n'a été pré-rempli.</b>
          Reviens en arrière pour corriger l'association, ou remplis au pinceau — il reste disponible dans tous les cas.
        </div>
        <div class="modal-actions">
          <button class="btn ghost" onclick="closeModal();window._cfaMapForce=null">Annuler</button>
          <button class="btn ghost" onclick="window._cfaMapForce=null;showCfaClusters(window._cfaDet)">← Corriger l'association</button>
          <button class="btn" onclick="applyCfaClusters(true)">Pré-remplir quand même</button>
        </div>
      </div></div>`;
      return;
    }
  }
  window._cfaMapForce=null;
  closeModal(); if(!det||!det.byDate){toast('Aucune donnée.');return;}
  const dates=Object.keys(det.byDate); if(!dates.length){ toast('Aucun jour détecté.'); return; }
  // cadre la vue sur la plage réellement détectée
  const sorted=dates.sort(); const dMin=new Date(sorted[0]+'T00:00:00'), dMax=new Date(sorted[sorted.length-1]+'T00:00:00');
  ALT.period={debut:`${dMin.getFullYear()}-${String(dMin.getMonth()+1).padStart(2,'0')}-01`, fin:`${dMax.getFullYear()}-${String(dMax.getMonth()+1).padStart(2,'0')}-${String(new Date(dMax.getFullYear(),dMax.getMonth()+1,0).getDate()).padStart(2,'0')}`};
  ALT.jours={}; let n=0,low=0;
  Object.entries(det.byDate).forEach(([date,v])=>{ const type=map[v.cluster]; if(!type||type==='ignore')return;
    const verify=(v.conf||0)<CFA_CONF_SEUIL; ALT.jours[date]={type,source:'ocr',conf:v.conf,verify}; n++; if(verify)low++; });
  ALT.dirty=true; markAltDirty(); renderAltCalendar();
  cfaSaveMappings(map);   // mémorise couleur→catégorie pour cette org (le prochain import sera auto-rempli)
  const ctlOk=cfaControleTotal(det,map);
  const sceau=ctlOk?(ctlOk.ok?` · ✅ conforme au total annoncé (${ctlOk.annonce} j)`:` · ⚠ ${ctlOk.ecart>0?'+':''}${ctlOk.ecart} j vs total annoncé, forcé`):' · ⚠ aucun total annoncé à vérifier';
  toast(`✓ ${n} jours pré-remplis (aperçu, ${det.fmt})${low?` · ${low} à vérifier`:''}${sceau} — corrige au pinceau puis « 💾 Enregistrer le calendrier »`);
}

// ===== OCR / Pré-remplissage =====
if(window.pdfjsLib) pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.worker.min.js';

// Pré-remplissage via l'edge function IA (import-contrat-ai) : Mistral OCR/vision + LLM
// json_schema + garde-fous serveur. Remplace l'ancien pipeline Tesseract + regex (parseEmployeData),
// qui prenait des libellés de formulaire pour des valeurs sur les CERFA scannés.
function escOcr(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function fileToBase64(f){return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(String(r.result).split(',')[1]||'');r.onerror=rej;r.readAsDataURL(f);});}

// Rend les pages d'un PDF en PNG UNIQUEMENT si c'est un scan (couche texte native quasi absente).
// Le modèle « voit » alors la mise en page (bloc employeur vs bloc salarié) au lieu d'un texte aplati.
async function pdfPagesToImages(file){
  const buf=await file.arrayBuffer();
  const pdf=await pdfjsLib.getDocument({data:buf}).promise;
  const n=Math.min(pdf.numPages,4);
  let nativeChars=0;
  for(let i=1;i<=n;i++){ try{ const tc=await (await pdf.getPage(i)).getTextContent(); nativeChars+=tc.items.reduce((a,it)=>a+((it.str||'').replace(/\s/g,'').length),0); }catch(_){} }
  const isScan=nativeChars<200; const images=[];
  if(isScan){
    for(let i=1;i<=n;i++){
      const page=await pdf.getPage(i);
      const vp=page.getViewport({scale:2});
      const c=document.createElement('canvas'); c.width=vp.width; c.height=vp.height;
      await page.render({canvasContext:c.getContext('2d'),viewport:vp}).promise;
      images.push(c.toDataURL('image/png'));
    }
  }
  return {isScan,images};
}

// Champs pré-remplissables : [clé IA, id champ, libellé, type].
const OCR_FIELDS=[
  ['nom','f_nom','Nom','text'],['prenom','f_prenom','Prénom','text'],
  ['date_naissance','f_naiss','Date de naissance','date'],['sexe','f_sexe','Sexe','sexe'],
  ['nationalite','f_nat','Nationalité','text'],['num_secu','f_secu','N° Sécurité sociale','text'],
  ['email','f_email','Email','text'],['telephone','f_tel','Téléphone','text'],
  ['adresse','f_adr','Adresse','text'],['code_postal','f_cp','Code postal','text'],
  ['ville','f_ville','Ville','text'],['type_contrat','f_contrat','Type de contrat','contrat'],
  ['date_entree','f_entree',"Date d'entrée",'date'],
];
const OCR_LABEL=Object.fromEntries(OCR_FIELDS.map(f=>[f[0],f[2]]));
let _ocrData=null;

async function ocrExtract(ev){
  const file=ev.target.files[0]; if(!file)return; ev.target.value='';
  const btn=document.getElementById('ocrBtn');
  const setBtn=(t,d)=>{ if(btn){btn.disabled=d;btn.textContent=t;} };
  setBtn('⏳ Lecture IA…',true);
  try{
    const{data:{session}}=await sb.auth.getSession();
    if(!session?.access_token){ toast('Session expirée — reconnecte-toi'); setBtn('📄 Pré-remplir depuis un document',false); return; }
    const base64=await fileToBase64(file);
    let images=[];
    if(file.type==='application/pdf'){
      const r=await pdfPagesToImages(file); images=r.images;
      if(r.isScan) setBtn('⏳ Scan détecté — lecture visuelle…',true);
    } else if((file.type||'').startsWith('image/')){
      images=['data:'+file.type+';base64,'+base64];
    }
    const ctrl=new AbortController(); const to=setTimeout(()=>ctrl.abort(),90000); let r;
    try{
      r=await fetch(SUPA_URL+'/functions/v1/import-contrat-ai',{method:'POST',signal:ctrl.signal,
        headers:{'Content-Type':'application/json','Authorization':'Bearer '+session.access_token,'apikey':SUPA_KEY},
        body:JSON.stringify({base64,mime_type:file.type||'application/pdf',images})});
    }catch(err){ throw new Error(err.name==='AbortError'?'Délai dépassé (90 s) — réessaie':err.message); }
    finally{ clearTimeout(to); }
    let j={}; try{ j=await r.json(); }catch(_){}
    if(r.status===403) throw new Error("Accès refusé : l'import IA requiert un rôle admin ou manager.");
    if(!r.ok) throw new Error(j.error||('Erreur IA ('+r.status+')'));
    openOcrReview(j.data||{}, j.rejected||[], j.via);
  }catch(err){ toast('Erreur lecture : '+err.message); }
  setBtn('📄 Pré-remplir depuis un document',false);
}

// Panneau de REVUE : rien n'est écrit sans validation. Chaque valeur proposée est affichée
// avec la confiance ; l'utilisateur coche/décoche. Les collisions (champ déjà rempli) sont
// signalées et DÉCOCHÉES par défaut. Les champs rejetés par les garde-fous sont listés à part.
function openOcrReview(data, rejected, via){
  _ocrData=data;
  const conf=typeof data.confidence==='number'?data.confidence:null;
  const confPct=conf==null?null:Math.round(conf*100);
  const confCls=conf==null?'off':(conf>=0.8?'ok':conf>=0.5?'warn':'bad');
  const viaLabel=(via==='vision'||via==='ocr-fallback')?'lecture visuelle (scan)':'lecture texte';
  let rows='',any=false;
  for(const [k,id,label] of OCR_FIELDS){
    const val=data[k]; if(val===undefined||val===null||String(val).trim()==='')continue;
    const el=document.getElementById(id); if(!el)continue;
    const existing=(el.value||'').trim();
    const collision=existing && existing!==String(val).trim();
    any=true;
    rows+=`<tr>
      <td style="width:30px;text-align:center"><input type="checkbox" class="ocr-chk" data-field="${k}" ${collision?'':'checked'}></td>
      <td style="color:var(--muted);white-space:nowrap">${label}</td>
      <td><b style="word-break:break-word">${escOcr(String(val))}</b>${collision?`<div style="color:var(--warn);font-size:11.5px;margin-top:2px">⚠ écrase « ${escOcr(existing)} » — décoché par défaut</div>`:''}</td>
    </tr>`;
  }
  const uniqRej=[...new Set((rejected||[]).map(r=>OCR_LABEL[r.field]||r.field))];
  const rejBlock=uniqRej.length?`<div style="margin-top:12px;padding:10px 12px;border-radius:8px;background:rgba(224,169,58,.12);color:var(--warn);font-size:12.5px">⚠ ${uniqRej.length} champ(s) non exploitable(s), à saisir à la main : ${escOcr(uniqRej.join(', '))}.</div>`:'';
  const head=`<div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:4px"><h3 style="margin:0">Vérifier le pré-remplissage</h3>${conf!=null?`<span class="chip ${confCls}">Confiance ${confPct}%</span>`:''}<span style="color:var(--muted);font-size:11.5px">${viaLabel}</span></div>
    <p style="color:var(--muted);font-size:12.5px;margin:4px 0 12px">Décoche ce qui est faux. Seuls les champs cochés seront appliqués — tu pourras encore tout modifier ensuite.</p>`;
  const bodyHtml=any
    ? `${head}<table class="tbl" style="width:100%"><tbody>${rows}</tbody></table>${rejBlock}
       <div class="modal-actions" style="margin-top:16px"><button class="btn ghost" onclick="closeModal()">Annuler</button><button class="btn" onclick="applyOcrReview()">Appliquer les champs cochés</button></div>`
    : `${head}<p style="color:var(--muted)">Aucune donnée exploitable détectée dans ce document.</p>${rejBlock}<div class="modal-actions" style="margin-top:16px"><button class="btn" onclick="closeModal()">Fermer</button></div>`;
  document.getElementById('modalHost').innerHTML=`<div class="modal-bg" onclick="if(event.target===this)closeModal()"><div class="modal" style="max-width:560px">${bodyHtml}</div></div>`;
}

// Dernier filet CÔTÉ CLIENT : re-vérification automatique avant écriture, même si un champ
// coché a franchi les garde-fous serveur. Sous-ensemble déterministe, indépendant de l'IA.
const _CLIENT_LABELS=new Set(['nom','prenom','prenoms','date de naissance','nationalite','sexe','adresse','ville','code postal','effectif total salaries de','type d\'employeur','lieu d\'execution']);
function _clientReject(type,val){
  const n=String(val).toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/\s+/g,' ').trim();
  if(type==='text'||type==='sexe'){
    if(_CLIENT_LABELS.has(n)) return 'libellé de formulaire';
    if(String(val).includes(':')) return 'contient « : »';
    if(/^effectif total|^type d'employeur|^lieu d'execution/.test(n)) return 'libellé de formulaire';
  }
  if(type==='date'){
    const d=/^(\d{4})-(\d{2})-(\d{2})$/.exec(String(val).trim());
    if(d){ const t=Date.UTC(+d[1],+d[2]-1,+d[3]); const now=new Date(); if(t>=Date.UTC(now.getFullYear(),now.getMonth(),now.getDate())) return 'date aujourd\'hui ou future'; }
  }
  return null;
}
function applyOcrReview(){
  if(!_ocrData){ closeModal(); return; }
  const conf=typeof _ocrData.confidence==='number'?_ocrData.confidence:1;
  const border=conf>=0.8?'var(--ok)':'var(--warn)';
  let n=0; const blocked=[];
  document.querySelectorAll('.ocr-chk:checked').forEach(chk=>{
    const k=chk.getAttribute('data-field');
    const def=OCR_FIELDS.find(f=>f[0]===k); if(!def)return;
    const id=def[1], label=def[2], type=def[3]; const el=document.getElementById(id); if(!el)return;
    let val=_ocrData[k]; if(val===undefined||val===null||String(val).trim()==='')return;
    if(type==='sexe'){ const s=String(val).toUpperCase(); val=(s.startsWith('H')||s.startsWith('M'))?'M':(s.startsWith('F')?'F':''); if(!val)return; }
    const rej=_clientReject(type==='contrat'?'text':type, val);
    if(rej){ blocked.push(label); return; }   // valeur douteuse : jamais écrite
    el.value=val; el.style.borderColor=border; n++;
    if(type==='contrat' && typeof toggleSortie==='function') toggleSortie(el.value);
  });
  closeModal();
  let msg=n?`${n} champ(s) appliqué(s) — vérifie puis enregistre`:'Aucun champ appliqué';
  if(blocked.length) msg+=` · ${blocked.length} bloqué(s) (valeur douteuse : ${blocked.join(', ')})`;
  toast(msg);
}
