<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">

<title>Raya — Gestion Salariés</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../access.js?v=6.31"></script>
<script src="../orgscope.js?v=1"></script>
<script src="../utils.js?v=1.7"></script>
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/exceljs@4.4.0/dist/exceljs.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root, [data-theme="dark"]{--gold:#c8a035;--gold-dim:#8a7028;--bg:#0b0b15;--card:#15151f;--surface:#1c1c28;--line:rgba(255,255,255,.06);--line-2:rgba(255,255,255,.12);--text:#e8e8ec;--muted:#7b7b8a;--ok:#3fb87f;--warn:#e0a93a;--bad:#c45a5a}
[data-theme="light"]{--gold:#c8a035;--bg:#f5f5f7;--card:#ffffff;--surface:#f0f0f3;--line:rgba(0,0,0,.06);--line-2:rgba(0,0,0,.12);--text:#1a1a1f;--muted:#6b6b78;--ok:#2a8f5f;--warn:#b8841f;--bad:#b04444;--info:#4a7fbd}
html,body{height:100%}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;font-size:14px;-webkit-font-smoothing:antialiased}
a{color:var(--gold);text-decoration:none}
.hidden{display:none!important}
input,select,textarea,button{font-family:inherit;color:var(--text)}
button{cursor:pointer;border:none;background:none}

/* ── BUTTONS ── */
.btn{padding:9px 16px;border-radius:8px;background:var(--gold);color:#1a1a1a;font-weight:600;font-size:13px;border:1px solid transparent;transition:.15s}
.btn:hover{filter:brightness(1.07)}
.btn.ghost{background:transparent;color:var(--text);border-color:var(--line-2)}
.btn.ghost:hover{background:rgba(255,255,255,.04)}
.btn.danger{background:transparent;color:var(--bad);border-color:rgba(196,90,90,.3)}
.btn.danger:hover{background:rgba(196,90,90,.08)}
.btn.sm{padding:6px 11px;font-size:12px}
.btn.icon{padding:7px 9px}

/* ── LOCK ── */
.lock{position:fixed;inset:0;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;z-index:100}
.lock .brand{color:var(--gold);font-size:22px;font-weight:700;letter-spacing:.5px}
.lock .sub{color:var(--muted);font-size:13px;margin-bottom:14px}
.lock input{padding:13px 18px;border-radius:10px;border:1px solid var(--line-2);background:var(--surface);font-size:15px;text-align:center;width:260px;outline:none}
.lock input:focus{border-color:var(--gold)}
.lock .err{color:var(--bad);font-size:12px;height:16px}

/* ── HEADER ── */
.header{display:flex;align-items:center;justify-content:space-between;padding:14px 28px;border-bottom:1px solid var(--line);background:var(--bg);position:sticky;top:0;z-index:20}
.brand{color:var(--gold);font-weight:700;font-size:16px;letter-spacing:.3px}
.brand small{color:var(--muted);font-weight:400;font-size:12px;margin-left:8px;letter-spacing:0}
.h-actions{display:flex;gap:8px;align-items:center}

/* ── LIST ── */
.wrap{max-width:1180px;margin:0 auto;padding:24px 28px 60px}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:18px}
.toolbar input,.toolbar select{padding:9px 12px;border-radius:8px;border:1px solid var(--line);background:var(--surface);font-size:13px;outline:none}
.toolbar input:focus,.toolbar select:focus{border-color:var(--gold-dim)}
.count{color:var(--muted);font-size:12px;margin-left:auto}
.tbl{width:100%;border-collapse:separate;border-spacing:0;background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.tbl th{text-align:left;padding:12px 16px;font-size:11px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;background:rgba(255,255,255,.015);border-bottom:1px solid var(--line)}
.tbl td{padding:14px 16px;border-bottom:1px solid var(--line);font-size:13px;vertical-align:middle}
.tbl tr:last-child td{border-bottom:none}
.tbl tr.row{cursor:pointer;transition:background .12s}
.tbl tr.row:hover{background:rgba(200,160,53,.04)}
.namecell{display:flex;align-items:center;gap:12px}
.avatar{width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;color:#111;font-size:13px;flex-shrink:0;background:#444}
.fullname{font-weight:600;color:var(--text)}
.subline{color:var(--muted);font-size:11.5px;margin-top:1px}
.chip{display:inline-block;padding:2px 9px;border-radius:20px;font-size:10.5px;font-weight:600;letter-spacing:.02em}
.chip.cuisine{background:rgba(232,160,106,.13);color:#e8a06a}
.chip.caisse{background:rgba(224,196,106,.13);color:#e0c46a}
.chip.multi{background:rgba(155,140,255,.13);color:#bca7ff}
.chip.off{background:rgba(255,255,255,.05);color:var(--muted)}
.chip.ok{background:rgba(63,184,127,.13);color:var(--ok)}
.chip.warn{background:rgba(224,169,58,.13);color:var(--warn)}
.chip.bad{background:rgba(196,90,90,.13);color:var(--bad)}

/* ── FICHE ── */
.fiche{position:fixed;inset:0;background:var(--bg);z-index:50;overflow:auto;display:flex;flex-direction:column}
.fiche-head{display:flex;align-items:center;gap:18px;padding:16px 28px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--bg);z-index:1}
.fiche-head .back{display:flex;align-items:center;gap:6px;color:var(--muted);font-size:13px;padding:7px 10px;border-radius:8px}
.fiche-head .back:hover{background:rgba(255,255,255,.04);color:var(--text)}
.fiche-name{display:flex;align-items:center;gap:14px;flex:1;min-width:0}
.fiche-name .avatar{width:42px;height:42px;font-size:16px}
.fiche-name .nm{font-size:18px;font-weight:600;color:var(--text)}
.fiche-name .meta{color:var(--muted);font-size:12px;margin-top:2px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.tabs{display:flex;gap:2px;padding:0 28px;border-bottom:1px solid var(--line);background:var(--bg);position:sticky;top:75px;z-index:1}
.tab{padding:14px 18px;font-size:13px;color:var(--muted);font-weight:500;border-bottom:2px solid transparent;margin-bottom:-1px}
.tab:hover{color:var(--text)}
.tab.active{color:var(--gold);border-bottom-color:var(--gold)}
.tab-body{max-width:880px;margin:0 auto;padding:28px;width:100%}

/* ── SECTION CARDS ── */
.section{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:22px 24px;margin-bottom:18px}
.section h3{font-size:11.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;margin-bottom:16px;font-weight:600}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px 18px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px 18px}
.fld label{display:block;font-size:11.5px;color:var(--muted);margin-bottom:6px;font-weight:500}
.fld input,.fld select,.fld textarea{width:100%;padding:9px 12px;border-radius:8px;border:1px solid var(--line-2);background:var(--surface);font-size:13px;outline:none;transition:.12s}
.fld input:focus,.fld select:focus,.fld textarea:focus{border-color:var(--gold-dim)}
.fld input[type=color]{padding:3px;height:38px;cursor:pointer}
.chkrow{display:flex;gap:18px;flex-wrap:wrap;margin-top:6px}
.chk{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--text);cursor:pointer}
.chk input{width:auto;cursor:pointer}

/* ── DOCS ── */
.req-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
.req{background:var(--surface);border:1px solid var(--line-2);border-radius:10px;padding:14px 16px;display:flex;align-items:flex-start;gap:12px;cursor:pointer;transition:.12s}
.req:hover{border-color:var(--gold-dim)}
.req .ic{width:32px;height:32px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:15px;flex-shrink:0}
.req.ok .ic{background:rgba(63,184,127,.15);color:var(--ok)}
.req.miss .ic{background:rgba(224,169,58,.13);color:var(--warn)}
.req .lbl{font-weight:600;font-size:13px}
.req .st{font-size:11px;color:var(--muted);margin-top:2px}
.req.ok .st{color:var(--ok)}
.req.miss .st{color:var(--warn)}
.doc-list{margin-top:14px}
.doc{display:flex;align-items:center;gap:12px;padding:10px 14px;background:var(--surface);border:1px solid var(--line);border-radius:8px;margin-bottom:8px}
.doc .typ{padding:2px 8px;border-radius:6px;background:rgba(200,160,53,.13);color:var(--gold);font-size:10.5px;font-weight:600;text-transform:uppercase;letter-spacing:.04em}
.doc .nm{font-weight:500;font-size:13px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;cursor:pointer}
.doc .nm:hover{color:var(--gold)}
.doc .sz{color:var(--muted);font-size:11px}

/* ── DISPO / CONTRAINTE ── */
.subitem{display:flex;align-items:center;gap:10px;padding:9px 13px;background:var(--surface);border:1px solid var(--line);border-radius:8px;margin-bottom:7px;font-size:12.5px;flex-wrap:wrap}
.add-row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:10px;padding-top:14px;border-top:1px dashed var(--line-2)}
.add-row select,.add-row input{padding:7px 10px;border-radius:7px;border:1px solid var(--line-2);background:var(--surface);font-size:12px;outline:none}
/* Champs de gestion des rôles (modal ⚙ Rôles) + sélecteur de niveau (fiche) : fond explicite sinon texte clair sur fond blanc = invisible */
#rolesBody input,#rolesBody select,.ra-niv{background:var(--surface);color:var(--text);border:1px solid var(--line-2);border-radius:7px;padding:7px 10px;font-size:13px;outline:none}
#rolesBody input[type=color]{padding:3px;height:34px}

/* ── MODAL ── */
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.65);display:flex;align-items:center;justify-content:center;padding:30px 14px;overflow:auto;z-index:150}
.modal{background:var(--card);border:1px solid var(--line-2);border-radius:14px;width:100%;max-width:480px;padding:24px}
.modal h2{font-size:17px;margin-bottom:18px;color:var(--text)}
.modal-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:22px}

/* ── TOAST ── */
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#1f1f2b;border:1px solid var(--line-2);padding:11px 20px;border-radius:10px;font-size:13px;z-index:200;opacity:0;transition:.25s;box-shadow:0 8px 28px rgba(0,0,0,.4)}
.toast.show{opacity:1;transform:translateX(-50%) translateY(-4px)}

@media(max-width:680px){
  .wrap{padding:16px}.header,.fiche-head,.tabs{padding-left:16px;padding-right:16px}
  .grid2,.grid3{grid-template-columns:1fr}
  .tab-body{padding:18px 16px}
  .tbl td:nth-child(4),.tbl th:nth-child(4){display:none}
}
/* ── ALTERNANCE / CFA ── */
.alt-brush{padding:5px 10px;border:1px solid var(--line-2);background:var(--surface);color:var(--text);border-radius:8px;font-size:12px;cursor:pointer;display:inline-flex;align-items:center;gap:4px;user-select:none}
.alt-brush.on{border-color:var(--bc);color:var(--bc);font-weight:700;box-shadow:inset 0 0 0 1px var(--bc)}
.alt-months{display:grid;grid-template-columns:repeat(auto-fill,minmax(188px,1fr));gap:14px}
.alt-month{border:1px solid var(--line-2);border-radius:10px;padding:8px;background:var(--surface)}
.alt-mh{font-size:12px;font-weight:700;text-transform:capitalize;margin-bottom:6px;text-align:center}
.alt-wd{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;margin-bottom:3px}
.alt-wd span{font-size:9px;color:var(--muted);text-align:center}
.alt-days{display:grid;grid-template-columns:repeat(7,1fr);gap:2px}
.alt-d{height:22px;display:flex;align-items:center;justify-content:center;font-size:10.5px;border:1px solid transparent;border-radius:5px;cursor:pointer;user-select:none;background:var(--bg);color:var(--text)}
.alt-d.empty{visibility:hidden;cursor:default}
.alt-d.we{color:var(--muted)}
.alt-d:not(.empty):hover{outline:1px solid var(--accent)}
.alt-d.has{font-weight:600}
/* Overlay de progression OCR CFA */
.cfa-prog-bg{display:none;position:fixed;inset:0;z-index:400;background:rgba(8,8,14,.74);align-items:center;justify-content:center}
.cfa-prog-bg.on{display:flex}
.cfa-prog-card{background:var(--card);border:1px solid var(--line-2);border-radius:16px;padding:28px 34px;text-align:center;min-width:300px;max-width:90vw;box-shadow:0 20px 60px rgba(0,0,0,.5)}
.cfa-spin{width:44px;height:44px;border:4px solid var(--line-2);border-top-color:var(--accent,#5b9cff);border-radius:50%;margin:0 auto;animation:cfaspin .8s linear infinite}
@keyframes cfaspin{to{transform:rotate(360deg)}}
.cfa-prog-bar{height:7px;background:var(--surface);border-radius:6px;margin-top:16px;overflow:hidden}
.cfa-prog-bar>#cfaProgFill{height:100%;width:0;background:var(--accent,#5b9cff);transition:width .35s;border-radius:6px}
.cfa-prog-bar>#cfaProgFill.indet{width:40%;animation:cfaindet 1.2s ease-in-out infinite}
@keyframes cfaindet{0%{margin-left:-40%}100%{margin-left:100%}}
</style>
</head>
<body>

<!-- VERROU -->
<div class="lock hidden" id="lock">
  <div class="brand">Gestion Salariés</div>
  <div class="sub" id="lockSub">Connexion à ton compte</div>
  <div id="loginBlock" style="display:flex;flex-direction:column;gap:10px;align-items:center">
    <input type="email" id="loginEmail" placeholder="Email" autocomplete="email" style="width:280px">
    <input type="password" id="loginPw" placeholder="Mot de passe" autocomplete="current-password" onkeydown="if(event.key==='Enter')login()" style="width:280px">
    <button class="btn" onclick="login()" style="width:280px">Se connecter</button>
    <div style="color:var(--muted);font-size:12px">🔒 Accès sur invitation. Demande un lien à ton administrateur.</div>
  </div>
  <div class="err" id="loginErr"></div>
  <a href="../" style="font-size:12px;color:var(--muted);margin-top:6px">← Retour au portail</a>
</div>

<!-- LISTE -->
<div id="listView" class="hidden">
  <div id="lectureBarSal" style="display:none;background:rgba(196,90,90,.16);border-bottom:2px solid var(--bad);padding:9px 24px;font-size:13px"></div>
  <div class="header">
    <div class="brand">Raya <small>· Gestion Salariés · <span id="ver" style="font-size:10px;color:var(--muted)"></span></small></div>
    <div class="h-actions">
      <button class="btn ghost" id="demandesBtn" onclick="openDemandes()" style="position:relative">🔔 Demandes <span id="demandesBadge" style="display:none;background:var(--bad);color:#fff;font-size:10px;padding:1px 6px;border-radius:10px;margin-left:4px;font-weight:700"></span></button>
      <button class="btn ghost" onclick="openExportModal()">Export pointages</button>
      <button class="btn ghost" onclick="openRolesModal()">⚙ Rôles</button>
      <button class="btn ghost" onclick="openColorBackfill()" title="Attribuer une couleur distincte et lisible aux salariés sans couleur, en doublon ou illisible">🎨 Couleurs</button>
      <button class="btn" onclick="openFiche(null)">+ Nouveau salarié</button>
      <a href="../" class="btn ghost">Portail</a>
      <button class="btn ghost" onclick="logout()" title="Déconnexion">↩</button>
    </div>
  </div>
  <div class="wrap">
    <div class="toolbar">
      <input id="search" placeholder="Rechercher…" oninput="render()">
      <select id="fSnack" onchange="render()"><option value="">Tous les snacks</option></select>
      <select id="fRole" onchange="render()"><option value="">Tous les rôles</option><option value="cuisine">Cuisine</option><option value="caisse">Caisse</option></select>
      <select id="fActif" onchange="render()"><option value="1">Actifs</option><option value="">Tous</option><option value="0">Inactifs</option></select>
      <span class="count" id="count"></span>
    </div>
    <table class="tbl">
      <thead><tr><th>Salarié</th><th>Snack</th><th>Rôles</th><th>Contrat</th><th>Documents</th></tr></thead>
      <tbody id="tbody"></tbody>
    </table>
  </div>
</div>

<!-- FICHE -->
<div id="ficheView" class="hidden"></div>

<div id="modalHost"></div>
<!-- Overlay bloquant pendant l'analyse OCR du planning CFA -->
<div id="cfaProgress" class="cfa-prog-bg">
  <div class="cfa-prog-card">
    <div class="cfa-spin"></div>
    <div style="font-weight:600;font-size:15px;margin-top:16px">🎓 Analyse du planning CFA en cours…</div>
    <div id="cfaProgStep" style="color:var(--muted);font-size:12.5px;margin-top:6px">Préparation…</div>
    <div class="cfa-prog-bar"><div id="cfaProgFill"></div></div>
    <div style="color:var(--muted2,#888);font-size:11px;margin-top:10px">L'analyse IA peut prendre ~30 à 60 s. Ne ferme pas la page.</div>
    <button class="btn ghost sm" style="margin-top:14px" onclick="cancelCfaOcr()">Annuler</button>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
// ===== SUPABASE =====
const SUPA_URL='https://ynnqvtfayrdteqtgxeuk.supabase.co';
const SUPA_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InlubnF2dGZheXJkdGVxdGd4ZXVrIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzk4OTE1MTQsImV4cCI6MjA5NTQ2NzUxNH0._mfVAGexu7ew38UQk6adn42az4Gt_J3ePxR6O6wuWHc';
const sb=supabase.createClient(SUPA_URL,SUPA_KEY);
const VERSION='v0.25 · lectures complètes : indisponibilités et retards lus en entier malgré le plafond de 1 000 lignes du serveur, bandeau rouge si une lecture est incomplète';
let ME=null, ORG={};
let selectedMonth=null, selectedSnack=null;
function fmtH(h){if(h==null||isNaN(h))return'';const tot=Math.round(h*60);return `${Math.floor(tot/60)}h ${String(tot%60).padStart(2,'0')}m`;}
function ymOf(ts){return ts.slice(0,7);}
function ymLabel(ym){const[y,m]=ym.split('-');return new Date(parseInt(y),parseInt(m)-1,1).toLocaleDateString('fr-FR',{month:'long',year:'numeric'}).replace(/^./,c=>c.toUpperCase());}
const MOIS_FR={janvier:1,février:2,fevrier:2,mars:3,avril:4,mai:5,juin:6,juillet:7,août:8,aout:8,septembre:9,octobre:10,novembre:11,décembre:12,decembre:12};

const JOURS=['Lundi','Mardi','Mercredi','Jeudi','Vendredi','Samedi','Dimanche'];
const CONTRAINTE_PRESETS=['pas_apres','pas_avant','pas_de_coupure','max_soirs_semaine','jours_off_consecutifs','indispo_jour','autre'];
// Saisie GUIDÉE des contraintes (fini les clés techniques + « valeur (ex 19:00, true, 1) »).
// blocking=true → dure (appliquée par le planning via checkPlacement) ; false → indicative (souple).
const CONTRAINTE_META={
  pas_apres:            {label:'Ne peut pas finir après',                   input:'time',   blocking:true},
  pas_avant:            {label:'Ne peut pas commencer avant',               input:'time',   blocking:true},
  pas_de_coupure:       {label:'Pas de coupure (midi + soir le même jour)', input:'bool',   blocking:true},
  max_soirs_semaine:    {label:'Maximum de soirs par semaine',              input:'number', blocking:true},
  jours_off_consecutifs:{label:'Jours de repos consécutifs souhaités',      input:'number', blocking:false},
  indispo_jour:         {label:'Jour non travaillé',                        input:'day',    blocking:true},
  autre:                {label:'Note libre',                                input:'text',   blocking:false},
};
// Jour 0=Lundi…6=Dimanche depuis un libellé FR OU un nombre (rétro-compat : indispo_jour numérique déjà saisi).
const _CONTR_JOURS={lundi:0,mardi:1,mercredi:2,jeudi:3,vendredi:4,samedi:5,dimanche:6};
function contrDayIdx(v){ if(v==null)return null; const s=String(v).trim().toLowerCase(); if(_CONTR_JOURS[s]!=null)return _CONTR_JOURS[s]; const n=parseInt(s,10); return (isFinite(n)&&n>=0&&n<=6)?n:null; }
// Phrase lisible d'une contrainte enregistrée.
function contrPhrase(c){
  const v=c.valeur;
  switch(c.cle){
    case 'pas_apres': return `Ne peut pas finir après ${(v||'').slice(0,5)}`;
    case 'pas_avant': return `Ne peut pas commencer avant ${(v||'').slice(0,5)}`;
    case 'pas_de_coupure': return 'Pas de coupure (midi + soir le même jour)';
    case 'max_soirs_semaine': return `Maximum ${v} soir(s) par semaine`;
    case 'jours_off_consecutifs': return `${v} jour(s) de repos consécutifs souhaités`;
    case 'indispo_jour': { const ji=contrDayIdx(v); return `Jour non travaillé : ${ji!=null?JOURS[ji]:v}`; }

// ════════ COULEURS SALARIÉS — génération, contraste, attribution ════════════════════════════════════
// Objectif : chaque salarié d'une org a une couleur DISTINCTE et LISIBLE (grille, PDF, vue mobile).
// Ces fonctions sont PURES (testées dans tests/palette_test.js) ; la version « lecture seule » (relLum,
// textColorFor) est dupliquée à l'identique dans planning/index.html pour le PDF/mobile.
const COLOR_DEFAULTS=['#888888','#000000','#ffffff','#666666','#444444']; // couleurs « non choisies » remplaçables
function _hexToRgb(hex){const m=String(hex||'').match(/^#?([0-9a-f]{6})$/i);if(!m)return null;const n=parseInt(m[1],16);return[(n>>16)&255,(n>>8)&255,n&255];}
function _relLum(hex){const rgb=_hexToRgb(hex);if(!rgb)return 1;const f=c=>{c/=255;return c<=0.03928?c/12.92:Math.pow((c+0.055)/1.055,2.4);};return 0.2126*f(rgb[0])+0.7152*f(rgb[1])+0.0722*f(rgb[2]);}
function _contrastRatio(L1,L2){const a=Math.max(L1,L2),b=Math.min(L1,L2);return (a+0.05)/(b+0.05);}
// Meilleur texte (noir ou blanc) posé SUR cette couleur, celui qui maximise le contraste.
function textColorFor(hex){const L=_relLum(hex);return _contrastRatio(L,0)>=_contrastRatio(L,1)?'#111111':'#ffffff';}
// Lisible = le meilleur texte atteint AA 4.5:1 ET la couleur se distingue du papier blanc (pas quasi-blanche).
function isReadableColor(hex){const rgb=_hexToRgb(hex);if(!rgb)return false;const L=_relLum(hex);
  const bestText=Math.max(_contrastRatio(L,0),_contrastRatio(L,1)), vsPaper=_contrastRatio(L,1);
  return bestText>=4.5 && vsPaper>=1.30;}
function _hslToHex(h,s,l){h=((h%360)+360)%360/360;const a=s*Math.min(l,1-l);
  const f=n=>{const k=(n+h*12)%12;const c=l-a*Math.max(-1,Math.min(k-3,9-k,1));return Math.round(255*c).toString(16).padStart(2,'0');};
  return '#'+f(0)+f(8)+f(4);}
// Couleur i de la palette : teinte à l'angle d'or (≈137.5°, teintes bien réparties, jamais deux voisines
// proches avant longtemps), saturation/luminosité contrôlées → texte lisible + distinct du papier. On saute
// la zone jaune pur (≈50–68°) qui tourne au terne/illisible. tier>0 = palier plus foncé si la palette est épuisée.
function paletteColor(i,tier){
  let h=(i*137.508)%360; if(h>=50&&h<68) h=(h+26)%360;
  const s=0.52, l=(tier?[0.68,0.55,0.78][Math.min(tier,2)]:0.68);
  return _hslToHex(h,s,l);
}
// Attribue des couleurs UNIQUES en marchant la palette et en SAUTANT celles déjà prises (stateless : survit
// aux suppressions, préserve les couleurs manuelles). Épuisement → palier de luminosité suivant.
function assignUniqueColor(takenSet){
  for(let tier=0;tier<3;tier++){ for(let i=0;i<400;i++){ const c=paletteColor(i,tier).toLowerCase();
    if(!takenSet.has(c) && isReadableColor(c)) return c; } }
  return paletteColor(Math.floor(Math.random()*400),0); // filet ultime (ne devrait jamais arriver < ~1000 salariés)
}
// Une couleur doit-elle être (ré)attribuée ? NULL, couleur par défaut, ou illisible → oui. Une couleur unique
// ET lisible est un choix DÉLIBÉRÉ → on n'y touche jamais sans confirmation (le rattrapage exclut ces cas).
function colorNeedsAssign(hex){ if(!hex) return true; const h=String(hex).toLowerCase();
  return COLOR_DEFAULTS.includes(h) || !isReadableColor(h); }
// Plan de rattrapage pour une liste de salariés {id,couleur} : rend [{id, from, to}] SANS écrire.
// Réattribue les NULL/défaut/illisibles ET les DOUBLONS (on garde la 1re occurrence d'une couleur lisible,
// les suivantes sont réattribuées). N'écrase jamais une couleur unique+lisible.
function planColorBackfill(sals){
  const taken=new Set(); const plan=[];
  // 1re passe : geler les couleurs déjà lisibles ET uniques (choix délibérés) comme « prises ».
  const seen=new Set();
  for(const s of sals){ const h=(s.couleur||'').toLowerCase();
    if(h && isReadableColor(h) && !COLOR_DEFAULTS.includes(h) && !seen.has(h)){ taken.add(h); seen.add(h); s._keep=true; } }
  // 2e passe : tout le reste (NULL/défaut/illisible/doublon) reçoit une couleur unique.
  for(const s of sals){ if(s._keep){ delete s._keep; continue; }
    const to=assignUniqueColor(taken); taken.add(to); plan.push({id:s.id, from:s.couleur||null, to}); }
  return plan;
}

const assignedToSnack=(s,rid)=>{ const a=Array.isArray(s&&s.snacks_priorites)?s.snacks_priorites:null; if(a&&a.length) return a.some(x=>x.restaurant_id===rid); return (s&&s.snack_origine_id)===rid; };
function initSnackPri(s){
  snackPri={};
  const a=Array.isArray(s&&s.snacks_priorites)?s.snacks_priorites:[];
  if(a.length) a.forEach(x=>{ if(x&&x.restaurant_id) snackPri[x.restaurant_id]=x.priorite; });
  else if(s&&s.snack_origine_id) snackPri[s.snack_origine_id]=1;
}
function snackGridHTML(){
  if(!S.restos.length) return '<div style="color:var(--muted);font-size:12.5px">Aucun restaurant. Crée tes restaurants dans Paramètres.</div>';
  return '<div style="display:flex;flex-wrap:wrap;gap:8px">'+S.restos.map(r=>{
    const p=snackPri[r.id], on=p!=null;
    const badge=on
      ? `<span style="display:inline-flex;align-items:center;justify-content:center;width:21px;height:21px;border-radius:50%;font-size:11px;font-weight:800;background:${p===1?'var(--gold)':'var(--line-2)'};color:${p===1?'#1a1a1a':'var(--text)'}">${p}</span>`
      : `<span style="display:inline-flex;align-items:center;justify-content:center;width:21px;height:21px;border-radius:50%;font-size:13px;border:1.5px dashed var(--line-2);color:var(--muted)">+</span>`;
    return `<button type="button" onclick="toggleSnackPri('${r.id}')" title="${escH(r.nom)}" style="display:flex;align-items:center;gap:8px;padding:8px 12px;border-radius:9px;border:1.5px solid ${on?'var(--gold)':'var(--line-2)'};background:${on?'rgba(200,160,53,.12)':'var(--surface)'};color:var(--text);cursor:pointer;font-size:13px;font-weight:600">${badge}${escH(r.nom)}${p===1?' <span style="font-size:9px;color:var(--gold);font-weight:800;letter-spacing:.04em">PRINCIPAL</span>':''}</button>`;
  }).join('')+'</div>';
}
function toggleSnackPri(rid){
  if(snackPri[rid]!=null){
    const removed=snackPri[rid]; delete snackPri[rid];
    Object.keys(snackPri).forEach(k=>{ if(snackPri[k]>removed) snackPri[k]--; });   // renumérote
  } else {
    const max=Object.values(snackPri).reduce((a,b)=>Math.max(a,b),0);
    snackPri[rid]=max+1;
  }
  const g=document.getElementById('snackGrid'); if(g) g.innerHTML=snackGridHTML();
}
function snackPriArray(){ return Object.keys(snackPri).map(rid=>({restaurant_id:rid,priorite:snackPri[rid]})).sort((a,b)=>a.priorite-b.priorite); }

// ===== EXPORT DES POINTAGES (v0.23) =====
// Trois défauts corrigés ensemble, parce qu'ils produisaient le même résultat : un fichier qui a l'air
// complet et ne l'est pas.
//  1. Le serveur plafonne CHAQUE réponse à 1 000 lignes (max_rows Supabase, constaté dans les journaux de
//     l'API) — sans erreur. 30 jours = ~1 750 pointages : l'export en livrait 1 000. → lecture PAGINÉE
//     jusqu'au bout (fetchAllRows, utils.js) + contrôle « attendus = exportés, sans doublon ».
//  2. Les bornes « date+'T00:00:00' » sont lues en UTC par le serveur : 1 à 2 h perdues au début, autant
//     ajoutées après la fin. → bornes en JOURNÉES D'EXPLOITATION (même définition que le stock et le
//     planning : une journée va de l'heure de bascule de l'organisation, 05:00 par défaut, à la même heure
//     le lendemain, heure de Paris). Une sortie à 01:30 appartient à la journée de la veille.
//  3. Les colonnes Date/Heure suivaient le fuseau de l'appareil. → toujours l'heure de Paris.
// Un export incomplet n'est JAMAIS livré en silence : il est bloqué, et ne peut être téléchargé que sur
// demande explicite, marqué INCOMPLET dans son nom ET sa première ligne.
function _cutoff(){ return (ORG&&ORG.journee_exploitation_debut)||null; }
function _ddmmyyyy(ymd){ const p=String(ymd).split('-'); return `${p[2]}/${p[1]}/${p[0]}`; }
function _cutLbl(){ const m=cutoffToMinutes(_cutoff()); return `${String(Math.floor(m/60)).padStart(2,'0')}:${String(m%60).padStart(2,'0')}`; }
// Journée d'exploitation d'un pointage — clé UNIQUE de regroupement par jour (export ET onglet Badgeuse).
function ptsJour(p){ return exploitationDay(p.ts, _cutoff()); }

function _exStatus(html){ const e=document.getElementById('exStatus'); if(e) e.innerHTML=html; }

// Lecture complète des pointages d'une période — SOURCE UNIQUE des deux exports.
// sel = {from,to} (journées d'exploitation, incluses) ou null (tout) ; filtre = (q)=>q (restaurants, salarié).
// La fin est FIGÉE au lancement quand la période inclut l'instant présent : les tablettes pointent en
// continu, et une ligne arrivée pendant la lecture fausserait le contrôle du compte.
async function readPointages(sel, filtre, onProgress){
  let start=null, end=null, fige=null;
  if(sel){ const b=exploitationBounds(sel.from, sel.to, _cutoff()); start=b.start; end=b.end;
           if(Date.now()<b.endMs){ fige=new Date(Date.now()).toISOString(); end=fige; } }
  const mk=(cols,o)=>{ let q=EatimeScope.from('pointages').select(cols,o);
    if(start) q=q.gte('ts',start); if(end) q=q.lt('ts',end);
    return filtre(q).order('ts').order('id'); };
  const r=await fetchAllRows(mk,{onProgress});
  return Object.assign(r,{sel, fige});
}
// Récapitulatif — affiché à l'écran ET écrit en tête du fichier (fonction PURE, testée).
function exportResume(meta){
  const per=meta.sel?`Journées du ${_ddmmyyyy(meta.sel.from)} au ${_ddmmyyyy(meta.sel.to)} (de ${meta.cutLbl} à ${meta.cutLbl} le lendemain, heure de Paris)`:'Toute la période enregistrée';
  const fige=meta.fige?` — arrêté au ${new Date(meta.fige).toLocaleString('fr-FR',{timeZone:'Europe/Paris',day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'})} (heure de l'export)`:'';
  const ctl=meta.complet?`${meta.recu} pointage(s) — contrôle : ${meta.attendu} attendu(s), ${meta.recu} exporté(s), complet`
                        :`EXPORT INCOMPLET — ${meta.attendu==null?'?':meta.attendu} pointage(s) attendu(s), ${meta.recu} reçu(s)${meta.doublons?`, ${meta.doublons} doublon(s) écarté(s)`:''}`;
  return {periode:per+fige, controle:ctl, perimetre:meta.perimetre||''};
}
const _csvQ=v=>'"'+String(v==null?'':v).replace(/"/g,'""')+'"';
// Construit le CSV (fonction PURE, testée). Lignes de tête = récapitulatif, chacune en UN champ entre
// guillemets (ses virgules ne créent pas de colonnes). Puis une ligne vide, puis l'en-tête habituel.
// Colonnes inchangées + « Journee » en DERNIER : les colonnes existantes gardent leur position.
function buildPointagesCSV(rows, meta){
  const R=exportResume(meta);
  const tete=[(meta.complet?'':'INCOMPLET — ')+'Export des pointages'+(R.perimetre?' — '+R.perimetre:''), R.periode, R.controle].map(_csvQ).join('\n')+'\n\n';
  const head='Date,Heure,Salarie,Snack,Type,Heures_jour,Journee\n';
  const byDS={}; rows.forEach(p=>{ const k=ptsJour(p)+'|'+p.salarie_id; (byDS[k]=byDS[k]||[]).push(p); });
  const hForDS={}; Object.entries(byDS).forEach(([k,arr])=>{ hForDS[k]=hoursOfDay(arr); });
  const vu=new Set();
  const csv=rows.map(p=>{
    const s=S.salaries.find(x=>x.id===p.salarie_id)||{}, r=S.restos.find(x=>x.id===p.restaurant_id)||{};
    const d=new Date(p.ts), j=ptsJour(p), k=j+'|'+p.salarie_id;
    const showH=!vu.has(k); vu.add(k);
    const h=showH&&hForDS[k]!=null?fmtH(hForDS[k]):'';
    return [d.toLocaleDateString('fr-FR',{timeZone:'Europe/Paris'}), d.toLocaleTimeString('fr-FR',{timeZone:'Europe/Paris'}),
            _csvQ(fullName(s)||s.nom||'?'), _csvQ(r.nom||''), TYPL_PT[p.type]||p.type, h, _ddmmyyyy(j)].join(',');
  }).join('\n');
  return '﻿'+tete+head+csv;
}
function downloadPointagesCSV(rows, filename, meta){
  const blob=new Blob([buildPointagesCSV(rows,meta)],{type:'text/csv;charset=utf-8'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`${filename}${meta.complet?'':'_INCOMPLET'}.csv`;a.click();
}
// Après lecture : livrer si complet, sinon BLOQUER et expliquer (dans la fenêtre d'export, ou dans une
// fenêtre dédiée pour l'export de la fiche salarié).
function finishExport(res, filename, perimetre){
  const meta={sel:res.sel, fige:res.fige, attendu:res.attendu, recu:res.recu, doublons:res.doublons, complet:res.complet, cutLbl:_cutLbl(), perimetre};
  if(!document.getElementById('exStatus')){
    document.getElementById('modalHost').innerHTML=`<div class="modal-bg" onclick="if(event.target===this)closeExportModal()"><div class="modal"><h2>Export des pointages</h2><div id="exStatus" style="font-size:12.5px"></div><div class="modal-actions"><button class="btn ghost" onclick="closeExportModal()">Fermer</button></div></div></div>`;
  }
  const R=exportResume(meta);
  if(res.error){ _exStatus(`<div class="orange-box">⚠ Lecture impossible : ${escH(res.error.message||String(res.error))}. <b>Aucun fichier n'a été produit.</b></div>`); return meta; }
  if(!res.complet){
    _exportPending={rows:res.rows, filename, meta};
    _exStatus(`<div class="orange-box" style="line-height:1.55">⚠ <b>Export incomplet — fichier NON produit.</b><br>${escH(R.controle)}.<br>${escH(R.periode)}.<br>Cause probable : des pointages ont été modifiés pendant la lecture. Relancez l'export ; si l'écart persiste, signalez-le.
      <div style="margin-top:10px;display:flex;gap:8px;flex-wrap:wrap"><button class="btn sm" onclick="_exportPending=null;doExportAgain()">↻ Réessayer</button><button class="btn ghost sm" onclick="forceIncompleteExport()">Télécharger quand même (marqué INCOMPLET)</button></div></div>`);
    return meta;
  }
  downloadPointagesCSV(res.rows, filename, meta);
  _exStatus(`<div style="background:rgba(63,184,127,.1);border:1px solid var(--ok);border-radius:8px;padding:10px 12px;line-height:1.55;color:var(--text)">✅ <b>${res.recu} pointage(s) exporté(s)</b><br>${escH(R.periode)}<br><span style="color:var(--muted)">${escH(R.controle)}</span></div>`);
  const go=document.getElementById('exGo'); if(go) go.textContent='Exporter à nouveau';
  toast(`Exporté : ${res.recu} pointages (contrôle OK)`);
  return meta;
}
function forceIncompleteExport(){ const p=_exportPending; if(!p) return; _exportPending=null; downloadPointagesCSV(p.rows,p.filename,p.meta);
  _exStatus(`<div class="orange-box">Fichier téléchargé, marqué <b>INCOMPLET</b> dans son nom et sa première ligne.</div>`); }
let _exportAgain=null; function doExportAgain(){ if(_exportAgain) _exportAgain(); }
async function doExport(){
  const from=document.getElementById('ex_from').value;
  const to=document.getElementById('ex_to').value;
  if(!from||!to){toast('Choisis une période');return;}
  if(to<from){toast('La date de fin est avant la date de début');return;}
  const restos=[...document.querySelectorAll('.ex_resto:checked')].map(c=>c.value);
  if(!restos.length){toast('Coche au moins un snack');return;}
  _exportAgain=doExport;
  const go=document.getElementById('exGo'); if(go) go.disabled=true;
  _exStatus('Lecture des pointages…');
  const res=await readPointages({from,to}, q=>q.in('restaurant_id',restos), (n,a)=>_exStatus(`Lecture des pointages… ${n}${a!=null?' / '+a:''}`));
  if(go) go.disabled=false;
  const noms=S.restos.filter(r=>restos.includes(r.id)).map(r=>r.nom.replace('Raya ','')).join(', ');
  return finishExport(res, `pointages_${from}_${to}`, noms);
}

function hoursOfDay(arr){
  const ev=arr.slice().sort((a,b)=>a.ts.localeCompare(b.ts)).map(p=>({t:p.type,d:new Date(p.ts)}));
  const first=ev.find(x=>x.t==='arrivee');
  const last=[...ev].reverse().find(x=>x.t==='sortie');
  if(!first||!last)return null;
  let pause=0;
  for(let i=0;i<ev.length-1;i++)if(ev[i].t==='pause_debut'&&ev[i+1].t==='pause_fin')pause+=(ev[i+1].d-ev[i].d);
  return Math.max(0,(last.d-first.d-pause)/3600000);
}
const initials=s=>((s.prenom||'').charAt(0)+(s.nom||'').charAt(0)).toUpperCase()||(s.nom||'?').charAt(0).toUpperCase();
const fullName=s=>[s.prenom,s.nom].filter(Boolean).join(' ');

// ===== RENDER LIST =====
function render(){
  const q=(document.getElementById('search').value||'').toLowerCase();
  const fSn=document.getElementById('fSnack').value, fRo=document.getElementById('fRole').value, fAc=document.getElementById('fActif').value;
  let list=S.salaries.filter(s=>{
    const fn=fullName(s).toLowerCase();
    if(q && !fn.includes(q)&&!(s.nom||'').toLowerCase().includes(q)) return false;
    if(fSn==='MULTI'){if(!s.est_multi)return false;} else if(fSn){if(!assignedToSnack(s,fSn))return false;}
    if(fRo && !rolesOf(s.id).includes(fRo)) return false;
    if(fAc==='1' && !s.actif) return false;
    if(fAc==='0' && s.actif) return false;
    return true;
  });
  document.getElementById('count').textContent=list.length+' salarié'+(list.length>1?'s':'');
  document.getElementById('tbody').innerHTML=list.map(s=>{
    const rls=rolesFullOf(s.id).map(r=>`<span class="chip" style="background:${roleColor(r.role)}22;color:${roleColor(r.role)}">${r.niveau==='nouveau'?'🔰':'★'} ${escH(roleName(r.role))}</span>`).join(' ')||'<span class="chip off">—</span>';
    const docTypes=docsOf(s.id).map(d=>d.type);
    const reqOK=DOC_REQUIRED.filter(rd=>docTypes.map(t=>(t||'').toLowerCase().trim()).includes(rd.key)).length;
    const reqTot=DOC_REQUIRED.length;
    const docCls=reqOK===reqTot?'ok':(reqOK===0?'bad':'warn');
    const contrat=(s.type_contrat||'<span style="color:var(--muted)">—</span>')+
      ((s.heures_min||s.heures_max)?` <span style="color:var(--muted)">· ${s.heures_min??'?'}–${s.heures_max??'?'}h</span>`:'');
    const sub=[];
    if(s.email) sub.push(s.email);
    if(s.telephone) sub.push(s.telephone);
    return `<tr class="row" onclick="openFiche('${s.id}')">
      <td><div class="namecell"><div class="avatar" style="background:${s.couleur||'#444'};color:${textColorFor(s.couleur||'#444')}">${initials(s)}</div>
        <div><div class="fullname">${fullName(s)||s.nom}${s.est_mineur?' <span class="chip off">mineur</span>':''}${!s.actif?' <span class="chip off">inactif</span>':''}</div>
        ${sub.length?'<div class="subline">'+sub.join(' · ')+'</div>':''}</div></div></td>
      <td>${s.est_multi?'<span class="chip multi">MULTI</span>':snackName(s.snack_origine_id)}</td>
      <td>${rls}</td>
      <td>${contrat}</td>
      <td><span class="chip ${docCls}">${reqOK}/${reqTot} obligatoires</span></td>
    </tr>`;
  }).join('')||'<tr><td colspan="5" style="padding:36px;text-align:center;color:var(--muted)">Aucun salarié</td></tr>';
}

async function openFiche(id){
  // Changer de salarié avec un calendrier d'alternance non enregistré → on demande d'abord.
  if(!(id && currentFiche && currentFiche.id===id) && !await altLeaveGuard('ouvrir une autre fiche')) return;
  if(id){ currentFiche={...S.salaries.find(x=>x.id===id)}; }
  else {
    // Nouveau salarié : couleur UNIQUE attribuée d'emblée (plus jamais de NULL ni de gris #888888 partagé).
    const taken=new Set(S.salaries.map(s=>(s.couleur||'').toLowerCase()).filter(Boolean));
    currentFiche={actif:true,plafond_heures:48,couleur:assignUniqueColor(taken)};
  }
  initSnackPri(currentFiche);
  currentTab='infos';
  document.getElementById('listView').classList.add('hidden');
  const v=document.getElementById('ficheView');
  v.classList.remove('hidden');
  renderFiche();
}

function openColorBackfill(){
  const sals=S.salaries.filter(s=>s.actif!==false);
  const plan=planColorBackfill(sals.map(s=>({id:s.id,couleur:s.couleur})));
  const nameOf=id=>{const s=S.salaries.find(x=>x.id===id);return [s?.prenom,s?.nom].filter(Boolean).join(' ')||s?.nom||'?';};
  if(!plan.length){

    return;
  }
  const rows=plan.map(p=>`<div style="display:flex;align-items:center;gap:10px;padding:5px 0;font-size:12.5px">
      <span style="flex:1">${escH(nameOf(p.id))}</span>

    </div>`).join('');

    <h2>🎨 Attribuer les couleurs manquantes</h2>

    <div style="background:var(--surface);border:1px solid var(--line-2);border-radius:8px;padding:8px 12px;max-height:46vh;overflow:auto">${rows}</div>
    <div class="actions"><button class="btn ghost" onclick="closeModal()">Annuler</button><button class="btn" onclick="applyColorBackfill()">Appliquer (${plan.length})</button></div></div></div>`;
}
async function applyColorBackfill(){
  const plan=window._colorPlan||[]; if(!plan.length){closeModal();return;}
  closeModal(); toast('Attribution des couleurs…');
  let done=0;
  for(const p of plan){
    const{error}=await EatimeScope.from('salaries').update({couleur:p.to}).eq('id',p.id);
    if(error){toast('Erreur: '+error.message);return;}
    const s=S.salaries.find(x=>x.id===p.id); if(s)s.couleur=p.to; done++;
  }
  toast(`✓ ${done} couleur(s) attribuée(s)`); render();
}

// triggerUpload sur clic d'une carte "doc requis" → auto-upload après sélection
function triggerUpload(key){
  setTab('docs');
  setTimeout(()=>{
    const sel=document.getElementById('nf_type'); if(sel)sel.value=key;
    const f=document.getElementById('nf_file');
    if(f){
      // Auto-upload dès que l'user choisit un fichier (pas besoin de re-cliquer sur "Uploader")
      f.onchange=(e)=>{ if(e.target.files && e.target.files[0]) uploadDoc(); };
      f.click();
    }
  },50);
}

function fmtSize(n){if(!n)return'';if(n<1024)return n+' o';if(n<1048576)return(n/1024).toFixed(0)+' Ko';return(n/1048576).toFixed(1)+' Mo';}

function val(id,trim=true){const e=document.getElementById(id);if(!e)return null;const v=trim?e.value.trim():e.value;return v===''?null:v;}
function num(id){const v=val(id,false);return v==null?null:parseFloat(v);}

async function saveSalarie(){
  // Map: champ DB -> id input ; on n'ajoute au payload QUE ce qui est dans le DOM courant.
  const TXT={nom:'f_nom',prenom:'f_prenom',type_contrat:'f_contrat',notes:'f_notes',
    nationalite:'f_nat',num_secu:'f_secu',matricule:'f_matricule',email:'f_email',
    telephone:'f_tel',adresse:'f_adr',code_postal:'f_cp',ville:'f_ville',poste_intitule:'f_poste',
    pin_badgeuse:'f_pin'};
  const DATE={date_naissance:'f_naiss',date_entree:'f_entree',date_sortie:'f_sortie'};
  const NUM={plafond_heures:'f_plafond',heures_min:'f_hmin',heures_max:'f_hmax',taux_horaire_brut:'f_taux',coef_charges_perso:'f_coefperso'};
  const CHK={est_mineur:'f_mineur',actif:'f_actif',est_alternant:'f_alternant'};
  const SEL={sexe:'f_sexe'};
  const COL={couleur:'f_couleur'};
  const payload={};
  for(const[k,id]of Object.entries(TXT)){const e=document.getElementById(id);if(e)payload[k]=e.value.trim()||null;}
  for(const[k,id]of Object.entries(DATE)){const e=document.getElementById(id);if(e)payload[k]=e.value||null;}
  for(const[k,id]of Object.entries(NUM)){const e=document.getElementById(id);if(e)payload[k]=e.value!==''?parseFloat(e.value):null;}
  for(const[k,id]of Object.entries(CHK)){const e=document.getElementById(id);if(e)payload[k]=e.checked;}
  for(const[k,id]of Object.entries(SEL)){const e=document.getElementById(id);if(e)payload[k]=e.value||null;}
  for(const[k,id]of Object.entries(COL)){const e=document.getElementById(id);if(e)payload[k]=e.value;}
  // Affectation restaurants à priorité (source = grille snackPri) + synchro des champs legacy
  const _spArr=snackPriArray();
  payload.snacks_priorites=_spArr;
  payload.snack_origine_id=_spArr.length?_spArr[0].restaurant_id:null;
  payload.est_multi=_spArr.length>1;
  // organization_id manquait ici (bug) : le payload de création n'incluait jamais l'org de
  // l'admin connecté, contrairement à tous les autres inserts de ce fichier (org_roles,
  // alternance, cfa_color_mappings) — résultat : un salarié fraîchement créé avait
  // organization_id=NULL, invisible pour verify-pin/create-pointage (filtrées par org),
  // d'où "code inconnu" alors que le PIN était bien enregistré. Ne s'applique qu'à la
  // création : ne jamais réécrire l'org d'une fiche existante lors d'une simple édition.
  if(!currentFiche.id) payload.organization_id=ME.organization_id;

  // Création : besoin du nom au minimum
  if(!currentFiche.id){
    if(!payload.nom){toast('Va dans Informations et renseigne au moins le nom');setTab('infos');return;}
  }

  // GARDE-FOU INTER-ORGANISATION. La fiche ouverte peut appartenir à une AUTRE organisation si un
  // super_admin a basculé entre-temps. Sans ce contrôle, l'update part avec la borne .eq() de
  // l'organisation active et n'affecte simplement AUCUNE ligne — ce qui se lit comme un succès
  // partout dans ce code. Refus VISIBLE plutôt qu'écriture au mauvais endroit.
  if(!EatimeScope.verifierAppartenance(currentFiche.id?currentFiche:null,'Ce salarié')) return;
  let sid=currentFiche.id;
  if(sid){
    if(Object.keys(payload).length===0){/* rien à update côté salaries */}
    else{const{error}=await EatimeScope.from('salaries').update(payload).eq('id',sid);if(error){toast('Erreur: '+error.message);return;}}
  } else {
    if(!payload.pin_badgeuse) payload.pin_badgeuse=generatePin();
    const{data,error}=await EatimeScope.from('salaries').insert(payload).select().single();
    if(error){toast('Erreur: '+error.message);return;}
    sid=data.id;currentFiche.id=sid;
  }

  // rôles + niveau d'expérience (assignation dynamique)
  const raChks=document.querySelectorAll('.ra-chk');
  if(raChks.length){
    await EatimeScope.from('salarie_roles').delete().eq('salarie_id',sid).is('restaurant_id',null);
    const rows=[];
    raChks.forEach(chk=>{ if(chk.checked){ const cle=chk.dataset.cle; const sel=document.querySelector('.ra-niv[data-cle="'+cle+'"]'); rows.push({salarie_id:sid,role:cle,niveau:(sel&&sel.value)||'experimente'}); } });
    if(rows.length) await EatimeScope.from('salarie_roles').insert(rows);
  }
  toast('Enregistré ✓');await loadAll();
  currentFiche=S.salaries.find(x=>x.id===sid);
  renderFiche();
}

const MOTIFS_SORTIE=['Démission','Fin de CDD','Licenciement','Rupture conventionnelle','Abandon de poste','Fin de période d\'essai','Retraite','Autre'];
function sortirSalarie(){
  if(!currentFiche.id)return;
  const today=new Date().toISOString().slice(0,10);
  const cur=currentFiche.date_sortie||today;
  const curMotif=(currentFiche.motif_sortie||'').trim();
  const knownIdx=MOTIFS_SORTIE.slice(0,-1).findIndex(m=>m.toLowerCase()===curMotif.toLowerCase());
  const isAutre=curMotif && knownIdx<0;
  const inSt='width:100%;background:var(--surface);color:var(--text);border:1px solid var(--line-2);border-radius:8px;padding:10px;font-size:14px;outline:none';
  const opts=MOTIFS_SORTIE.map((m,i)=>`<option ${((knownIdx>=0&&i===knownIdx)||(isAutre&&m==='Autre'))?'selected':''}>${m}</option>`).join('');
  document.getElementById('modalHost').innerHTML=`
  <div class="modal-bg" onclick="if(event.target===this)closeModal()">
    <div class="modal" style="max-width:440px">
      <h2>Sortir des effectifs</h2>
      <div style="color:var(--muted);font-size:12.5px;margin:-10px 0 18px;line-height:1.5">Le dossier est <b style="color:var(--text)">conservé en archive</b> (pointages, planning, sanctions, documents). Tu pourras le réintégrer à tout moment.</div>
      <label style="display:block;font-size:12px;color:var(--muted);margin-bottom:6px">Date de sortie</label>
      <input type="date" id="so_date" value="${cur}" style="${inSt};margin-bottom:16px">
      <label style="display:block;font-size:12px;color:var(--muted);margin-bottom:6px">Motif</label>
      <select id="so_motif" onchange="document.getElementById('so_autre').style.display=this.value==='Autre'?'block':'none'" style="${inSt}">${opts}</select>
      <input type="text" id="so_autre" placeholder="Préciser le motif…" value="${isAutre?escH(curMotif):''}" style="${inSt};margin-top:8px;display:${isAutre?'block':'none'}">
      <div class="modal-actions">
        <button class="btn ghost" onclick="closeModal()">Annuler</button>
        <button class="btn" onclick="doSortie()">Confirmer la sortie</button>
      </div>
    </div>
  </div>`;
  setTimeout(()=>document.getElementById('so_date')?.focus(),50);
}
async function doSortie(){
  if(!currentFiche.id)return;
  if(!EatimeScope.verifierAppartenance(currentFiche,'Ce salarié')) return;   // désactivation
  const date=val('so_date',false);
  if(!date){toast('Choisis une date de sortie');return;}
  let motif=document.getElementById('so_motif').value;
  if(motif==='Autre') motif=val('so_autre')||'Autre';
  const{error}=await EatimeScope.from('salaries').update({date_sortie:date,motif_sortie:motif||null,actif:false}).eq('id',currentFiche.id);
  if(error){toast('Erreur: '+error.message);return;}
  // Propagation planning : on retire les créneaux planifiés À PARTIR de la date de sortie (l'historique d'avant reste intact)
  await EatimeScope.from('planning_creneaux').delete().eq('salarie_id',currentFiche.id).gte('date',date);
  closeModal();
  toast('Salarié sorti des effectifs ✓');await loadAll();
  currentFiche=S.salaries.find(x=>x.id===currentFiche.id);
  renderFiche();
}

async function reintegrerSalarie(){
  if(!currentFiche.id)return;
  if(!EatimeScope.verifierAppartenance(currentFiche,'Ce salarié')) return;   // réintégration
  if(!confirm('Réintégrer ce salarié ? (la date et le motif de sortie seront effacés)'))return;
  const{error}=await EatimeScope.from('salaries').update({date_sortie:null,motif_sortie:null,actif:true}).eq('id',currentFiche.id);
  if(error){toast('Erreur: '+error.message);return;}
  toast('Réintégré ✓');await loadAll();
  currentFiche=S.salaries.find(x=>x.id===currentFiche.id);
  renderFiche();
}

  if(!currentFiche.id)return;
  const nom=[currentFiche.prenom,currentFiche.nom].filter(Boolean).join(' ').trim()||currentFiche.nom||'ce salarié';
  const inSt='width:100%;background:var(--surface);color:var(--text);border:1px solid var(--line-2);border-radius:8px;padding:10px;font-size:14px;outline:none';
  document.getElementById('modalHost').innerHTML=`

    <div class="modal" style="max-width:460px;border-color:var(--bad)">
      <h2 style="color:var(--bad)">⚠ Supprimer définitivement ce salarié ?</h2>
      <div style="font-size:13px;line-height:1.6;color:var(--text)">
        Cette action est <b style="color:var(--bad)">irréversible</b>. Tout l'historique de
        <b>${escH(nom)}</b> sera perdu&nbsp;: pointages, planning, sanctions, documents…
      </div>
      <div style="background:rgba(200,160,53,.10);border:1px solid var(--line-2);border-radius:10px;padding:12px 14px;margin:16px 0;font-size:12.5px;line-height:1.5;color:var(--muted)">
        💡 <b style="color:var(--text)">Mieux&nbsp;:</b> sors plutôt le salarié des effectifs (date de sortie). Son dossier reste consultable en archive et reste réintégrable.
        <div style="margin-top:10px"><button class="btn ghost sm" onclick="closeModal();sortirSalarie()">Sortir des effectifs</button></div>
      </div>

const ALT_TMAP=Object.fromEntries(ALT_TYPES.map(t=>[t.k,t]));
// ALT.jours = aperçu EN MÉMOIRE (rien en base avant « Enregistrer »). ALT.period = plage de mois affichée.

let ALT={jours:{},cal:null,annee:null,period:null,brush:'ecole',painting:false,dirty:false,salId:null,base:{},cfaNom:'',lastSave:null};
function schoolYears(){ const n=new Date(); let y=n.getFullYear(); if(n.getMonth()<7)y--; const a=[]; for(let d=-1;d<=2;d++){const yy=y+d;a.push(`${yy}-${yy+1}`);} return a; }
function altPeriod(annee){ const y=parseInt(annee.split('-')[0]); return {debut:`${y}-09-01`,fin:`${y+1}-08-31`}; }

function markAltDirty(){
  // Point de passage UNIQUE de toute modification de l'aperçu (pinceau, import, emploi du temps, « tout
  // vider », nom du CFA) : c'est ici qu'on rattache l'aperçu au salarié affiché. Sans ce rattachement, un
  // import fait après « Abandonner » n'était plus protégé — ni garde, ni avertissement du navigateur — et

  if(ALT.dirty && !ALT.salId && currentFiche && currentFiche.id) ALT.salId=currentFiche.id;

  b.style.display=ALT.dirty?'inline-flex':'none';

}
function onAltCfaInput(v){ ALT.cfaNom=v; ALT.dirty=true; markAltDirty(); }
// Nombre de jours qui diffèrent entre deux états {date:{type}} (fonction PURE, testée).
function altDiffCount(a, b){ a=a||{}; b=b||{}; let n=0; const ks=new Set([...Object.keys(a),...Object.keys(b)]);
  ks.forEach(k=>{ const ta=a[k]&&a[k].type, tb=b[k]&&b[k].type; if(ta!==tb) n++; }); return n; }
async function loadAltCal(salId){
  const annee=ALT.annee;
  const {data:cal}=await EatimeScope.from('alternance_calendrier').select('*').eq('salarie_id',salId).eq('annee_scolaire',annee).maybeSingle();
  ALT.cal=cal||null; ALT.cfaNom=cal?.cfa_nom||''; const cfa=document.getElementById('alt_cfa'); if(cfa)cfa.value=ALT.cfaNom;
  ALT.period=(cal&&cal.date_debut&&cal.date_fin)?{debut:cal.date_debut,fin:cal.date_fin}:altPeriod(annee);
  const {data:jours}=await EatimeScope.from('alternance_jours').select('*').eq('salarie_id',salId).gte('date',ALT.period.debut).lte('date',ALT.period.fin);
  ALT.jours={}; (jours||[]).forEach(j=>ALT.jours[j.date]={id:j.id,type:j.type,source:j.source});
  ALT.salId=salId; ALT.base=altSnapshot(ALT.jours); ALT.lastSave=null;
  ALT.dirty=false; markAltDirty(); renderAltCalendar(); renderAltSaveStatus();
  // ⚠ PLUS de pré-remplissage des week-ends en « repos » (retiré en v0.23). En restauration le week-end est
  // un jour d'ENTREPRISE, souvent le plus chargé : un samedi sans cours reste NON RENSEIGNÉ. Le repos de
  // l'alternant relève de son planning de travail et de ses indisponibilités, pas du calendrier du CFA —
  // et si un établissement ferme le week-end, ce n'est pas à ce calendrier de le décider.
}
function altSnapshot(j){ const o={}; Object.entries(j||{}).forEach(([d,v])=>{ o[d]={type:v.type, source:v.source}; }); return o; }
function altMonthsRange(){
  const p=ALT.period||altPeriod(ALT.annee);
  const s=new Date(p.debut+'T00:00:00'), e=new Date(p.fin+'T00:00:00'); const arr=[];
  let cur=new Date(s.getFullYear(),s.getMonth(),1); const end=new Date(e.getFullYear(),e.getMonth(),1);
  while(cur<=end && arr.length<18){ arr.push(new Date(cur)); cur.setMonth(cur.getMonth()+1); }

function renderAltCalendar(){

function paintAltDay(cell){   // EN MÉMOIRE uniquement — rien n'est écrit en base avant « Enregistrer le calendrier »
  const date=cell.dataset.date; if(!date)return; const wend=(new Date(date).getDay()+6)%7>=5;
  if(ALT.brush==='effacer'){ delete ALT.jours[date]; cell.className='alt-d'+(wend?' we':''); cell.style.cssText=''; cell.textContent=parseInt(date.slice(8)); }
  else { ALT.jours[date]={type:ALT.brush,source:'manuel'}; const t=ALT_TMAP[ALT.brush]; cell.className='alt-d has'+(wend?' we':''); cell.style.cssText=`background:${t.col}33;border-color:${t.col};color:${t.col}`; cell.textContent=t.ic; }
  ALT.dirty=true; markAltDirty(); renderAltSummary();
}
document.addEventListener('mousedown',e=>{ const c=e.target.closest&&e.target.closest('.alt-d:not(.empty)'); if(c){ ALT.painting=true; paintAltDay(c); e.preventDefault(); } });
document.addEventListener('mouseover',e=>{ if(!ALT.painting)return; const c=e.target.closest&&e.target.closest('.alt-d:not(.empty)'); if(c)paintAltDay(c); });
document.addEventListener('mouseup',()=>{ ALT.painting=false; });
function clearAltCal(){ if(!confirm('Vider tout le calendrier affiché ?\n\n(Rien n\'est supprimé en base tant que tu ne cliques pas « 💾 Enregistrer le calendrier ».)'))return; ALT.jours={}; ALT.dirty=true; markAltDirty(); renderAltCalendar(); }
// ===== ENREGISTREMENT DU CALENDRIER — UN SEUL BOUTON (v0.23) =====
// Il y en avait deux : « 💾 Enregistrer le CFA » (nom du CFA seulement — les jours peints n'étaient PAS
// écrits, sans un mot) et « Valider & appliquer ». Le patron cliquait sur le premier et perdait son
// travail. Désormais UN bouton enregistre tout : le CFA, les jours, les événements du Calendrier RH.
//
// Ordre d'écriture SÛR : on écrit le nouvel état (upsert par salarié+date) AVANT de retirer ce qui a été
// effacé. L'ancien code effaçait toute la période puis réinsérait : une insertion refusée laissait le
// calendrier VIDE. Puis on RELIT la base et on la compare à l'aperçu : le message « N jours enregistrés »
// est un constat, pas une intention. En cas d'échec, l'aperçu reste à l'écran (non enregistré) : on réessaie.
// Valeurs autorisées par la base pour `source` (contrainte alternance_jours_source_check) : 'ocr' et
// 'manuel'. L'import « emploi du temps » marquait 'pdf-texte' — refusé par la base, APRÈS l'effacement.
function altSourceDb(src){ return src==='manuel'||!src ? 'manuel' : 'ocr'; }
// Lignes à écrire pour la période (fonction PURE, testée).
function altRowsToSave(jours, p, sal, org){
  return Object.entries(jours||{}).filter(([d])=>d>=p.debut&&d<=p.fin).sort((a,b)=>a[0]<b[0]?-1:1)
    .map(([date,j])=>({salarie_id:sal, organization_id:org, date, type:j.type, source:altSourceDb(j.source)}));
}
// Écart entre ce qu'on voulait écrire et ce que la base contient (fonction PURE, testée).
function altEcart(rows, back){
  const want={}, got={}; rows.forEach(r=>want[r.date]=r.type); (back||[]).forEach(r=>got[r.date]=r.type);
  let manquants=0, enTrop=0, differents=0;
  Object.keys(want).forEach(d=>{ if(!(d in got)) manquants++; else if(got[d]!==want[d]) differents++; });
  Object.keys(got).forEach(d=>{ if(!(d in want)) enTrop++; });
  return {manquants, enTrop, differents, total:manquants+enTrop+differents};
}
function renderAltSaveStatus(){
  const e=document.getElementById('altSaveStatus'); if(!e) return;
  const L=ALT.lastSave; if(!L){ e.innerHTML=''; return; }
  e.innerHTML=L.ok
    ? `<span style="color:var(--ok);font-weight:600">✅ ${L.n} jour${L.n>1?'s':''} enregistré${L.n>1?'s':''}</span> à ${L.at} — ${L.bloc} jour${L.bloc>1?'s':''} d'école/examen bloquant${L.bloc>1?'s':''} au planning${L.exa?` · ${L.exa} examen${L.exa>1?'s':''} au Calendrier RH`:''}${L.warn?` <span style="color:var(--warn)">· ⚠ ${escH(L.warn)}</span>`:''}`
    : `<span style="color:var(--bad);font-weight:600">⚠ Non enregistré</span> : ${escH(L.msg)} — vos modifications sont toujours à l'écran, réessayez.`;
}
let _altSaving=false;
async function saveAltCal(){
  if(_altSaving) return false;
  const sal=ALT.salId||(currentFiche&&currentFiche.id); if(!sal) return false;
  const annee=ALT.annee, p=ALT.period||altPeriod(annee), org=ME.organization_id;
  const btn=document.getElementById('altSaveBtn');
  const fail=msg=>{ ALT.lastSave={ok:false,msg}; renderAltSaveStatus(); toast('⚠ Calendrier NON enregistré : '+msg); return false; };
  _altSaving=true; if(btn){btn.disabled=true;btn.textContent='Enregistrement…';}
  try{
    // 1. Configuration du CFA (nom, période).
    const cfg={salarie_id:sal,organization_id:org,annee_scolaire:annee,cfa_nom:ALT.cfaNom||null,date_debut:p.debut,date_fin:p.fin};
    const r1=await EatimeScope.from('alternance_calendrier').upsert(cfg,{onConflict:'salarie_id,annee_scolaire'}).select().single();
    if(r1.error) return fail('configuration du CFA ('+r1.error.message+')');
    // 2. Nouvel état d'abord.
    const rows=altRowsToSave(ALT.jours,p,sal,org);
    for(let i=0;i<rows.length;i+=200){
      const {error}=await EatimeScope.from('alternance_jours').upsert(rows.slice(i,i+200),{onConflict:'salarie_id,date'});
      if(error) return fail('écriture des jours ('+error.message+')');
    }
    // 3. Puis retrait des jours effacés dans l'aperçu (présents en base, absents de l'aperçu).
    const {data:exist,error:e3}=await EatimeScope.from('alternance_jours').select('id,date').eq('salarie_id',sal).gte('date',p.debut).lte('date',p.fin);
    if(e3) return fail('lecture avant nettoyage ('+e3.message+')');
    const keep=new Set(rows.map(r=>r.date)), del=(exist||[]).filter(x=>!keep.has(x.date)).map(x=>x.id);
    for(let i=0;i<del.length;i+=150){
      const {error}=await EatimeScope.from('alternance_jours').delete().in('id',del.slice(i,i+150));
      if(error) return fail('retrait des jours effacés ('+error.message+')');
    }
    // 4. Relecture : la base doit contenir EXACTEMENT l'aperçu.
    const {data:back,error:e4}=await EatimeScope.from('alternance_jours').select('date,type').eq('salarie_id',sal).gte('date',p.debut).lte('date',p.fin);
    if(e4) return fail('relecture de contrôle ('+e4.message+')');
    const ec=altEcart(rows,back);
    if(ec.total) return fail(`la base ne correspond pas à l'aperçu (${ec.manquants} manquant(s), ${ec.enTrop} en trop, ${ec.differents} différent(s))`);
    // 5. Secondaire : statut + événements du Calendrier RH. Un échec ici ne remet pas en cause les jours
    //    (déjà vérifiés), mais il est DIT.
    let warn='';
    const r5=await EatimeScope.from('alternance_calendrier').update({statut:'valide',validated_at:new Date().toISOString()}).eq('salarie_id',sal).eq('annee_scolaire',annee);
    if(r5&&r5.error) warn='statut non mis à jour';
    const fic=(S.salaries||[]).find(x=>x.id===sal)||currentFiche||{};

// ===== DÉTECTION DÉTERMINISTE DU PLANNING CFA (refonte) =====
// On ne demande PLUS à un LLM de deviner les couleurs. On lit la couleur de chaque case-jour de façon
// déterministe (Excel = remplissage de cellule ; PDF/image = médiane de pixels), on regroupe en CLUSTERS
// (espace Lab), et l'humain associe chaque cluster à une catégorie (flux validation-first). La vision
// pixtral reste en SECOURS derrière un flag (défaut OFF).
const CFA_USE_VISION_FALLBACK = false;
const CFA_CONF_SEUIL = 0.6;        // sous ce score → case « à vérifier »
const CFA_DELTAE = 16;             // seuil de regroupement des couleurs (ΔE Lab)
// Mode debug détection image : ajouter ?cfadebug=1 à l'URL → log détaillé (colonnes/lignes, RGB G/D par jour,
// couleur retenue, totaux/clusters) en console + window._cfaDebug. Aide à caler le pipeline navigateur réel.
const CFA_DEBUG = /[?&]cfadebug=1/.test(location.search);
const cfaChroma = rgb => Math.max(rgb[0],rgb[1],rgb[2]) - Math.min(rgb[0],rgb[1],rgb[2]);
// Une sous-case porte une vraie couleur (vs vide blanc / fond hachuré gris clair) si elle n'est pas quasi-blanche
// ET possède une chroma franche (écart canal max-min). Seuil 22 : laisse passer violet/cyan/vert/rouge, rejette gris/blanc.
function cfaColored(rgb){ if(rgb[0]>230&&rgb[1]>230&&rgb[2]>230) return false; return cfaChroma(rgb)>=22; }
function cfaRgb2lab(r,g,b){
  const lin=c=>{c/=255;return c>0.04045?Math.pow((c+0.055)/1.055,2.4):c/12.92;};
  r=lin(r);g=lin(g);b=lin(b);
  let X=(r*0.4124+g*0.3576+b*0.1805)/0.95047, Y=r*0.2126+g*0.7152+b*0.0722, Z=(r*0.0193+g*0.1192+b*0.9505)/1.08883;
  const f=t=>t>0.008856?Math.cbrt(t):7.787*t+16/116;
  const fx=f(X),fy=f(Y),fz=f(Z); return [116*fy-16,500*(fx-fy),200*(fy-fz)];
}
const cfaDE=(a,b)=>Math.hypot(a[0]-b[0],a[1]-b[1],a[2]-b[2]);
const cfaIsWhite=(r,g,b)=>r>238&&g>238&&b>238;
function cfaMedianPatch(img,cx,cy,rad){
  const {data,width,height}=img; const rs=[],gs=[],bs=[];
  for(let dy=-rad;dy<=rad;dy++)for(let dx=-rad;dx<=rad;dx++){
    const x=cx+dx,y=cy+dy; if(x<0||y<0||x>=width||y>=height)continue;
    const i=(y*width+x)*4; rs.push(data[i]);gs.push(data[i+1]);bs.push(data[i+2]);
  }
  if(!rs.length)return [255,255,255];
  const med=a=>{a.sort((p,q)=>p-q);return a[a.length>>1];};
  return [med(rs),med(gs),med(bs)];
}
function cfaCluster(samples){
  const clusters=[];
  for(const s of samples){
    if(cfaIsWhite(...s.rgb)){ s.cluster='blanc'; s.conf=1; continue; }
    const lab=cfaRgb2lab(...s.rgb); let best=null,bd=1e9;
    for(const c of clusters){const d=cfaDE(lab,c.lab); if(d<bd){bd=d;best=c;}}
    if(best && bd<CFA_DELTAE){ best.n++; best.acc=best.acc.map((v,i)=>v+lab[i]); best.lab=best.acc.map(v=>v/best.n); s.cluster=best.id; s.conf=Math.max(0,Math.min(1,1-bd/CFA_DELTAE)); }
    else { const id='c'+(clusters.length+1); clusters.push({id,lab,acc:[...lab],n:1,rgb:s.rgb.slice()}); s.cluster=id; s.conf=1; }
  }
  return clusters;
}
const cfaIsWE=date=>((new Date(date+'T00:00:00').getDay()+6)%7)>=5;
async function cfaPdfToImageData(file){
  const buf=await file.arrayBuffer(); const pdf=await pdfjsLib.getDocument({data:buf}).promise; const page=await pdf.getPage(1);
  const vp=page.getViewport({scale:3}); const cv=document.createElement('canvas'); cv.width=vp.width; cv.height=vp.height;
  const ctx=cv.getContext('2d',{willReadFrequently:true}); ctx.fillStyle='#fff'; ctx.fillRect(0,0,cv.width,cv.height);
  await page.render({canvasContext:ctx,viewport:vp,background:'#ffffff'}).promise;
  return {img:ctx.getImageData(0,0,cv.width,cv.height),canvas:cv};
}
async function cfaImgToImageData(file){
  const url=URL.createObjectURL(file);

    const im=await new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=rej;i.src=url;});
    const cv=document.createElement('canvas'); cv.width=im.naturalWidth; cv.height=im.naturalHeight;
    const ctx=cv.getContext('2d',{willReadFrequently:true}); ctx.fillStyle='#fff'; ctx.fillRect(0,0,cv.width,cv.height); ctx.drawImage(im,0,0);

// Reconnaissance TOLÉRANTE des en-têtes de mois : noms pleins OU abrégés, sans accents (NFD), casse libre,
// séparateur -/espace/. , année sur 2 ou 4 chiffres (ex. « janvier-26 », « déc-25 », « Août 2026 »).
function cfaNorm(s){ return (s||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,''); }
const CFA_MONTH_VAR=[['janvier','janv','jan'],['fevrier','fevr','fev'],['mars','mar'],['avril','avr'],['mai'],['juin'],['juillet','juil'],['aout','aou'],['septembre','sept','sep'],['octobre','oct'],['novembre','nov'],['decembre','dec']];
function cfaParseMonth(text){
  const t=cfaNorm(text).replace(/\s+/g,''); const m=t.match(/^([a-z]{3,9})\.?[-\/ ]?(\d{2,4})?/);
  if(!m)return null; const w=m[1]; let mi=-1,best=0;
  for(let i=0;i<CFA_MONTH_VAR.length;i++) for(const v of CFA_MONTH_VAR[i]){ if(w.startsWith(v) && v.length>best){ mi=i; best=v.length; } }
  if(mi<0)return null; let y=m[2]?parseInt(m[2]):null; if(y!=null && y<100) y=2000+y;
  return {mi,y};
}
// Échantillon de couleur de FOND de case (autour du numéro) : médiane d'un patch, en ignorant le texte
// (quasi-noir). Convient aux grilles « mini-mois » où la catégorie est le fond de la case.
function cfaSampleCell(img,cx,cy,rad){
  const {data,width,height}=img; const rs=[],gs=[],bs=[];
  for(let dy=-rad;dy<=rad;dy++)for(let dx=-rad;dx<=rad;dx++){ const x=cx+dx,y=cy+dy; if(x<0||y<0||x>=width||y>=height)continue;
    const i=(y*width+x)*4, r=data[i],g=data[i+1],b=data[i+2]; if(r<70&&g<70&&b<70)continue; rs.push(r);gs.push(g);bs.push(b); }
  if(!rs.length)return [255,255,255]; const md=a=>{a.sort((p,q)=>p-q);return a[a.length>>1];}; return [md(rs),md(gs),md(bs)];
}
function cfaSampleSwatch(img,xStart,y,xEnd){
  const step=4; let last=null;
  for(let x=xStart+2;x<xEnd;x+=step){ const p=cfaMedianPatch(img,x,y,3); if(!cfaIsWhite(...p)) last=p; }
  return last||[255,255,255];
}
async function cfaFromImage(imageData,onStep){
  const {img}=imageData; const W=img.width,H=img.height;
  onStep&&onStep('Lecture des en-têtes (OCR)…',35,true);
  const {data}=await Tesseract.recognize(imageData.canvas,'fra');
  let words=(data&&data.words)||[];
  if(!words.length && data&&data.blocks){ data.blocks.forEach(bl=>(bl.paragraphs||[]).forEach(p=>(p.lines||[]).forEach(ln=>(ln.words||[]).forEach(w=>words.push(w))))); }
  // En-têtes de mois (tolérants : pleins/abrégés, MAJUSCULES, accents, avec ou sans année) → colonnes
  let months=[];
  for(const w of words){ const pm=cfaParseMonth(w.text); if(pm) months.push({mi:pm.mi,y:pm.y,cx:(w.bbox.x0+w.bbox.x1)/2,cy:(w.bbox.y0+w.bbox.y1)/2,top:w.bbox.y0}); }
  if(!months.length) return {error:'Aucun en-tête de mois détecté'};
  // dédoublonnage par mois : un en-tête est unique. On garde l'occurrence la plus HAUTE (les en-têtes sont
  // sur la 1re ligne ; un libellé de jour ou un faux positif plus bas dans la grille est ainsi écarté).
  const byMi={}; for(const m of months){ if(!byMi[m.mi]||m.top<byMi[m.mi].top) byMi[m.mi]=m; }
  months=Object.values(byMi).sort((a,b)=>a.cx-b.cx);
  const base=parseInt((ALT.annee||schoolYears()[1]).split('-')[0]); months.forEach(m=>{ if(m.y==null) m.y=m.mi>=8?base:base+1; });
  // mots « FERIE / férié » → catégorie indépendante de la couleur
  const feries=words.filter(w=>/^feries?$/.test(cfaNorm(w.text))).map(w=>({cx:(w.bbox.x0+w.bbox.x1)/2,cy:(w.bbox.y0+w.bbox.y1)/2}));
  // ===== DÉTECTION GÉOMÉTRIQUE DE LA GRILLE (bordures noires) — robuste, indépendante de l'OCR =====
  // L'OCR ne sert QU'À NOMMER les mois. La grille (colonnes-mois + lignes-jours) vient des PROFILS DE
  // PROJECTION des pixels sombres : séparateurs verticaux pleine hauteur (sous-colonnes) + horizontaux
  // pleine largeur (lignes-jours). Fini le seuil global qui plafonnait à 11 et le clipping par l'OCR.
  onStep&&onStep('Détection de la grille…',62,true);
  const {col:colProj,row:rowProj}=cfaGridProfiles(img);
  const V=cfaLines(colProj,H,0.5,12);    // séparateurs VERTICAUX (pleine hauteur) = sous-colonnes (num|lettre|sw1|sw2)
  const Hl=cfaLines(rowProj,W,0.30,12);  // séparateurs HORIZONTAUX (pleine largeur) = lignes-jours
  if(V.length<3||Hl.length<4) return {error:'Grille non localisée (bordures introuvables)'};
  const subPitch=cfaMedianGap(V);
  // pas horizontal d'un MOIS : depuis l'espacement des en-têtes OCR (par diff de mois) ; défaut = 4 sous-colonnes
  let monthPitch=subPitch*4;
  if(months.length>=2){ const ps=[]; for(let i=1;i<months.length;i++){ const dmi=months[i].mi-months[i-1].mi; if(dmi>0)ps.push((months[i].cx-months[i-1].cx)/dmi); } if(ps.length){ ps.sort((a,b)=>a-b); monthPitch=ps[ps.length>>1]; } }
  const gridL=V[0], gridR=V[V.length-1];
  const nblocks=Math.max(1,Math.round((gridR-gridL)/monthPitch));
  const subsPer=Math.max(2,Math.round(monthPitch/subPitch));   // sous-colonnes par mois (num|lettre|sw1|sw2 → 4)
  const snap=x=>V.reduce((a,b)=>Math.abs(b-x)<Math.abs(a-x)?b:a,V[0]);
  // construction des blocs-mois : 2 dernières sous-cases = pastilles couleur (snap sur les bordures réelles)
  const blocks=[];
  for(let k=0;k<nblocks;k++){ const bl=snap(gridL+k*monthPitch);
    const s1=snap(bl+(subsPer-2)*subPitch), s2=snap(bl+(subsPer-1)*subPitch), s3=snap(bl+subsPer*subPitch);
    blocks.push({k,bl,cx:bl+monthPitch/2,sw1:[s1,s2],sw2:[s2,s3],left:bl,right:bl+monthPitch,mi:null,y:null}); }
  // nommage : ancrage sur les en-têtes OCR lus, puis mois CONSÉCUTIFS pour les blocs dont l'en-tête a été raté
  blocks.forEach(b=>{ const hit=months.find(m=>Math.abs(m.cx-b.cx)<monthPitch*0.5); if(hit){b.mi=hit.mi;b.y=hit.y;} });
  const anchor=blocks.find(b=>b.mi!=null); if(!anchor) return {error:'Mois non identifiés (en-têtes illisibles)'};
  blocks.forEach(b=>{ if(b.mi==null){ const mi=((anchor.mi+(b.k-anchor.k))%12+12)%12; b.mi=mi; b.y=mi>=8?base:base+1; } });
  // lignes-jours : on saute la bande d'en-tête (au-dessus de la ligne de base des titres OCR), puis 1 inter-ligne = 1 jour.
  // MÉDIANE des cy d'en-têtes (et non max) → robuste à un faux positif OCR profond qui rognerait la grille.
  const cys=months.map(m=>m.cy).sort((a,b)=>a-b); const headBaseY=cys[cys.length>>1];
  let startIdx=Hl.findIndex(l=>l>=headBaseY); if(startIdx<1)startIdx=1;
  const rows=[]; for(let i=startIdx;i<Hl.length-1;i++) rows.push([Hl[i],Hl[i+1]]);
  if(rows.length<3) return {error:'Lignes-jours introuvables'};
  onStep&&onStep('Lecture des couleurs…',80,true);
  const samples=[]; const dbg=[];
  for(const col of blocks){
    const ndays=new Date(col.y,col.mi+1,0).getDate();
    if(col.mi==null||!Number.isFinite(ndays)) continue;   // garde : jamais de bloc sans mois/année valides (sinon jours perdus en silence)
    for(let r=0;r<rows.length && r<ndays;r++){

      const date=`${col.y}-${String(col.mi+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
      const isFerie=feries.some(f=>f.cx>=col.left&&f.cx<col.right&&f.cy>=y0&&f.cy<y1);
      if(isFerie){ samples.push({date,rgb:[255,255,255],d,forced:'ferie'});
        if(CFA_DEBUG)dbg.push({date,L:'-',R:'-',pick:'FERIE'}); continue; }
      const yy0=Math.round(y0+2), yy1=Math.round(y1-2);
      // pastille gauche + pastille droite (sous-colonnes géométriques) : la couleur utile est tantôt à G, tantôt à D
      const lc=cfaDominantColor(img,col.sw1[0]+1,col.sw1[1]-1,yy0,yy1);
      const rc=cfaDominantColor(img,col.sw2[0]+1,col.sw2[1]-1,yy0,yy1);

    }

  const det=cfaFinalize(samples,cfaCluster(samples),'image');

    const nonEmpty=Object.values(det.byDate).filter(v=>v.cluster!=='blanc').length;
    const perCluster={}; Object.values(det.byDate).forEach(v=>perCluster[v.cluster]=(perCluster[v.cluster]||0)+1);
    det.debug={vlines:V,hlines:Hl,subPitch:Math.round(subPitch),monthPitch:Math.round(monthPitch),subsPer,nblocks,
      blocks:blocks.map(b=>({mois:b.mi+1,y:b.y,left:Math.round(b.left),right:Math.round(b.right),sw1:b.sw1,sw2:b.sw2})),
      rowsTopIdx:startIdx,rows:rows.length,days:dbg.length,nonEmpty,perCluster,perDay:dbg};
    window._cfaDebug=det.debug;
    console.log('%c[CFA debug] colonnes-mois:'+nblocks+' · lignes-jours:'+rows.length+' · jours:'+dbg.length+' · NON-VIDES:'+nonEmpty,'color:#b8860b;font-weight:bold');
    console.log('[CFA debug] séparateurs VERTICAUX (X):',V);
    console.log('[CFA debug] séparateurs HORIZONTAUX (Y):',Hl);
    console.log('[CFA debug] subPitch:'+Math.round(subPitch)+' · monthPitch:'+Math.round(monthPitch)+' · subsPerMonth:'+subsPer);
    console.log('[CFA debug] blocs-mois (nommés):',det.debug.blocks);
    console.log('[CFA debug] décompte par cluster:',perCluster);
    try{ console.table(dbg); }catch(_){ console.log('[CFA debug] par-jour:',dbg); }
    console.log('%c[CFA debug] → window._cfaDebug (objet complet)','color:#888');

}
// Profils de projection des pixels SOMBRES (bordures) : par colonne X (séparateurs verticaux) et par rangée Y
// (séparateurs horizontaux). Un seul passage. Seuil 150 pour capter aussi les bordures anti-crénelées (grises).
function cfaGridProfiles(img){
  const {data,width,height}=img; const col=new Float64Array(width), row=new Float64Array(height); const T=150;
  for(let y=0;y<height;y++){ const b=y*width*4; let rc=0;
    for(let x=0;x<width;x++){ const i=b+x*4; if(data[i]<T&&data[i+1]<T&&data[i+2]<T){ col[x]++; rc++; } } row[y]=rc; }
  return {col,row};
}
// Pics réguliers d'un profil (bordures pleine longueur) → positions de lignes (moyenne de chaque groupe contigu).
function cfaLines(proj,span,minfrac,mingap){
  const th=minfrac*span; const lines=[]; let grp=[];

// Dans ces calendriers, chaque jour occupe TROIS cases côte à côte :

function cfaVectorAnalyse(pages,annee){

    // C'est le seul contrôle qui vaille, quelle que soit la méthode de lecture.

    // du groupe : la légende et le bandeau de titre n'ont aucun numéro à leur gauche, donc ils

    // d'un même mois partagent la même abscisse, et l'en-tête coiffe la colonne. On regroupe donc
    // les numéros par abscisse, puis on apparie colonnes et en-têtes PAR RANG (de gauche à droite).
    // L'ancienne règle — « l'en-tête le plus proche au-dessus » — confondait les colonnes voisines

    // « c'en est un, mais il ne couvre pas l'année demandée » (→ le dire, ne PAS retomber en
    // silence sur une méthode moins fiable qui produirait un calendrier faux).
    const hors=(a.pagesIgnorees||[]).filter(p=>/hors de/.test(p.raison||''));
