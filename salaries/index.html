<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Raya — Gestion Salariés</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root, [data-theme="dark"]{--gold:#c8a035;--gold-dim:#8a7028;--bg:#0b0b15;--card:#15151f;--surface:#1c1c28;--line:rgba(255,255,255,.06);--line-2:rgba(255,255,255,.12);--text:#e8e8ec;--muted:#7b7b8a;--ok:#3fb87f;--warn:#e0a93a;--bad:#c45a5a}
[data-theme="light"]{--gold:#c8a035;--bg:#f5f5f7;--card:#ffffff;--surface:#f0f0f3;--line:rgba(0,0,0,.06);--line-2:rgba(0,0,0,.12);--text:#1a1a1f;--muted:#6b6b78;--ok:#2a8f5f;--warn:#b8841f;--bad:#b04444;--info:#4a7fbd}
html,body{height:100%}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;font-size:14px;-webkit-font-smoothing:antialiased}
a{color:var(--gold);text-decoration:none}
.hidden{display:none!important}
input,select,textarea,button{font-family:inherit;color:var(--text)}
button{cursor:pointer;border:none;background:none}

/* ── BUTTONS ── */
.btn{padding:9px 16px;border-radius:8px;background:var(--gold);color:#1a1a1a;font-weight:600;font-size:13px;border:1px solid transparent;transition:.15s}
.btn:hover{filter:brightness(1.07)}
.btn.ghost{background:transparent;color:var(--text);border-color:var(--line-2)}
.btn.ghost:hover{background:rgba(255,255,255,.04)}
.btn.danger{background:transparent;color:var(--bad);border-color:rgba(196,90,90,.3)}
.btn.danger:hover{background:rgba(196,90,90,.08)}
.btn.sm{padding:6px 11px;font-size:12px}
.btn.icon{padding:7px 9px}

/* ── LOCK ── */
.lock{position:fixed;inset:0;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;z-index:100}
.lock .brand{color:var(--gold);font-size:22px;font-weight:700;letter-spacing:.5px}
.lock .sub{color:var(--muted);font-size:13px;margin-bottom:14px}
.lock input{padding:13px 18px;border-radius:10px;border:1px solid var(--line-2);background:var(--surface);font-size:15px;text-align:center;width:260px;outline:none}
.lock input:focus{border-color:var(--gold)}
.lock .err{color:var(--bad);font-size:12px;height:16px}

/* ── HEADER ── */
.header{display:flex;align-items:center;justify-content:space-between;padding:14px 28px;border-bottom:1px solid var(--line);background:var(--bg);position:sticky;top:0;z-index:20}
.brand{color:var(--gold);font-weight:700;font-size:16px;letter-spacing:.3px}
.brand small{color:var(--muted);font-weight:400;font-size:12px;margin-left:8px;letter-spacing:0}
.h-actions{display:flex;gap:8px;align-items:center}

/* ── LIST ── */
.wrap{max-width:1180px;margin:0 auto;padding:24px 28px 60px}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:18px}
.toolbar input,.toolbar select{padding:9px 12px;border-radius:8px;border:1px solid var(--line);background:var(--surface);font-size:13px;outline:none}
.toolbar input:focus,.toolbar select:focus{border-color:var(--gold-dim)}
.count{color:var(--muted);font-size:12px;margin-left:auto}
.tbl{width:100%;border-collapse:separate;border-spacing:0;background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.tbl th{text-align:left;padding:12px 16px;font-size:11px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;background:rgba(255,255,255,.015);border-bottom:1px solid var(--line)}
.tbl td{padding:14px 16px;border-bottom:1px solid var(--line);font-size:13px;vertical-align:middle}
.tbl tr:last-child td{border-bottom:none}
.tbl tr.row{cursor:pointer;transition:background .12s}
.tbl tr.row:hover{background:rgba(200,160,53,.04)}
.namecell{display:flex;align-items:center;gap:12px}
.avatar{width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;color:#111;font-size:13px;flex-shrink:0;background:#444}
.fullname{font-weight:600;color:var(--text)}
.subline{color:var(--muted);font-size:11.5px;margin-top:1px}
.chip{display:inline-block;padding:2px 9px;border-radius:20px;font-size:10.5px;font-weight:600;letter-spacing:.02em}
.chip.cuisine{background:rgba(232,160,106,.13);color:#e8a06a}
.chip.caisse{background:rgba(224,196,106,.13);color:#e0c46a}
.chip.multi{background:rgba(155,140,255,.13);color:#bca7ff}
.chip.off{background:rgba(255,255,255,.05);color:var(--muted)}
.chip.ok{background:rgba(63,184,127,.13);color:var(--ok)}
.chip.warn{background:rgba(224,169,58,.13);color:var(--warn)}
.chip.bad{background:rgba(196,90,90,.13);color:var(--bad)}

/* ── FICHE ── */
.fiche{position:fixed;inset:0;background:var(--bg);z-index:50;overflow:auto;display:flex;flex-direction:column}
.fiche-head{display:flex;align-items:center;gap:18px;padding:16px 28px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--bg);z-index:1}
.fiche-head .back{display:flex;align-items:center;gap:6px;color:var(--muted);font-size:13px;padding:7px 10px;border-radius:8px}
.fiche-head .back:hover{background:rgba(255,255,255,.04);color:var(--text)}
.fiche-name{display:flex;align-items:center;gap:14px;flex:1;min-width:0}
.fiche-name .avatar{width:42px;height:42px;font-size:16px}
.fiche-name .nm{font-size:18px;font-weight:600;color:var(--text)}
.fiche-name .meta{color:var(--muted);font-size:12px;margin-top:2px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.tabs{display:flex;gap:2px;padding:0 28px;border-bottom:1px solid var(--line);background:var(--bg);position:sticky;top:75px;z-index:1}
.tab{padding:14px 18px;font-size:13px;color:var(--muted);font-weight:500;border-bottom:2px solid transparent;margin-bottom:-1px}
.tab:hover{color:var(--text)}
.tab.active{color:var(--gold);border-bottom-color:var(--gold)}
.tab-body{max-width:880px;margin:0 auto;padding:28px;width:100%}

/* ── SECTION CARDS ── */
.section{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:22px 24px;margin-bottom:18px}
.section h3{font-size:11.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;margin-bottom:16px;font-weight:600}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px 18px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px 18px}
.fld label{display:block;font-size:11.5px;color:var(--muted);margin-bottom:6px;font-weight:500}
.fld input,.fld select,.fld textarea{width:100%;padding:9px 12px;border-radius:8px;border:1px solid var(--line-2);background:var(--surface);font-size:13px;outline:none;transition:.12s}
.fld input:focus,.fld select:focus,.fld textarea:focus{border-color:var(--gold-dim)}
.fld input[type=color]{padding:3px;height:38px;cursor:pointer}
.chkrow{display:flex;gap:18px;flex-wrap:wrap;margin-top:6px}
.chk{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--text);cursor:pointer}
.chk input{width:auto;cursor:pointer}

/* ── DOCS ── */
.req-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
.req{background:var(--surface);border:1px solid var(--line-2);border-radius:10px;padding:14px 16px;display:flex;align-items:flex-start;gap:12px;cursor:pointer;transition:.12s}
.req:hover{border-color:var(--gold-dim)}
.req .ic{width:32px;height:32px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:15px;flex-shrink:0}
.req.ok .ic{background:rgba(63,184,127,.15);color:var(--ok)}
.req.miss .ic{background:rgba(224,169,58,.13);color:var(--warn)}
.req .lbl{font-weight:600;font-size:13px}
.req .st{font-size:11px;color:var(--muted);margin-top:2px}
.req.ok .st{color:var(--ok)}
.req.miss .st{color:var(--warn)}
.doc-list{margin-top:14px}
.doc{display:flex;align-items:center;gap:12px;padding:10px 14px;background:var(--surface);border:1px solid var(--line);border-radius:8px;margin-bottom:8px}
.doc .typ{padding:2px 8px;border-radius:6px;background:rgba(200,160,53,.13);color:var(--gold);font-size:10.5px;font-weight:600;text-transform:uppercase;letter-spacing:.04em}
.doc .nm{font-weight:500;font-size:13px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;cursor:pointer}
.doc .nm:hover{color:var(--gold)}
.doc .sz{color:var(--muted);font-size:11px}

/* ── DISPO / CONTRAINTE ── */
.subitem{display:flex;align-items:center;gap:10px;padding:9px 13px;background:var(--surface);border:1px solid var(--line);border-radius:8px;margin-bottom:7px;font-size:12.5px;flex-wrap:wrap}
.add-row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:10px;padding-top:14px;border-top:1px dashed var(--line-2)}
.add-row select,.add-row input{padding:7px 10px;border-radius:7px;border:1px solid var(--line-2);background:var(--surface);font-size:12px;outline:none}

/* ── MODAL ── */
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.65);display:flex;align-items:center;justify-content:center;padding:30px 14px;overflow:auto;z-index:150}
.modal{background:var(--card);border:1px solid var(--line-2);border-radius:14px;width:100%;max-width:480px;padding:24px}
.modal h2{font-size:17px;margin-bottom:18px;color:var(--text)}
.modal-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:22px}

/* ── TOAST ── */
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#1f1f2b;border:1px solid var(--line-2);padding:11px 20px;border-radius:10px;font-size:13px;z-index:200;opacity:0;transition:.25s;box-shadow:0 8px 28px rgba(0,0,0,.4)}
.toast.show{opacity:1;transform:translateX(-50%) translateY(-4px)}

@media(max-width:680px){
  .wrap{padding:16px}.header,.fiche-head,.tabs{padding-left:16px;padding-right:16px}
  .grid2,.grid3{grid-template-columns:1fr}
  .tab-body{padding:18px 16px}
  .tbl td:nth-child(4),.tbl th:nth-child(4){display:none}
}
</style>
</head>
<body>
<div style="background:#b03a3a;color:#fff;text-align:center;padding:6px;font-size:12px;font-weight:700">ENVIRONNEMENT DE TEST — base séparée, aucune donnée de production</div>

<!-- VERROU -->
<div class="lock hidden" id="lock">
  <div class="brand">Gestion Salariés</div>
  <div class="sub" id="lockSub">Connexion à ton compte</div>
  <div id="loginBlock" style="display:flex;flex-direction:column;gap:10px;align-items:center">
    <input type="email" id="loginEmail" placeholder="Email" autocomplete="email" style="width:280px">
    <input type="password" id="loginPw" placeholder="Mot de passe" autocomplete="current-password" onkeydown="if(event.key==='Enter')login()" style="width:280px">
    <button class="btn" onclick="login()" style="width:280px">Se connecter</button>
    <div style="color:var(--muted);font-size:12px">Pas de compte ? <a href="#" style="color:var(--gold)" onclick="showSignup();return false">Créer un compte</a></div>
  </div>
  <div id="signupBlock" class="hidden" style="display:none;flex-direction:column;gap:10px;align-items:center">
    <input type="text" id="signupName" placeholder="Nom complet" style="width:280px">
    <input type="email" id="signupEmail" placeholder="Email" autocomplete="email" style="width:280px">
    <input type="password" id="signupPw" placeholder="Mot de passe (8 caractères min)" autocomplete="new-password" style="width:280px">
    <button class="btn" onclick="signup()" style="width:280px">Créer mon compte</button>
    <div style="color:var(--muted);font-size:12px">Déjà inscrit ? <a href="#" style="color:var(--gold)" onclick="showLogin();return false">Se connecter</a></div>
  </div>
  <div class="err" id="loginErr"></div>
  <a href="../" style="font-size:12px;color:var(--muted);margin-top:6px">← Retour au portail</a>
</div>

<!-- LISTE -->
<div id="listView" class="hidden">
  <div class="header">
    <div class="brand">Raya <small>· Gestion Salariés · <span id="ver" style="font-size:10px;color:var(--muted)"></span></small></div>
    <div class="h-actions">
      <button class="btn ghost" id="demandesBtn" onclick="openDemandes()" style="position:relative">🔔 Demandes <span id="demandesBadge" style="display:none;background:var(--bad);color:#fff;font-size:10px;padding:1px 6px;border-radius:10px;margin-left:4px;font-weight:700"></span></button>
      <button class="btn ghost" onclick="openExportModal()">Export pointages</button>
      <button class="btn" onclick="openFiche(null)">+ Nouveau salarié</button>
      <a href="../" class="btn ghost">Portail</a>
      <button class="btn ghost" onclick="logout()" title="Déconnexion">↩</button>
    </div>
  </div>
  <div class="wrap">
    <div class="toolbar">
      <input id="search" placeholder="Rechercher…" oninput="render()">
      <select id="fSnack" onchange="render()"><option value="">Tous les snacks</option></select>
      <select id="fRole" onchange="render()"><option value="">Tous les rôles</option><option value="cuisine">Cuisine</option><option value="caisse">Caisse</option></select>
      <select id="fActif" onchange="render()"><option value="1">Actifs</option><option value="">Tous</option><option value="0">Inactifs</option></select>
      <span class="count" id="count"></span>
    </div>
    <table class="tbl">
      <thead><tr><th>Salarié</th><th>Snack</th><th>Rôles</th><th>Contrat</th><th>Documents</th></tr></thead>
      <tbody id="tbody"></tbody>
    </table>
  </div>
</div>

<!-- FICHE -->
<div id="ficheView" class="hidden"></div>

<div id="modalHost"></div>
<div class="toast" id="toast"></div>

<script>
// ===== SUPABASE =====
const SUPA_URL='https://ynnqvtfayrdteqtgxeuk.supabase.co';
const SUPA_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InlubnF2dGZheXJkdGVxdGd4ZXVrIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzk4OTE1MTQsImV4cCI6MjA5NTQ2NzUxNH0._mfVAGexu7ew38UQk6adn42az4Gt_J3ePxR6O6wuWHc';
const sb=supabase.createClient(SUPA_URL,SUPA_KEY);
const VERSION='v0.13 · auth Supabase';
let ME=null;
let selectedMonth=null, selectedSnack=null;
function fmtH(h){if(h==null||isNaN(h))return'';const tot=Math.round(h*60);return `${Math.floor(tot/60)}h ${String(tot%60).padStart(2,'0')}m`;}
function ymOf(ts){return ts.slice(0,7);}
function ymLabel(ym){const[y,m]=ym.split('-');return new Date(parseInt(y),parseInt(m)-1,1).toLocaleDateString('fr-FR',{month:'long',year:'numeric'}).replace(/^./,c=>c.toUpperCase());}
const MOIS_FR={janvier:1,février:2,fevrier:2,mars:3,avril:4,mai:5,juin:6,juillet:7,août:8,aout:8,septembre:9,octobre:10,novembre:11,décembre:12,decembre:12};

const JOURS=['Lundi','Mardi','Mercredi','Jeudi','Vendredi','Samedi','Dimanche'];
const CONTRAINTE_PRESETS=['pas_apres','pas_avant','pas_de_coupure','max_soirs_semaine','jours_off_consecutifs','indispo_jour','autre'];
const DOC_REQUIRED=[
  {key:'contrat',     label:'Contrat de travail',      ic:'📄'},
  {key:'dpae',        label:'DPAE',                    ic:'📋'},
  {key:'cni',         label:'Carte d\'identité',       ic:'🆔'},
  {key:'carte_vitale',label:'Carte vitale',            ic:'💳'},
  {key:'justif_dom',  label:'Justif. de domicile',     ic:'🏠'}
];
const DOC_OPTIONAL=[
  {key:'avenant',label:'Avenant'},
  {key:'bulletin',label:'Bulletin de paie'},
  {key:'rib',label:'RIB'},
  {key:'autre',label:'Autre'}
];
const ALL_DOC_TYPES=[...DOC_REQUIRED,...DOC_OPTIONAL];
let S={restos:[],salaries:[],roles:[],dispos:[],contraintes:[],paires:[],docs:[],pts:[]};
let currentFiche=null, currentTab='infos';

// ===== AUTH SUPABASE =====
function showSignup(){document.getElementById('loginBlock').style.display='none';document.getElementById('signupBlock').style.display='flex';document.getElementById('signupBlock').classList.remove('hidden');document.getElementById('lockSub').textContent='Créer un compte';document.getElementById('loginErr').textContent='';}
function showLogin(){document.getElementById('signupBlock').style.display='none';document.getElementById('loginBlock').style.display='flex';document.getElementById('lockSub').textContent='Connexion à ton compte';document.getElementById('loginErr').textContent='';}
async function login(){
  const email=document.getElementById('loginEmail').value.trim();
  const password=document.getElementById('loginPw').value;
  if(!email||!password){document.getElementById('loginErr').textContent='Email + mot de passe requis';return;}
  document.getElementById('loginErr').textContent='Connexion…';
  const{error}=await sb.auth.signInWithPassword({email,password});
  if(error){document.getElementById('loginErr').textContent=error.message;return;}
  await loadProfileAndShow();
}
async function signup(){
  const email=document.getElementById('signupEmail').value.trim();
  const password=document.getElementById('signupPw').value;
  const name=document.getElementById('signupName').value.trim();
  if(!email||!password||password.length<8){document.getElementById('loginErr').textContent='Email + mdp 8+ caractères requis';return;}
  document.getElementById('loginErr').textContent='Création du compte…';
  const{error}=await sb.auth.signUp({email,password,options:{data:{full_name:name}}});
  if(error){document.getElementById('loginErr').textContent=error.message;return;}
  await sb.auth.signInWithPassword({email,password});
  await loadProfileAndShow();
}
async function loadProfileAndShow(){
  const{data:{session}}=await sb.auth.getSession();
  if(!session)return;
  const{data:profile,error}=await sb.from('profiles').select('*').eq('id',session.user.id).maybeSingle();
  if(error||!profile){document.getElementById('loginErr').textContent='Profil introuvable. Réessaye dans 2 secondes (création en cours).';await sb.auth.signOut();return;}
  if(!['admin','super_admin'].includes(profile.role)){document.getElementById('loginErr').textContent='Accès refusé. Ce module est réservé aux admins (ton rôle : '+profile.role+').';await sb.auth.signOut();return;}
  ME=profile;
  const{data:org}=await sb.from('organizations').select('couleur_primaire,logo_url').eq('id',profile.organization_id).maybeSingle();
  if(org?.couleur_primaire) document.documentElement.style.setProperty('--gold',org.couleur_primaire);
  showApp();
}
async function logout(){await sb.auth.signOut();ME=null;location.reload();}
function showApp(){
  document.getElementById('lock').classList.add('hidden');
  document.getElementById('listView').classList.remove('hidden');
  const v=document.getElementById('ver');if(v)v.textContent=VERSION;
  loadAll();
}
// Auto-login si session existante
sb.auth.getSession().then(({data})=>{
  if(data.session) loadProfileAndShow();
  else document.getElementById('lock').classList.remove('hidden');
});

// ===== TOAST =====
let tt;
function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('show'),2200);}

// ===== LOAD =====
async function loadAll(){
  const [r,s,ro,d,c,p,dx,pt]=await Promise.all([
    sb.from('restaurants').select('*').eq('actif',true).order('nom'),
    sb.from('salaries').select('*').order('nom'),
    sb.from('salarie_roles').select('*'),
    sb.from('salarie_dispos').select('*'),
    sb.from('salarie_contraintes').select('*'),
    sb.from('salarie_paires').select('*'),
    sb.from('salarie_documents').select('*').order('created_at',{ascending:false}),
    sb.from('pointages').select('*').gte('ts',new Date(Date.now()-90*86400000).toISOString()).order('ts',{ascending:false})
  ]);
  S.restos=r.data||[];S.salaries=s.data||[];S.roles=ro.data||[];S.dispos=d.data||[];S.contraintes=c.data||[];S.paires=p.data||[];S.docs=dx.data||[];S.pts=pt.data||[];
  // Compteur demandes en attente
  const pending=S.dispos.filter(d=>d.statut_demande==='en_attente').length;
  const b=document.getElementById('demandesBadge');
  if(b){if(pending){b.textContent=pending;b.style.display='inline-block';}else{b.style.display='none';}}
  const fS=document.getElementById('fSnack');
  fS.innerHTML='<option value="">Tous les snacks</option>'+S.restos.map(x=>`<option value="${x.id}">${x.nom}</option>`).join('')+'<option value="MULTI">MULTI</option>';
  render();
}
const snackName=id=>{const r=S.restos.find(x=>x.id===id);return r?r.nom.replace('Raya ',''):'—';};
const rolesOf=sid=>[...new Set(S.roles.filter(x=>x.salarie_id===sid).map(x=>x.role))];
const disposOf=sid=>S.dispos.filter(x=>x.salarie_id===sid);
const contrOf=sid=>S.contraintes.filter(x=>x.salarie_id===sid);
const docsOf=sid=>S.docs.filter(x=>x.salarie_id===sid);
const ptsOf=sid=>S.pts.filter(x=>x.salarie_id===sid);
function generatePin(){
  const used=new Set(S.salaries.map(s=>s.pin_badgeuse).filter(Boolean));
  for(let i=0;i<2000;i++){const p=String(Math.floor(Math.random()*10000)).padStart(4,'0');if(!used.has(p))return p;}
  return null;

function downloadPointagesCSV(rows,filename){
  const head='Date,Heure,Salarie,Snack,Type,Heures_jour\n';
  // group by day+sal for hours
  const byDS={};
  rows.forEach(p=>{const k=p.ts.slice(0,10)+'|'+p.salarie_id;(byDS[k]=byDS[k]||[]).push(p);});
  const hForDS={};
  Object.entries(byDS).forEach(([k,arr])=>{hForDS[k]=hoursOfDay(arr);});
  let firstRowOfDay=new Set();
  const csv=rows.map(p=>{
    const s=S.salaries.find(x=>x.id===p.salarie_id)||{};
    const r=S.restos.find(x=>x.id===p.restaurant_id)||{};
    const d=new Date(p.ts);
    const nm=fullName(s)||s.nom||'?';
    const key=p.ts.slice(0,10)+'|'+p.salarie_id;
    const showH=!firstRowOfDay.has(key);firstRowOfDay.add(key);
    const h=showH&&hForDS[key]!=null?fmtH(hForDS[key]):'';
    return `${d.toLocaleDateString('fr-FR')},${d.toLocaleTimeString('fr-FR')},"${nm}","${r.nom||''}",${TYPL_PT[p.type]||p.type},${h}`;
  }).join('\n');
  const blob=new Blob(['﻿'+head+csv],{type:'text/csv;charset=utf-8'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`${filename}.csv`;a.click();
}
function hoursOfDay(arr){
  const ev=arr.slice().sort((a,b)=>a.ts.localeCompare(b.ts)).map(p=>({t:p.type,d:new Date(p.ts)}));
  const first=ev.find(x=>x.t==='arrivee');
  const last=[...ev].reverse().find(x=>x.t==='sortie');
  if(!first||!last)return null;
  let pause=0;
  for(let i=0;i<ev.length-1;i++)if(ev[i].t==='pause_debut'&&ev[i+1].t==='pause_fin')pause+=(ev[i+1].d-ev[i].d);
  return Math.max(0,(last.d-first.d-pause)/3600000);
}
const initials=s=>((s.prenom||'').charAt(0)+(s.nom||'').charAt(0)).toUpperCase()||(s.nom||'?').charAt(0).toUpperCase();
const fullName=s=>[s.prenom,s.nom].filter(Boolean).join(' ');

  let list=S.salaries.filter(s=>{
    const fn=fullName(s).toLowerCase();

    if(fSn==='MULTI'){if(!s.est_multi)return false;} else if(fSn){if(s.snack_origine_id!==fSn)return false;}
    if(fRo && !rolesOf(s.id).includes(fRo)) return false;

      ((s.heures_min||s.heures_max)?` <span style="color:var(--muted)">· ${s.heures_min??'?'}–${s.heures_max??'?'}h</span>`:'');
    const sub=[];

    return `<tr class="row" onclick="openFiche('${s.id}')">
      <td><div class="namecell"><div class="avatar" style="background:${s.couleur||'#444'}">${initials(s)}</div>
        <div><div class="fullname">${fullName(s)||s.nom}${s.est_mineur?' <span class="chip off">mineur</span>':''}${!s.actif?' <span class="chip off">inactif</span>':''}</div>

      <td>${rls}</td>

    </tr>`;
  }).join('')||'<tr><td colspan="5" style="padding:36px;text-align:center;color:var(--muted)">Aucun salarié</td></tr>';

            ${snacksWorked.map(rid=>{const r=S.restos.find(x=>x.id===rid);if(!r)return'';const active=selectedSnack===rid;return `<button class="chip" style="cursor:pointer;font-size:12px;padding:8px 14px;border:1px solid ${active?'var(--gold)':'var(--line-2)'};background:${active?'rgba(200,160,53,.12)':'var(--surface)'};color:${active?'var(--gold)':'var(--text)'}" onclick="setSnackFilter('${rid}')">${r.nom.replace('Raya ','')}</button>`}).join('')}

// triggerUpload sur clic d'une carte "doc requis"
function triggerUpload(key){
  setTab('docs');
  setTimeout(()=>{
    const sel=document.getElementById('nf_type'); if(sel)sel.value=key;

}

function fmtSize(n){if(!n)return'';if(n<1024)return n+' o';if(n<1048576)return(n/1024).toFixed(0)+' Ko';return(n/1048576).toFixed(1)+' Mo';}

function renderDispoList(){

function val(id,trim=true){const e=document.getElementById(id);if(!e)return null;const v=trim?e.value.trim():e.value;return v===''?null:v;}
function num(id){const v=val(id,false);return v==null?null:parseFloat(v);}

async function saveSalarie(){
  // Map: champ DB -> id input ; on n'ajoute au payload QUE ce qui est dans le DOM courant.
  const TXT={nom:'f_nom',prenom:'f_prenom',type_contrat:'f_contrat',notes:'f_notes',
    nationalite:'f_nat',num_secu:'f_secu',matricule:'f_matricule',email:'f_email',
    telephone:'f_tel',adresse:'f_adr',code_postal:'f_cp',ville:'f_ville',poste_intitule:'f_poste',
    pin_badgeuse:'f_pin'};
  const DATE={date_naissance:'f_naiss',date_entree:'f_entree',date_sortie:'f_sortie'};
  const NUM={plafond_heures:'f_plafond',heures_min:'f_hmin',heures_max:'f_hmax',taux_horaire_brut:'f_taux',coef_charges_perso:'f_coefperso'};
  const CHK={est_multi:'f_multi',est_mineur:'f_mineur',actif:'f_actif'};
  const SEL={snack_origine_id:'f_snack'};
  const COL={couleur:'f_couleur'};
  const payload={};
  for(const[k,id]of Object.entries(TXT)){const e=document.getElementById(id);if(e)payload[k]=e.value.trim()||null;}
  for(const[k,id]of Object.entries(DATE)){const e=document.getElementById(id);if(e)payload[k]=e.value||null;}
  for(const[k,id]of Object.entries(NUM)){const e=document.getElementById(id);if(e)payload[k]=e.value!==''?parseFloat(e.value):null;}
  for(const[k,id]of Object.entries(CHK)){const e=document.getElementById(id);if(e)payload[k]=e.checked;}
  for(const[k,id]of Object.entries(SEL)){const e=document.getElementById(id);if(e)payload[k]=e.value||null;}
  for(const[k,id]of Object.entries(COL)){const e=document.getElementById(id);if(e)payload[k]=e.value;}

  // Création : besoin du nom au minimum
  if(!currentFiche.id){
    if(!payload.nom){toast('Va dans Informations et renseigne au moins le nom');setTab('infos');return;}
  }

  let sid=currentFiche.id;
  if(sid){
    if(Object.keys(payload).length===0){/* rien à update côté salaries */}
    else{const{error}=await sb.from('salaries').update(payload).eq('id',sid);if(error){toast('Erreur: '+error.message);return;}}
  } else {
    if(!payload.pin_badgeuse) payload.pin_badgeuse=generatePin();
    const{data,error}=await sb.from('salaries').insert(payload).select().single();
    if(error){toast('Erreur: '+error.message);return;}
    sid=data.id;currentFiche.id=sid;
  }

  // rôles (si checkboxes présentes)
  const rc=document.getElementById('f_r_cuisine'), rk=document.getElementById('f_r_caisse');
  if(rc||rk){
    const want=[];if(rc?.checked)want.push('cuisine');if(rk?.checked)want.push('caisse');
    await sb.from('salarie_roles').delete().eq('salarie_id',sid).is('restaurant_id',null);
    if(want.length)await sb.from('salarie_roles').insert(want.map(r=>({salarie_id:sid,role:r})));
  }
  toast('Enregistré ✓');await loadAll();
  currentFiche=S.salaries.find(x=>x.id===sid);
  renderFiche();
}

function toggleSortie(v){
  const show=(v||'').toUpperCase().includes('CDD') || currentFiche.actif===false || currentFiche.date_sortie;
  const el=document.getElementById('fldSortie');

}

async function sortirSalarie(){
  if(!currentFiche.id)return;
  const today=new Date().toISOString().slice(0,10);
  const date=prompt('Date de sortie (AAAA-MM-JJ)',today);
  if(!date)return;
  if(!/^\d{4}-\d{2}-\d{2}$/.test(date)){toast('Format date invalide (AAAA-MM-JJ)');return;}
  const motif=prompt('Motif de la sortie (démission, fin de CDD, licenciement, rupture conventionnelle, abandon de poste, fin de période d\'essai, retraite, autre…)');
  if(motif===null)return;
  const{error}=await sb.from('salaries').update({date_sortie:date,motif_sortie:motif||null,actif:false}).eq('id',currentFiche.id);
  if(error){toast('Erreur: '+error.message);return;}
  toast('Salarié sorti ✓');await loadAll();
  currentFiche=S.salaries.find(x=>x.id===currentFiche.id);
  renderFiche();
}

async function reintegrerSalarie(){
  if(!currentFiche.id)return;
  if(!confirm('Réintégrer ce salarié ? (la date et le motif de sortie seront effacés)'))return;
  const{error}=await sb.from('salaries').update({date_sortie:null,motif_sortie:null,actif:true}).eq('id',currentFiche.id);
  if(error){toast('Erreur: '+error.message);return;}
  toast('Réintégré ✓');await loadAll();
  currentFiche=S.salaries.find(x=>x.id===currentFiche.id);
  renderFiche();
}

async function delSalarie(){
  if(!currentFiche.id)return;
  if(!confirm('Supprimer définitivement ce salarié et toutes ses données ?'))return;
  const{error}=await sb.from('salaries').delete().eq('id',currentFiche.id);
  if(error){toast('Erreur: '+error.message);return;}
  toast('Supprimé');await loadAll();closeFiche();
}

async function uploadDoc(){
  const id=currentFiche.id;
  const f=document.getElementById('nf_file').files[0];
  if(!f){toast('Choisis un fichier');return;}
  if(f.size>10485760){toast('Fichier > 10 Mo');return;}
  const type=document.getElementById('nf_type').value;
  const path=`${id}/${type}/${Date.now()}_${f.name.replace(/[^a-zA-Z0-9._-]/g,'_')}`;
  const up=await sb.storage.from('salaries-docs').upload(path,f,{contentType:f.type||'application/octet-stream'});
  if(up.error){toast('Upload: '+up.error.message);return;}
  const{error}=await sb.from('salarie_documents').insert({salarie_id:id,type,nom:f.name,path,taille:f.size,content_type:f.type});
  if(error){toast('DB: '+error.message);return;}
  const{data}=await sb.from('salarie_documents').select('*').order('created_at',{ascending:false});S.docs=data||[];
  renderFiche();render();toast('Uploadé ✓');
}
async function viewDoc(path){
  // Ouvre en preview dans nouvel onglet (le browser affiche le PDF natif)
  const{data,error}=await sb.storage.from('salaries-docs').createSignedUrl(path,300);
  if(error){toast('Erreur: '+error.message);return;}
  window.open(data.signedUrl,'_blank');
}
async function dlDoc(path,filename){
  // Force le téléchargement avec le bon nom de fichier
  const{data,error}=await sb.storage.from('salaries-docs').createSignedUrl(path,300,{download:filename||true});
  if(error){toast('Erreur: '+error.message);return;}
  const a=document.createElement('a');a.href=data.signedUrl;a.download=filename||'';
  document.body.appendChild(a);a.click();a.remove();
}
async function delDoc(did,path){
  if(!confirm('Supprimer ce document ?'))return;
  await sb.storage.from('salaries-docs').remove([path]);
  await sb.from('salarie_documents').delete().eq('id',did);
  const{data}=await sb.from('salarie_documents').select('*').order('created_at',{ascending:false});S.docs=data||[];
  renderFiche();render();toast('Supprimé');
}

// ===== OCR / Pré-remplissage =====
if(window.pdfjsLib) pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.worker.min.js';

function dateFR(d,m,y){const dd=String(d).padStart(2,'0'),mm=String(m).padStart(2,'0');let yy=String(y);if(yy.length===2)yy=(parseInt(yy)>30?'19':'20')+yy;return `${yy}-${mm}-${dd}`;}

function parseEmployeData(txt){
  const out={};
  const t=txt.replace(/[ \t]+/g,' ').replace(/ /g,' ');
  const flat=t.replace(/\s+/g,' ');

  // === N° sécu ===
  const secu=flat.match(/\b([12])[\s.\-]?(\d{2})[\s.\-]?(\d{2})[\s.\-]?(\d{2})[\s.\-]?(\d{3})[\s.\-]?(\d{3})[\s.\-]?(\d{2})\b/);
  if(secu) out.num_secu=secu.slice(1).join('');

  // === Email ===
  const em=flat.match(/[\w.+-]+@[\w-]+\.[\w.-]+/i);
  if(em) out.email=em[0];

  // === Téléphone FR ===
  const tel=flat.match(/(?:\+33[\s.\-]?|0)[1-9](?:[\s.\-]?\d{2}){4}/);
  if(tel) out.telephone=tel[0].replace(/[.\-]/g,' ').replace(/\s+/g,' ').trim();

  // === Code postal + ville ===
  const cpVille=flat.match(/\b(\d{5})\s+([A-ZÉÈÀÂÊÔÛÏÎÇ][A-Za-zéèàâêôûïîç\-]+(?:[\s\-][A-ZÉÈÀÂÊÔÛÏÎÇa-zéèàâêôûïîç\-]+){0,3})\b/);
  if(cpVille){out.code_postal=cpVille[1];out.ville=cpVille[2].trim();}

  // === Date de naissance ===
  // Format DD/MM/YYYY ou DD.MM.YYYY ou DD-MM-YYYY
  let dob=flat.match(/(?:n[ée]\(?e?\)?(?:\s+le)?|date\s*(?:de\s*)?naissance|naissance|date\s*nais)\s*:?\s*(\d{1,2})[\/.\-\s](\d{1,2})[\/.\-\s](\d{2,4})/i);
  if(dob){out.date_naissance=dateFR(dob[1],dob[2],dob[3]);}
  else{
    // Format "15 mars 1990"
    const dobL=flat.match(/(?:n[ée]\(?e?\)?(?:\s+le)?|date\s*(?:de\s*)?naissance|naissance)\s*:?\s*(\d{1,2})\s+(janvier|février|fevrier|mars|avril|mai|juin|juillet|août|aout|septembre|octobre|novembre|décembre|decembre)\s+(\d{4})/i);
    if(dobL){out.date_naissance=dateFR(dobL[1],MOIS_FR[dobL[2].toLowerCase()],dobL[3]);}
  }

  // === Date d'embauche / entrée / effet ===
  let dent=flat.match(/(?:date\s+d['’]?\s*embauche|date\s+d['’]?\s*entr[ée]e|date\s+d['’]?\s*effet|date\s+de\s+d[ée]but|prise\s+de\s+fonction|[àa]\s+compter\s+du|embauch[ée]\s*(?:e\s+)?(?:le|à\s+(?:partir\s+)?(?:du|de)?)|engag[ée]?\s*(?:e\s+)?(?:le|à\s+(?:partir\s+)?(?:du|de)?))\s*:?\s*(\d{1,2})[\/.\-\s](\d{1,2})[\/.\-\s](\d{2,4})/i);
  if(dent){out.date_entree=dateFR(dent[1],dent[2],dent[3]);}
  else{
    const dentL=flat.match(/(?:date\s+d['’]?\s*embauche|date\s+d['’]?\s*entr[ée]e|prise\s+de\s+fonction|[àa]\s+compter\s+du)\s*:?\s*(\d{1,2})\s+(janvier|février|fevrier|mars|avril|mai|juin|juillet|août|aout|septembre|octobre|novembre|décembre|decembre)\s+(\d{4})/i);
    if(dentL){out.date_entree=dateFR(dentL[1],MOIS_FR[dentL[2].toLowerCase()],dentL[3]);}
  }

  // === Nationalité ===
  const nat=flat.match(/nationalit[ée]\s*:?\s*([A-ZÉÈÀÂÊÔÛÏÎÇa-zéèàâêôûïîç\-]+)/i);
  if(nat) out.nationalite=nat[1].trim().replace(/^./,c=>c.toUpperCase());

  // === Nom + Prénom ===
  // 1) Patterns explicites "Nom : XXX" / "Prénom : YYY" (par ligne)
  const nomLine=t.match(/Nom(?:\s+de\s+(?:naissance|famille)|\s+patronymique|\s+d['’]usage)?\s*:?\s*([A-ZÉÈÀÂÊÔÛÏÎÇ][A-ZÉÈÀÂÊÔÛÏÎÇa-zéèàâêôûïîç\-' ]{1,40})/);
  if(nomLine) out.nom=nomLine[1].trim().split(/\s{2,}/)[0];
  const prenomLine=t.match(/Pr[ée]nom(?:s)?\s*:?\s*([A-ZÉÈÀÂÊÔÛÏÎÇa-zéèàâêôûïîç][A-ZÉÈÀÂÊÔÛÏÎÇa-zéèàâêôûïîç\-' ]{1,40})/);
  if(prenomLine) out.prenom=prenomLine[1].trim().split(/\s{2,}/)[0];

  // 2) Pattern "Madame/Monsieur PRENOM NOM" ou "Madame/Monsieur NOM Prénom"
  if(!out.nom || !out.prenom){
    const civ=flat.match(/(?:Madame|Mme|Monsieur|M\.|Mr)\s+([A-ZÉÈÀÂÊÔÛÏÎÇ][A-ZÉÈÀÂÊÔÛÏÎÇa-zéèàâêôûïîç\-']{1,30})\s+([A-ZÉÈÀÂÊÔÛÏÎÇ][A-ZÉÈÀÂÊÔÛÏÎÇa-zéèàâêôûïîç\-']{1,30})/);
    if(civ){
      const a=civ[1].trim(),b=civ[2].trim();
      const aUp=a===a.toUpperCase(), bUp=b===b.toUpperCase();
      if(aUp && !bUp){out.nom=out.nom||a; out.prenom=out.prenom||b;}
      else if(!aUp && bUp){out.prenom=out.prenom||a; out.nom=out.nom||b;}
      else{out.prenom=out.prenom||a; out.nom=out.nom||b;}
    }
  }
  // Format propre pour le prénom (Title Case)
  if(out.prenom) out.prenom=out.prenom.toLowerCase().replace(/(^|[\s\-'])([a-zéèàâêôûïîç])/g,(_,p,c)=>p+c.toUpperCase());

  // === Adresse ===
  const adr=t.match(/(?:Adresse|Demeurant|Domicili[ée])\s*:?\s*([^\n]{5,90})/i);
  if(adr) out.adresse=adr[1].trim().replace(/\s{2,}/g,' ');

  // === Type de contrat ===
  const contrats=[
    {re:/contrat\s+(?:de\s+travail\s+)?(?:à|a)\s+dur[ée]e\s+ind[ée]termin[ée]e|\bCDI\b/i,v:'CDI'},
    {re:/contrat\s+(?:de\s+travail\s+)?(?:à|a)\s+dur[ée]e\s+d[ée]termin[ée]e|\bCDD\b/i,v:'CDD'},
    {re:/contrat\s+d['’]apprentissage|\balternance\b|\bapprenti\b/i,v:'alternant'},
    {re:/contrat\s+de\s+professionnalisation/i,v:'professionnalisation'},
    {re:/\bextra\b/i,v:'extra'}
  ];
  for(const c of contrats){if(c.re.test(flat)){out.type_contrat=c.v;break;}}

  return out;
}

async function ocrPdf(file){
  const buf=await file.arrayBuffer();
  const pdf=await pdfjsLib.getDocument({data:buf}).promise;
  const n=Math.min(pdf.numPages,3);
  let text='';
  for(let i=1;i<=n;i++){
    const page=await pdf.getPage(i);
    const viewport=page.getViewport({scale:2});
    const canvas=document.createElement('canvas');
    canvas.width=viewport.width;canvas.height=viewport.height;
    await page.render({canvasContext:canvas.getContext('2d'),viewport}).promise;
    const{data:{text:t}}=await Tesseract.recognize(canvas,'fra');
    text+=t+'\n';
  }
  return text;
}

async function ocrExtract(ev){
  const file=ev.target.files[0];if(!file)return;
  const btn=document.getElementById('ocrBtn');
  if(btn){btn.disabled=true;btn.textContent='⏳ Lecture en cours…';}
  try{
    let text='';
    if(file.type==='application/pdf'){text=await ocrPdf(file);}
    else{const{data:{text:t}}=await Tesseract.recognize(file,'fra');text=t;}
    const found=parseEmployeData(text);
    const map={nom:'f_nom',prenom:'f_prenom',date_naissance:'f_naiss',num_secu:'f_secu',
      email:'f_email',telephone:'f_tel',adresse:'f_adr',code_postal:'f_cp',ville:'f_ville',
      type_contrat:'f_contrat',date_entree:'f_entree'};
    let n=0;const filled=[];
    for(const[k,id]of Object.entries(map)){
      const e=document.getElementById(id);
      if(e && found[k]){e.value=found[k];e.style.borderColor='var(--ok)';n++;filled.push(k);}
    }
    if(n) toast(`${n} champ(s) détecté(s) : ${filled.join(', ')} — vérifie avant d'enregistrer`);
    else toast('Aucun champ détecté — remplis manuellement');
  }catch(err){toast('Erreur OCR : '+err.message);}
  if(btn){btn.disabled=false;btn.textContent='📄 Pré-remplir depuis un document';}
  ev.target.value='';
}
