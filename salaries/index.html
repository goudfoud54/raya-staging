<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Raya — Gestion Salariés</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--gold:#c8a035;--dark:#0f0f1e;--card:#1a1a2e;--line:rgba(255,255,255,.08)}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--dark);color:#eee;min-height:100vh}
a{color:var(--gold);text-decoration:none}
.hidden{display:none!important}
/* PIN */
.lock{position:fixed;inset:0;background:var(--dark);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;z-index:100}
.lock h1{color:var(--gold);font-size:26px}
.lock input{padding:14px 18px;border-radius:12px;border:1px solid var(--line);background:#11111f;color:#fff;font-size:18px;text-align:center;width:240px}
.btn{padding:11px 18px;border-radius:10px;border:none;background:var(--gold);color:#1a1a1a;font-weight:700;cursor:pointer;font-size:14px}
.btn:hover{opacity:.9}
.btn.ghost{background:rgba(255,255,255,.08);color:#fff}
.btn.danger{background:#b03a3a;color:#fff}
.btn.sm{padding:6px 10px;font-size:12px}
/* layout */
header{display:flex;align-items:center;justify-content:space-between;padding:16px 22px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--dark);z-index:10}
.logo{color:var(--gold);font-size:20px;font-weight:800}
.logo span{color:#666;font-size:12px;font-weight:400;display:block}
.wrap{max-width:1100px;margin:0 auto;padding:20px}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:16px}
.toolbar input,.toolbar select{padding:9px 12px;border-radius:9px;border:1px solid var(--line);background:#11111f;color:#fff;font-size:13px}
.count{color:#777;font-size:12px;margin-left:auto}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{padding:10px 12px;text-align:left;border-bottom:1px solid var(--line)}
th{color:#888;font-weight:600;font-size:11px;text-transform:uppercase;letter-spacing:.04em}
tr:hover td{background:rgba(255,255,255,.03)}
.dot{display:inline-block;width:12px;height:12px;border-radius:50%;border:1px solid rgba(255,255,255,.3);vertical-align:middle;margin-right:7px}
.tag{display:inline-block;padding:2px 9px;border-radius:20px;font-size:11px;font-weight:600}
.tag.cuisine{background:rgba(200,101,26,.2);color:#e8a06a}
.tag.caisse{background:rgba(200,160,53,.2);color:#e0c46a}
.tag.off{background:rgba(255,255,255,.07);color:#777}
.muted{color:#777;font-size:12px}
/* modal */
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.6);display:flex;align-items:flex-start;justify-content:center;padding:30px 14px;overflow:auto;z-index:50}
.modal{background:var(--card);border:1px solid var(--line);border-radius:16px;width:100%;max-width:640px;padding:24px}
.modal h2{font-size:18px;margin-bottom:16px;color:#fff}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.fld{margin-bottom:12px}
.fld label{display:block;font-size:12px;color:#999;margin-bottom:5px}
.fld input,.fld select,.fld textarea{width:100%;padding:9px 11px;border-radius:9px;border:1px solid var(--line);background:#11111f;color:#fff;font-size:13px}
.section{border-top:1px solid var(--line);margin-top:18px;padding-top:16px}
.section h3{font-size:13px;color:var(--gold);text-transform:uppercase;letter-spacing:.04em;margin-bottom:10px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:8px}
.chk{display:flex;align-items:center;gap:7px;font-size:13px}
.chk input{width:auto}
.subitem{display:flex;gap:8px;align-items:center;background:#11111f;border:1px solid var(--line);border-radius:9px;padding:8px 10px;margin-bottom:7px;font-size:12px;flex-wrap:wrap}
.modal-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:22px}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#222;border:1px solid var(--line);padding:12px 20px;border-radius:10px;font-size:13px;z-index:200;opacity:0;transition:.3s}
.toast.show{opacity:1}
@media(max-width:640px){.grid2{grid-template-columns:1fr}.count{width:100%;margin:0}}
</style>
</head>
<body>
<div style="background:#b03a3a;color:#fff;text-align:center;padding:6px;font-size:12px;font-weight:700">ENVIRONNEMENT DE TEST — base séparée, aucune donnée de production</div>

<!-- VERROU -->
<div class="lock" id="lock">
  <h1>Gestion Salariés</h1>
  <div class="muted">Accès réservé · entre ton mot de passe</div>
  <input type="password" id="pw" placeholder="Mot de passe" onkeydown="if(event.key==='Enter')unlock()">
  <button class="btn" onclick="unlock()">Entrer</button>
  <div id="pwerr" style="color:#e07a7a;font-size:13px;height:16px"></div>
  <a href="../" style="font-size:12px;color:#666;margin-top:10px">← Retour au portail</a>
</div>

<!-- APP -->
<div id="app" class="hidden">
  <header>
    <div class="logo">Raya <span>Gestion Salariés</span></div>
    <div style="display:flex;gap:10px">
      <button class="btn" onclick="openEdit(null)">+ Salarié</button>
      <a href="../" class="btn ghost" style="display:inline-block">Portail</a>
    </div>
  </header>
  <div class="wrap">
    <div class="toolbar">
      <input id="search" placeholder="Rechercher un nom…" oninput="render()">
      <select id="fSnack" onchange="render()"><option value="">Tous les snacks</option></select>
      <select id="fRole" onchange="render()"><option value="">Tous les rôles</option><option value="cuisine">Cuisine</option><option value="caisse">Caisse</option></select>
      <select id="fActif" onchange="render()"><option value="1">Actifs</option><option value="">Tous</option><option value="0">Inactifs</option></select>
      <span class="count" id="count"></span>
    </div>
    <table>
      <thead><tr><th>Salarié</th><th>Snack</th><th>Rôles</th><th>Contrat</th><th>Heures</th><th>Dispos / Contraintes</th><th></th></tr></thead>
      <tbody id="tbody"></tbody>
    </table>
  </div>
</div>

<div id="modalHost"></div>
<div class="toast" id="toast"></div>

<script>
// ===== SUPABASE =====
const SUPA_URL='https://ynnqvtfayrdteqtgxeuk.supabase.co';
const SUPA_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InlubnF2dGZheXJkdGVxdGd4ZXVrIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzk4OTE1MTQsImV4cCI6MjA5NTQ2NzUxNH0._mfVAGexu7ew38UQk6adn42az4Gt_J3ePxR6O6wuWHc';
const sb=supabase.createClient(SUPA_URL,SUPA_KEY);
const ADMIN_PW='Rayan1301';

const JOURS=['Lundi','Mardi','Mercredi','Jeudi','Vendredi','Samedi','Dimanche'];
const CONTRAINTE_PRESETS=['pas_apres','pas_avant','pas_de_coupure','max_soirs_semaine','jours_off_consecutifs','indispo_jour','autre'];
const DOC_TYPES=['contrat','avenant','bulletin','cni','justif_dom','autre'];
let S={restos:[],salaries:[],roles:[],dispos:[],contraintes:[],paires:[],docs:[]};

// ===== AUTH =====
function unlock(){
  const v=document.getElementById('pw').value;
  if(v===ADMIN_PW){sessionStorage.setItem('sal_ok','1');showApp();}
  else document.getElementById('pwerr').textContent='Mot de passe incorrect';
}
function showApp(){
  document.getElementById('lock').classList.add('hidden');
  document.getElementById('app').classList.remove('hidden');
  loadAll();
}
if(sessionStorage.getItem('sal_ok')==='1') showApp();

// ===== TOAST =====
let tt;
function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('show'),2200);}

// ===== LOAD =====
async function loadAll(){
  const [r,s,ro,d,c,p,dx]=await Promise.all([
    sb.from('restaurants').select('*').eq('actif',true).order('nom'),
    sb.from('salaries').select('*').order('nom'),
    sb.from('salarie_roles').select('*'),
    sb.from('salarie_dispos').select('*'),
    sb.from('salarie_contraintes').select('*'),
    sb.from('salarie_paires').select('*'),
    sb.from('salarie_documents').select('*').order('created_at',{ascending:false})
  ]);
  S.restos=r.data||[];S.salaries=s.data||[];S.roles=ro.data||[];S.dispos=d.data||[];S.contraintes=c.data||[];S.paires=p.data||[];S.docs=dx.data||[];
  // remplir filtres snack
  const fS=document.getElementById('fSnack');
  fS.innerHTML='<option value="">Tous les snacks</option>'+S.restos.map(x=>`<option value="${x.id}">${x.nom}</option>`).join('')+'<option value="MULTI">MULTI</option>';
  render();
}
const snackName=id=>{const r=S.restos.find(x=>x.id===id);return r?r.nom:'—';};
const rolesOf=sid=>[...new Set(S.roles.filter(x=>x.salarie_id===sid).map(x=>x.role))];
const disposOf=sid=>S.dispos.filter(x=>x.salarie_id===sid);
const contrOf=sid=>S.contraintes.filter(x=>x.salarie_id===sid);
const docsOf=sid=>S.docs.filter(x=>x.salarie_id===sid);

// ===== RENDER LISTE =====
function render(){
  const q=(document.getElementById('search').value||'').toLowerCase();
  const fSn=document.getElementById('fSnack').value, fRo=document.getElementById('fRole').value, fAc=document.getElementById('fActif').value;
  let list=S.salaries.filter(s=>{
    if(q && !(s.nom||'').toLowerCase().includes(q)) return false;
    if(fSn==='MULTI'){if(!s.est_multi)return false;} else if(fSn){if(s.snack_origine_id!==fSn)return false;}
    if(fRo && !rolesOf(s.id).includes(fRo)) return false;
    if(fAc==='1' && !s.actif) return false;
    if(fAc==='0' && s.actif) return false;
    return true;
  });
  document.getElementById('count').textContent=list.length+' salarié(s)';
  document.getElementById('tbody').innerHTML=list.map(s=>{
    const rls=rolesOf(s.id).map(r=>`<span class="tag ${r}">${r}</span>`).join(' ')||'<span class="tag off">—</span>';
    const nd=disposOf(s.id).length, nc=contrOf(s.id).filter(c=>c.active).length;
    const h=(s.heures_min||s.heures_max)?`${s.heures_min??'?'}–${s.heures_max??'?'}h`:'<span class="muted">—</span>';
    return `<tr>
      <td><span class="dot" style="background:${s.couleur||'#444'}"></span><b>${s.nom}${s.prenom?' '+s.prenom:''}</b>${s.est_mineur?' <span class="muted">(mineur)</span>':''}${!s.actif?' <span class="tag off">inactif</span>':''}${s.email?'<div class="muted">'+s.email+(s.telephone?' · '+s.telephone:'')+'</div>':(s.telephone?'<div class="muted">'+s.telephone+'</div>':'')}</td>
      <td>${s.est_multi?'<span class="tag caisse">MULTI</span>':snackName(s.snack_origine_id)}</td>
      <td>${rls}</td>
      <td>${s.type_contrat||'<span class="muted">—</span>'}</td>
      <td>${h}</td>
      <td class="muted">${nd} dispo · ${nc} contr.</td>
      <td><button class="btn ghost sm" onclick="openEdit('${s.id}')">Éditer</button></td>
    </tr>`;
  }).join('')||'<tr><td colspan="7" class="muted" style="padding:30px;text-align:center">Aucun salarié</td></tr>';
}

// ===== MODAL EDIT =====
function openEdit(id){
  const s=id?S.salaries.find(x=>x.id===id):{};
  const isNew=!id;
  const snackOpts='<option value="">— (MULTI / aucun) —</option>'+S.restos.map(r=>`<option value="${r.id}" ${s.snack_origine_id===r.id?'selected':''}>${r.nom}</option>`).join('');
  const rls=id?rolesOf(id):[];
  document.getElementById('modalHost').innerHTML=`
  <div class="modal-bg" onclick="if(event.target===this)closeModal()">
   <div class="modal">
    <h2>${isNew?'Nouveau salarié':'Éditer · '+s.nom}</h2>
    <div class="grid2">
      <div class="fld"><label>Nom *</label><input id="f_nom" value="${s.nom||''}"></div>
      <div class="fld"><label>Prénom</label><input id="f_prenom" value="${s.prenom||''}"></div>
      <div class="fld"><label>Snack d'origine</label><select id="f_snack">${snackOpts}</select></div>
      <div class="fld"><label>Couleur</label><input type="color" id="f_couleur" value="${s.couleur||'#888888'}"></div>
      <div class="fld"><label>Type de contrat</label><input id="f_contrat" value="${s.type_contrat||''}" placeholder="CDI, CDD, extra, alternant…"></div>
      <div class="fld"><label>Plafond heures hebdo</label><input type="number" id="f_plafond" value="${s.plafond_heures??48}"></div>
      <div class="fld"><label>Heures min / semaine</label><input type="number" id="f_hmin" value="${s.heures_min??''}"></div>
      <div class="fld"><label>Heures max / semaine</label><input type="number" id="f_hmax" value="${s.heures_max??''}"></div>
    </div>
    <div class="row">
      <label class="chk"><input type="checkbox" id="f_multi" ${s.est_multi?'checked':''}> Multi-snacks</label>
      <label class="chk"><input type="checkbox" id="f_mineur" ${s.est_mineur?'checked':''}> Mineur</label>
      <label class="chk"><input type="checkbox" id="f_actif" ${(s.actif??true)?'checked':''}> Actif</label>
    </div>
    <div class="fld"><label>Notes</label><textarea id="f_notes" rows="2">${s.notes||''}</textarea></div>
    <div class="row" style="margin-top:6px">
      <span class="muted">Rôles :</span>
      <label class="chk"><input type="checkbox" id="f_r_cuisine" ${rls.includes('cuisine')?'checked':''}> Cuisine</label>
      <label class="chk"><input type="checkbox" id="f_r_caisse" ${rls.includes('caisse')?'checked':''}> Caisse</label>
    </div>

    <div class="section">
      <h3>Social / Administratif</h3>
      <div class="grid2">
        <div class="fld"><label>Date de naissance</label><input type="date" id="f_naiss" value="${s.date_naissance||''}"></div>
        <div class="fld"><label>Nationalité</label><input id="f_nat" value="${s.nationalite||''}"></div>
        <div class="fld"><label>N° Sécurité sociale</label><input id="f_secu" value="${s.num_secu||''}"></div>
        <div class="fld"><label>Matricule</label><input id="f_matricule" value="${s.matricule||''}"></div>
        <div class="fld"><label>Email</label><input type="email" id="f_email" value="${s.email||''}"></div>
        <div class="fld"><label>Téléphone</label><input id="f_tel" value="${s.telephone||''}"></div>
        <div class="fld"><label>Adresse</label><input id="f_adr" value="${s.adresse||''}"></div>
        <div class="fld"><label>Code postal</label><input id="f_cp" value="${s.code_postal||''}"></div>
        <div class="fld"><label>Ville</label><input id="f_ville" value="${s.ville||''}"></div>
        <div class="fld"><label>Intitulé de poste</label><input id="f_poste" value="${s.poste_intitule||''}"></div>
        <div class="fld"><label>Date d'entrée</label><input type="date" id="f_entree" value="${s.date_entree||''}"></div>
        <div class="fld"><label>Date de sortie</label><input type="date" id="f_sortie" value="${s.date_sortie||''}"></div>
      </div>
    </div>

    ${id?`
    <div class="section">
      <h3>Disponibilités / Indisponibilités</h3>
      <div id="dispoList"></div>
      <div class="row">
        <select id="nd_type"><option value="recurrente">Récurrente</option><option value="ponctuelle">Ponctuelle</option></select>
        <select id="nd_jour">${JOURS.map((j,i)=>`<option value="${i}">${j}</option>`).join('')}</select>
        <input id="nd_date" type="date" class="hidden">
        <input id="nd_hd" type="time" title="début"><input id="nd_hf" type="time" title="fin">
        <select id="nd_statut"><option value="indispo">Indispo</option><option value="dispo_limitee">Dispo limitée</option></select>
        <input id="nd_motif" placeholder="motif (école…)" style="width:120px">
        <button class="btn sm" onclick="addDispo('${id}')">+ Ajouter</button>
      </div>
    </div>
    <div class="section">
      <h3>Contraintes individuelles</h3>
      <div id="contrList"></div>
      <div class="row">
        <select id="nc_cle">${CONTRAINTE_PRESETS.map(c=>`<option value="${c}">${c}</option>`).join('')}</select>
        <input id="nc_val" placeholder="valeur (ex 19:00, true, 1)" style="width:160px">
        <button class="btn sm" onclick="addContrainte('${id}')">+ Ajouter</button>
      </div>
    </div>
    <div class="section">
      <h3>Documents</h3>
      <div id="docList"></div>
      <div class="row">
        <select id="nf_type">${DOC_TYPES.map(t=>`<option value="${t}">${t}</option>`).join('')}</select>
        <input id="nf_file" type="file" accept=".pdf,.png,.jpg,.jpeg,.doc,.docx" style="flex:1">
        <button class="btn sm" onclick="uploadDoc('${id}')">+ Uploader</button>
      </div>
      <div class="muted" style="font-size:11px">Max 10 Mo · PDF, images, Word</div>
    </div>`:'<div class="muted section">Enregistre d\'abord le salarié pour ajouter dispos, contraintes et documents.</div>'}

    <div class="modal-actions">
      ${id?`<button class="btn danger" onclick="delSalarie('${id}')">Supprimer</button>`:''}
      <button class="btn ghost" onclick="closeModal()">Annuler</button>
      <button class="btn" onclick="saveSalarie('${id||''}')">Enregistrer</button>
    </div>
   </div>
  </div>`;
  if(id){renderDispoList(id);renderContrList(id);renderDocList(id);}
  const ndt=document.getElementById('nd_type');
  if(ndt)ndt.onchange=()=>{const p=ndt.value==='ponctuelle';document.getElementById('nd_date').classList.toggle('hidden',!p);document.getElementById('nd_jour').classList.toggle('hidden',p);};
}
function closeModal(){document.getElementById('modalHost').innerHTML='';}

function renderDispoList(id){
  document.getElementById('dispoList').innerHTML=disposOf(id).map(d=>{
    const when=d.type==='ponctuelle'?(d.date_specifique||''):JOURS[d.jour_semaine]||'';
    const plage=(d.heure_debut||d.heure_fin)?`${(d.heure_debut||'').slice(0,5)}–${(d.heure_fin||'').slice(0,5)}`:'journée';
    return `<div class="subitem"><b>${when}</b> · ${plage} · ${d.statut} ${d.motif?'· '+d.motif:''}<button class="btn danger sm" style="margin-left:auto" onclick="delDispo('${d.id}','${id}')">×</button></div>`;
  }).join('')||'<div class="muted">Aucune</div>';
}
function renderContrList(id){
  document.getElementById('contrList').innerHTML=contrOf(id).map(c=>
    `<div class="subitem"><b>${c.cle}</b> = ${c.valeur||''} ${c.active?'':'(inactive)'}<button class="btn danger sm" style="margin-left:auto" onclick="delContrainte('${c.id}','${id}')">×</button></div>`
  ).join('')||'<div class="muted">Aucune</div>';
}
function fmtSize(n){if(!n)return'';if(n<1024)return n+' o';if(n<1048576)return(n/1024).toFixed(0)+' Ko';return(n/1048576).toFixed(1)+' Mo';}
function renderDocList(id){
  document.getElementById('docList').innerHTML=docsOf(id).map(d=>
    `<div class="subitem"><span style="background:rgba(200,160,53,.2);color:#e0c46a;padding:2px 8px;border-radius:10px;font-size:10px;font-weight:700">${d.type}</span> <b style="cursor:pointer;text-decoration:underline" onclick="dlDoc('${d.path}')">${d.nom}</b> <span class="muted">${fmtSize(d.taille)}</span><button class="btn danger sm" style="margin-left:auto" onclick="delDoc('${d.id}','${d.path}','${id}')">×</button></div>`
  ).join('')||'<div class="muted">Aucun document</div>';
}
async function uploadDoc(id){
  const f=document.getElementById('nf_file').files[0];
  if(!f){toast('Choisis un fichier');return;}
  if(f.size>10485760){toast('Fichier > 10 Mo');return;}
  const type=document.getElementById('nf_type').value;
  const path=`${id}/${type}/${Date.now()}_${f.name.replace(/[^a-zA-Z0-9._-]/g,'_')}`;
  const up=await sb.storage.from('salaries-docs').upload(path,f,{contentType:f.type||'application/octet-stream'});
  if(up.error){toast('Upload: '+up.error.message);return;}
  const{error}=await sb.from('salarie_documents').insert({salarie_id:id,type,nom:f.name,path,taille:f.size,content_type:f.type});
  if(error){toast('DB: '+error.message);return;}
  const{data}=await sb.from('salarie_documents').select('*').order('created_at',{ascending:false});S.docs=data||[];
  renderDocList(id);render();document.getElementById('nf_file').value='';toast('Uploadé ✓');
}
async function dlDoc(path){
  const{data,error}=await sb.storage.from('salaries-docs').createSignedUrl(path,300);
  if(error){toast('Erreur: '+error.message);return;}
  window.open(data.signedUrl,'_blank');
}
async function delDoc(did,path,id){
  if(!confirm('Supprimer ce document ?'))return;
  await sb.storage.from('salaries-docs').remove([path]);
  await sb.from('salarie_documents').delete().eq('id',did);
  const{data}=await sb.from('salarie_documents').select('*').order('created_at',{ascending:false});S.docs=data||[];
  renderDocList(id);render();toast('Supprimé');
}

// ===== CRUD =====
async function saveSalarie(id){
  const nom=document.getElementById('f_nom').value.trim();
  if(!nom){toast('Le nom est obligatoire');return;}
  const payload={
    nom, prenom:document.getElementById('f_prenom').value.trim()||null,
    snack_origine_id:document.getElementById('f_snack').value||null,
    couleur:document.getElementById('f_couleur').value,
    type_contrat:document.getElementById('f_contrat').value.trim()||null,
    plafond_heures:parseFloat(document.getElementById('f_plafond').value)||null,
    heures_min:document.getElementById('f_hmin').value!==''?parseFloat(document.getElementById('f_hmin').value):null,
    heures_max:document.getElementById('f_hmax').value!==''?parseFloat(document.getElementById('f_hmax').value):null,
    est_multi:document.getElementById('f_multi').checked,
    est_mineur:document.getElementById('f_mineur').checked,
    actif:document.getElementById('f_actif').checked,
    notes:document.getElementById('f_notes').value.trim()||null,
    date_naissance:document.getElementById('f_naiss').value||null,
    nationalite:document.getElementById('f_nat').value.trim()||null,
    num_secu:document.getElementById('f_secu').value.trim()||null,
    matricule:document.getElementById('f_matricule').value.trim()||null,
    email:document.getElementById('f_email').value.trim()||null,
    telephone:document.getElementById('f_tel').value.trim()||null,
    adresse:document.getElementById('f_adr').value.trim()||null,
    code_postal:document.getElementById('f_cp').value.trim()||null,
    ville:document.getElementById('f_ville').value.trim()||null,
    poste_intitule:document.getElementById('f_poste').value.trim()||null,
    date_entree:document.getElementById('f_entree').value||null,
    date_sortie:document.getElementById('f_sortie').value||null
  };
  let sid=id;
  if(id){const{error}=await sb.from('salaries').update(payload).eq('id',id);if(error){toast('Erreur: '+error.message);return;}}
  else{const{data,error}=await sb.from('salaries').insert(payload).select().single();if(error){toast('Erreur: '+error.message);return;}sid=data.id;}
  // rôles
  const want=[];if(document.getElementById('f_r_cuisine').checked)want.push('cuisine');if(document.getElementById('f_r_caisse').checked)want.push('caisse');
  await sb.from('salarie_roles').delete().eq('salarie_id',sid).is('restaurant_id',null);
  if(want.length)await sb.from('salarie_roles').insert(want.map(r=>({salarie_id:sid,role:r})));
  toast('Enregistré ✓');closeModal();await loadAll();
}
async function delSalarie(id){
  if(!confirm('Supprimer définitivement ce salarié et ses données associées ?'))return;
  const{error}=await sb.from('salaries').delete().eq('id',id);
  if(error){toast('Erreur: '+error.message);return;}
  toast('Supprimé');closeModal();await loadAll();
}
async function addDispo(id){
  const type=document.getElementById('nd_type').value;
  const row={salarie_id:id,type,statut:document.getElementById('nd_statut').value,
    motif:document.getElementById('nd_motif').value.trim()||null,
    heure_debut:document.getElementById('nd_hd').value||null,heure_fin:document.getElementById('nd_hf').value||null};
  if(type==='ponctuelle')row.date_specifique=document.getElementById('nd_date').value||null;
  else row.jour_semaine=parseInt(document.getElementById('nd_jour').value);
  const{error}=await sb.from('salarie_dispos').insert(row);
  if(error){toast('Erreur: '+error.message);return;}
  const{data}=await sb.from('salarie_dispos').select('*');S.dispos=data||[];renderDispoList(id);render();toast('Dispo ajoutée');
}
async function delDispo(did,id){await sb.from('salarie_dispos').delete().eq('id',did);const{data}=await sb.from('salarie_dispos').select('*');S.dispos=data||[];renderDispoList(id);render();}
async function addContrainte(id){
  const cle=document.getElementById('nc_cle').value;
  const{error}=await sb.from('salarie_contraintes').insert({salarie_id:id,cle,valeur:document.getElementById('nc_val').value.trim()||null,active:true});
  if(error){toast('Erreur: '+error.message);return;}
  const{data}=await sb.from('salarie_contraintes').select('*');S.contraintes=data||[];renderContrList(id);render();toast('Contrainte ajoutée');
}
async function delContrainte(cid,id){await sb.from('salarie_contraintes').delete().eq('id',cid);const{data}=await sb.from('salarie_contraintes').select('*');S.contraintes=data||[];renderContrList(id);render();}
</script>
