<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<script>(function(){var t=localStorage.getItem("eatime_theme");document.documentElement.setAttribute("data-theme",t==="light"?"light":"dark");})();</script>
<title>Eatime360 — Stock</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../access.js?v=1"></script>
<script src="../utils.js?v=1.2"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.31/jspdf.plugin.autotable.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root, [data-theme="dark"]{--gold:#c8a035;--bg:#0b0b15;--card:#15151f;--surface:#1c1c28;--line:rgba(255,255,255,.06);--line-2:rgba(255,255,255,.14);--text:#e8e8ec;--muted:#7b7b8a;--ok:#3fb87f;--warn:#e0a93a;--bad:#c45a5a;--info:#5b9cff}
[data-theme="light"]{--gold:#c8a035;--bg:#f5f5f7;--card:#ffffff;--surface:#f0f0f3;--line:rgba(0,0,0,.06);--line-2:rgba(0,0,0,.12);--text:#1a1a1f;--muted:#6b6b78;--ok:#2a8f5f;--warn:#b8841f;--bad:#b04444;--info:#4a7fbd}
html,body{height:100%}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;font-size:14px}
a{color:var(--gold);text-decoration:none}
.hidden{display:none!important}
input,select,textarea,button{font-family:inherit;color:var(--text)}
button{cursor:pointer;border:none;background:none}
.btn{padding:9px 14px;border-radius:8px;background:var(--gold);color:#1a1a1a;font-weight:600;font-size:13px;border:none;display:inline-flex;align-items:center;gap:6px}
.btn.ghost{background:transparent;color:var(--text);border:1px solid var(--line-2)}
.btn.bad{background:var(--bad);color:#fff}
.btn.ok{background:var(--ok);color:#111}
.btn.sm{padding:6px 11px;font-size:12px}
.lock{position:fixed;inset:0;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:20px}
.lock h1{color:var(--gold);font-size:22px}
.lock input{padding:12px 16px;border-radius:10px;border:1px solid var(--line-2);background:var(--surface);color:var(--text);font-size:14px;width:280px;outline:none;text-align:center}
.err{color:var(--bad);font-size:12px;min-height:16px}
.header{display:flex;align-items:center;justify-content:space-between;padding:14px 24px;border-bottom:1px solid var(--line);flex-wrap:wrap;gap:10px}
.brand{color:var(--gold);font-weight:700;font-size:16px}
.brand small{color:var(--muted);font-weight:400;font-size:12px;margin-left:8px}
.tabs{display:flex;gap:2px;padding:0 24px;border-bottom:1px solid var(--line);overflow-x:auto}
.tabs button{padding:11px 16px;border-bottom:2px solid transparent;color:var(--muted);font-weight:600;font-size:13px;white-space:nowrap}
.tabs button.active{color:var(--gold);border-color:var(--gold)}
.tabs button:hover{color:var(--text)}
.wrap{max-width:1400px;margin:0 auto;padding:24px 24px 60px}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:18px;align-items:center}
.toolbar select,.toolbar input{padding:8px 12px;border-radius:7px;border:1px solid var(--line-2);background:var(--surface);color:var(--text);font-size:13px;outline:none}
.grid{display:grid;gap:14px}
.grid.cards{grid-template-columns:repeat(auto-fill,minmax(220px,1fr))}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:18px}
.kpi .lbl{color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.05em;font-weight:600}
.kpi .val{font-size:28px;font-weight:800;margin-top:6px}
.kpi .sub{color:var(--muted);font-size:11.5px;margin-top:4px}
.kpi.ok .val{color:var(--ok)} .kpi.bad .val{color:var(--bad)} .kpi.warn .val{color:var(--warn)} .kpi.info .val{color:var(--info)}
table.tbl{width:100%;border-collapse:collapse;font-size:13px;background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden}
table.tbl th,table.tbl td{padding:9px 12px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle}
table.tbl th{font-size:10.5px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.05em;background:var(--surface)}
td.besoin-mobile{display:none} /* carte compacte : cachée en desktop (vue tableau), montrée sous 640px */
/* Sélecteur multi-snack de la Feuille de besoin */
.snack-chip{display:inline-flex;align-items:center;gap:7px;padding:6px 11px;border-radius:20px;border:1px solid var(--line-2);background:var(--surface);font-size:12.5px;cursor:pointer;user-select:none;white-space:nowrap}
.snack-chip input{cursor:pointer;margin:0}
.snack-chip.on{border-color:var(--gold);background:rgba(200,160,53,.12);color:var(--gold);font-weight:600}
.besoin-brk{font-size:11px;color:var(--muted);margin-top:2px}
.besoin-brk b{color:var(--text);font-weight:600}
table.tbl tr:last-child td{border-bottom:none}
table.tbl tr:hover{background:rgba(127,127,127,.04)}
.badge{display:inline-block;padding:2px 8px;border-radius:20px;font-size:10.5px;font-weight:700;text-transform:uppercase}
.badge.ok{background:rgba(63,184,127,.15);color:var(--ok)}
.badge.bad{background:rgba(196,90,90,.15);color:var(--bad)}
.badge.warn{background:rgba(224,169,58,.15);color:var(--warn)}
.section{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:20px;margin-bottom:16px}
.section h3{font-size:11.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;margin-bottom:14px;font-weight:600}
.fld{margin-bottom:12px}
.fld label{display:block;font-size:11.5px;color:var(--muted);margin-bottom:5px;font-weight:500}
.fld input,.fld textarea,.fld select{width:100%;padding:9px 11px;border-radius:7px;border:1px solid var(--line-2);background:var(--surface);color:var(--text);font-size:13px;outline:none}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
@media(max-width:700px){.grid2,.grid3{grid-template-columns:1fr}}
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.7);display:flex;align-items:center;justify-content:center;z-index:100;padding:20px}
.modal{background:var(--card);border:1px solid var(--line-2);border-radius:14px;padding:24px;max-width:640px;width:100%;max-height:90vh;overflow-y:auto}
.modal h2{font-size:16px;font-weight:700;margin-bottom:14px}
.modal-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:18px}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#222;border:1px solid var(--line-2);padding:11px 22px;border-radius:10px;font-size:13px;opacity:0;transition:.25s;z-index:200;color:#fff}
.toast.show{opacity:1}
.prog{height:6px;background:var(--surface);border-radius:3px;overflow:hidden;margin-top:4px}
.prog-bar{height:100%;background:var(--ok);transition:width .2s}
.prog-bar.warn{background:var(--warn)}
.prog-bar.bad{background:var(--bad)}

/* ─────────────── MOBILE (≤640px) ─────────────── */
@media(max-width:640px){
  .wrap{padding:16px 12px 40px}
  .header{padding:12px 14px}
  .brand{font-size:15px}
  .modal-bg{padding:10px}
  .modal{padding:18px 16px}
  .toolbar{gap:8px}
  .toolbar input,.toolbar select{flex:1 1 auto;min-width:0}
  /* Tables tabulaires : le wrapper .tbl-scroll (injecté par wrapTables) scrolle horizontalement
     le tableau SANS jamais faire déborder la page. La feuille de besoin (.tbl-besoin) est en cartes. */
  .tbl-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch;border:1px solid var(--line);border-radius:12px}
  .tbl-scroll table.tbl{border:none;border-radius:0;white-space:nowrap;min-width:max-content}

  /* Feuille de besoin → CARTES COMPACTES (2-3 lignes/produit). On masque les 8 <td> classiques et
     on n'affiche que la cellule .besoin-mobile. Header de catégorie une seule fois par groupe. */
  table.tbl-besoin{border:none;background:transparent}
  table.tbl-besoin thead{display:none}
  table.tbl-besoin,table.tbl-besoin tbody{display:block;width:100%}
  table.tbl-besoin tr{display:block;background:var(--surface);border:1px solid var(--line-2);border-radius:10px;padding:10px 12px;margin-bottom:7px}
  table.tbl-besoin tr td{display:none}                      /* on cache la vue tableau… */
  table.tbl-besoin tr td.besoin-mobile{display:block;padding:0;border:none} /* …on garde la carte */
  /* Header catégorie : dans la 1re carte du groupe seulement (séparateur de section, +espace au-dessus). */
  table.tbl-besoin tr.bcat-first{margin-top:16px}
  table.tbl-besoin tbody tr.bcat-first:first-child{margin-top:0}
  table.tbl-besoin tr.bcat-first::before{content:attr(data-cat);display:block;color:var(--gold);font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;margin-bottom:8px}
  .bm-name{font-size:14px;line-height:1.25;margin-bottom:4px}
  .bm-line{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin-bottom:2px}
  .bm-cmd{font-weight:800;color:var(--gold);font-size:15px;white-space:nowrap}
  .bm-sub{font-size:12px;color:var(--muted)}
  .bm-foot{font-size:11px;color:var(--muted)}
}
</style>
</head>
<body>

<div id="lock" class="lock hidden">
  <h1>Stock</h1>
  <div style="color:var(--muted);font-size:13px">Connexion requise</div>
  <input type="email" id="loginEmail" placeholder="Email">
  <input type="password" id="loginPw" placeholder="Mot de passe" onkeydown="if(event.key==='Enter')login()">
  <button class="btn" onclick="login()">Se connecter</button>
  <div class="err" id="err"></div>
  <a href="../" style="font-size:12px;color:var(--muted)">← Portail</a>
</div>

<div id="app" class="hidden">
  <div class="header">
    <div class="brand">Eatime360 <small>· Stock · v0.5</small></div>
    <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">
      <select id="snackSelect" onchange="onSnackChange()" style="padding:7px 11px;border-radius:7px;border:1px solid var(--line-2);background:var(--surface);color:var(--text);font-size:12.5px"></select>
      <a href="../" class="btn ghost sm">Portail</a>
      <button class="btn ghost sm" onclick="logout()">↩</button>
    </div>
  </div>
  <div class="tabs">
    <button data-tab="dashboard" class="active" onclick="setTab('dashboard')">📊 Dashboard</button>
    <button data-tab="saisie" onclick="setTab('saisie')">✍ Saisie quotidienne</button>
    <button data-tab="besoin" onclick="setTab('besoin')">🛒 Feuille de besoin</button>
    <button data-tab="produits" onclick="setTab('produits')">📦 Produits</button>
    <button data-tab="fournisseurs" onclick="setTab('fournisseurs')">🚚 Fournisseurs</button>
    <button data-tab="max" onclick="setTab('max')">⚖ Stock max</button>
    <button data-tab="historique" onclick="setTab('historique')">📈 Historique</button>
  </div>
  <div class="wrap" id="content"></div>
</div>

<div id="modalHost"></div>
<div class="toast" id="toast"></div>

<script>
const SUPA_URL='https://ynnqvtfayrdteqtgxeuk.supabase.co';
const SUPA_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InlubnF2dGZheXJkdGVxdGd4ZXVrIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzk4OTE1MTQsImV4cCI6MjA5NTQ2NzUxNH0._mfVAGexu7ew38UQk6adn42az4Gt_J3ePxR6O6wuWHc';
const sb=supabase.createClient(SUPA_URL,SUPA_KEY);
let ME=null,ORG={},SNACK=null,TAB='dashboard';
// Sélection multi-snack PROPRE à l'onglet Feuille de besoin (n'affecte pas le #snackSelect global qui
// pilote les autres onglets, volontairement mono-snack). Tableau de restaurant_id. Défaut = snack courant.
let BESOIN_SEL=null;
const S={snacks:[],produits:[],fournisseurs:[],stockMax:[],saisiesAujourdhui:{}};
const CATS=['Viandes & Frais','Boissons','Épicerie','Sauces','Emballages','Desserts','Épices','Entretien','Vaisselle','Matériel','Vêtements','Divers'];

let tt;function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('show'),2200);}
function val(id){const e=document.getElementById(id);return e?(e.value||'').trim():'';}
function num(id){const v=val(id);return v===''?null:parseFloat(v.replace(',','.'));}
/* fmtD factorisé dans utils.js (C3) */
function eur(n){if(n==null||isNaN(n))return'—';return Number(n).toFixed(2)+' €';}
function nameFourn(id){const f=S.fournisseurs.find(x=>x.id===id);return f?f.nom:'—';}

async function login(){const{error}=await sb.auth.signInWithPassword({email:val('loginEmail'),password:val('loginPw')});if(error){document.getElementById('err').textContent=error.message;return;}await loadProfileAndShow();}
async function loadProfileAndShow(){
  const{data:{session}}=await sb.auth.getSession();if(!session)return;
  const{data:profile}=await sb.from('profiles').select('*').eq('id',session.user.id).maybeSingle();
  if(!profile){document.getElementById('err').textContent='Profil introuvable.';await sb.auth.signOut();return;}
  ME=profile;
  const{data:org}=await sb.from('organizations').select('*').eq('id',profile.organization_id).maybeSingle();ORG=org||{};
  // Accès contrôlé par la config org (access.js), plus de liste de rôles codée en dur.
  if(!EatimeAccess.canAccessModule('stock', profile.role, ORG.permissions)){document.body.innerHTML=EatimeAccess.renderAccessDenied('Stock');return;}
  if(ORG.couleur_primaire) document.documentElement.style.setProperty('--gold',ORG.couleur_primaire);
  if(ORG.suspended && ME.role!=='super_admin'){document.body.innerHTML='<div style="min-height:100vh;display:flex;align-items:center;justify-content:center;color:var(--bad);font-size:18px;text-align:center;padding:20px">🚫 Organisation suspendue. Contacter le service client.</div>';return;}
  document.getElementById('lock').classList.add('hidden');document.getElementById('app').classList.remove('hidden');
  await loadCommonData();render();
}
async function logout(){await sb.auth.signOut();location.reload();}
sb.auth.getSession().then(({data})=>{if(data.session)loadProfileAndShow();else document.getElementById('lock').classList.remove('hidden');});

async function loadCommonData(){
  const[r,p,f,m]=await Promise.all([
    sb.from('restaurants').select('id,nom').eq('organization_id',ORG.id).order('nom'),
    sb.from('stock_produits').select('*').eq('organization_id',ORG.id).eq('actif',true).order('categorie').order('nom'),
    sb.from('fournisseurs').select('*').eq('organization_id',ORG.id).eq('actif',true).order('nom'),
    // On charge TOUS les stock_max (actifs ET désactivés) : l'onglet "Stock max" doit pouvoir voir
    // et réactiver une ligne désactivée. Les flows opérationnels filtrent `m.actif!==false` eux-mêmes.
    sb.from('stock_max').select('*').eq('organization_id',ORG.id),
  ]);
  S.snacks=r.data||[];S.produits=p.data||[];S.fournisseurs=f.data||[];S.stockMax=m.data||[];
  const sel=document.getElementById('snackSelect');
  sel.innerHTML=S.snacks.map(x=>`<option value="${x.id}">${x.nom}</option>`).join('');
  if(!SNACK && S.snacks.length){SNACK=S.snacks[0];sel.value=SNACK.id;}
}
function onSnackChange(){const id=val('snackSelect');SNACK=S.snacks.find(x=>x.id===id);render();}
function setTab(t){TAB=t;document.querySelectorAll('.tabs button').forEach(b=>b.classList.toggle('active',b.dataset.tab===t));updateSnackSelVisibility();render();}
// Sur l'onglet Feuille de besoin, le sélecteur global #snackSelect n'a plus aucun effet (ce sont les
// chips multi-snack locales qui pilotent) → on le masque pour lever l'ambiguïté « lequel fait quoi ? ».
// On le réaffiche sur tous les autres onglets, où il reste le seul sélecteur pertinent.
function updateSnackSelVisibility(){
  const sel=document.getElementById('snackSelect');
  if(sel) sel.style.display=(TAB==='besoin')?'none':'';
}

function render(){
  if(!SNACK){document.getElementById('content').innerHTML='<div class="section" style="text-align:center;color:var(--muted)">Aucun snack disponible.</div>';return;}
  const el=document.getElementById('content');
  if(TAB==='dashboard') return renderDashboard(el);
  if(TAB==='saisie') return renderSaisie(el);
  if(TAB==='besoin') return renderBesoin(el);
  if(TAB==='produits') return renderProduits(el);
  if(TAB==='fournisseurs') return renderFournisseurs(el);
  if(TAB==='max') return renderMax(el);
  if(TAB==='historique') return renderHistorique(el);
}

// Enveloppe chaque tableau tabulaire dans un conteneur .tbl-scroll (scroll horizontal LOCAL au
// tableau sur mobile, jamais toute la page). La feuille de besoin (.tbl-besoin) est exclue : elle
// passe en cartes via CSS. Idempotent + branché sur un MutationObserver car les renders sont async.
function wrapTables(){
  document.querySelectorAll('#content table.tbl:not(.tbl-besoin)').forEach(t=>{
    if(t.parentElement&&t.parentElement.classList.contains('tbl-scroll'))return;
    const w=document.createElement('div');w.className='tbl-scroll';
    t.parentNode.insertBefore(w,t);w.appendChild(t);
  });
}
(function(){const c=document.getElementById('content');if(c)new MutationObserver(wrapTables).observe(c,{childList:true,subtree:true});})();

async function renderDashboard(el){
  el.innerHTML='<div style="color:var(--muted)">Chargement…</div>';
  const today=new Date().toISOString().slice(0,10);
  const since=new Date();since.setDate(since.getDate()-30);
  const{data:saisies}=await sb.from('stock_saisies').select('*').eq('restaurant_id',SNACK.id).gte('date_saisie',since.toISOString().slice(0,10)).order('date_saisie',{ascending:false});
  const SL=saisies||[];
  const last={};SL.forEach(s=>{if(!last[s.produit_id]||s.date_saisie>last[s.produit_id].date_saisie)last[s.produit_id]=s;});
  const aujourdhui=SL.filter(s=>s.date_saisie===today);
  const stockMaxSnack=S.stockMax.filter(m=>m.restaurant_id===SNACK.id && m.actif!==false); // produits désactivés exclus du suivi
  // Produits « commentaire seul » : pas de quantité → exclus des agrégats NUMÉRIQUES (ruptures, valo,
  // sous-seuil). Restent comptés en « produits suivis » / « non saisis » (ils exigent une saisie du jour).
  const cmtOnlyIds=new Set(stockMaxSnack.filter(m=>m.mode_commentaire==='obligatoire').map(m=>m.produit_id));
  const produitsManquants=stockMaxSnack.filter(m=>!last[m.produit_id]);
  const ruptures=Object.values(last).filter(s=>!cmtOnlyIds.has(s.produit_id) && (Number(s.quantite)||0)===0);
  let valorisation=0;Object.values(last).forEach(s=>{if(cmtOnlyIds.has(s.produit_id))return;const p=S.produits.find(x=>x.id===s.produit_id);if(p)valorisation+=Number(s.quantite||0)*Number(p.cout_unitaire||0);});
  let html=`<h2 style="font-size:18px;font-weight:700;margin-bottom:6px">Dashboard Stock</h2>
    <div style="color:var(--muted);font-size:12.5px;margin-bottom:18px">${SNACK.nom} · 30 derniers jours</div>
    <div class="grid cards" style="margin-bottom:24px">
      <div class="kpi"><div class="lbl">Produits suivis</div><div class="val">${stockMaxSnack.length}</div></div>
      <div class="kpi ${aujourdhui.length>0?'ok':'warn'}"><div class="lbl">Saisies aujourd'hui</div><div class="val">${aujourdhui.length}</div></div>
      <div class="kpi ${produitsManquants.length>0?'bad':'ok'}"><div class="lbl">Non saisis (30j)</div><div class="val">${produitsManquants.length}</div></div>
      <div class="kpi ${ruptures.length>0?'bad':'ok'}"><div class="lbl">Ruptures</div><div class="val">${ruptures.length}</div></div>
      <div class="kpi info"><div class="lbl">Valorisation stock</div><div class="val">${eur(valorisation)}</div><div class="sub">dernières saisies × coût unit.</div></div>
    </div>`;
  const sousSeuil=[];
  stockMaxSnack.forEach(m=>{
    if(cmtOnlyIds.has(m.produit_id))return; // commentaire seul : pas de seuil numérique
    const l=last[m.produit_id];const qte=l?Number(l.quantite):0;
    const pct=Number(m.quantite_max)?qte/Number(m.quantite_max)*100:0;
    if(pct<50) sousSeuil.push({produit:S.produits.find(p=>p.id===m.produit_id),qte,max:Number(m.quantite_max),pct,date:l?.date_saisie});
  });
  sousSeuil.sort((a,b)=>a.pct-b.pct);
  html+=`<div class="section"><h3>Produits sous 50% du stock max</h3>
    <table class="tbl"><thead><tr><th>Produit</th><th>Qté</th><th>Max</th><th>%</th><th>Dernière saisie</th></tr></thead><tbody>
    ${sousSeuil.slice(0,15).map(x=>`<tr><td><b>${x.produit?.nom||'?'}</b><div class="prog"><div class="prog-bar ${x.pct<25?'bad':'warn'}" style="width:${Math.min(100,x.pct)}%"></div></div></td><td>${x.qte}</td><td>${x.max}</td><td>${x.pct.toFixed(0)}%</td><td style="color:var(--muted);font-size:11.5px">${fmtD(x.date)}</td></tr>`).join('')||'<tr><td colspan="5" style="text-align:center;color:var(--muted);padding:20px">✓ Tout est au-dessus de 50%</td></tr>'}
    </tbody></table></div>`;
  el.innerHTML=html;
}

async function renderSaisie(el){
  const today=new Date().toISOString().slice(0,10);
  const{data:saisies}=await sb.from('stock_saisies').select('*').eq('restaurant_id',SNACK.id).eq('date_saisie',today);
  const byProd={};(saisies||[]).forEach(s=>{byProd[s.produit_id]=s;});S.saisiesAujourdhui=byProd;
  const max={};S.stockMax.filter(m=>m.restaurant_id===SNACK.id).forEach(m=>max[m.produit_id]=m);
  // Produits désactivés sur CE snack (seuil défini mais actif=false) : exclus de la saisie du jour.
  const disabled=new Set(S.stockMax.filter(m=>m.restaurant_id===SNACK.id && m.actif===false).map(m=>m.produit_id));
  const prodsSuivis=S.produits.filter(p=>!disabled.has(p.id));
  const byCat={};prodsSuivis.forEach(p=>{const c=p.categorie||'Divers';(byCat[c]=byCat[c]||[]).push(p);});
  let html=`<div class="toolbar">
    <input id="saisie_search" placeholder="Filtrer produit…" oninput="filterSaisie()">
    <div style="flex:1"></div>
    <span style="color:var(--muted);font-size:12.5px">${Object.keys(byProd).length} / ${prodsSuivis.length} saisis aujourd'hui</span>
  </div>`;
  Object.keys(byCat).sort().forEach(cat=>{
    html+=`<div class="section"><h3>${cat} (${byCat[cat].length})</h3>
      <table class="tbl"><thead><tr><th>Produit</th><th>Cond.</th><th>Stock max</th><th>Saisie</th><th>État</th></tr></thead><tbody>`;
    byCat[cat].forEach(p=>{
      const m=max[p.id];const cur=byProd[p.id];const qte=cur?cur.quantite:'';
      const maxQ=m?Number(m.quantite_max):null;
      const cmtOnly=(m&&m.mode_commentaire)==='obligatoire';
      const cmt=cur&&cur.commentaire?String(cur.commentaire):''; const cmtA=cmt.replace(/"/g,'&quot;');
      const cmtBadge=cmt?` <span title="${cmtA}" data-c="${cmtA}" onclick="toast('💬 '+this.getAttribute('data-c'))" style="cursor:pointer;font-size:12px" aria-label="Commentaire salarié">💬</span>`:'';
      if(cmtOnly){
        // « Commentaire seul » : pas de quantité. On affiche la remarque du salarié (lecture) ; saisi = remarque présente.
        const saisieCell=cmt?`<span style="font-size:12.5px">📝 ${cmt.replace(/</g,'&lt;')}</span>`:'<span style="color:var(--muted);font-size:11px">— commentaire requis —</span>';
        const etat=cmt?'<span style="color:var(--ok);font-size:11px">✓ saisi</span>':'<span style="color:var(--muted);font-size:11px">non saisi</span>';
        html+=`<tr data-pname="${p.nom.toLowerCase()}"><td><b>${p.nom}</b> <span title="Commentaire seul (pas de quantité)" style="font-size:11px">📝</span></td><td style="color:var(--muted);font-size:11.5px">${p.conditionnement||''}</td><td style="color:var(--muted)">—</td><td>${saisieCell}</td><td>${etat}</td></tr>`;
        return;
      }
      const pct=maxQ&&qte!==''&&qte!=null?Math.min(100,Number(qte)/maxQ*100):0;
      const etat=cur?`<div class="prog"><div class="prog-bar ${pct<25?'bad':pct<50?'warn':''}" style="width:${pct}%"></div></div>`:'<span style="color:var(--muted);font-size:11px">non saisi</span>';
      html+=`<tr data-pname="${p.nom.toLowerCase()}"><td><b>${p.nom}</b>${cmtBadge}</td><td style="color:var(--muted);font-size:11.5px">${p.conditionnement||''}</td><td style="color:var(--muted)">${maxQ??'—'}</td><td><input type="number" step="0.5" data-pid="${p.id}" value="${qte}" placeholder="${maxQ??''}" onblur="saveSaisie('${p.id}',this.value)" style="width:80px;padding:6px 8px;border-radius:6px;border:1px solid var(--line-2);background:var(--surface);color:var(--text);font-size:13px;text-align:center"></td><td>${etat}</td></tr>`;
    });
    html+='</tbody></table></div>';
  });
  el.innerHTML=html;
}
function filterSaisie(){const q=val('saisie_search').toLowerCase();document.querySelectorAll('[data-pname]').forEach(tr=>{tr.style.display=tr.dataset.pname.includes(q)?'':'none';});}
async function saveSaisie(pid,vTxt){
  const v=parseFloat((vTxt||'').replace(',','.'));
  const d=new Date().toISOString().slice(0,10);
  // Chaque écriture est contrôlée : avant, UPDATE/DELETE avalaient l'erreur et le toast "✓ Saisi"
  // s'affichait quand même → l'admin croyait une saisie enregistrée alors que la base n'avait rien reçu.
  if(isNaN(v)){
    if(S.saisiesAujourdhui[pid]){
      const{error}=await sb.from('stock_saisies').delete().eq('id',S.saisiesAujourdhui[pid].id);
      if(error){toast('⚠ Non enregistré : '+error.message);return;}
      delete S.saisiesAujourdhui[pid];
    }
    return;
  }
  if(v<0){toast('⚠ Quantité négative impossible');return;}
  const existing=S.saisiesAujourdhui[pid];
  if(existing){
    const{error}=await sb.from('stock_saisies').update({quantite:v}).eq('id',existing.id);
    if(error){toast('⚠ Non enregistré : '+error.message);return;}
    existing.quantite=v;
  } else {
    const{data,error}=await sb.from('stock_saisies').insert({organization_id:ORG.id,restaurant_id:SNACK.id,produit_id:pid,quantite:v,date_saisie:d}).select().single();
    if(error){toast('⚠ Non enregistré : '+error.message);return;}
    S.saisiesAujourdhui[pid]=data;
  }
  toast('✓ Saisi');
}

const BESOIN_STALE_DAYS=4; // au-delà, la dernière saisie est signalée "donnée ancienne" (stock probablement obsolète)
function daysSince(dateStr){ if(!dateStr) return null; const d=new Date(dateStr+'T00:00:00'); const now=new Date(); now.setHours(0,0,0,0); return Math.round((now-d)/86400000); }
const shortSnack=n=>(n||'').replace(/^Raya\s+/i,'').trim()||n;
// ── SOURCE UNIQUE des besoins (affichage + copier WhatsApp + PDF → toujours cohérents) ──
// Agrège PAR PRODUIT sur la liste de snacks donnée : le besoin total d'un produit = SOMME des besoins
// calculés snack par snack (un même produit peut avoir un max différent par snack, table stock_max
// scopée par restaurant_id). On ne somme que les snacks CONTRIBUTEURS (need>0, donc max>cur) → totalMax
// et totalCur restent cohérents avec totalNeed (totalNeed = totalMax − totalCur). Détail par snack
// conservé (perSnack) pour l'affichage/exports multi. staleAtMax listé par (snack,produit).
async function computeBesoin(snackIds){
  const ids=(snackIds||[]).filter(Boolean);
  if(!ids.length) return {list:[],notes:[],staleAtMax:[],totalEur:0,snackIds:[],snackNames:[],multi:false};
  const{data:saisies}=await sb.from('stock_saisies').select('restaurant_id,produit_id,quantite,commentaire,date_saisie').in('restaurant_id',ids).order('date_saisie',{ascending:false});
  const last={};(saisies||[]).forEach(s=>{const b=last[s.restaurant_id]=last[s.restaurant_id]||{};if(!b[s.produit_id]||s.date_saisie>b[s.produit_id].date_saisie)b[s.produit_id]=s;});
  const snackNom=sid=>{const r=S.snacks.find(x=>x.id===sid);return r?r.nom:'?';};
  const aggMap={};const staleAtMax=[];
  ids.forEach(sid=>{
    // produits désactivés exclus, ET produits « commentaire seul » (pas de seuil quantité → hors feuille de besoin)
    S.stockMax.filter(m=>m.restaurant_id===sid && m.actif!==false && m.mode_commentaire!=='obligatoire').forEach(m=>{
      const p=S.produits.find(x=>x.id===m.produit_id);if(!p)return;
      const l=(last[sid]||{})[m.produit_id];
      const jamais=!l;const cur=jamais?0:Number(l.quantite);
      const max=Number(m.quantite_max);const need=Math.max(0,max-cur);
      const date=l?l.date_saisie:null;const age=daysSince(date);
      const stale=(!jamais && age!==null && age>BESOIN_STALE_DAYS);
      if(need<=0){ if(stale) staleAtMax.push({produit:p,snack:snackNom(sid),cur,date,age}); return; }
      const a=aggMap[p.id]=aggMap[p.id]||{produit:p,totalNeed:0,totalCur:0,totalMax:0,perSnack:[],anyStale:false,anyJamais:false};
      a.totalNeed+=need;a.totalCur+=cur;a.totalMax+=max;
      a.perSnack.push({sid,snack:snackNom(sid),cur,max,need,date,age,jamais,stale});
      if(jamais)a.anyJamais=true; if(stale)a.anyStale=true;
    });
  });
  const list=Object.values(aggMap).sort((a,b)=>{const c=(a.produit.categorie||'Divers').localeCompare(b.produit.categorie||'Divers');return c!==0?c:a.produit.nom.localeCompare(b.produit.nom);});
  const totalEur=list.reduce((a,x)=>a+x.totalNeed*Number(x.produit.cout_unitaire||0),0);
  staleAtMax.sort((a,b)=>b.age-a.age);
  // Produits « commentaire seul » (mode_commentaire='obligatoire') : pas de quantité → hors calcul
  // numérique ci-dessus, MAIS le/la magasinier·ère doit voir la dernière remarque saisie (ex: monnaie
  // → « 50€ de fond de caisse », tiramisu → « goûts : coco, pistache »). On remonte la DERNIÈRE note
  // par (snack, produit) dans une liste séparée `notes`, jamais mêlée aux totaux € ni aux lignes numériques.
  const notesMap={};
  ids.forEach(sid=>{
    S.stockMax.filter(m=>m.restaurant_id===sid && m.actif!==false && m.mode_commentaire==='obligatoire').forEach(m=>{
      const p=S.produits.find(x=>x.id===m.produit_id);if(!p)return;
      const l=(last[sid]||{})[m.produit_id];
      const cmt=l&&l.commentaire?String(l.commentaire).trim():'';
      if(!cmt)return; // pas encore de remarque saisie sur ce snack → rien à afficher
      const n=notesMap[p.id]=notesMap[p.id]||{produit:p,perSnack:[]};
      n.perSnack.push({sid,snack:snackNom(sid),commentaire:cmt,date:l.date_saisie,age:daysSince(l.date_saisie)});
    });
  });
  const notes=Object.values(notesMap).sort((a,b)=>{const c=(a.produit.categorie||'Divers').localeCompare(b.produit.categorie||'Divers');return c!==0?c:a.produit.nom.localeCompare(b.produit.nom);});
  return {list,notes,staleAtMax,totalEur,snackIds:ids,snackNames:ids.map(snackNom),multi:ids.length>1};
}
// Sélecteur multi-snack (checkboxes + "Tout") — propre à cet onglet.
function besoinSelectorHtml(){
  const sel=BESOIN_SEL||[];
  const allOn=S.snacks.length>0 && S.snacks.every(s=>sel.includes(s.id));
  return `<div class="section" style="padding:12px 14px;margin-bottom:12px">
    <div style="font-size:12px;color:var(--muted);margin-bottom:9px;font-weight:600">🏪 Snacks inclus dans la commande</div>
    <div style="display:flex;flex-wrap:wrap;gap:8px;align-items:center">
      ${S.snacks.map(s=>`<label class="snack-chip ${sel.includes(s.id)?'on':''}"><input type="checkbox" ${sel.includes(s.id)?'checked':''} onchange="toggleBesoinSnack('${s.id}',this.checked)">${s.nom}</label>`).join('')}
      <button class="btn ghost sm" onclick="toggleAllBesoinSnacks(${allOn?'false':'true'})">${allOn?'Tout désélectionner':'Tout sélectionner'}</button>
    </div>
  </div>`;
}
function toggleBesoinSnack(id,on){
  BESOIN_SEL=(BESOIN_SEL||[]).slice();
  if(on){ if(!BESOIN_SEL.includes(id))BESOIN_SEL.push(id); } else BESOIN_SEL=BESOIN_SEL.filter(x=>x!==id);
  renderBesoin(document.getElementById('content'));
}
function toggleAllBesoinSnacks(on){ BESOIN_SEL=on?S.snacks.map(s=>s.id):[]; renderBesoin(document.getElementById('content')); }

async function renderBesoin(el){
  el.innerHTML='<div style="color:var(--muted)">Calcul…</div>';
  // Défaut : snack global courant. Filtré aux snacks encore existants (pas d'id fantôme).
  if(!BESOIN_SEL) BESOIN_SEL=[SNACK.id];
  BESOIN_SEL=BESOIN_SEL.filter(id=>S.snacks.some(s=>s.id===id));
  const R=await computeBesoin(BESOIN_SEL);
  const besoin=R.list, multi=R.multi, totalEur=R.totalEur;
  const titre = multi ? R.snackNames.join(' + ') : (R.snackNames[0]||SNACK.nom);
  // Encart "à recompter" : produits au max mais sur données anciennes (par snack en mode multi).
  const staleAtMax=R.staleAtMax;
  const staleNote=staleAtMax.length?`<div class="section" style="border-color:var(--warn)">
    <h3 style="color:var(--warn)">⚠️ ${staleAtMax.length} produit${staleAtMax.length>1?'s':''} au max mais sur données anciennes — à recompter</h3>
    <div style="color:var(--muted);font-size:12.5px;margin-bottom:8px">Dernière saisie ≥ ${BESOIN_STALE_DAYS} j : le stock a pu se vider depuis, ces produits n'apparaissent pas dans la commande ci-dessous.</div>
    <table class="tbl"><thead><tr>${multi?'<th>Snack</th>':''}<th>Produit</th><th>Dernier compte</th><th>Dernière saisie</th></tr></thead><tbody>
    ${staleAtMax.map(x=>`<tr>${multi?`<td>${shortSnack(x.snack)}</td>`:''}<td><b>${x.produit.nom}</b></td><td>${x.cur}</td><td style="color:var(--warn);font-size:12px">${fmtD(x.date)} · ${x.age} j</td></tr>`).join('')}
    </tbody></table></div>`:'';
  // Section « Notes » : produits « commentaire seul » avec leur dernière remarque (par snack en multi
  // si les notes diffèrent). Distincte du tableau numérique et des totaux €.
  const notes=R.notes||[];
  const notesSection=notes.length?`<div class="section">
    <h3 style="color:var(--gold)">📝 Notes (sans quantité)</h3>
    <div style="color:var(--muted);font-size:12.5px;margin-bottom:8px">Produits à remarque libre (monnaie, goûts à prévoir…) — pas de quantité calculée, à lire avant la tournée.</div>
    <table class="tbl"><thead><tr><th>Produit</th>${multi?'<th>Snack</th>':''}<th>Note</th><th>Saisie</th></tr></thead><tbody>
    ${notes.map(n=>n.perSnack.map((ps,i)=>`<tr><td style="vertical-align:top">${i===0?`<b>${n.produit.nom}</b>`:''}</td>${multi?`<td>${shortSnack(ps.snack)}</td>`:''}<td style="color:var(--warn)">💬 ${String(ps.commentaire).replace(/</g,'&lt;')}</td><td style="color:var(--muted);font-size:12px">${fmtD(ps.date)}${ps.age>BESOIN_STALE_DAYS?` · ${ps.age}j`:''}</td></tr>`).join('')).join('')}
    </tbody></table></div>`:'';
  let html=besoinSelectorHtml()+`<div class="toolbar">
    <h2 style="font-size:18px;font-weight:700;flex:1">Feuille de besoin — ${titre}</h2>
    <button class="btn ghost" onclick="copyBesoinAll()">📋 Copier toute la commande</button>
    <button class="btn" onclick="exportBesoinPDF()">📄 Export PDF</button>
  </div>`;
  window._BESOIN=R; // exposé pour copier/PDF
  if(!BESOIN_SEL.length){ html+='<div class="section" style="text-align:center;color:var(--muted)">Sélectionne au moins un snack ci-dessus.</div>'; el.innerHTML=html; return; }
  if(!besoin.length){
    html+=staleNote+notesSection;
    if(!staleNote && !notesSection) html+='<div class="section" style="text-align:center;color:var(--ok)">✓ Aucun besoin — stocks au max partout</div>';
    el.innerHTML=html;return;
  }
  html+=`<div class="section">
    <input id="besoin_search" placeholder="🔍 Rechercher un produit…" oninput="filterBesoin()" style="width:100%;margin-bottom:12px;padding:9px 12px;border-radius:8px;border:1px solid var(--line-2);background:var(--surface);color:var(--text);font-size:13px;outline:none">
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:12px">
      <div style="color:var(--muted);font-size:13px" id="besoin_count">${besoin.length} produit${besoin.length>1?'s':''} à commander</div>
      <div style="font-weight:700;font-size:15px">${eur(totalEur)} HT estimé</div>
    </div>
    <table class="tbl tbl-besoin"><thead><tr><th>Catégorie</th><th>Produit</th><th>Fournisseur</th><th>Actuel</th><th>Max</th><th>À commander</th><th>Cond.</th><th>€ HT</th></tr></thead><tbody>`;
  let prevCat=null;
  besoin.forEach(x=>{
    const cat=x.produit.categorie||'Divers';
    const isFirstOfCat=cat!==prevCat;
    const cond=x.produit.cond_fourn1||x.produit.conditionnement||'';
    const fnom=x.produit.fournisseur_principal_id?nameFourn(x.produit.fournisseur_principal_id):'<span style="color:var(--muted)">—</span>';
    const catCell=cat===prevCat?'':`<b style="color:var(--gold);font-size:12.5px;text-transform:uppercase;letter-spacing:.03em">${cat}</b>`;
    prevCat=cat;
    const fournName=x.produit.fournisseur_principal_id?nameFourn(x.produit.fournisseur_principal_id):'—';
    const unite=x.produit.unite||'';
    const need=x.totalNeed;
    const eurHT=eur(need*Number(x.produit.cout_unitaire||0));
    const ps0=x.perSnack[0]; // en mono, seul et unique snack contributeur
    // MULTI : totaux + détail par snack (nommant les snacks jamais/anciens). MONO : identique à avant.
    const cur = multi ? x.totalCur : ps0.cur, max = multi ? x.totalMax : ps0.max;
    let saisieInfo, brk='';
    if(multi){
      brk=`<div class="besoin-brk">`+x.perSnack.map(p=>`<b>${shortSnack(p.snack)}</b> ${p.need}${p.jamais?' ⚠️jamais':(p.stale?` ⚠️${p.age}j`:'')}`).join(' · ')+`</div>`;
      saisieInfo = (x.anyJamais||x.anyStale) ? `<span style="color:var(--warn)">⚠️ à vérifier (voir détail)</span>` : `${x.perSnack.length} snack${x.perSnack.length>1?'s':''}`;
    } else {
      if(ps0.jamais){ saisieInfo=`<span style="color:var(--warn)">⚠️ jamais saisi</span>`; }
      else if(ps0.age!==null && ps0.age>BESOIN_STALE_DAYS){ saisieInfo=`<span style="color:var(--warn)">${fmtD(ps0.date)} · ⚠️ donnée ancienne (${ps0.age} j)</span>`; }
      else { saisieInfo=`dernière saisie : ${fmtD(ps0.date)}`; }
    }
    const curTxt = multi ? cur : (ps0.jamais?'?':cur);
    const actuelCell = multi ? cur : (ps0.jamais?'<span style="color:var(--muted)">?</span>':cur);
    const warnIcon = multi
      ? ((x.anyJamais||x.anyStale)?'<span style="color:var(--warn)" title="Voir détail par snack">⚠️</span>':'')
      : (ps0.jamais?'<span style="color:var(--warn)" title="Jamais saisi">⚠️</span>':(ps0.age!==null&&ps0.age>BESOIN_STALE_DAYS?`<span style="color:var(--warn)" title="Donnée ancienne (${ps0.age} j)">⚠️</span>`:''));
    const pname=(x.produit.nom+' '+fournName+(multi?' '+x.perSnack.map(p=>p.snack).join(' '):'')).toLowerCase().replace(/"/g,'');
    html+=`<tr class="${isFirstOfCat?'bcat-first':''}" data-cat="${cat}" data-pname="${pname}"><td data-label="Catégorie" style="vertical-align:top">${catCell}</td><td data-label="Produit"><b>${x.produit.nom}</b><div style="font-size:11px;color:var(--muted)">${saisieInfo}</div>${brk}</td><td data-label="Fournisseur" style="font-size:12.5px">${fnom}</td><td data-label="Actuel">${actuelCell}</td><td data-label="Max">${max}</td><td data-label="À commander"><b style="color:var(--gold);font-size:15px">${need}</b> ${unite}</td><td data-label="Cond." style="color:var(--muted);font-size:11.5px">${cond}</td><td data-label="€ HT">${eurHT}</td><td class="besoin-mobile"><div class="bm-name"><b>${x.produit.nom}</b> ${warnIcon}</div><div class="bm-line"><span class="bm-cmd">→ ${need} ${unite}</span><span class="bm-sub">stock ${curTxt}/${max}${cond?' · '+cond:''}</span></div><div class="bm-foot">${fournName}${need?' · '+eurHT:''}</div>${multi?brk:''}</td></tr>`;
  });
  html+='</tbody></table></div>';
  html+=notesSection;
  html+=staleNote;
  window._BESOIN=R;
  el.innerHTML=html;
}
// Recherche produit/fournisseur dans la feuille de besoin. Toggle les <tr> — marche en vue tableau
// (desktop) ET en cartes (mobile), c'est le même <tr> caché via display:none.
function filterBesoin(){
  const q=(val('besoin_search')||'').toLowerCase();
  let visibles=0;
  document.querySelectorAll('.tbl-besoin tbody tr').forEach(tr=>{
    const show=!q||(tr.dataset.pname||'').includes(q);
    tr.style.display=show?'':'none';
    if(show)visibles++;
  });
  const c=document.getElementById('besoin_count');
  const n=(window._BESOIN&&window._BESOIN.list||[]).length;
  if(c)c.textContent=q?`${visibles} résultat${visibles>1?'s':''}`:`${n} produit${n>1?'s':''} à commander`;
}
function copyBesoinAll(){
  const R=window._BESOIN||{list:[],notes:[],multi:false,snackNames:[]};
  const besoin=R.list, multi=R.multi, notes=R.notes||[];
  if(!besoin.length && !notes.length){toast('Rien à copier');return;}
  // Regrouper par fournisseur, puis dans chaque fournisseur par catégorie
  const byFourn={};
  besoin.forEach(x=>{
    const fid=x.produit.fournisseur_principal_id||'_sans';
    (byFourn[fid]=byFourn[fid]||[]).push(x);
  });
  const today=new Date().toLocaleDateString('fr-FR',{day:'2-digit',month:'long',year:'numeric'});
  // Mono : en-tête identique à avant. Multi : commande groupée mentionnant les snacks inclus.
  let txt = multi ? `*Commande groupée — ${R.snackNames.join(' + ')}*\n${today}\n` : `*Commande ${R.snackNames[0]}*\n${today}\n`;
  let totalEur=0;
  Object.keys(byFourn).forEach(fid=>{
    const fnom=fid==='_sans'?'(Sans fournisseur)':nameFourn(fid);
    const arr=byFourn[fid];
    let subTotal=0;
    txt+=`\n━━━━━━━━━━━━━━\n*${fnom.toUpperCase()}*\n━━━━━━━━━━━━━━\n`;
    // Grouper par catégorie
    const byCat={};
    arr.forEach(x=>{const c=x.produit.categorie||'Divers';(byCat[c]=byCat[c]||[]).push(x);});
    Object.keys(byCat).sort().forEach(c=>{
      txt+=`\n— ${c.toUpperCase()} —\n`;
      byCat[c].sort((a,b)=>a.produit.nom.localeCompare(b.produit.nom)).forEach(x=>{
        const cond=x.produit.cond_fourn1||x.produit.conditionnement||'';
        const unit=x.produit.unite||'';
        // En multi, on rappelle la répartition par snack en fin de ligne (le total reste en gras).
        const detail = multi ? ' ('+x.perSnack.map(p=>`${shortSnack(p.snack)} ${p.need}`).join(' + ')+')' : '';
        txt+=`• ${x.produit.nom} — *${x.totalNeed}*${unit?' '+unit:''}${cond?' ('+cond+')':''}${detail}\n`;
        const eurX=x.totalNeed*Number(x.produit.cout_unitaire||0);
        subTotal+=eurX;totalEur+=eurX;
      });
    });
    txt+=`\n_Sous-total ${fnom} : ${eur(subTotal)} HT_\n`;
  });
  if(besoin.length) txt+=`\n*TOTAL GÉNÉRAL : ${eur(totalEur)} HT*\n`;
  // Notes « sans quantité » : une ligne texte par produit (par snack si plusieurs notes en multi).
  if(notes.length){
    txt+=`\n━━━━━━━━━━━━━━\n*📝 NOTES (sans quantité)*\n━━━━━━━━━━━━━━\n`;
    notes.forEach(n=>{
      if(n.perSnack.length===1){ txt+=`• ${n.produit.nom} : ${n.perSnack[0].commentaire}\n`; }
      else { txt+=`• ${n.produit.nom}\n`+n.perSnack.map(ps=>`   – ${shortSnack(ps.snack)} : ${ps.commentaire}`).join('\n')+`\n`; }
    });
  }
  txt+=`\nMerci 🙏`;
  if(navigator.clipboard&&navigator.clipboard.writeText){
    navigator.clipboard.writeText(txt).then(()=>toast('✓ Toute la commande copiée — colle dans WhatsApp')).catch(()=>fallbackCopy(txt));
  } else fallbackCopy(txt);
}
function fallbackCopy(txt){
  const ta=document.createElement('textarea');ta.value=txt;ta.style.position='fixed';ta.style.left='-9999px';
  document.body.appendChild(ta);ta.select();
  try{document.execCommand('copy');toast('✓ Copié');}catch(e){alert(txt);}
  ta.remove();
}
async function exportBesoinPDF(){
  toast('Génération PDF…');
  // Même source agrégée que l'écran (computeBesoin) → le PDF ne peut pas contredire l'affichage.
  const R=(window._BESOIN && (window._BESOIN.list.length||(window._BESOIN.notes||[]).length))?window._BESOIN:await computeBesoin(BESOIN_SEL||[SNACK.id]);
  if(!R.list.length && !(R.notes||[]).length){toast('Rien à exporter');return;}
  const multi=R.multi;
  const{jsPDF}=window.jspdf;
  const doc=new jsPDF({unit:'mm',format:'a4'});
  const titre = multi ? R.snackNames.join(' + ') : R.snackNames[0];
  doc.setFontSize(18);doc.text(`Feuille de besoin — ${titre}`,14,18);
  doc.setFontSize(10);doc.setTextColor(120);doc.text(`Généré le ${new Date().toLocaleString('fr-FR')} · ${ORG.nom||''}`,14,25);doc.setTextColor(0);
  const byFourn={};
  R.list.forEach(x=>{ const fid=x.produit.fournisseur_principal_id||'_sans'; (byFourn[fid]=byFourn[fid]||[]).push(x); });
  let y=32;
  // Largeurs de colonnes FIXES (mm), identiques pour CHAQUE tableau fournisseur → colonnes alignées
  // d'un tableau à l'autre (total 180mm ≤ largeur utile A4). Ne pas casser (chantier alignement).
  const besoinCols={0:{cellWidth:52},1:{cellWidth:15,halign:'center'},2:{cellWidth:14,halign:'center'},3:{cellWidth:22,halign:'center',fontStyle:'bold'},4:{cellWidth:28},5:{cellWidth:30},6:{cellWidth:19,halign:'right'}};
  // Mono : colonne « Dernière saisie » (date) comme avant. Multi : « Par snack » (répartition).
  const col5Head = multi ? 'Par snack' : 'Dernière saisie';
  Object.entries(byFourn).forEach(([fid,arr])=>{
    if(y>250){doc.addPage();y=20;}
    doc.setFontSize(13);doc.text(fid==='_sans'?'(sans fournisseur)':nameFourn(fid),14,y);y+=2;
    doc.autoTable({startY:y+2,head:[['Produit','Actuel','Max','À cmd.','Cond.',col5Head,'€ HT']],body:arr.map(x=>{
      const ps0=x.perSnack[0];
      const actuel = multi ? x.totalCur : (ps0.jamais?'?':ps0.cur);
      const max = multi ? x.totalMax : ps0.max;
      const col5 = multi
        ? x.perSnack.map(p=>`${shortSnack(p.snack)}:${p.need}${(p.jamais||p.stale)?'⚠':''}`).join('  ')
        : (ps0.jamais?'jamais saisi':(fmtD(ps0.date)+(ps0.age>BESOIN_STALE_DAYS?` (ancien, ${ps0.age}j)`:'')));
      return [x.produit.nom,actuel,max,x.totalNeed+' '+(x.produit.unite||''),x.produit.cond_fourn1||x.produit.conditionnement||'',col5,(x.totalNeed*Number(x.produit.cout_unitaire||0)).toFixed(2)+' €'];
    }),theme:'grid',styles:{fontSize:8,overflow:'linebreak'},columnStyles:besoinCols,margin:{left:14,right:16},tableWidth:'wrap',headStyles:{fillColor:[200,160,53]}});
    y=doc.lastAutoTable.finalY+8;
  });
  // Notes « sans quantité » : tableau distinct en fin de document (jamais mêlé aux totaux € ci-dessus).
  const notes=R.notes||[];
  if(notes.length){
    if(y>250){doc.addPage();y=20;}
    doc.setFontSize(13);doc.text('Notes (sans quantité)',14,y);y+=2;
    doc.autoTable({startY:y+2,head:[multi?['Produit','Snack','Note','Saisie']:['Produit','Note','Saisie']],
      body:notes.flatMap(n=>n.perSnack.map((ps,i)=>multi?[i===0?n.produit.nom:'',shortSnack(ps.snack),ps.commentaire,fmtD(ps.date)]:[n.produit.nom,ps.commentaire,fmtD(ps.date)])),
      theme:'grid',styles:{fontSize:8,overflow:'linebreak'},margin:{left:14,right:16},headStyles:{fillColor:[200,160,53]}});
    y=doc.lastAutoTable.finalY+8;
  }
  doc.save(`Besoin_${(multi?'groupe':titre.replace(/\s+/g,'_'))}_${new Date().toISOString().slice(0,10)}.pdf`);
}

function renderMax(el){
  const max={};S.stockMax.filter(m=>m.restaurant_id===SNACK.id).forEach(m=>max[m.produit_id]=m);

  </div>
  <div style="color:var(--muted);font-size:12px;margin-bottom:6px">« Désactiver » exclut le produit du suivi (dashboard, saisie, feuille de besoin) <b>sur ${SNACK.nom} uniquement</b>, sans perdre son seuil ni l'affecter sur les autres snacks.</div>
  <div style="color:var(--muted);font-size:12px;margin-bottom:12px">« Commentaire » (kiosk) : <b>Optionnel</b> = quantité + remarque libre en plus ; <b>Commentaire seul</b> = pas de quantité, uniquement une remarque obligatoire (ex: monnaie de caisse, goûts disponibles…) — le produit est alors exclu de la feuille de besoin.</div>
  <table class="tbl"><thead><tr><th>Produit</th><th>Catégorie</th><th>Cond.</th><th>Stock max ${SNACK.nom}</th><th style="text-align:center">Désactiver</th><th style="text-align:center">Commentaire</th></tr></thead><tbody>`;
  const MODE_LBL={aucun:'',optionnel:'💬 optionnel',obligatoire:'💬 sans quantité'};
  S.produits.forEach(p=>{
    const m=max[p.id];
    const off=!!(m&&m.actif===false);
    const mode=(m&&m.mode_commentaire)||'aucun';
    const cmtOnly=mode==='obligatoire';
    // Un produit « commentaire seul » n'a pas de seuil quantité → champ max grisé/désactivé.
    const qInput=`<input type="number" step="0.5" value="${m&&!cmtOnly?m.quantite_max:''}" placeholder="${cmtOnly?'—':'0'}" ${cmtOnly?'disabled':''} onblur="saveMax('${p.id}',this.value)" style="width:100px;padding:6px 8px;border-radius:6px;border:1px solid var(--line-2);background:var(--surface);color:var(--text);font-size:13px;${(off||cmtOnly)?'opacity:.4':''}">`;
    // Cochée si actif=false. Toujours cliquable : si aucun seuil n'existe encore, la case en crée un (quantite_max:0, actif:false).
    const chk=`<input type="checkbox" ${off?'checked':''} onchange="toggleMaxActif('${p.id}',this.checked)" title="Exclure ce produit du suivi sur ce snack" style="width:18px;height:18px;cursor:pointer">`;
    // Sélecteur 3 états (même principe : crée la ligne stock_max au besoin).
    const opt=(v,lbl)=>`<option value="${v}" ${mode===v?'selected':''}>${lbl}</option>`;
    const selMode=`<select onchange="setMaxMode('${p.id}',this.value)" style="padding:5px 8px;border-radius:6px;border:1px solid var(--line-2);background:var(--surface);color:var(--text);font-size:12px;cursor:pointer">${opt('aucun','Aucun')}${opt('optionnel','Optionnel')}${opt('obligatoire','Commentaire seul')}</select>`;
    const badge=mode!=='aucun'?` <span title="${MODE_LBL[mode]}" style="font-size:11px">${cmtOnly?'📝':'💬'}</span>`:'';
    html+=`<tr data-pname="${p.nom.toLowerCase()}" style="${off?'opacity:.6':''}"><td><b>${p.nom}</b>${off?' <span style="color:var(--warn);font-size:10.5px;font-weight:700">DÉSACTIVÉ</span>':''}${badge}</td><td style="color:var(--muted);font-size:12px">${p.categorie||''}</td><td style="color:var(--muted);font-size:12px">${p.conditionnement||''}</td><td>${qInput}</td><td style="text-align:center">${chk}</td><td style="text-align:center">${selMode}</td></tr>`;
  });
  html+='</tbody></table>';
  el.innerHTML=html;
}
async function toggleMaxActif(pid,checked){
  // checked = case "Désactiver" cochée → le produit doit passer actif=false sur CE snack.
  const existing=S.stockMax.find(m=>m.restaurant_id===SNACK.id && m.produit_id===pid);
  if(!existing){
    if(!checked)return; // rien à faire : pas de ligne = déjà "non suivi/actif par défaut"
    // Aucun seuil défini : on crée directement la ligne désactivée (pas besoin d'inventer un faux seuil avant).
    const{data,error}=await sb.from('stock_max').insert({organization_id:ORG.id,restaurant_id:SNACK.id,produit_id:pid,quantite_max:0,actif:false}).select().single();
    if(error){toast('⚠ Non enregistré : '+error.message);renderMax(document.getElementById('content'));return;}
    if(data)S.stockMax.push(data);
    toast(`${(S.produits.find(p=>p.id===pid)||{}).nom||'Produit'} désactivé sur ${SNACK.nom}`);
    renderMax(document.getElementById('content'));
    return;
  }
  const newActif=!checked;
  const{error}=await sb.from('stock_max').update({actif:newActif}).eq('id',existing.id);
  if(error){toast('⚠ Non enregistré : '+error.message);renderMax(document.getElementById('content'));return;}
  existing.actif=newActif;
  toast(checked?`${(S.produits.find(p=>p.id===pid)||{}).nom||'Produit'} désactivé sur ${SNACK.nom}`:'Produit réactivé');
  renderMax(document.getElementById('content'));
}
// Mode commentaire 3 états ('aucun'/'optionnel'/'obligatoire'). Même principe que toggleMaxActif :
// crée la ligne stock_max au besoin, sinon update. Indépendant de `actif`.
async function setMaxMode(pid,mode){
  const existing=S.stockMax.find(m=>m.restaurant_id===SNACK.id && m.produit_id===pid);
  if(!existing){
    if(mode==='aucun')return; // pas de ligne = déjà 'aucun'
    const{data,error}=await sb.from('stock_max').insert({organization_id:ORG.id,restaurant_id:SNACK.id,produit_id:pid,quantite_max:0,actif:true,mode_commentaire:mode}).select().single();
    if(error){toast('⚠ Non enregistré : '+error.message);renderMax(document.getElementById('content'));return;}
    if(data)S.stockMax.push(data);
    toast('Mode commentaire mis à jour');
    renderMax(document.getElementById('content'));
    return;
  }
  const{error}=await sb.from('stock_max').update({mode_commentaire:mode}).eq('id',existing.id);
  if(error){toast('⚠ Non enregistré : '+error.message);renderMax(document.getElementById('content'));return;}
  existing.mode_commentaire=mode;
  toast('Mode commentaire mis à jour');
  renderMax(document.getElementById('content'));
}
function filterMax(){const q=val('max_search').toLowerCase();document.querySelectorAll('#content [data-pname]').forEach(tr=>{tr.style.display=tr.dataset.pname.includes(q)?'':'none';});}
async function saveMax(pid,vTxt){
  const v=parseFloat((vTxt||'').replace(',','.'));
  const existing=S.stockMax.find(m=>m.restaurant_id===SNACK.id && m.produit_id===pid);
  if(isNaN(v)||v<=0){if(existing){await sb.from('stock_max').delete().eq('id',existing.id);S.stockMax=S.stockMax.filter(m=>m.id!==existing.id);}return;}
  if(existing){await sb.from('stock_max').update({quantite_max:v}).eq('id',existing.id);existing.quantite_max=v;}
  else {const{data}=await sb.from('stock_max').insert({organization_id:ORG.id,restaurant_id:SNACK.id,produit_id:pid,quantite_max:v,actif:true}).select().single();if(data)S.stockMax.push(data);}
  toast('✓');
}

  if(val('hist_prod')) q=q.eq('produit_id',val('hist_prod'));
  const{data}=await q;const list=data||[];
  let html=`<table class="tbl"><thead><tr><th>Date</th><th>Produit</th><th>Qté</th><th>Catégorie</th></tr></thead><tbody>`;
  if(!list.length) html+='<tr><td colspan="4" style="text-align:center;color:var(--muted);padding:30px">Aucune saisie sur la période</td></tr>';
  else list.forEach(s=>{const p=S.produits.find(x=>x.id===s.produit_id);const cmt=s.commentaire?String(s.commentaire).replace(/</g,'&lt;'):'';const qte=s.quantite==null?'<span style="color:var(--muted)">—</span>':s.quantite;const pname=(p?.nom||'(supprimé)').toLowerCase().replace(/"/g,'');html+=`<tr data-pname="${pname}"><td>${fmtD(s.date_saisie)}</td><td><b>${p?.nom||'(supprimé)'}</b>${cmt?`<div style="font-size:11px;color:var(--warn);margin-top:2px">💬 ${cmt}</div>`:''}</td><td>${qte}</td><td style="color:var(--muted);font-size:12px">${p?.categorie||''}</td></tr>`;});
  html+='</tbody></table>';
  document.getElementById('histList').innerHTML=html;
}
// Recherche texte libre côté client sur les lignes déjà rendues (pas de re-requête serveur) — même
// pattern que filterMax()/filterBesoin(). Le <select> "Tous produits" filtre côté serveur ; ceci
// filtre en direct l'affichage courant.
function filterHistorique(){
  const q=(val('hist_search')||'').toLowerCase();
  document.querySelectorAll('#histList tbody tr[data-pname]').forEach(tr=>{
    tr.style.display=(!q||(tr.dataset.pname||'').includes(q))?'':'none';
  });
}
async function genererSnapshotMensuel(){
  if(!confirm('Générer un snapshot du mois précédent et purger les saisies détaillées correspondantes ?\nLes données restent consultables sous forme agrégée.'))return;
  const now=new Date();const lastMonth=new Date(now.getFullYear(),now.getMonth()-1,1);
  const monthStart=lastMonth.toISOString().slice(0,10);
  const monthEnd=new Date(now.getFullYear(),now.getMonth(),0).toISOString().slice(0,10);
  toast('Génération du snapshot…');
  const{data:saisiesAll}=await sb.from('stock_saisies').select('*').eq('organization_id',ORG.id).gte('date_saisie',monthStart).lte('date_saisie',monthEnd);
  // Le snapshot est NUMÉRIQUE → on n'agrège que les saisies avec quantité. Les saisies « commentaire
  // seul » (quantite NULL) sont ignorées ici ET conservées en base (non purgées ci-dessous).
  const saisies=(saisiesAll||[]).filter(s=>s.quantite!=null);
  if(!saisies.length){toast('Aucune saisie chiffrée sur ce mois');return;}
  const agg={};
  saisies.forEach(s=>{const k=`${s.restaurant_id}|${s.produit_id}`;if(!agg[k])agg[k]={qte:[],last:null,restaurant_id:s.restaurant_id,produit_id:s.produit_id};agg[k].qte.push(Number(s.quantite));if(!agg[k].last||s.date_saisie>agg[k].last.date)agg[k].last={date:s.date_saisie,qte:Number(s.quantite)};});
  const snaps=Object.values(agg).map(g=>{const p=S.produits.find(x=>x.id===g.produit_id);return {organization_id:ORG.id,restaurant_id:g.restaurant_id,produit_id:g.produit_id,annee:lastMonth.getFullYear(),mois:lastMonth.getMonth()+1,qte_moyenne:+(g.qte.reduce((a,b)=>a+b,0)/g.qte.length).toFixed(2),qte_min:Math.min(...g.qte),qte_max:Math.max(...g.qte),qte_derniere:g.last.qte,nb_saisies:g.qte.length,valorisation_eur:+(g.last.qte*Number(p?.cout_unitaire||0)).toFixed(2)};});
  await sb.from('stock_snapshots_mensuels').upsert(snaps,{onConflict:'organization_id,restaurant_id,produit_id,annee,mois'});
  await sb.from('stock_saisies').delete().eq('organization_id',ORG.id).gte('date_saisie',monthStart).lte('date_saisie',monthEnd).not('quantite','is',null);
  toast(`✓ Snapshot ${snaps.length} lignes · ${saisies.length} saisies purgées`);
  renderHistorique(document.getElementById('content'));
}
