<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<script>(function(){var t=localStorage.getItem("eatime_theme");document.documentElement.setAttribute("data-theme",t==="light"?"light":"dark");})();</script>
<title>Eatime360 — Stock</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../utils.js?v=1.1"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.31/jspdf.plugin.autotable.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root, [data-theme="dark"]{--gold:#c8a035;--bg:#0b0b15;--card:#15151f;--surface:#1c1c28;--line:rgba(255,255,255,.06);--line-2:rgba(255,255,255,.14);--text:#e8e8ec;--muted:#7b7b8a;--ok:#3fb87f;--warn:#e0a93a;--bad:#c45a5a;--info:#5b9cff}
[data-theme="light"]{--gold:#c8a035;--bg:#f5f5f7;--card:#ffffff;--surface:#f0f0f3;--line:rgba(0,0,0,.06);--line-2:rgba(0,0,0,.12);--text:#1a1a1f;--muted:#6b6b78;--ok:#2a8f5f;--warn:#b8841f;--bad:#b04444;--info:#4a7fbd}
html,body{height:100%}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;font-size:14px}
a{color:var(--gold);text-decoration:none}
.hidden{display:none!important}
input,select,textarea,button{font-family:inherit;color:var(--text)}
button{cursor:pointer;border:none;background:none}
.btn{padding:9px 14px;border-radius:8px;background:var(--gold);color:#1a1a1a;font-weight:600;font-size:13px;border:none;display:inline-flex;align-items:center;gap:6px}
.btn.ghost{background:transparent;color:var(--text);border:1px solid var(--line-2)}
.btn.bad{background:var(--bad);color:#fff}
.btn.ok{background:var(--ok);color:#111}
.btn.sm{padding:6px 11px;font-size:12px}
.lock{position:fixed;inset:0;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:20px}
.lock h1{color:var(--gold);font-size:22px}
.lock input{padding:12px 16px;border-radius:10px;border:1px solid var(--line-2);background:var(--surface);color:var(--text);font-size:14px;width:280px;outline:none;text-align:center}
.err{color:var(--bad);font-size:12px;min-height:16px}
.header{display:flex;align-items:center;justify-content:space-between;padding:14px 24px;border-bottom:1px solid var(--line);flex-wrap:wrap;gap:10px}
.brand{color:var(--gold);font-weight:700;font-size:16px}
.brand small{color:var(--muted);font-weight:400;font-size:12px;margin-left:8px}
.tabs{display:flex;gap:2px;padding:0 24px;border-bottom:1px solid var(--line);overflow-x:auto}
.tabs button{padding:11px 16px;border-bottom:2px solid transparent;color:var(--muted);font-weight:600;font-size:13px;white-space:nowrap}
.tabs button.active{color:var(--gold);border-color:var(--gold)}
.tabs button:hover{color:var(--text)}
.wrap{max-width:1400px;margin:0 auto;padding:24px 24px 60px}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:18px;align-items:center}
.toolbar select,.toolbar input{padding:8px 12px;border-radius:7px;border:1px solid var(--line-2);background:var(--surface);color:var(--text);font-size:13px;outline:none}
.grid{display:grid;gap:14px}
.grid.cards{grid-template-columns:repeat(auto-fill,minmax(220px,1fr))}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:18px}
.kpi .lbl{color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.05em;font-weight:600}
.kpi .val{font-size:28px;font-weight:800;margin-top:6px}
.kpi .sub{color:var(--muted);font-size:11.5px;margin-top:4px}
.kpi.ok .val{color:var(--ok)} .kpi.bad .val{color:var(--bad)} .kpi.warn .val{color:var(--warn)} .kpi.info .val{color:var(--info)}
table.tbl{width:100%;border-collapse:collapse;font-size:13px;background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden}
table.tbl th,table.tbl td{padding:9px 12px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle}
table.tbl th{font-size:10.5px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.05em;background:var(--surface)}
table.tbl tr:last-child td{border-bottom:none}
table.tbl tr:hover{background:rgba(127,127,127,.04)}
.badge{display:inline-block;padding:2px 8px;border-radius:20px;font-size:10.5px;font-weight:700;text-transform:uppercase}
.badge.ok{background:rgba(63,184,127,.15);color:var(--ok)}
.badge.bad{background:rgba(196,90,90,.15);color:var(--bad)}
.badge.warn{background:rgba(224,169,58,.15);color:var(--warn)}
.section{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:20px;margin-bottom:16px}
.section h3{font-size:11.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;margin-bottom:14px;font-weight:600}
.fld{margin-bottom:12px}
.fld label{display:block;font-size:11.5px;color:var(--muted);margin-bottom:5px;font-weight:500}
.fld input,.fld textarea,.fld select{width:100%;padding:9px 11px;border-radius:7px;border:1px solid var(--line-2);background:var(--surface);color:var(--text);font-size:13px;outline:none}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
@media(max-width:700px){.grid2,.grid3{grid-template-columns:1fr}}
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.7);display:flex;align-items:center;justify-content:center;z-index:100;padding:20px}
.modal{background:var(--card);border:1px solid var(--line-2);border-radius:14px;padding:24px;max-width:640px;width:100%;max-height:90vh;overflow-y:auto}
.modal h2{font-size:16px;font-weight:700;margin-bottom:14px}
.modal-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:18px}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#222;border:1px solid var(--line-2);padding:11px 22px;border-radius:10px;font-size:13px;opacity:0;transition:.25s;z-index:200;color:#fff}
.toast.show{opacity:1}
.prog{height:6px;background:var(--surface);border-radius:3px;overflow:hidden;margin-top:4px}
.prog-bar{height:100%;background:var(--ok);transition:width .2s}
.prog-bar.warn{background:var(--warn)}
.prog-bar.bad{background:var(--bad)}
</style>
</head>
<body>

<div id="lock" class="lock hidden">
  <h1>Stock</h1>
  <div style="color:var(--muted);font-size:13px">Connexion requise</div>
  <input type="email" id="loginEmail" placeholder="Email">
  <input type="password" id="loginPw" placeholder="Mot de passe" onkeydown="if(event.key==='Enter')login()">
  <button class="btn" onclick="login()">Se connecter</button>
  <div class="err" id="err"></div>
  <a href="../" style="font-size:12px;color:var(--muted)">← Portail</a>
</div>

<div id="app" class="hidden">
  <div class="header">
    <div class="brand">Eatime360 <small>· Stock · v0.1</small></div>
    <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">
      <select id="snackSelect" onchange="onSnackChange()" style="padding:7px 11px;border-radius:7px;border:1px solid var(--line-2);background:var(--surface);color:var(--text);font-size:12.5px"></select>
      <a href="../" class="btn ghost sm">Portail</a>
      <button class="btn ghost sm" onclick="logout()">↩</button>
    </div>
  </div>
  <div class="tabs">
    <button data-tab="dashboard" class="active" onclick="setTab('dashboard')">📊 Dashboard</button>
    <button data-tab="saisie" onclick="setTab('saisie')">✍ Saisie quotidienne</button>
    <button data-tab="besoin" onclick="setTab('besoin')">🛒 Feuille de besoin</button>
    <button data-tab="produits" onclick="setTab('produits')">📦 Produits</button>
    <button data-tab="fournisseurs" onclick="setTab('fournisseurs')">🚚 Fournisseurs</button>
    <button data-tab="max" onclick="setTab('max')">⚖ Stock max</button>
    <button data-tab="historique" onclick="setTab('historique')">📈 Historique</button>
  </div>
  <div class="wrap" id="content"></div>
</div>

<div id="modalHost"></div>
<div class="toast" id="toast"></div>

<script>
const SUPA_URL='https://ynnqvtfayrdteqtgxeuk.supabase.co';
const SUPA_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InlubnF2dGZheXJkdGVxdGd4ZXVrIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzk4OTE1MTQsImV4cCI6MjA5NTQ2NzUxNH0._mfVAGexu7ew38UQk6adn42az4Gt_J3ePxR6O6wuWHc';
const sb=supabase.createClient(SUPA_URL,SUPA_KEY);
let ME=null,ORG={},SNACK=null,TAB='dashboard';
const S={snacks:[],produits:[],fournisseurs:[],stockMax:[],saisiesAujourdhui:{}};
const CATS=['Viandes & Frais','Boissons','Épicerie','Sauces','Emballages','Desserts','Épices','Entretien','Vaisselle','Matériel','Vêtements','Divers'];

let tt;function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('show'),2200);}
function val(id){const e=document.getElementById(id);return e?(e.value||'').trim():'';}
function num(id){const v=val(id);return v===''?null:parseFloat(v.replace(',','.'));}
/* fmtD factorisé dans utils.js (C3) */
function eur(n){if(n==null||isNaN(n))return'—';return Number(n).toFixed(2)+' €';}
function nameFourn(id){const f=S.fournisseurs.find(x=>x.id===id);return f?f.nom:'—';}

async function login(){const{error}=await sb.auth.signInWithPassword({email:val('loginEmail'),password:val('loginPw')});if(error){document.getElementById('err').textContent=error.message;return;}await loadProfileAndShow();}
async function loadProfileAndShow(){
  const{data:{session}}=await sb.auth.getSession();if(!session)return;
  const{data:profile}=await sb.from('profiles').select('*').eq('id',session.user.id).maybeSingle();
  if(!profile||!['admin','super_admin','manager'].includes(profile.role)){document.getElementById('err').textContent='Accès refusé.';await sb.auth.signOut();return;}
  ME=profile;
  const{data:org}=await sb.from('organizations').select('*').eq('id',profile.organization_id).maybeSingle();ORG=org||{};
  if(ORG.couleur_primaire) document.documentElement.style.setProperty('--gold',ORG.couleur_primaire);
  if(ORG.suspended && ME.role!=='super_admin'){document.body.innerHTML='<div style="min-height:100vh;display:flex;align-items:center;justify-content:center;color:var(--bad);font-size:18px;text-align:center;padding:20px">🚫 Organisation suspendue. Contacter le service client.</div>';return;}
  document.getElementById('lock').classList.add('hidden');document.getElementById('app').classList.remove('hidden');
  await loadCommonData();render();
}
async function logout(){await sb.auth.signOut();location.reload();}
sb.auth.getSession().then(({data})=>{if(data.session)loadProfileAndShow();else document.getElementById('lock').classList.remove('hidden');});

async function loadCommonData(){
  const[r,p,f,m]=await Promise.all([
    sb.from('restaurants').select('id,nom').eq('organization_id',ORG.id).order('nom'),
    sb.from('stock_produits').select('*').eq('organization_id',ORG.id).eq('actif',true).order('categorie').order('nom'),
    sb.from('fournisseurs').select('*').eq('organization_id',ORG.id).eq('actif',true).order('nom'),
    sb.from('stock_max').select('*').eq('organization_id',ORG.id).eq('actif',true),
  ]);
  S.snacks=r.data||[];S.produits=p.data||[];S.fournisseurs=f.data||[];S.stockMax=m.data||[];
  const sel=document.getElementById('snackSelect');
  sel.innerHTML=S.snacks.map(x=>`<option value="${x.id}">${x.nom}</option>`).join('');
  if(!SNACK && S.snacks.length){SNACK=S.snacks[0];sel.value=SNACK.id;}
}
function onSnackChange(){const id=val('snackSelect');SNACK=S.snacks.find(x=>x.id===id);render();}
function setTab(t){TAB=t;document.querySelectorAll('.tabs button').forEach(b=>b.classList.toggle('active',b.dataset.tab===t));render();}

function render(){
  if(!SNACK){document.getElementById('content').innerHTML='<div class="section" style="text-align:center;color:var(--muted)">Aucun snack disponible.</div>';return;}
  const el=document.getElementById('content');
  if(TAB==='dashboard') return renderDashboard(el);
  if(TAB==='saisie') return renderSaisie(el);
  if(TAB==='besoin') return renderBesoin(el);
  if(TAB==='produits') return renderProduits(el);
  if(TAB==='fournisseurs') return renderFournisseurs(el);
  if(TAB==='max') return renderMax(el);
  if(TAB==='historique') return renderHistorique(el);
}

async function renderDashboard(el){
  el.innerHTML='<div style="color:var(--muted)">Chargement…</div>';
  const today=new Date().toISOString().slice(0,10);
  const since=new Date();since.setDate(since.getDate()-30);
  const{data:saisies}=await sb.from('stock_saisies').select('*').eq('restaurant_id',SNACK.id).gte('date_saisie',since.toISOString().slice(0,10)).order('date_saisie',{ascending:false});
  const SL=saisies||[];
  const last={};SL.forEach(s=>{if(!last[s.produit_id]||s.date_saisie>last[s.produit_id].date_saisie)last[s.produit_id]=s;});
  const aujourdhui=SL.filter(s=>s.date_saisie===today);
  const stockMaxSnack=S.stockMax.filter(m=>m.restaurant_id===SNACK.id);
  const produitsManquants=stockMaxSnack.filter(m=>!last[m.produit_id]);
  const ruptures=Object.values(last).filter(s=>(Number(s.quantite)||0)===0);
  let valorisation=0;Object.values(last).forEach(s=>{const p=S.produits.find(x=>x.id===s.produit_id);if(p)valorisation+=Number(s.quantite||0)*Number(p.cout_unitaire||0);});
  let html=`<h2 style="font-size:18px;font-weight:700;margin-bottom:6px">Dashboard Stock</h2>
    <div style="color:var(--muted);font-size:12.5px;margin-bottom:18px">${SNACK.nom} · 30 derniers jours</div>
    <div class="grid cards" style="margin-bottom:24px">
      <div class="kpi"><div class="lbl">Produits suivis</div><div class="val">${stockMaxSnack.length}</div></div>
      <div class="kpi ${aujourdhui.length>0?'ok':'warn'}"><div class="lbl">Saisies aujourd'hui</div><div class="val">${aujourdhui.length}</div></div>
      <div class="kpi ${produitsManquants.length>0?'bad':'ok'}"><div class="lbl">Non saisis (30j)</div><div class="val">${produitsManquants.length}</div></div>
      <div class="kpi ${ruptures.length>0?'bad':'ok'}"><div class="lbl">Ruptures</div><div class="val">${ruptures.length}</div></div>
      <div class="kpi info"><div class="lbl">Valorisation stock</div><div class="val">${eur(valorisation)}</div><div class="sub">dernières saisies × coût unit.</div></div>
    </div>`;
  const sousSeuil=[];
  stockMaxSnack.forEach(m=>{
    const l=last[m.produit_id];const qte=l?Number(l.quantite):0;
    const pct=Number(m.quantite_max)?qte/Number(m.quantite_max)*100:0;
    if(pct<50) sousSeuil.push({produit:S.produits.find(p=>p.id===m.produit_id),qte,max:Number(m.quantite_max),pct,date:l?.date_saisie});
  });
  sousSeuil.sort((a,b)=>a.pct-b.pct);
  html+=`<div class="section"><h3>Produits sous 50% du stock max</h3>
    <table class="tbl"><thead><tr><th>Produit</th><th>Qté</th><th>Max</th><th>%</th><th>Dernière saisie</th></tr></thead><tbody>
    ${sousSeuil.slice(0,15).map(x=>`<tr><td><b>${x.produit?.nom||'?'}</b><div class="prog"><div class="prog-bar ${x.pct<25?'bad':'warn'}" style="width:${Math.min(100,x.pct)}%"></div></div></td><td>${x.qte}</td><td>${x.max}</td><td>${x.pct.toFixed(0)}%</td><td style="color:var(--muted);font-size:11.5px">${fmtD(x.date)}</td></tr>`).join('')||'<tr><td colspan="5" style="text-align:center;color:var(--muted);padding:20px">✓ Tout est au-dessus de 50%</td></tr>'}
    </tbody></table></div>`;
  el.innerHTML=html;
}

async function renderSaisie(el){
  const today=new Date().toISOString().slice(0,10);
  const{data:saisies}=await sb.from('stock_saisies').select('*').eq('restaurant_id',SNACK.id).eq('date_saisie',today);
  const byProd={};(saisies||[]).forEach(s=>{byProd[s.produit_id]=s;});S.saisiesAujourdhui=byProd;
  const max={};S.stockMax.filter(m=>m.restaurant_id===SNACK.id).forEach(m=>max[m.produit_id]=m);
  const byCat={};S.produits.forEach(p=>{const c=p.categorie||'Divers';(byCat[c]=byCat[c]||[]).push(p);});
  let html=`<div class="toolbar">
    <input id="saisie_search" placeholder="Filtrer produit…" oninput="filterSaisie()">
    <div style="flex:1"></div>
    <span style="color:var(--muted);font-size:12.5px">${Object.keys(byProd).length} / ${S.produits.length} saisis aujourd'hui</span>
  </div>`;
  Object.keys(byCat).sort().forEach(cat=>{
    html+=`<div class="section"><h3>${cat} (${byCat[cat].length})</h3>
      <table class="tbl"><thead><tr><th>Produit</th><th>Cond.</th><th>Stock max</th><th>Saisie</th><th>État</th></tr></thead><tbody>`;
    byCat[cat].forEach(p=>{
      const m=max[p.id];const cur=byProd[p.id];const qte=cur?cur.quantite:'';
      const maxQ=m?Number(m.quantite_max):null;
      const pct=maxQ&&qte!==''?Math.min(100,Number(qte)/maxQ*100):0;
      const etat=cur?`<div class="prog"><div class="prog-bar ${pct<25?'bad':pct<50?'warn':''}" style="width:${pct}%"></div></div>`:'<span style="color:var(--muted);font-size:11px">non saisi</span>';
      html+=`<tr data-pname="${p.nom.toLowerCase()}"><td><b>${p.nom}</b></td><td style="color:var(--muted);font-size:11.5px">${p.conditionnement||''}</td><td style="color:var(--muted)">${maxQ??'—'}</td><td><input type="number" step="0.5" data-pid="${p.id}" value="${qte}" placeholder="${maxQ??''}" onblur="saveSaisie('${p.id}',this.value)" style="width:80px;padding:6px 8px;border-radius:6px;border:1px solid var(--line-2);background:var(--surface);color:var(--text);font-size:13px;text-align:center"></td><td>${etat}</td></tr>`;
    });
    html+='</tbody></table></div>';
  });
  el.innerHTML=html;
}
function filterSaisie(){const q=val('saisie_search').toLowerCase();document.querySelectorAll('[data-pname]').forEach(tr=>{tr.style.display=tr.dataset.pname.includes(q)?'':'none';});}
async function saveSaisie(pid,vTxt){
  const v=parseFloat((vTxt||'').replace(',','.'));
  const d=new Date().toISOString().slice(0,10);
  if(isNaN(v)){if(S.saisiesAujourdhui[pid]){await sb.from('stock_saisies').delete().eq('id',S.saisiesAujourdhui[pid].id);delete S.saisiesAujourdhui[pid];}return;}
  const existing=S.saisiesAujourdhui[pid];
  if(existing){await sb.from('stock_saisies').update({quantite:v}).eq('id',existing.id);existing.quantite=v;}
  else {const{data,error}=await sb.from('stock_saisies').insert({organization_id:ORG.id,restaurant_id:SNACK.id,produit_id:pid,quantite:v,date_saisie:d}).select().single();if(error){toast(error.message);return;}S.saisiesAujourdhui[pid]=data;}
  toast('✓ Saisi');
}

async function renderBesoin(el){
  el.innerHTML='<div style="color:var(--muted)">Calcul…</div>';
  const since=new Date();since.setDate(since.getDate()-7);
  const{data:saisies}=await sb.from('stock_saisies').select('*').eq('restaurant_id',SNACK.id).gte('date_saisie',since.toISOString().slice(0,10)).order('date_saisie',{ascending:false});
  const last={};(saisies||[]).forEach(s=>{if(!last[s.produit_id]||s.date_saisie>last[s.produit_id].date_saisie)last[s.produit_id]=s;});
  // Construire la liste des besoins (à plat)
  const besoin=[];
  S.stockMax.filter(m=>m.restaurant_id===SNACK.id).forEach(m=>{
    const p=S.produits.find(x=>x.id===m.produit_id);if(!p)return;
    const cur=last[m.produit_id]?Number(last[m.produit_id].quantite):0;
    const need=Math.max(0,Number(m.quantite_max)-cur);
    if(need<=0)return;
    besoin.push({produit:p,cur,max:Number(m.quantite_max),need,date:last[m.produit_id]?.date_saisie});
  });
  const totalEur=besoin.reduce((a,x)=>a+x.need*Number(x.produit.cout_unitaire||0),0);
  let html=`<div class="toolbar">
    <h2 style="font-size:18px;font-weight:700;flex:1">Feuille de besoin — ${SNACK.nom}</h2>
    <button class="btn ghost" onclick="copyBesoinAll()">📋 Copier toute la commande</button>
    <button class="btn" onclick="exportBesoinPDF()">📄 Export PDF</button>
  </div>`;
  if(!besoin.length){html+='<div class="section" style="text-align:center;color:var(--ok)">✓ Aucun besoin — stocks au max partout</div>';el.innerHTML=html;return;}
  // Vue unifiée : 1 seul bloc, ordonné par catégorie puis nom
  besoin.sort((a,b)=>{
    const c=(a.produit.categorie||'Divers').localeCompare(b.produit.categorie||'Divers');
    return c!==0?c:a.produit.nom.localeCompare(b.produit.nom);
  });
  html+=`<div class="section">
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:12px">
      <div style="color:var(--muted);font-size:13px">${besoin.length} produit${besoin.length>1?'s':''} à commander</div>
      <div style="font-weight:700;font-size:15px">${eur(totalEur)} HT estimé</div>
    </div>
    <table class="tbl"><thead><tr><th>Catégorie</th><th>Produit</th><th>Fournisseur</th><th>Actuel</th><th>Max</th><th>À commander</th><th>Cond.</th><th>€ HT</th></tr></thead><tbody>`;
  let prevCat=null;
  besoin.forEach(x=>{
    const cat=x.produit.categorie||'Divers';
    const cond=x.produit.cond_fourn1||x.produit.conditionnement||'';
    const fnom=x.produit.fournisseur_principal_id?nameFourn(x.produit.fournisseur_principal_id):'<span style="color:var(--muted)">—</span>';
    const catCell=cat===prevCat?'':`<b style="color:var(--gold);font-size:12.5px;text-transform:uppercase;letter-spacing:.03em">${cat}</b>`;
    prevCat=cat;
    html+=`<tr><td style="vertical-align:top">${catCell}</td><td><b>${x.produit.nom}</b><div style="color:var(--muted);font-size:11px">dernière saisie : ${fmtD(x.date)}</div></td><td style="font-size:12.5px">${fnom}</td><td>${x.cur}</td><td>${x.max}</td><td><b style="color:var(--gold);font-size:15px">${x.need}</b> ${x.produit.unite||''}</td><td style="color:var(--muted);font-size:11.5px">${cond}</td><td>${eur(x.need*Number(x.produit.cout_unitaire||0))}</td></tr>`;
  });
  html+='</tbody></table></div>';
  window._BESOIN_LIST=besoin;
  el.innerHTML=html;
}
function copyBesoinAll(){
  const besoin=window._BESOIN_LIST||[];
  if(!besoin.length){toast('Rien à copier');return;}
  // Regrouper par fournisseur, puis dans chaque fournisseur par catégorie
  const byFourn={};
  besoin.forEach(x=>{
    const fid=x.produit.fournisseur_principal_id||'_sans';
    (byFourn[fid]=byFourn[fid]||[]).push(x);
  });
  const today=new Date().toLocaleDateString('fr-FR',{day:'2-digit',month:'long',year:'numeric'});
  let txt=`*Commande ${SNACK.nom}*\n${today}\n`;
  let totalEur=0;
  Object.keys(byFourn).forEach(fid=>{
    const fnom=fid==='_sans'?'(Sans fournisseur)':nameFourn(fid);
    const arr=byFourn[fid];
    let subTotal=0;
    txt+=`\n━━━━━━━━━━━━━━\n*${fnom.toUpperCase()}*\n━━━━━━━━━━━━━━\n`;
    // Grouper par catégorie
    const byCat={};
    arr.forEach(x=>{const c=x.produit.categorie||'Divers';(byCat[c]=byCat[c]||[]).push(x);});
    Object.keys(byCat).sort().forEach(c=>{
      txt+=`\n— ${c.toUpperCase()} —\n`;
      byCat[c].sort((a,b)=>a.produit.nom.localeCompare(b.produit.nom)).forEach(x=>{
        const cond=x.produit.cond_fourn1||x.produit.conditionnement||'';
        const unit=x.produit.unite||'';
        txt+=`• ${x.produit.nom} — *${x.need}*${unit?' '+unit:''}${cond?' ('+cond+')':''}\n`;
        const eurX=x.need*Number(x.produit.cout_unitaire||0);
        subTotal+=eurX;totalEur+=eurX;
      });
    });
    txt+=`\n_Sous-total ${fnom} : ${eur(subTotal)} HT_\n`;
  });
  txt+=`\n*TOTAL GÉNÉRAL : ${eur(totalEur)} HT*\n\nMerci 🙏`;
  if(navigator.clipboard&&navigator.clipboard.writeText){
    navigator.clipboard.writeText(txt).then(()=>toast('✓ Toute la commande copiée — colle dans WhatsApp')).catch(()=>fallbackCopy(txt));
  } else fallbackCopy(txt);
}
function fallbackCopy(txt){
  const ta=document.createElement('textarea');ta.value=txt;ta.style.position='fixed';ta.style.left='-9999px';
  document.body.appendChild(ta);ta.select();
  try{document.execCommand('copy');toast('✓ Copié');}catch(e){alert(txt);}
  ta.remove();
}
async function exportBesoinPDF(){
  toast('Génération PDF…');
  const since=new Date();since.setDate(since.getDate()-7);
  const{data:saisies}=await sb.from('stock_saisies').select('*').eq('restaurant_id',SNACK.id).gte('date_saisie',since.toISOString().slice(0,10));
  const last={};(saisies||[]).forEach(s=>{if(!last[s.produit_id]||s.date_saisie>last[s.produit_id].date_saisie)last[s.produit_id]=s;});
  const{jsPDF}=window.jspdf;
  const doc=new jsPDF({unit:'mm',format:'a4'});
  doc.setFontSize(18);doc.text(`Feuille de besoin — ${SNACK.nom}`,14,18);
  doc.setFontSize(10);doc.setTextColor(120);doc.text(`Généré le ${new Date().toLocaleString('fr-FR')} · ${ORG.nom||''}`,14,25);doc.setTextColor(0);
  const byFourn={};S.stockMax.filter(m=>m.restaurant_id===SNACK.id).forEach(m=>{
    const p=S.produits.find(x=>x.id===m.produit_id);if(!p)return;
    const cur=last[m.produit_id]?Number(last[m.produit_id].quantite):0;
    const need=Math.max(0,Number(m.quantite_max)-cur);if(need<=0)return;
    const fid=p.fournisseur_principal_id||'_sans';
    (byFourn[fid]=byFourn[fid]||[]).push({p,cur,max:Number(m.quantite_max),need});
  });
  let y=32;
  Object.entries(byFourn).forEach(([fid,arr])=>{
    if(y>250){doc.addPage();y=20;}
    doc.setFontSize(13);doc.text(fid==='_sans'?'(sans fournisseur)':nameFourn(fid),14,y);y+=2;
    doc.autoTable({startY:y+2,head:[['Produit','Actuel','Max','À cmd.','Cond.','€ HT']],body:arr.map(x=>[x.p.nom,x.cur,x.max,x.need+' '+(x.p.unite||''),x.p.cond_fourn1||x.p.conditionnement||'',(x.need*Number(x.p.cout_unitaire||0)).toFixed(2)+' €']),theme:'grid',styles:{fontSize:8},headStyles:{fillColor:[200,160,53]}});
    y=doc.lastAutoTable.finalY+8;
  });
  doc.save(`Besoin_${SNACK.nom.replace(/\s+/g,'_')}_${new Date().toISOString().slice(0,10)}.pdf`);
}

function filterProduits(){const q=val('prod_search').toLowerCase(),c=val('prod_cat');document.querySelectorAll('#prodTbody tr').forEach(tr=>{tr.style.display=((!q||tr.dataset.pname.includes(q))&&(!c||tr.dataset.pcat===c))?'':'none';});}

async function saveProduit(){
  if(!val('p_nom')){toast('Nom requis');return;}
  const payload={organization_id:ORG.id,nom:val('p_nom'),categorie:val('p_cat'),conditionnement:val('p_cond')||null,grammage:val('p_gram')||null,unite:val('p_unit')||null,cout_unitaire:num('p_cout')||0,note:val('p_note')||null,fournisseur_principal_id:val('p_f1')||null,prix_fourn1:num('p_pf1'),cond_fourn1:val('p_cf1')||null,fournisseur_secondaire_id:val('p_f2')||null,prix_fourn2:num('p_pf2'),cond_fourn2:val('p_cf2')||null,actif:true};
  const id=val('p_id');
  const{error}=id?await sb.from('stock_produits').update(payload).eq('id',id):await sb.from('stock_produits').insert(payload);
  if(error){toast(error.message);return;}toast('✓ Enregistré');closeModal();await loadCommonData();renderProduits(document.getElementById('content'));
}
async function delProduit(id){if(!confirm('Désactiver ce produit ?'))return;await sb.from('stock_produits').update({actif:false}).eq('id',id);await loadCommonData();renderProduits(document.getElementById('content'));}

async function delFourn(id){if(!confirm('Désactiver ce fournisseur ?'))return;await sb.from('fournisseurs').update({actif:false}).eq('id',id);await loadCommonData();renderFournisseurs(document.getElementById('content'));}

async function saveMax(pid,vTxt){
  const v=parseFloat((vTxt||'').replace(',','.'));
  const existing=S.stockMax.find(m=>m.restaurant_id===SNACK.id && m.produit_id===pid);
  if(isNaN(v)||v<=0){if(existing){await sb.from('stock_max').delete().eq('id',existing.id);S.stockMax=S.stockMax.filter(m=>m.id!==existing.id);}return;}
  if(existing){await sb.from('stock_max').update({quantite_max:v}).eq('id',existing.id);existing.quantite_max=v;}
  else {const{data}=await sb.from('stock_max').insert({organization_id:ORG.id,restaurant_id:SNACK.id,produit_id:pid,quantite_max:v,actif:true}).select().single();if(data)S.stockMax.push(data);}
  toast('✓');
}

async function renderHistorique(el){
  el.innerHTML=`<div class="toolbar">
    <input type="date" id="hist_from" value="${new Date(Date.now()-30*86400000).toISOString().slice(0,10)}">
    <span style="color:var(--muted)">→</span>
    <input type="date" id="hist_to" value="${new Date().toISOString().slice(0,10)}">
    <select id="hist_prod"><option value="">Tous produits</option>${S.produits.map(p=>`<option value="${p.id}">${p.nom}</option>`).join('')}</select>
    <button class="btn sm" onclick="renderHistorique(document.getElementById('content'))">Filtrer</button>
    <div style="flex:1"></div>
    <button class="btn ghost sm" onclick="genererSnapshotMensuel()" title="Agrège les saisies du mois précédent en snapshot et libère stock_saisies">📸 Snapshot mensuel</button>
  </div><div id="histList">Chargement…</div>`;
  let q=sb.from('stock_saisies').select('*').eq('restaurant_id',SNACK.id).gte('date_saisie',val('hist_from')).lte('date_saisie',val('hist_to')).order('date_saisie',{ascending:false}).limit(500);
  if(val('hist_prod')) q=q.eq('produit_id',val('hist_prod'));
  const{data}=await q;const list=data||[];
  let html=`<table class="tbl"><thead><tr><th>Date</th><th>Produit</th><th>Qté</th><th>Catégorie</th></tr></thead><tbody>`;
  if(!list.length) html+='<tr><td colspan="4" style="text-align:center;color:var(--muted);padding:30px">Aucune saisie sur la période</td></tr>';

}
async function genererSnapshotMensuel(){
  if(!confirm('Générer un snapshot du mois précédent et purger les saisies détaillées correspondantes ?\nLes données restent consultables sous forme agrégée.'))return;
  const now=new Date();const lastMonth=new Date(now.getFullYear(),now.getMonth()-1,1);
  const monthStart=lastMonth.toISOString().slice(0,10);
  const monthEnd=new Date(now.getFullYear(),now.getMonth(),0).toISOString().slice(0,10);
  toast('Génération du snapshot…');
  const{data:saisies}=await sb.from('stock_saisies').select('*').eq('organization_id',ORG.id).gte('date_saisie',monthStart).lte('date_saisie',monthEnd);
  if(!saisies||!saisies.length){toast('Aucune saisie sur ce mois');return;}
  const agg={};
  saisies.forEach(s=>{const k=`${s.restaurant_id}|${s.produit_id}`;if(!agg[k])agg[k]={qte:[],last:null,restaurant_id:s.restaurant_id,produit_id:s.produit_id};agg[k].qte.push(Number(s.quantite));if(!agg[k].last||s.date_saisie>agg[k].last.date)agg[k].last={date:s.date_saisie,qte:Number(s.quantite)};});
  const snaps=Object.values(agg).map(g=>{const p=S.produits.find(x=>x.id===g.produit_id);return {organization_id:ORG.id,restaurant_id:g.restaurant_id,produit_id:g.produit_id,annee:lastMonth.getFullYear(),mois:lastMonth.getMonth()+1,qte_moyenne:+(g.qte.reduce((a,b)=>a+b,0)/g.qte.length).toFixed(2),qte_min:Math.min(...g.qte),qte_max:Math.max(...g.qte),qte_derniere:g.last.qte,nb_saisies:g.qte.length,valorisation_eur:+(g.last.qte*Number(p?.cout_unitaire||0)).toFixed(2)};});
  await sb.from('stock_snapshots_mensuels').upsert(snaps,{onConflict:'organization_id,restaurant_id,produit_id,annee,mois'});
  await sb.from('stock_saisies').delete().eq('organization_id',ORG.id).gte('date_saisie',monthStart).lte('date_saisie',monthEnd);
  toast(`✓ Snapshot ${snaps.length} lignes · ${saisies.length} saisies purgées`);
  renderHistorique(document.getElementById('content'));
}

function closeModal(){document.getElementById('modalHost').innerHTML='';}
