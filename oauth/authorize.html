<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Eatime360 — Autoriser l'accès</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,sans-serif;background:#0b0b15;color:#e8e8ec;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px}
.card{background:#15151f;border:1px solid rgba(255,255,255,.06);border-radius:14px;padding:30px;max-width:440px;width:100%}
.logo{color:#c8a035;font-size:24px;font-weight:800;text-align:center;margin-bottom:6px}
.logo small{display:block;color:#7b7b8a;font-weight:400;font-size:12px;margin-top:4px}
.info{background:#1c1c28;border:1px solid rgba(255,255,255,.14);border-radius:10px;padding:14px;margin:18px 0;font-size:13px;line-height:1.5;color:#7b7b8a}
.info b{color:#e8e8ec}
.fld{margin-bottom:14px}
.fld label{display:block;font-size:11.5px;color:#7b7b8a;margin-bottom:6px;font-weight:500}
.fld input{width:100%;padding:11px 14px;border-radius:10px;border:1px solid rgba(255,255,255,.14);background:#1c1c28;color:#e8e8ec;font-size:13px;outline:none;font-family:monospace}
.fld input:focus{border-color:#c8a035}
.btn{width:100%;padding:13px;border-radius:10px;background:#c8a035;color:#1a1a1a;font-weight:700;font-size:14px;border:none;cursor:pointer}
.err{color:#c45a5a;font-size:13px;text-align:center;margin-top:10px;min-height:18px}
.foot{color:#7b7b8a;text-align:center;font-size:11px;margin-top:14px}
.foot a{color:#c8a035;text-decoration:none}
</style>
</head>
<body>
<div class="card">
  <div class="logo">Eatime360<small>Autoriser l'accès</small></div>
  <div class="info">
    L'application <b>Claude</b> demande l'autorisation d'accéder à ton organisation.<br><br>
    Colle ci-dessous ta <b>clé API Eatime360</b> (générable dans Paramètres → Clés API).
  </div>
  <form id="frm" method="POST" action="https://ynnqvtfayrdteqtgxeuk.supabase.co/functions/v1/mcp/authorize">
    <input type="hidden" name="client_id" id="f_client_id">
    <input type="hidden" name="redirect_uri" id="f_redirect_uri">
    <input type="hidden" name="state" id="f_state">
    <input type="hidden" name="code_challenge" id="f_code_challenge">
    <input type="hidden" name="code_challenge_method" id="f_code_challenge_method">
    <div class="fld">
      <label>Clé API Eatime360</label>
      <input type="password" name="api_key" placeholder="eat_xxxxxxxxxxxxxxxxxxxxx" required autofocus>
    </div>
    <button class="btn" type="submit">Autoriser l'accès</button>
    <div class="err" id="err"></div>
  </form>
  <div class="foot">Pas de clé ? <a href="../parametres/" target="_blank">Génère-en une dans Paramètres</a></div>
</div>
<script>
const q = new URLSearchParams(location.search);
['client_id','redirect_uri','state','code_challenge','code_challenge_method'].forEach(k=>{
  const v = q.get(k) || '';
  const el = document.getElementById('f_'+k);
  if (el) el.value = v;
});
// Si une erreur a été passée en query, l'afficher
if (q.get('error')) document.getElementById('err').textContent = q.get('error');
</script>
</body>
</html>
