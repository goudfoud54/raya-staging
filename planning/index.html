async function submitAbsence(sid){
  const type=document.getElementById('abs_type').value;
  const debut=document.getElementById('abs_debut').value;
  const fin=document.getElementById('abs_fin').value;
  const comment=(document.getElementById('abs_motif').value||'').trim();
  const err=document.getElementById('abs_err');
  if(!debut||!fin){ err.textContent='Dates requises.'; return; }
  if(fin<debut){ err.textContent='La date de fin est avant la date de début.'; return; }
  // Liste des jours (bornes incluses)
  const days=[]; let d=new Date(debut+'T00:00:00'), end=new Date(fin+'T00:00:00');
  for(let g=0; d<=end && g<400; d.setDate(d.getDate()+1), g++) days.push(fmtDate(d));
  const btn=document.getElementById('abs_save'); if(btn){ btn.disabled=true; }
  err.textContent='';
  // Créneaux déjà planifiés sur la période (tous restos) → proposer de les supprimer
  const{data:existing,error:exErr}=await sb.from('planning_creneaux').select('id,date').eq('salarie_id',sid).gte('date',debut).lte('date',fin);
  if(exErr){ err.textContent='Erreur: '+exErr.message; if(btn)btn.disabled=false; return; }
  if(existing && existing.length){
    if(confirm(`⚠ ${existing.length} créneau(x) déjà planifié(s) pour ce salarié sur la période.\n\nOK = les supprimer et marquer l'absence.\nAnnuler = garder les créneaux (ils apparaîtront en conflit avec l'absence).`)){
      const{error:delErr}=await sb.from('planning_creneaux').delete().eq('salarie_id',sid).gte('date',debut).lte('date',fin);
      if(delErr){ err.textContent='Suppression impossible: '+delErr.message; if(btn)btn.disabled=false; return; }
    }
  }
  // Une ligne d'indispo validée par jour (checkPlacement bloque déjà sur ce mécanisme — pas de duplication)
  const motif=type+(comment?(' — '+comment):'');
  const rows=days.map(day=>({salarie_id:sid, type:'ponctuelle', statut:'indispo', statut_demande:'validee', date_specifique:day, motif, decided_at:new Date().toISOString()}));
  const{error:insErr}=await sb.from('salarie_dispos').insert(rows);
  if(insErr){ err.textContent='Erreur: '+insErr.message; if(btn)btn.disabled=false; return; }
  document.getElementById('pdfModal').innerHTML='';
  setSS('ok',`✓ Absence enregistrée (${days.length} jour${days.length>1?'s':''})`);
  await loadWeek(); // recharge S.dispos + créneaux → grille et blocages à jour
}

// Postes « expérimenté requis » d'un service NON couverts par un expérimenté PRÉSENT qui les tient.
// SOURCE UNIQUE (badge en-tête de colonne + panneau Vérifications) pour ne jamais diverger.
// Appariement TOLÉRANT à la rallonge phase 3 : depuis v0.36, la phase 3 peut avancer le début / prolonger
// la fin d'un créneau (dans l'enveloppe du service). Un expérimenté dont le début a bougé (ex 10:00 au lieu
// de 10:30) COUVRE toujours le poste 10:30 tant que son créneau l'englobe → matching par COUVERTURE
// (deb ≤ horaire du poste ≤ fin, minutes, passage minuit) et non par égalité stricte du début. GLOUTON :
// chaque expérimenté présent ne couvre qu'UN poste ; les postes exp non appariés = « non couverts ».
// `assigned` : créneaux du (jour,service,rôle) déjà filtrés onRoster.
function expUncoveredPosts(assigned, jt, svc, roleCle){
  const req=[]; getShifts(jt,svc,roleCle).forEach(v=>{ if(v.exp) req.push({deb:v.deb,fin:v.fin,debMin:_pmin(v.deb)}); });
  if(!req.length) return [];
  req.sort((a,b)=>a.debMin-b.debMin);
  const exps=assigned.filter(x=>x.heure_debut&&isExp(x.salarie_id,roleCle)).map(x=>{ let cd=_pmin(x.heure_debut),cf=x.heure_fin?_pmin(x.heure_fin):null; if(cd==null)return null; if(cf==null)cf=cd+30; if(cf<=cd)cf+=1440; return {cd,cf,used:false}; }).filter(Boolean);
  const covers=(e,pm)=>{ let p=pm; if(p<e.cd)p+=1440; return e.cd<=p && p<=e.cf; };
  const uncovered=[];
  for(const post of req){ const e=exps.find(x=>!x.used && covers(x,post.debMin)); if(e) e.used=true; else uncovered.push(post); }
  return uncovered;
}
// Un créneau (heure_debut/heure_fin) couvre-t-il un horaire donné (minutes, passage minuit) ?
function _creCoversMin(cre, pm){ let cd=_pmin(cre.heure_debut); if(cd==null)return false; let cf=cre.heure_fin?_pmin(cre.heure_fin):cd+30; if(cf<=cd)cf+=1440; let p=pm; if(p<cd)p+=1440; return cd<=p && p<=cf; }
let CHECKS=[];
function renderChecks(){
  CHECKS=[];
  const _rc=_ruleCtx();
  const toMin=t=>{if(!t)return null;const[h,m]=t.slice(0,5).split(':').map(Number);return h*60+m;};
  const dur=(deb,fin)=>{let a=toMin(deb),b=toMin(fin);if(a==null||b==null)return 0;if(b<=a)b+=24*60;return b-a;};
  const dayIdxOfDate=d=>(new Date(d).getDay()+6)%7;
  const nameOf=sid=>{const s=S.salaries.find(x=>x.id===sid);return [s?.prenom,s?.nom].filter(Boolean).join(' ')||s?.nom||'?';};

  // 1. Effectifs cibles — effectifs_exacts ON : tout écart (sous OU sur-effectif) est signalé ;
  //    OFF : seul le SOUS-effectif l'est (le sur-effectif est toléré).
  const _exact=_rc.on('effectifs_exacts',true);
  const eff=[], expMiss=[];
  for(let i=0;i<7;i++)for(const svc of ['midi','soir']){
    const t=targetFor(i,svc);const date=fmtDate(dateOfDay(i));
    S.orgRoles.forEach(r=>{
      const tgt=t[r.cle]||{cible:0};
      const assigned=S.creneaux.filter(c=>c.date===date&&c.service===svc&&c.role===r.cle&&c.heure_debut&&onRoster(salById(c.salarie_id)));
      if(tgt.cible){
        // Signalement fondé sur la présence SIMULTANÉE (même source que les badges) : plus de faux positif
        // quand des salariés se relaient. effectifs_exacts ON → sur- ET sous-couverture ; OFF → sous seulement.
        // under et over signalés INDÉPENDAMMENT (profils de besoin variables : un rôle peut être sur-couvert
        // sur une demi-heure ET sous-couvert sur une autre). Sinon le badge (rouge) et la liste divergeraient.
        const st=_effStatus(date,dayJourType(i),svc,r.cle);
        if(st.under) eff.push(`${JOURS[i]} ${svc} · ${r.nom} : ${st.peak} en simultané pour ${tgt.cible} requis (sous-couverture)`);
        if(_exact && st.over) eff.push(`${JOURS[i]} ${svc} · ${r.nom} : ${st.peak} en simultané pour ${tgt.cible} requis (sur-couverture)`);
      }
      // Expérimenté requis : matching TOLÉRANT à la rallonge phase 3 (couverture d'horaire, appariement
      // glouton) via la source unique expUncoveredPosts — plus d'égalité stricte du début (cf. bug Cali).
      expUncoveredPosts(assigned, dayJourType(i), svc, r.cle).forEach(post=>{
        // Poste tenu par un NON-expérimenté (donc à requalifier) vs simplement vacant → nuance du message.
        const heldByNonExp = assigned.some(x=>_creCoversMin(x, post.debMin));
        expMiss.push(`${JOURS[i]} ${svc} · ${r.nom} · poste ${post.deb}→${post.fin} : 1 expérimenté requis non couvert${heldByNonExp?' (poste tenu par un non-expérimenté)':''}`);
      });
    });
  }
  CHECKS.push({lbl:'Effectifs cibles',ok:eff.length===0,details:eff});
  CHECKS.push({lbl:'Expérimentés requis par poste',ok:expMiss.length===0,details:expMiss});

  // 2. Doublons inter-snack
  const conf=[];
  for(const c of S.allCreneauxWeek){
    if(!c.heure_debut || c.restaurant_id!==SNACK.id)continue;
    const others=S.allCreneauxWeek.filter(x=>x.salarie_id===c.salarie_id && x.date===c.date && x.restaurant_id!==c.restaurant_id && x.heure_debut && _overlap(c,x));
    if(others.length){
      const oList=others.map(o=>{const r=S.restos.find(x=>x.id===o.restaurant_id);return `${shortSnack(r?.nom||'')} ${o.service} ${(o.heure_debut||'').slice(0,5)}→${(o.heure_fin||'').slice(0,5)||'?'}`;}).join(' / ');
      conf.push(`${nameOf(c.salarie_id)} · ${JOURS[dayIdxOfDate(c.date)]} ${c.service} ${(c.heure_debut||'').slice(0,5)}→${(c.heure_fin||'').slice(0,5)||'?'} ↔ ${oList}`);
    }
  }
  CHECKS.push({lbl:'Pas de doublon inter-snack',ok:conf.length===0,details:conf});

  // 3. Coupure minimale (valeur de la règle coupure_min, comme checkPlacement — plus de 3h codé en dur)
  const coupMin=_rc.num('coupure_min',3);
  const coup=[];
  const bySD={};S.creneaux.forEach(c=>{const k=c.salarie_id+'|'+c.date;bySD[k]=bySD[k]||{};bySD[k][c.service]=c;});
  Object.entries(bySD).forEach(([k,svcs])=>{
    if(svcs.midi?.heure_fin && svcs.soir?.heure_debut){
      const diff=(toMin(svcs.soir.heure_debut)-toMin(svcs.midi.heure_fin))/60;
      if(diff>0 && diff<coupMin){const[sid,date]=k.split('|');coup.push(`${nameOf(sid)} · ${JOURS[dayIdxOfDate(date)]} : ${diff.toFixed(1)}h entre midi et soir`);}
    }
  });
  CHECKS.push({lbl:`Coupure ≥ ${coupMin}h`,ok:coup.length===0,details:coup});

  // 4. Jours de repos mini / semaine (valeur jour_off_min, comme checkPlacement — plus de « 7/7 » codé en dur)
  const offMin=_rc.num('jour_off_min',1);
  const noOff=[];
  // onRoster EXCLUT les salariés sortis (actif=false / date_sortie < lundi) — sans lui, les checks
  // off/plafond/min listaient des partis (ex RIAD, ALAMIN 0h) alors que le rapport auto-fill, qui filtre
  // onRoster, ne les compte pas → divergence 12 vs 10. Même filtre que le rapport → cohérence.
  const list=S.salaries.filter(s=>onRoster(s) && worksAt(s,SNACK.id));
  list.forEach(s=>{const d=new Set(S.creneaux.filter(c=>c.salarie_id===s.id && c.heure_debut).map(c=>c.date));const off=7-d.size;if(d.size>0 && off<offMin)noOff.push(`${nameOf(s.id)} : ${d.size} jours travaillés (${off} repos < ${offMin})`);});
  CHECKS.push({lbl:`≥ ${offMin} jour(s) off`,ok:noOff.length===0,details:noOff});

  // 5. Plafond heures — plafond UNIFIÉ (plafondOf : heures_max → plafond_heures → plafond_hebdo → 48),
  //    exactement le même que le blocage dur de checkPlacement.
  const over=[];
  list.forEach(s=>{
    const plaf=plafondOf(s,_rc)*60;
    const total=S.creneaux.filter(c=>c.salarie_id===s.id).reduce((a,c)=>a+dur(c.heure_debut,c.heure_fin),0);
    if(total>plaf) over.push(`${nameOf(s.id)} : ${(total/60).toFixed(1)}h > ${plaf/60}h`);
  });
  CHECKS.push({lbl:'Plafond heures hebdo',ok:over.length===0,details:over});

  // 5b. Minimum d'heures (symétrique du plafond MAX) — total tous-snacks pour un multi-snack.
  //     Signale les salariés sous leur heures_min contractuel (le nouveau tri auto-fill vise à
  //     l'éviter, mais la semaine peut manquer d'heures disponibles).
  const under=[];
  list.forEach(s=>{ const mn=s.heures_min||0; if(!mn) return; const have=weekHoursOf(s.id); if(have<mn-0.01) under.push(`${nameOf(s.id)} : ${have.toFixed(1)}h < ${mn}h (manque ${(mn-have).toFixed(1)}h)`); });
  CHECKS.push({lbl:'Minimum heures hebdo',ok:under.length===0,details:under});

  // 5b. Heure de fin max (fin_semaine lun→jeu / fin_weekend ven+sam) — miroir a posteriori des
  //     plafonds durs de checkPlacement, pour que toute règle dure apparaisse aussi dans ce panneau.
  const finCap=[];
  S.creneaux.forEach(c=>{
    if(!c.heure_fin || !c.heure_debut) return;
    const cap=_endCapMin(_rc, dayIdxOfDate(c.date)); if(!cap) return;
    let endM=toMin(c.heure_fin), debM=toMin(c.heure_debut); if(endM==null||debM==null)return; if(endM<=debM)endM+=1440;
    if(endM>cap.capM) finCap.push(`${nameOf(c.salarie_id)} · ${JOURS[dayIdxOfDate(c.date)]} ${c.service} : fin ${(c.heure_fin||'').slice(0,5)} (au-delà du plafond ${cap.cle==='fin_semaine'?'lun→jeu':'ven & sam'})`);
  });
  CHECKS.push({lbl:'Heure de fin max (jour)',ok:finCap.length===0,details:finCap});

  // 6. Amplitude max consécutive (valeur amplitude_max, comme checkPlacement — plus de 12h codé en dur)
  const ampMax=_rc.num('amplitude_max',12);
  const amp=[];
  const bySD2={};S.creneaux.forEach(c=>{const k=c.salarie_id+'|'+c.date;bySD2[k]=bySD2[k]||{};bySD2[k][c.service]=c;});
  Object.entries(bySD2).forEach(([k,svcs])=>{
    const midi=svcs.midi, soir=svcs.soir;
    const blocs=[];
    const mkBloc=(c)=>{if(!c||!c.heure_debut)return null;let d=toMin(c.heure_debut),f=toMin(c.heure_fin);if(f==null)return null;if(f<=d)f+=24*60;return {d,f};};
    const m=mkBloc(midi),s=mkBloc(soir);
    if(m && s){
      // si pause ≥ 30 min entre fin midi et début soir → 2 blocs distincts
      const sStartAdj=s.d<m.f?s.d+24*60:s.d;
      const gap=sStartAdj-m.f;
      if(gap>=30) {blocs.push(m);blocs.push(s);} else {blocs.push({d:m.d,f:s.f<=m.d?s.f+24*60:s.f});}
    } else if(m) blocs.push(m);
    else if(s) blocs.push(s);
    for(const b of blocs){
      const a=b.f-b.d;
      if(a>ampMax*60){const[sid,date]=k.split('|');amp.push(`${nameOf(sid)} · ${JOURS[dayIdxOfDate(date)]} : ${(a/60).toFixed(1)}h consécutives`);}
    }
  });
  CHECKS.push({lbl:`Amplitude ≤ ${ampMax}h consécutives`,ok:amp.length===0,details:amp});

  // 7. Fin 2h → pas matin
  const fin2=[];
  Object.entries(bySD2).forEach(([k,svcs])=>{
    const soir=svcs.soir;if(!soir||!soir.heure_fin)return;
    const fm=toMin(soir.heure_fin);
    if(fm!=null && fm>=0 && fm<=180){
      const[sid,date]=k.split('|');const nd=fmtDate(new Date(new Date(date).getTime()+86400000));
      const nm=S.creneaux.find(c=>c.salarie_id===sid && c.date===nd && c.service==='midi' && c.heure_debut);
      if(nm && toMin(nm.heure_debut)<15*60) fin2.push(`${nameOf(sid)} · ${JOURS[dayIdxOfDate(date)]}→${JOURS[dayIdxOfDate(nd)]} : fin ${(soir.heure_fin||'').slice(0,5)} puis matin ${(nm.heure_debut||'').slice(0,5)}`);
    }
  });
  CHECKS.push({lbl:'Fin 2h → pas matin J+1',ok:fin2.length===0,details:fin2});

  // 8. Repos quotidien (fin soir J → matin J+1) — TOUJOURS contrôlé (obligation légale 11h).
  //    Fin de soir en absolu (≤ début ⇒ +24h) pour ne pas sous-estimer le repos quand le soir
  //    finit après minuit (ex. 00:30) — même correction que dans checkPlacement.
  {
    const reposMin=_rc.num('repos_quotidien_h',11)*60, reposBad=[];
    const finAbs=(deb,fin)=>{let a=toMin(deb),b=toMin(fin);if(a==null||b==null)return null;if(b<=a)b+=1440;return b;};
    Object.entries(bySD2).forEach(([k,svcs])=>{
      const soir=svcs.soir; if(!soir||!soir.heure_fin)return;
      const[sid,date]=k.split('|'); const nd=fmtDate(new Date(new Date(date).getTime()+86400000));
      const nm=S.creneaux.find(c=>c.salarie_id===sid && c.date===nd && c.service==='midi' && c.heure_debut);
      if(nm){ const se=finAbs(soir.heure_debut,soir.heure_fin); if(se==null)return; const g=(toMin(nm.heure_debut)+1440)-se; if(g<reposMin) reposBad.push(`${nameOf(sid)} · ${JOURS[dayIdxOfDate(date)]}→${JOURS[dayIdxOfDate(nd)]} : ${(g/60).toFixed(1)}h de repos (min ${reposMin/60}h)`); }
    });
    CHECKS.push({lbl:`Repos quotidien ≥ ${reposMin/60}h (légal)`,ok:reposBad.length===0,details:reposBad});
  }

  // 8b. Repos HEBDOMADAIRE ≥ 35h consécutives (24h hebdo + 11h quotidien accolés).
  //     Vérif réelle : on cherche le plus grand créneau de repos continu sur la semaine
  //     affichée (segments de travail fusionnés, en minutes depuis lundi 00:00, plus les
  //     bords de semaine). Un simple « 1 jour off » ne garantit pas toujours 35h.
  const repos35=[];
  const listW=S.salaries.filter(s=>onRoster(s) && worksAt(s,SNACK.id));
  listW.forEach(s=>{
    const segs=[];
    S.creneaux.filter(c=>c.salarie_id===s.id && c.heure_debut && c.heure_fin).forEach(c=>{
      const di=dayIdxOfDate(c.date); let a=di*1440+toMin(c.heure_debut), b=di*1440+toMin(c.heure_fin);
      if(b<=a)b+=1440; segs.push([a,b]);
    });
    if(!segs.length) return; // aucun créneau → semaine entièrement de repos, conforme
    segs.sort((x,y)=>x[0]-y[0]);
    const merged=[segs[0].slice()];
    for(let i=1;i<segs.length;i++){ const last=merged[merged.length-1]; if(segs[i][0]<=last[1]) last[1]=Math.max(last[1],segs[i][1]); else merged.push(segs[i].slice()); }
    let maxGap=merged[0][0];                       // repos du lundi 00:00 au 1er créneau
    maxGap=Math.max(maxGap, 10080-merged[merged.length-1][1]); // du dernier créneau au dimanche 24:00
    for(let i=1;i<merged.length;i++) maxGap=Math.max(maxGap, merged[i][0]-merged[i-1][1]);
    if(maxGap < 35*60) repos35.push(`${nameOf(s.id)} : plus long repos continu ${(maxGap/60).toFixed(1)}h (min 35h)`);
  });
  CHECKS.push({lbl:'Repos hebdomadaire ≥ 35h',ok:repos35.length===0,details:repos35});

  // 9. Alternance / CFA — aucun service sur jour école/examen + veille protégée
  if(S.altJours && Object.keys(S.altJours).length){
    const cfaViol=[];
    S.creneaux.forEach(c=>{
      if(!c.heure_debut) return;
      const ad=altDayType(c.salarie_id,c.date);
      if(ad==='ecole'||ad==='examen'){ cfaViol.push(`${nameOf(c.salarie_id)} · ${JOURS[dayIdxOfDate(c.date)]} : placé un jour ${ad==='examen'?'d\'EXAMEN':'d\'ÉCOLE'} CFA`); return; }
      const nd=fmtDate(new Date(new Date(c.date).getTime()+86400000)); const nextAd=altDayType(c.salarie_id,nd);
      if(nextAd==='ecole'||nextAd==='examen'){
        const r=_rc.raw(nextAd==='examen'?'fin_veille_examen':'fin_veille_ecole');
        const seuil=(r&&r.active===false)?null:((r&&r.valeur)||(nextAd==='examen'?'19:00':'22:00'));
        if(seuil){ const fm=toMin(c.heure_fin),dm=toMin(c.heure_debut); const late=(fm!=null&&dm!=null&&fm<=dm)||(fm!=null&&fm>toMin(seuil));
          if(late) cfaViol.push(`${nameOf(c.salarie_id)} · ${JOURS[dayIdxOfDate(c.date)]} : fin ${(c.heure_fin||'').slice(0,5)} la veille d'un ${nextAd==='examen'?'examen':'jour d\'école'} (seuil ${seuil})`); }
      }
    });
    CHECKS.push({lbl:'Alternance (école / veille)',ok:cfaViol.length===0,details:cfaViol});
  }

  // 10. Couverture continue (soft, activable) — pour chaque jour/service/rôle requis, les
  //     créneaux de ce rôle doivent couvrir sans trou la plage travaillée (≥15 min sans
  //     personne du rôle = trou). On suit la fin MAX courante pour tolérer les chevauchements.
  if(_rc.on('couverture_continue',false)){
    const gaps=[];
    for(let i=0;i<7;i++)for(const svc of ['midi','soir']){
      const date=fmtDate(dateOfDay(i)); const t=targetFor(i,svc);
      S.orgRoles.forEach(r=>{
        if(!((t[r.cle]||{}).cible)) return;
        const cre=S.creneaux.filter(c=>c.date===date&&c.service===svc&&c.role===r.cle&&c.heure_debut&&c.heure_fin&&onRoster(salById(c.salarie_id)))
          .map(c=>{let a=toMin(c.heure_debut),b=toMin(c.heure_fin);if(b<=a)b+=1440;return [a,b];}).sort((x,y)=>x[0]-y[0]);
        if(cre.length<2) return;
        let end=cre[0][1];
        for(let j=1;j<cre.length;j++){ if(cre[j][0]-end>=15){ gaps.push(`${JOURS[i]} ${svc} · ${r.nom} : trou de ${((cre[j][0]-end)/60).toFixed(1)}h dans la couverture`); break; } end=Math.max(end,cre[j][1]); }
      });
    }
    CHECKS.push({lbl:'Couverture continue',ok:gaps.length===0,details:gaps});
  }

  // 11. Départs échelonnés (soft, activable) — signale les « pics » de départ : ≥3 personnes
  //     qui finissent exactement à la même heure sur un même service.
  if(_rc.on('departs_echelonnes',false)){
    const pics=[];
    for(let i=0;i<7;i++)for(const svc of ['midi','soir']){
      const date=fmtDate(dateOfDay(i)); const byFin={};
      S.creneaux.filter(c=>c.date===date&&c.service===svc&&c.heure_fin&&onRoster(salById(c.salarie_id))).forEach(c=>{const f=(c.heure_fin||'').slice(0,5);byFin[f]=(byFin[f]||0)+1;});
      Object.entries(byFin).forEach(([f,n])=>{ if(n>=3) pics.push(`${JOURS[i]} ${svc} : ${n} départs simultanés à ${f}`); });
    }
    CHECKS.push({lbl:'Départs échelonnés',ok:pics.length===0,details:pics});
  }

  // 12. Temps partiel — heures complémentaires plafonnées (soft, activable). Proxy « temps
  //     partiel » = heures_max renseigné et < 35h (aucun champ dédié en base). Cap = heures_max
  //     × pct/100. Signalement seulement : heures_max n'est saisi que sur une partie des fiches.
  if(_rc.on('temps_partiel_max',false)){
    const pct=_rc.num('temps_partiel_max',140)/100, tp=[];
    listW.forEach(s=>{
      const base=Number(s.heures_max); if(!(base>0 && base<35)) return;
      const cap=base*pct;
      const h=S.creneaux.filter(c=>c.salarie_id===s.id).reduce((a,c)=>a+dur(c.heure_debut,c.heure_fin),0)/60;
      if(h>cap+1e-6) tp.push(`${nameOf(s.id)} : ${h.toFixed(1)}h > ${cap.toFixed(1)}h (contrat ${base}h × ${(pct*100).toFixed(0)}%)`);
    });
    CHECKS.push({lbl:'Heures compl. temps partiel',ok:tp.length===0,details:tp});
  }

  // Contraintes individuelles (salarie_contraintes) — a posteriori. Les clés DURES sont bloquées à la pose,
  // mais une dérogation manuelle peut les forcer → on les re-signale ici. jours_off_consecutifs est SOUPLE
  // (jamais bloquant, seulement signalé). autre est purement informatif.
  const contrViol=[], joursOffViol=[], autreInfo=[], seenCV=new Set();
  list.forEach(s=>{
    const cs=contrOf(s.id); if(!cs.length) return;
    const myCre=S.creneaux.filter(c=>c.salarie_id===s.id && c.heure_debut);
    const daysWorked=new Set(myCre.map(c=>c.date));
    myCre.forEach(cr=>{
      const di=dayIdxOfDate(cr.date);
      const v=_contrainteBlocking(s.id,{deb:(cr.heure_debut||'').slice(0,5),fin:(cr.heure_fin||'').slice(0,5),role:cr.role},cr.date,cr.service,di);
      if(v){ const line=`${nameOf(s.id)} · ${JOURS[di]} ${cr.service} ${(cr.heure_debut||'').slice(0,5)}→${(cr.heure_fin||'').slice(0,5)} : ${v.label}`; if(!seenCV.has(line)){ seenCV.add(line); contrViol.push(line); } }
    });
    cs.forEach(c=>{
      if(c.cle==='autre'){ autreInfo.push(`${nameOf(s.id)} : ${escP(c.valeur)}`); }
      else if(c.cle==='jours_off_consecutifs'){
        const nOff=parseInt(c.valeur,10);
        if(isFinite(nOff) && daysWorked.size>0){
          const off=[]; for(let i=0;i<7;i++){ if(!daysWorked.has(fmtDate(dateOfDay(i)))) off.push(i); }
          let best=0,cur=0,prev=-9; off.forEach(i=>{ cur=(i===prev+1)?cur+1:1; prev=i; if(cur>best)best=cur; });
          if(off.length && best<nOff) joursOffViol.push(`${nameOf(s.id)} : repos non groupés (plus longue série ${best}j < ${nOff}j souhaités)`);
        }
      }
    });
  });
  CHECKS.push({lbl:'Contraintes individuelles',ok:contrViol.length===0,details:contrViol});
  if(joursOffViol.length) CHECKS.push({lbl:'Repos groupés (préférence)',ok:false,details:joursOffViol});
  if(autreInfo.length) CHECKS.push({lbl:'Contraintes libres (info)',ok:true,details:autreInfo});

  // Sur-couverture horaire : demi-heures où le nombre de présents DÉPASSE le besoin (projection des vagues).
  // Audite aussi les plannings saisis à la main (la phase 3 ne peut plus en créer). On signale la pire
  // demi-heure par (jour, service, rôle) pour rester lisible.
  const overCov=[]; const _hm=m=>String(Math.floor((((m%1440)+1440)%1440)/60)).padStart(2,'0')+':'+String(m%60).padStart(2,'0');
  for(let i=0;i<7;i++)for(const svc of ['midi','soir']){
    const jt=dayJourType(i), date=fmtDate(dateOfDay(i));
    S.orgRoles.forEach(r=>{
      const vs=getShifts(jt,svc,r.cle); if(!vs.length)return;
      let mn=Infinity,mx=-Infinity; vs.forEach(v=>{let d=toMin(v.deb),f=toMin(v.fin);if(d==null||f==null)return;if(f<=d)f+=1440;if(d<mn)mn=d;if(f>mx)mx=f;});
      if(mn===Infinity)return;
      let worst=null;
      for(let hh=mn;hh<mx;hh+=30){ const cov=_coverAt(date,svc,r.cle,hh,null), need=_needAt(jt,svc,r.cle,hh); if(cov>need && (!worst||cov-need>worst.d)) worst={hh,cov,need,d:cov-need}; }
      if(worst) overCov.push(`${JOURS[i]} ${svc} · ${r.nom} · ${_hm(worst.hh)} : ${worst.cov}/${worst.need} présents (sur-couverture)`);
    });
  }
  CHECKS.push({lbl:'Couverture horaire (pas de sur-effectif)',ok:overCov.length===0,details:overCov});

  document.getElementById('checks').innerHTML=CHECKS.map((c,i)=>{
    const n=c.details.length;const hasD=n>0;
    return `<button class="chk ${c.ok?'ok':'ko'}" ${hasD?`onclick="showCheckDetails(${i})"`:''} style="${hasD?'cursor:pointer':'cursor:default'}">${c.ok?'✓':'⚠'} ${c.lbl}${n?` (${n})`:''}</button>`;
  }).join('');
}

function showCheckDetails(i){
  const c=CHECKS[i];if(!c||!c.details.length)return;
  document.getElementById('pdfModal').innerHTML=`
  <div class="pdf-bg" onclick="if(event.target===this)document.getElementById('pdfModal').innerHTML=''">
    <div class="pdf-modal" style="max-width:560px">
      <h3>${c.ok?'✓':'⚠'} ${c.lbl} <span style="color:var(--muted);font-weight:400;font-size:12px">(${c.details.length})</span></h3>
      <div style="max-height:60vh;overflow:auto;background:var(--surface);border:1px solid var(--line-2);border-radius:8px;padding:12px;font-size:12.5px;line-height:1.7">
        ${c.details.map(d=>`<div>• ${d}</div>`).join('')}
      </div>
      <div class="actions" style="margin-top:14px"><button class="btn" onclick="document.getElementById('pdfModal').innerHTML=''">OK</button></div>
    </div>
  </div>`;
}

function render(){
  document.getElementById('wkLabel').textContent=wkRangeLabel();
  computeConflicts();
  renderEffectifs();
  if(VIEW_MODE==='poste') renderPosteTable(); else renderTable();
  renderChecks();updateUndoBtns();updateViewButtons();updateDemandesBadge();
  recomputeAggregates();   // point de passage unique : coûts/heures toujours à jour après TOUT rendu (auto-fill, undo/redo, bascule de vue, import…)
  renderMobile();          // vue mobile (< 820px) — même données, mêmes helpers que la grille (jamais de divergence)
  setSS('','');
}

// ════════ VUE MOBILE (< 820px) ════════════════════════════════════════════════════════════════════
// Rendu alternatif conditionné à la largeur (CSS) : la grille bureau reste INCHANGÉE. Réutilise les MÊMES
// helpers que la grille (getCreneau, hasIndispo, altDayType, contrOf, rowHoursCell, saveCell, autoFillDay…)
// pour ne jamais diverger. Deux dimensions, une seule à la fois : par JOUR (défaut) ou par SALARIÉ.
let mobileMode='jour', mobileDay=-1, mobileSalId=null, mobileOpenKey=null;
function setMobileMode(m){ mobileMode=m; mobileOpenKey=null; renderMobile(); }
function mvNavDay(delta){ mobileDay=Math.max(0,Math.min(6,mobileDay+delta)); mobileOpenKey=null; renderMobile(); }
function mvPickSal(sid){ mobileSalId=sid; mobileOpenKey=null; renderMobile(); }
function mvToggleCard(key){ mobileOpenKey=(mobileOpenKey===key?null:key); renderMobile(); }
async function mvSave(sid,date,svc,which,el){ await saveCell(sid,date,svc,which,el); renderMobile(); }
function _mvTot(sid,date){ return _pdur((getCreneau(sid,date,'midi')||{}).heure_debut,(getCreneau(sid,date,'midi')||{}).heure_fin)+_pdur((getCreneau(sid,date,'soir')||{}).heure_debut,(getCreneau(sid,date,'soir')||{}).heure_fin); }
// Badges d'un salarié (rôle + indispo/école + contrainte 🔒 + cumul inter-snack) — repris de la grille.
function _mvBadges(s,date){
  let b='';
  rolesOf(s.id).forEach(cle=>{ b+=`<span style="background:${roleCol(cle)}22;color:${roleCol(cle)};border:1px solid ${roleCol(cle)}55">${escP((roleNom(cle).charAt(0)||'').toUpperCase())}${isExp(s.id,cle)?'★':'🔰'}</span>`; });
  if(date){ const adt=altDayType(s.id,date); if(adt) b+=`<span style="background:rgba(91,156,255,.14);color:#5b9cff">${adt==='examen'?'📝 Examen':'🎓 École'}</span>`;
    const ind=hasIndispo(s.id,date); if(ind){const ib=indispoBadge(ind);b+=`<span style="background:rgba(224,169,58,.16);color:var(--warn)">${ib.ic} ${escP(ib.lbl)}</span>`;} }
  const cs=contrOf(s.id); if(cs.length) b+=`<span data-tip="${escP(cs.map(_contrLabelOf).join(' · '))}" style="background:rgba(74,127,189,.14);color:#4a7fbd">🔒 ${cs.length}</span>`;
  const oth=otherSnackHoursOf(s.id); if(oth>0.01) b+=`<span style="background:rgba(200,160,53,.14);color:var(--gold)">+${fmtH1(oth)}h ailleurs</span>`;
  return b;
}
// Bloc service (midi/soir) d'une carte : affichage + (si ouvert) champs éditables réutilisant saveCell.
function _mvSvcBlock(s,date,svc){
  const cr=getCreneau(s.id,date,svc)||{};
  const hd=(cr.heure_debut||'').slice(0,5), hf=(cr.heure_fin||'').slice(0,5), empty=!(hd||hf);
  return `<div class="s ${svc}${empty?' empty':''}"><span class="k">${svc==='midi'?'Midi':'Soir'}</span><span class="v">${empty?'—':escP(hd)+' → '+escP(hf)}</span></div>`;
}
function _mvEditPanel(s,date){
  // Journée entière bloquée (école/indispo sans heures) → pas d'édition, on explique.
  const adt=altDayType(s.id,date), ind=hasIndispo(s.id,date);
  if(adt==='ecole'||adt==='examen') return `<div class="edit"><div class="blocked">${adt==='examen'?'📝 Examen':'🎓 École'} — alternant indisponible ce jour.</div></div>`;
  if(ind && !(ind.heure_debut||ind.heure_fin)) return `<div class="edit"><div class="blocked">${indispoBadge(ind).ic} ${escP(indispoBadge(ind).lbl)} — journée entière, non modifiable ici.</div></div>`;
  let h='<div class="edit">';
  for(const svc of ['midi','soir']){
    const cr=getCreneau(s.id,date,svc)||{}; const hd=(cr.heure_debut||'').slice(0,5), hf=(cr.heure_fin||'').slice(0,5);
    h+=`<div class="erow"><label>${svc==='midi'?'Midi':'Soir'}</label>
      <input type="text" inputmode="numeric" maxlength="5" placeholder="dbt" value="${hd}" data-saved="${hd}" onblur="mvSave('${s.id}','${date}','${svc}','deb',this)">
      <input type="text" inputmode="numeric" maxlength="5" placeholder="fin" value="${hf}" data-saved="${hf}" onblur="mvSave('${s.id}','${date}','${svc}','fin',this)"></div>`;
  }
  return h+'</div>';
}
// Bandeau de couverture d'un jour (rôles/services sous ou sur-couverts) — via _effStatus (présence simultanée).
function _mvCoverage(date,jt){
  const parts=[];
  for(const svc of ['midi','soir']){ const t=targetFor(mobileDay,svc);
    for(const r of S.orgRoles){ const tgt=t[r.cle]||{cible:0}; if(!tgt.cible)continue;
      const st=_effStatus(date,jt,svc,r.cle); const cl=st.over?'over':(st.under?'under':'ok');
      parts.push(`<span class="b ${cl}"><span class="dt" style="background:${roleCol(r.cle)}"></span>${svc==='midi'?'M':'S'} ${escP(roleNom(r.cle).slice(0,4))} ${st.peak}/${tgt.cible}</span>`);
    } }
  return parts.length?`<div class="mv-cov">${parts.join('')}</div>`:'';
}
function _mvDayView(list){
  if(mobileDay<0) mobileDay=Math.min(6,Math.max(0,(new Date().getDay()+6)%7)); // aujourd'hui si dans la semaine
  const date=fmtDate(dateOfDay(mobileDay)), jt=dayJourType(mobileDay);
  const dObj=dateOfDay(mobileDay);
  let h=`<div class="mv-daybar">
    <button class="nav" onclick="mvNavDay(-1)" ${mobileDay<=0?'disabled style="opacity:.4"':''}>‹</button>
    <div class="lbl">${JOURS[mobileDay]}<small>${dObj.getDate()} ${dObj.toLocaleDateString('fr-FR',{month:'long'})}</small></div>
    <button class="nav" onclick="mvNavDay(1)" ${mobileDay>=6?'disabled style="opacity:.4"':''}>›</button>
    <button class="act" onclick="autoFillDay(${mobileDay})" data-tip="Remplir ce jour">🎲</button></div>`;
  h+=_mvCoverage(date,jt);
  if(!list.length) return h+'<div class="mv-empty">Aucun salarié pour ce snack.</div>';
  h+='<div class="mv-cards">';
  list.forEach(s=>{
    const key=s.id+'|'+date, open=(mobileOpenKey===key), tot=_mvTot(s.id,date);
    h+=`<div class="mv-card" style="--scol:${s.couleur||'#666'}">
      <div class="hd" onclick="mvToggleCard('${key}')"><span class="dot" style="width:11px;height:11px;border-radius:50%;background:${s.couleur||'#666'};flex-shrink:0"></span>
        <span class="nm">${escP(fullName(s))}</span><span class="tot">${tot>0?fmtH1(tot/60)+'h':'—'}</span><span style="color:var(--muted)">${open?'▲':'▾'}</span></div>
      <div class="badges">${_mvBadges(s,date)}</div>
      <div class="svc" onclick="mvToggleCard('${key}')">${_mvSvcBlock(s,date,'midi')}${_mvSvcBlock(s,date,'soir')}</div>
      ${open?_mvEditPanel(s,date):''}</div>`;
  });
  return h+'</div>';
}
function _mvSalView(list){
  if(!list.length) return '<div class="mv-empty">Aucun salarié pour ce snack.</div>';
  if(!mobileSalId || !list.some(s=>s.id===mobileSalId)) mobileSalId=list[0].id;
  const idx=list.findIndex(s=>s.id===mobileSalId), s=list[idx];
  const rh=rowHoursCell(s);
  let h=`<div class="mv-daybar">
    <button class="nav" onclick="mvPickSal('${list[Math.max(0,idx-1)].id}')" ${idx<=0?'disabled style="opacity:.4"':''}>‹</button>
    <div class="lbl">${escP(fullName(s))}<small>total ${rh.html.replace(/<[^>]+>/g,' ').trim()}</small></div>

function renderPosteTable(){
  const fullName=s=>[s.prenom,s.nom].filter(Boolean).join(' ')||s.nom||'?';
  // Construire la liste des postes (svc, role, index) avec max sur la semaine
  const rows=[];
  for(const svc of ['midi','soir'])for(const _r of S.orgRoles){const role=_r.cle;
    let maxN=0;
    for(let i=0;i<7;i++){const s=getShifts(dayJourType(i),svc,role);if(s.length>maxN)maxN=s.length;}
    for(let k=0;k<maxN;k++)rows.push({svc,role,k});
  }
  // header : Poste | Lu | Ma | ... | Di
  let html='<thead><tr><th class="salhead">Poste</th>';
  JOURS_SH.forEach((j,i)=>html+=`<th class="dayhead">${j} <span style="color:var(--muted);font-weight:400">${dateOfDay(i).getDate()}</span></th>`);
  html+='</tr></thead><tbody>';

  if(!rows.length){
    html+='<tr><td colspan="8" style="text-align:center;padding:30px;color:var(--muted)">Aucun poste défini pour ce snack — configure les effectifs dans Réglages</td></tr></tbody>';
    document.getElementById('planTbl').innerHTML=html;return;
  }

  let lastGroup=null;
  for(const{svc,role,k}of rows){
    const groupLbl=svc==='midi'?'MIDI':'SOIR';
    const groupKey=svc+'-'+role;
    // Ligne d'en-tête de section quand le groupe change
    if(lastGroup!==groupKey){
      const roleLbl=roleNom(role);
      const groupColor=svc==='midi'?'rgba(232,160,106,.15)':'rgba(91,156,255,.12)';
      html+=`<tr><td colspan="8" style="background:${groupColor};padding:8px 14px;font-size:11px;font-weight:700;color:${svc==='midi'?'#e8a06a':'#5b9cff'};text-transform:uppercase;letter-spacing:.08em;border-top:2px solid var(--line)">${groupLbl} · ${roleLbl}</td></tr>`;
      lastGroup=groupKey;
    }
    const roleSym=roleNom(role);
    const bg=svc==='midi'?'rgba(232,160,106,.04)':'rgba(91,156,255,.04)';
    html+=`<tr><td class="salname" style="background:${bg}"><b>${roleSym} ${k+1}</b></td>`;
    for(let i=0;i<7;i++){
      const shifts=getShifts(dayJourType(i),svc,role);
      const shift=shifts[k];
      const date=fmtDate(dateOfDay(i));
      if(!shift){html+=`<td style="background:rgba(255,255,255,.015);text-align:center;color:var(--muted);font-size:11px">—</td>`;continue;}
      const matchingByOrder=S.creneaux.filter(c=>c.date===date&&c.service===svc&&c.role===role&&c.heure_debut).sort((a,b)=>(a.heure_debut||'').localeCompare(b.heure_debut||''));
      const cr=matchingByOrder[k]||null;
      const candidates=S.salaries.filter(s=>{
        if(s.actif===false)return false;
        if(!worksAt(s,SNACK.id))return false;
        if(!rolesOf(s.id).includes(role))return false;
        return true;
      }).sort((a,b)=>(a.nom||'').localeCompare(b.nom||''));
      const selSid=cr?cr.salarie_id:'';
      const selColor=cr?(S.salaries.find(s=>s.id===cr.salarie_id)?.couleur||''):'';
      const conflictKey=cr?`${cr.salarie_id}|${date}|${svc}`:'';
      const isConf=cr&&CONFLICTS.has(conflictKey);
      html+=`<td style="background:${selColor?selColor+'25':bg};${selColor?'border-left:3px solid '+selColor:''};${isConf?'box-shadow:inset 0 0 0 1.5px var(--bad);':''};padding:5px 6px">
        <select onchange="assignPosteCell('${date}','${svc}','${role}','${shift.deb}','${shift.fin}',this.value,'${cr?cr.id:''}')" style="width:100%;background:transparent;border:1px solid var(--line-2);color:var(--text);padding:4px 6px;border-radius:5px;font-size:11.5px;font-weight:600;cursor:pointer">
          <option value="">— vacant —</option>
          ${candidates.map(s=>`<option value="${s.id}" ${s.id===selSid?'selected':''}>${fullName(s)} ${isExp(s.id,role)?'★':'🔰'}</option>`).join('')}
        </select>
        <div style="color:var(--muted);font-size:10px;text-align:center;margin-top:3px;font-family:monospace">${shift.deb}→${shift.fin}</div>
      </td>`;
    }
    html+='</tr>';
  }
  html+='</tbody>';
  document.getElementById('planTbl').innerHTML=html;
}

async function assignPosteCell(date,svc,role,deb,fin,newSid,oldCreneauId){
  setSS('busy','Enregistrement…');
  beginTxn();
  // 1) Si l'ancien existait et qu'on change → supprimer (ou modifier)
  if(oldCreneauId){
    const oldCr=S.creneaux.find(c=>c.id===oldCreneauId);
    if(oldCr && (!newSid || newSid !== oldCr.salarie_id)){
      await sb.from('planning_creneaux').delete().eq('id',oldCreneauId);
      S.creneaux=S.creneaux.filter(c=>c.id!==oldCreneauId);
      S.allCreneauxWeek=S.allCreneauxWeek.filter(c=>c.id!==oldCreneauId);
      if(_txn)_txn.push({before:oldCr,after:null});
    }
  }
  // 2) Si nouveau salarié sélectionné → upsert
  if(newSid){
    const payload={restaurant_id:SNACK.id,salarie_id:newSid,role,date,service:svc,heure_debut:deb,heure_fin:fin};
    const{data,error}=await sb.from('planning_creneaux').upsert(payload,{onConflict:'restaurant_id,salarie_id,date,service'}).select().single();
    if(error){setSS('err','Erreur: '+error.message);endTxn();return;}
    S.creneaux=S.creneaux.filter(c=>!(c.salarie_id===newSid&&c.date===date&&c.service===svc));S.creneaux.push(data);
    S.allCreneauxWeek=S.allCreneauxWeek.filter(c=>!(c.salarie_id===newSid&&c.date===date&&c.service===svc&&c.restaurant_id===SNACK.id));S.allCreneauxWeek.push(data);
    if(_txn)_txn.push({before:null,after:data});
  }
  endTxn();
  setSS('ok','Enregistré ✓');
  render();
}

// ── Seuils LÉGAUX (France) ──────────────────────────────────────────────────────────────────────
// On N'INTERDIT PAS (des dérogations conventionnelles existent, notamment HCR) mais on AVERTIT : le produit
// étant revendu, l'utilisateur doit savoir qu'il descend sous un seuil légal. Réf. VÉRIFIÉE fournie :
// repos quotidien 11h = art. L3131-1. Les autres seuils sont indiqués génériquement (« seuil légal
// français » / convention) — chiffres à confirmer selon la convention collective applicable. Ne pas
// inventer de numéros d'article : une mauvaise citation dans un produit de revente est un risque juridique.
const LEGAL_LIMITS={
  repos_quotidien_h:{dir:'min', seuil:11, unit:'h', label:'repos quotidien de 11 h consécutives', ref:'art. L3131-1 du Code du travail'},
  jour_off_min:{dir:'min', seuil:1,  unit:'j', label:'repos hebdomadaire (au moins 1 jour de repos par semaine)', ref:'seuil légal français'}, // seuil à confirmer
  plafond_hebdo:{dir:'max', seuil:48, unit:'h', label:'durée hebdomadaire maximale absolue de 48 h', ref:'seuil légal français'},              // seuil à confirmer
  amplitude_max:{dir:'max', seuil:13, unit:'h', label:'amplitude journalière maximale de 13 h', ref:'convention collective (ex. HCR)'},        // seuil à confirmer
};
function legalBreach(cle, val){ const L=LEGAL_LIMITS[cle]; if(!L)return null; const v=parseFloat(val); if(!isFinite(v))return null; return (L.dir==='min'?v<L.seuil:v>L.seuil)?L:null; }
function legalBreachList(){ return Object.keys(LEGAL_LIMITS).map(k=>{ const r=(S.regles||[]).find(x=>x.cle===k); if(!r||r.valeur==null)return null; const L=legalBreach(k,r.valeur); return L?{cle:k,val:r.valeur,L}:null; }).filter(Boolean); }
// Saisie d'une valeur de règle soumise à un seuil légal : avertit + journalise UNIQUEMENT quand on FRANCHIT
// le seuil (jamais quand on repasse au-dessus). Annulation → on restaure la valeur précédente (comme la saisie).
async function onRegleValue(el, id){
  const r=(S.regles||[]).find(x=>x.id===id); if(!r) return;
  const old=r.valeur, val=el.value, L=legalBreach(r.cle, val);
  if(L && String(val)!==String(old)){
    const sens = L.dir==='min' ? 'descendez sous le' : 'dépassez le';
    if(!confirm(`⚠️ Vous ${sens} ${L.label}.\n\nUn planning ne respectant pas ce seuil vous expose à des sanctions (contentieux prud'homal, contrôle de l'inspection du travail). Certaines conventions collectives (dont HCR) prévoient des dérogations encadrées — vérifiez votre situation.\n\nRéférence : ${L.ref}.\n\nEnregistrer quand même cette valeur sous le seuil légal ?`)){
      el.value = old!=null?old:''; return;   // annulé → on restaure la valeur d'avant
    }
    await saveRegle(id,'valeur',val);
    logLegalOverride(r,val,L);
  } else {
    await saveRegle(id,'valeur',val);
  }
  openReglages();   // re-render : badge « sous le seuil légal » persistant, à jour dans les deux sens
}
// Traçabilité : qui a réglé sous le seuil légal et quand (réutilise planning_derogations, salarie_id null).
async function logLegalOverride(r,val,L){
  try{ await sb.from('planning_derogations').insert({restaurant_id:SNACK.id, salarie_id:null, service:null, date:fmtDate(new Date()), regle_cle:r.cle, regle_label:`Réglage sous seuil légal : ${L.label}`, motif:`Confirmé à ${val}${L.unit} (seuil ${L.seuil}${L.unit}) — ${L.ref}`, forced_by:ME&&ME.id}); }
  catch(e){ console.warn('[planning] journalisation seuil légal échouée', e); }
}
// Encart « généré sous un seuil légal » pour le rapport d'auto-fill (discret mais présent).
function buildLegalWarn(){
  const list=legalBreachList(); if(!list.length) return '';

}

    <div style="color:var(--muted);font-size:12px;margin-bottom:12px">Active ou désactive les contrôles qui s'appliquent au planning</div>
    <div style="background:var(--surface);border:1px solid var(--line-2);border-radius:10px;overflow:hidden">`;
  if(!S.regles.length){
    html+='<div style="padding:18px;color:var(--muted);font-size:12px">Aucune règle configurée. Les vérifications utilisent les valeurs par défaut.</div>';
  } else {
    // Trier : règles booléennes (avec on/off) en premier, valeurs obligatoires ensuite
    const sorted=S.regles.slice().sort((a,b)=>{
      const ta=(RULE_META[a.cle]?.type||'z'),tb=(RULE_META[b.cle]?.type||'z');
      const aIsBool=ta==='bool'?0:1, bIsBool=tb==='bool'?0:1;
      if(aIsBool!==bIsBool) return aIsBool-bIsBool;
      return (RULE_META[a.cle]?.lbl||a.cle).localeCompare(RULE_META[b.cle]?.lbl||b.cle);
    });
    let lastType=null;
    sorted.forEach((r,idx)=>{
      const meta=RULE_META[r.cle]||{lbl:r.libelle||r.cle,type:'text'};
      const isBool=meta.type==='bool';
      // Insérer un sous-titre quand on passe des booléens aux valeurs
      if(isBool && lastType!=='bool'){
        html+=`<div style="padding:10px 16px 4px;font-size:10.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;font-weight:600;background:rgba(255,255,255,.02)">Règles activables</div>`;
      } else if(!isBool && lastType==='bool'){
        html+=`<div style="padding:10px 16px 4px;font-size:10.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;font-weight:600;background:rgba(255,255,255,.02);border-top:1px solid var(--line)">Limites & valeurs</div>`;
      } else if(idx===0 && !isBool){
        html+=`<div style="padding:10px 16px 4px;font-size:10.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;font-weight:600;background:rgba(255,255,255,.02)">Limites & valeurs</div>`;
      }
      lastType=isBool?'bool':'val';

      let valueInput='';
      if(meta.type==='number'){
        const _onb = LEGAL_LIMITS[r.cle] ? `onRegleValue(this,'${r.id}')` : `saveRegle('${r.id}','valeur',this.value)`;
        const _brk = legalBreach(r.cle, r.valeur);
        valueInput=`<input type="number" ${meta.min!=null?`min="${meta.min}"`:''} ${meta.max!=null?`max="${meta.max}"`:''} value="${r.valeur||0}" onblur="${_onb}" style="width:80px;padding:7px 10px;border-radius:6px;border:1px solid ${_brk?'var(--bad)':'var(--line-2)'};background:var(--bg);color:var(--text);font-size:13px;text-align:center;font-weight:600">${meta.unit?`<span style="color:var(--muted);font-size:12px;margin-left:6px">${meta.unit}</span>`:''}`;
      } else if(meta.type==='time' && (r.cle==='fin_semaine'||r.cle==='fin_weekend')){
        valueInput=finRuleInput(r);
      } else if(meta.type==='time'){
        valueInput=`<input type="time" value="${r.valeur||'00:00'}" onblur="saveRegle('${r.id}','valeur',this.value)" style="padding:7px 10px;border-radius:6px;border:1px solid var(--line-2);background:var(--bg);color:var(--text);font-size:13px;font-weight:600">`;
      } else if(!isBool) {
        valueInput=`<input type="text" value="${r.valeur||''}" onblur="saveRegle('${r.id}','valeur',this.value)" style="width:120px;padding:7px 10px;border-radius:6px;border:1px solid var(--line-2);background:var(--bg);color:var(--text);font-size:13px">`;
      }

      // L'aide de RULE_META était renseignée mais n'était affichée NULLE PART : c'est elle qui lève
      // l'ambiguïté entre deux règles voisines (repos quotidien = une DURÉE · fin après minuit = un
      // INTERDIT). On la rend sous le libellé, en français courant.
      const helpHtml = meta.help ? `<div style="font-size:11.5px;color:var(--muted);line-height:1.5;margin-top:5px;padding-left:${isBool?'28px':'0'}">${escP(meta.help)}</div>` : '';
      if(isBool && r.cle==='repos_quotidien'){
        // Obligation légale (repos quotidien 11h) : toujours appliquée, non désactivable.
        // Case verrouillée cochée + mention explicite — un admin ne doit jamais pouvoir la contourner.
        html+=`<div style="padding:12px 16px;border-top:1px solid var(--line)">
          <label style="display:flex;align-items:center;gap:10px;flex:1;cursor:not-allowed;opacity:.9">
            <input type="checkbox" checked disabled style="width:18px;height:18px;cursor:not-allowed">
            <span style="font-size:13.5px">${meta.lbl} <span style="color:var(--gold);font-size:11px;font-weight:600;border:1px solid var(--gold);border-radius:4px;padding:1px 6px;margin-left:6px">🔒 obligation légale</span></span>
          </label>${helpHtml}
        </div>`;
      } else if(isBool){
        html+=`<div style="padding:12px 16px;border-top:1px solid var(--line)">
          <label style="display:flex;align-items:center;gap:10px;flex:1;cursor:pointer">
            <input type="checkbox" ${r.active?'checked':''} onchange="saveRegle('${r.id}','active',this.checked)" style="width:18px;height:18px;cursor:pointer">
            <span style="font-size:13.5px">${meta.lbl}</span>
          </label>${helpHtml}
        </div>`;
      } else {
        // Règles à valeur — pas de case, juste le champ. Badge ROUGE persistant si sous le seuil légal.
        const _lb=legalBreach(r.cle, r.valeur);
        const legalBadge=_lb?`<span data-tip="${escP(_lb.ref)} — dérogations conventionnelles possibles, vérifiez votre situation" style="margin-left:8px;font-size:10px;font-weight:700;color:var(--bad);background:rgba(196,90,90,.13);border:1px solid var(--bad);border-radius:4px;padding:1px 6px;white-space:nowrap;cursor:help">⚠ sous le seuil légal (${_lb.dir==='min'?'min. ':'max. '}${_lb.seuil}${_lb.unit})</span>`:'';
        html+=`<div style="display:flex;align-items:center;gap:14px;padding:12px 16px;border-top:1px solid var(--line)">
          <span style="font-size:13.5px;flex:1">${meta.lbl}${legalBadge}${helpHtml}</span>
          <div>${valueInput}</div>
        </div>`;
      }
    });
  }
  // Sureffectif auto (phase 3) — toggle TOUJOURS présent (indépendant des lignes planning_regles
  // existantes), créé à la volée s'il n'existe pas encore. Défaut OFF (opt-in, coût supplémentaire).
  {
    const sr=S.regles.find(x=>x.cle==='sureffectif_minimum');
    const on = sr ? sr.active!==false : false;
    html+=`<div style="display:flex;align-items:center;gap:14px;padding:12px 16px;border-top:1px solid var(--line)">
      <label style="display:flex;align-items:center;gap:10px;flex:1;cursor:pointer">
        <input type="checkbox" ${on?'checked':''} onchange="toggleSureffRule(this.checked)" style="width:18px;height:18px;cursor:pointer">
        <span style="font-size:13.5px">${RULE_META.sureffectif_minimum.lbl} <span style="color:var(--muted);font-size:11px">(phase 3 · coût +)</span></span>
      </label>
    </div>`;
  }
  // Transfert inter-snack (phase 3) — même modèle que le sureffectif : toggle toujours présent, créé à la
  // volée, défaut OFF (opt-in). Contrôle le SEUL cas « déplacement vers un autre restaurant » ; les
  // ajustements d'horaires intra-snack restent automatiques quoi qu'il arrive.
  {
    const tr=S.regles.find(x=>x.cle==='transfert_inter_snack');
    const on = tr ? tr.active!==false : false;
    html+=`<div style="display:flex;align-items:center;gap:14px;padding:12px 16px;border-top:1px solid var(--line)">
      <label style="display:flex;align-items:center;gap:10px;flex:1;cursor:pointer">
        <input type="checkbox" ${on?'checked':''} onchange="toggleInterSnackRule(this.checked)" style="width:18px;height:18px;cursor:pointer">
        <span style="font-size:13.5px">${RULE_META.transfert_inter_snack.lbl} <span style="color:var(--muted);font-size:11px">(phase 3 · dernier recours)</span></span>
      </label>
    </div>`;
  }
  html+='</div></div>';

  // === ALERTES & COMPORTEMENT ===
  html+=`<div style="margin-bottom:8px">
    <div style="font-size:14px;font-weight:600;margin-bottom:4px">Comportement</div>
    <div style="color:var(--muted);font-size:12px;margin-bottom:12px">Préférences d'affichage et notifications</div>
    <div style="background:var(--surface);border:1px solid var(--line-2);border-radius:10px;padding:14px 16px">
      <label style="display:flex;align-items:center;gap:10px;cursor:pointer">
        <input type="checkbox" ${POPUP_ALERTS?'checked':''} onchange="setPopupAlerts(this.checked)" style="width:18px;height:18px;cursor:pointer">
        <span style="font-size:13.5px">Afficher une popup quand un conflit inter-snack est détecté</span>
      </label>
    </div>
  </div>`;

  document.getElementById('pdfModal').innerHTML=`<div class="pdf-bg" onclick="if(event.target===this){document.getElementById('pdfModal').innerHTML='';render();}"><div class="pdf-modal" style="max-width:760px;width:92vw;max-height:90vh;overflow:auto;padding:26px">${html}</div></div>`;
}
function targetForJT(jt,svc){
  const fromDb=S.effectifs.filter(e=>e.restaurant_id===SNACK.id && e.jour_type===jt && e.service===svc);
  if(fromDb.length){const t={cuisine:0,caisse:0};fromDb.forEach(e=>{if(t[e.role]!=null)t[e.role]=e.nb_cible;});return t;}
  const i={'Lu-Me':0,'Je':3,'Ve':4,'Sa':5,'Di':6}[jt];
  return targetFor(i,svc);
}
async function saveEffField(inp){

  const col=f==='exp'?'nb_experimentes':'nb_cible';
  const existing=S.effectifs.find(e=>e.restaurant_id===SNACK.id&&e.jour_type===jt&&e.service===svc&&e.role===role);
  if(existing){
    const{error}=await sb.from('planning_effectifs').update({[col]:v}).eq('id',existing.id);
    if(error){alert('Erreur: '+error.message);return;} existing[col]=v;
  } else {
    const payload={restaurant_id:SNACK.id,jour_type:jt,service:svc,role,nb_cible:0,nb_experimentes:0}; payload[col]=v;
    const{data,error}=await sb.from('planning_effectifs').insert(payload).select().single();
    if(error){alert('Erreur: '+error.message);return;} S.effectifs.push(data);
  }

      b.onclick=()=>openShiftsEditor(jt,svc,role);

  setSS('ok','Effectif sauvegardé'); renderEffectifs(); renderChecks();
}

async function saveRegle(id,field,val){

// Suggestion d'heure de fin (plafond) à partir de la fermeture du restaurant + marge (rangement/service).
const FIN_MARGE_MIN=30;
function suggestionFin(cle){
  const ferm = cle==='fin_weekend' ? SNACK.fermeture_weekend : SNACK.fermeture_semaine;
  if(!ferm) return null;
  const[h,m]=String(ferm).slice(0,5).split(':').map(Number);
  if(!isFinite(h)||!isFinite(m)) return null;
  let tot=(h*60+m+FIN_MARGE_MIN)%1440; if(tot<0)tot+=1440;
  return {ferm:String(ferm).slice(0,5), sug:String(Math.floor(tot/60)).padStart(2,'0')+':'+String(tot%60).padStart(2,'0')};
}
// Rendu des règles fin_semaine / fin_weekend dans Réglages.
// - Déjà configurée (valeur ≠ 00:00) : champ éditable normal (sauvegarde onblur, comme avant).
// - Jamais configurée (00:00/vide) + horaires du resto connus : champ PRÉ-REMPLI avec la suggestion,
//   mais SANS écriture auto — un bouton « Enregistrer » explicite est requis (jamais de save silencieux).
// - Jamais configurée + horaires inconnus : champ manuel + message renvoyant vers Paramètres > Restaurants.
function finRuleInput(r){
  const configured = r.valeur && r.valeur!=='00:00';
  const inpSt='padding:7px 10px;border-radius:6px;border:1px solid var(--line-2);background:var(--bg);color:var(--text);font-size:13px;font-weight:600';
  if(configured){
    return `<input type="time" value="${r.valeur}" onblur="saveRegle('${r.id}','valeur',this.value)" style="${inpSt}">`;
  }
  const inpId='finrule_'+r.id;
  const s=suggestionFin(r.cle);
  const saveBtn=`<button class="btn sm" onclick="saveFinRegle('${r.id}','${inpId}')" style="padding:6px 10px">Enregistrer</button>`;
  if(s){
    return `<div style="display:flex;flex-direction:column;gap:5px;align-items:flex-end">
      <div style="display:flex;gap:6px;align-items:center"><input type="time" id="${inpId}" value="${s.sug}" style="${inpSt};border-color:var(--gold)">${saveBtn}</div>
      <div style="color:var(--gold);font-size:10.5px;text-align:right">💡 Suggéré d'après la fermeture ${s.ferm} (+${FIN_MARGE_MIN} min) — <b>non enregistré</b></div>
    </div>`;
  }
  return `<div style="display:flex;flex-direction:column;gap:5px;align-items:flex-end">
    <div style="display:flex;gap:6px;align-items:center"><input type="time" id="${inpId}" value="" style="${inpSt}">${saveBtn}</div>
    <div style="color:var(--muted);font-size:10.5px;max-width:240px;text-align:right;line-height:1.5">Renseigne les heures d'ouverture de <b>${escP(SNACK.nom||'ce restaurant')}</b> dans <a href="../parametres/#restaurants" style="color:var(--gold)">Paramètres › Restaurants</a> pour obtenir une suggestion automatique.</div>
  </div>`;
}

async function saveShifts(){

// Vérifie si un salarié a une indispo validée pour cette date
// Icône + libellé courts pour l'affichage d'une indispo dans la grille, dérivés du champ motif.
// full = motif complet (tooltip). Mapping sur les libellés produits par « Ajouter une absence »
// (+ fallback générique pour "Autre" ou une indispo salarié classique sans motif structuré).
const INDISPO_ICONS=[['arrêt maladie','🤒'],['arret maladie','🤒'],['congé payé','🌴'],['conge paye','🌴'],['congé sans solde','🚫'],['conge sans solde','🚫'],['absence injustifiée','❌'],['absence injustifiee','❌']];
function indispoBadge(ind){
  const raw=((ind&&ind.motif)||'').trim();
  const low=raw.toLowerCase();
  for(const [key,ic] of INDISPO_ICONS){ if(low.startsWith(key)) return {ic, lbl:raw.slice(0,key.length), full:raw}; }
  if(raw){ const short=raw.replace(/^autre\s*—?\s*/i,'').trim()||raw; return {ic:'🚫', lbl:(short.length>18?short.slice(0,17)+'…':short), full:raw}; }
  return {ic:'🚫', lbl:'Indisponible', full:'Indisponible'};
}
function hasIndispo(sid,date){
  const di=(new Date(date).getDay()+6)%7;
  return S.dispos.find(d=>{
    if(d.salarie_id!==sid)return false;
    if(d.statut!=='indispo')return false;
    if((d.statut_demande||'validee')!=='validee')return false;
    if(d.type==='recurrente' && d.jour_semaine===di)return true;
    if(d.type==='ponctuelle' && d.date_specifique===date)return true;
    return false;
  });
}
// Salarié sous le coup d'une mise à pied (disciplinary_actions) couvrant `date` → suspendu ce jour,
// donc légitimement absent. Bornes incluses (mise_a_pied_debut ≤ date ≤ mise_a_pied_fin).
function isSuspended(sid,date){
  return (S.miseAPied||[]).some(m=>m.salarie_id===sid && m.mise_a_pied_debut && m.mise_a_pied_fin && m.mise_a_pied_debut<=date && date<=m.mise_a_pied_fin);
}
// Absence exceptionnelle PONCTUELLE validée à cette date (arrêt maladie, congé…). VOLONTAIREMENT
// distinct de hasIndispo : les indispos RÉCURRENTES (jour de repos fixe) ne comptent PAS comme
// absence — elles sont déjà reflétées dans le heures_min contractuel, donc ne doivent pas réduire
// l'attente hebdo. Seules les vraies absences exceptionnelles (ponctuelles + mise à pied) le font.
function hasPonctuelleAbsence(sid,date){
  return S.dispos.some(d=>d.salarie_id===sid && d.statut==='indispo' && (d.statut_demande||'validee')==='validee' && d.type==='ponctuelle' && d.date_specifique===date);
}

// ===== RAPPORT : RÉEL vs PRÉVU =====
async function openReport(){
  setSS('busy','Chargement pointages…');
  const from=fmtDate(MONDAY), to=fmtDate(new Date(MONDAY.getTime()+7*86400000));
  const{data:pts,error}=await sb.from('pointages').select('*').gte('ts',from+'T00:00:00').lt('ts',to+'T00:00:00').order('ts');
  if(error){setSS('err','Erreur: '+error.message);return;}
  setSS('','');
  // Index pointages par (sid|date)
  const idx={};(pts||[]).forEach(p=>{const k=p.salarie_id+'|'+p.ts.slice(0,10);(idx[k]=idx[k]||[]).push(p);});
  const nameOf=sid=>{const s=S.salaries.find(x=>x.id===sid);return [s?.prenom,s?.nom].filter(Boolean).join(' ')||s?.nom||'?';};
  const retards=[],absences=[],depAntic=[],sansPlan=[];
  // Pour chaque créneau planifié sur ce snack
  S.creneaux.forEach(c=>{
    if(!c.heure_debut)return;
    const k=c.salarie_id+'|'+c.date;
    const dayPts=(idx[k]||[]).slice().sort((a,b)=>a.ts.localeCompare(b.ts));
    const plannedStart=new Date(c.date+'T'+c.heure_debut.slice(0,5)+':00');
    const arrPts=dayPts.filter(p=>p.type==='arrivee').sort((a,b)=>Math.abs(new Date(a.ts)-plannedStart)-Math.abs(new Date(b.ts)-plannedStart));
    const arr=arrPts[0];
    if(!arr || Math.abs((new Date(arr.ts)-plannedStart)/60000)>240){
      absences.push({sid:c.salarie_id,date:c.date,svc:c.service,planned:c.heure_debut.slice(0,5)+'→'+(c.heure_fin||'?').slice(0,5)});
    } else {
      const dMin=Math.round((new Date(arr.ts)-plannedStart)/60000);
      if(dMin>5){
        retards.push({sid:c.salarie_id,date:c.date,svc:c.service,planned:c.heure_debut.slice(0,5),actual:new Date(arr.ts).toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'}),delta:dMin});
      }
    }
    if(c.heure_fin){
      const plannedEnd=new Date(c.date+'T'+c.heure_fin.slice(0,5)+':00');
      // Si heure_fin <= heure_debut, on est sur le lendemain
      if(plannedEnd<=plannedStart) plannedEnd.setDate(plannedEnd.getDate()+1);
      const sorPts=dayPts.filter(p=>p.type==='sortie').sort((a,b)=>Math.abs(new Date(a.ts)-plannedEnd)-Math.abs(new Date(b.ts)-plannedEnd));
      // Inclure pointages du lendemain matin si fin tardive
      if(c.heure_fin && plannedEnd.getDate()!==new Date(c.date).getDate()){
        const k2=c.salarie_id+'|'+fmtDate(plannedEnd);
        (idx[k2]||[]).filter(p=>p.type==='sortie').forEach(p=>sorPts.push(p));
        sorPts.sort((a,b)=>Math.abs(new Date(a.ts)-plannedEnd)-Math.abs(new Date(b.ts)-plannedEnd));
      }
      const sor=sorPts[0];
      if(sor && Math.abs((new Date(sor.ts)-plannedEnd)/60000)<=240){
        const dMin=Math.round((new Date(sor.ts)-plannedEnd)/60000);
        if(dMin<-10){
          depAntic.push({sid:c.salarie_id,date:c.date,svc:c.service,planned:c.heure_fin.slice(0,5),actual:new Date(sor.ts).toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'}),delta:-dMin});
        }
      }
    }
  });
  // Pointages sans planning (sur ce snack uniquement)
  Object.entries(idx).forEach(([k,dayPts])=>{
    const[sid,date]=k.split('|');
    const planned=S.creneaux.find(c=>c.salarie_id===sid && c.date===date);
    if(!planned){
      const arr=dayPts.find(p=>p.type==='arrivee' && p.restaurant_id===SNACK.id);
      if(arr) sansPlan.push({sid,date,time:new Date(arr.ts).toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'})});
    }
  });
  // Oublis de sortie : un jour PASSÉ (pas aujourd'hui, le service peut être en cours) dont le
  // dernier pointage n'est pas 'sortie' → calculé à la volée depuis idx, aucune colonne stockée.
  const oublis=[];
  const todayStr=fmtDate(new Date());
  Object.entries(idx).forEach(([k,dayPts])=>{
    const[sid,date]=k.split('|');
    if(date>=todayStr)return;
    const sorted=dayPts.slice().sort((a,b)=>a.ts.localeCompare(b.ts));
    const last=sorted[sorted.length-1];
    if(last && last.type!=='sortie'){
      oublis.push({sid,date,lastType:last.type,lastTime:new Date(last.ts).toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'})});
    }
  });

  const fmtD=d=>new Date(d).toLocaleDateString('fr-FR',{weekday:'short',day:'numeric',month:'short'});
  const TLBL={arrivee:'arrivée',pause_debut:'pause',pause_fin:'reprise',sortie:'sortie'};
  const corBtn=(sid,date)=>`<button class="btn ghost sm" style="padding:2px 8px;font-size:11px;margin-left:8px" onclick="openPointageCorrection('${sid}','${date}')">✏️ Corriger</button>`;
  const section=(title,color,items,renderItem)=>{
    return `<div style="margin-bottom:18px">
      <div style="font-size:13px;font-weight:600;margin-bottom:8px;color:${color}">${title} <span style="color:var(--muted);font-weight:400">(${items.length})</span></div>
      ${items.length?`<div style="background:var(--surface);border:1px solid var(--line-2);border-radius:8px;max-height:240px;overflow:auto">
        ${items.map(renderItem).join('')}
      </div>`:'<div style="color:var(--muted);font-size:12px">Aucun</div>'}
    </div>`;
  };
  const html=`
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px">
      <div><h3 style="margin:0;font-size:17px">Rapport semaine ${isoWeek(MONDAY)}</h3>
      <div style="color:var(--muted);font-size:12px;margin-top:4px">Pointages (badgeuse) vs planning — ${SNACK.nom}</div></div>
      <button class="btn ghost sm" onclick="document.getElementById('pdfModal').innerHTML=''">✕</button>
    </div>
    <div style="margin:14px 0">
      ${section('🕳 Oublis de sortie','var(--bad)',oublis,r=>`<div style="display:flex;justify-content:space-between;align-items:center;padding:8px 14px;border-bottom:1px solid var(--line);font-size:12.5px"><span><b>${nameOf(r.sid)}</b> · ${fmtD(r.date)}</span><span style="color:var(--muted)">dernier pointage : ${TLBL[r.lastType]||r.lastType} à ${r.lastTime}${corBtn(r.sid,r.date)}</span></div>`)}
      ${section('🔴 Retards (>5 min)','var(--bad)',retards.sort((a,b)=>b.delta-a.delta),r=>`<div style="display:flex;justify-content:space-between;align-items:center;padding:8px 14px;border-bottom:1px solid var(--line);font-size:12.5px"><span><b>${nameOf(r.sid)}</b> · ${fmtD(r.date)} ${r.svc}</span><span style="color:var(--muted)">prévu ${r.planned} → réel ${r.actual} <b style="color:var(--bad);margin-left:6px">+${r.delta} min</b>${corBtn(r.sid,r.date)}</span></div>`)}
      ${section('⚠ Absences (pas de pointage)','var(--warn)',absences,r=>`<div style="display:flex;justify-content:space-between;align-items:center;padding:8px 14px;border-bottom:1px solid var(--line);font-size:12.5px"><span><b>${nameOf(r.sid)}</b> · ${fmtD(r.date)} ${r.svc}</span><span style="color:var(--muted)">prévu ${r.planned}${corBtn(r.sid,r.date)}</span></div>`)}
      ${section('🟠 Départs anticipés (>10 min)','var(--warn)',depAntic.sort((a,b)=>b.delta-a.delta),r=>`<div style="display:flex;justify-content:space-between;align-items:center;padding:8px 14px;border-bottom:1px solid var(--line);font-size:12.5px"><span><b>${nameOf(r.sid)}</b> · ${fmtD(r.date)} ${r.svc}</span><span style="color:var(--muted)">prévu ${r.planned} → réel ${r.actual} <b style="color:var(--warn);margin-left:6px">−${r.delta} min</b>${corBtn(r.sid,r.date)}</span></div>`)}
      ${section('🔵 Pointages sans planning','#5b9cff',sansPlan,r=>`<div style="display:flex;justify-content:space-between;align-items:center;padding:8px 14px;border-bottom:1px solid var(--line);font-size:12.5px"><span><b>${nameOf(r.sid)}</b> · ${fmtD(r.date)}</span><span style="color:var(--muted)">arrivée ${r.time}${corBtn(r.sid,r.date)}</span></div>`)}
    </div>
    ${(!oublis.length && !retards.length && !absences.length && !depAntic.length && !sansPlan.length)?'<div style="text-align:center;padding:24px;color:var(--ok);font-weight:600">✓ Tout est conforme</div>':''}`;
  document.getElementById('pdfModal').innerHTML=`<div class="pdf-bg" onclick="if(event.target===this)document.getElementById('pdfModal').innerHTML=''"><div class="pdf-modal" style="max-width:680px;width:92vw;max-height:88vh;overflow:auto;padding:24px">${html}</div></div>`;
}

function fmtD_(d){return new Date(d+'T00:00:00').toLocaleDateString('fr-FR',{weekday:'long',day:'numeric',month:'long'});}
async function savePointageTime(id,sid,date){
  const inp=document.getElementById('pc_t_'+id);
  const motif=prompt('Motif de la correction (obligatoire, ex. "oubli de sortie signalé par le salarié") :');
  if(!motif){alert('Motif requis pour toute correction (traçabilité).');return;}

async function autoFillMultiWeek(ids){
  // Ordre : le plus contraint (le plus de postes-cibles) d'abord, pour qu'il ne se fasse pas « rafler »
  // ses candidats par un snack moins tendu traité avant lui. Le tri inter-snack de sortCandidates
  // (manque vs heures_min) + le plafond via weekHoursOf limitent déjà la sur-affectation.
  // INDÉPENDANCE À L'ORDRE : on re-trie TOUJOURS les snacks par un ordre DÉTERMINISTE (le plus contraint
  // d'abord) → l'ordre d'ENTRÉE est sans effet ([GC,Lobau,Carnot] et [Carnot,Lobau,GC] donnent la même
  // séquence de traitement, donc le même résultat). La réserve de capacité (snackPriorityGate) rend en
  // plus la répartition robuste à cette séquence (un multi n'est aspiré par un snack secondaire qu'en
  // renfort). Une invariance TOTALE en cas pathologique (capacité du snack principal insuffisante pour
  // le min) n'est pas garantie mathématiquement — d'où cet ordre déterministe comme filet.
  const ordered=ids.slice().sort((a,b)=>snackTargetSlots(b)-snackTargetSlots(a));
  const names=ordered.map(id=>(S.restos.find(r=>r.id===id)||{}).nom).filter(Boolean);
  if(!confirm(`Remplir automatiquement TOUTE LA SEMAINE sur ${ordered.length} snacks ?\n\nOrdre (le plus contraint d'abord) : ${names.join(' → ')}\n\nLes créneaux existants ne sont pas remplacés. Chaque snack est annulable séparément (↶).`)) return;
  const originalId=SNACK.id;
  const results=[];
  // UN SEUL overlay pour toute la génération (persiste au-dessus des loadWeek intermédiaires) : le
  // contexte _afMulti nomme le snack en cours et indexe la barre sur le nombre de snacks → l'utilisateur
  // voit « Snack 2/3 · Raya Carnot » et une progression continue, pas un re-roll qui semble buggé.
  _afMulti={index:1,total:ordered.length,nom:(S.restos.find(r=>r.id===ordered[0])||{}).nom||''};
  showAutofillOverlay();
  // ══ ÉTAPE A : phases 1&2 SEULES (distribute:false) pour CHAQUE snack, AVANT toute phase 3. C'est LE
  // correctif de la régression Hayatou : la phase 3 par-snack (V1) exécutait sureffectif/rallonge d'un
  // snack AVANT la phase 1 du suivant → un bonus sur un snack P3/P2 volait la capacité qu'un multi aurait
  // dû recevoir en phase 1 sur son P1. En faisant TOUTES les phases 1&2 d'abord, la phase 1 du snack
  // principal place le multi (lack-first + gate P1) AVANT qu'aucun sureffectif n'existe. On collecte les
  // postes RÉELS non comblés de tous les snacks (globalUnfilled) pour la non-nuisance de la phase 3.
  const globalUnfilled=[]; const total=ordered.length;
  for(let i=0;i<ordered.length;i++){ const id=ordered[i];
    SNACK=S.restos.find(r=>r.id===id); if(!SNACK) continue;
    document.getElementById('snackSel').value=id;
    _afMulti={index:i+1,total,nom:SNACK.nom};
    updateAutofillProgress(0,1,'Placement (phases 1&2)…');
    await loadWeek(); // recharge S.creneaux/S.effectifs du snack + S.allCreneauxWeek (global, à jour)
    if(!hasEffectifsConfig()){ results.push({snackId:id, snackNom:SNACK.nom, skipped:true}); continue; }
    const res=await autoFillCore([0,1,2,3,4,5,6],{silent:true, distribute:false})||{};
    results.push({snackId:id, snackNom:SNACK.nom, added:res.added||0, report:(res.report||[]).map(r=>({...r,snack:SNACK.nom})), phase3:{}});
    (res.unfilled||[]).forEach(u=>globalUnfilled.push(u));
  }
  // ══ ÉTAPE B : UNE passe de DISTRIBUTION (phase 3 seule) par snack, APRÈS toutes les phases 1&2. Chaque
  // salarié encore sous son min est rallongé/sureffectivé ; la non-nuisance (globalUnfilled) empêche le
  // sureffectif sur un snack ≠ P1 tant qu'un poste régulier compatible reste non comblé sur un snack plus
  // prioritaire. Undo : 2 batches par snack (phases 1&2 en étape A + distribution en étape B).
  const done=results.filter(r=>!r.skipped).map(r=>r.snackId);
  for(let i=0;i<ordered.length;i++){ const id=ordered[i]; if(!done.includes(id)) continue;
    SNACK=S.restos.find(r=>r.id===id); if(!SNACK) continue;
    document.getElementById('snackSel').value=id;
    _afMulti={index:i+1,total,nom:SNACK.nom};
    updateAutofillProgress(0.5,1,'Distribution (min. d\'heures)…');
    await loadWeek();
    const res=await autoFillCore([0,1,2,3,4,5,6],{silent:true, phase3only:true, globalUnfilled})||{};
    const rr=results.find(r=>r.snackId===id); if(rr) rr.phase3=res.phase3||{};
  }
  // Retour au snack initialement affiché (état prévisible pour l'utilisateur).
  _afMulti=null;
  SNACK=S.restos.find(r=>r.id===originalId)||SNACK; document.getElementById('snackSel').value=SNACK.id;
  await loadWeek();
  hideAutofillOverlay();
  // ── Sous-minimum CONSOLIDÉ : calculé UNE SEULE FOIS, après TOUS les snacks, sur les heures GLOBALES
  // (S.allCreneauxWeek, indépendant du snack affiché) — sinon (a) un multi-snack sous son min après le
  // 1er snack mais complété par les suivants serait faussement listé, et (b) weekHoursOf est relatif au
  // snack courant pour un MONO-snack → un mono travaillant sur un snack non restauré lirait 0h.
  const underMin=[];
  const _weekDates=[0,1,2,3,4,5,6].map(i=>fmtDate(dateOfDay(i)));
  const globalHoursAll=sid=>S.allCreneauxWeek.filter(c=>c.salarie_id===sid && c.heure_debut).reduce((a,c)=>a+_pdur(c.heure_debut,c.heure_fin),0)/60;
  S.salaries.filter(s=>onRoster(s) && ordered.some(rid=>worksAt(s,rid)) && (s.heures_min||0)>0).forEach(s=>{
    const have=globalHoursAll(s.id), mn=s.heures_min||0;
    if(have >= mn-0.01) return;
    const blocked=_weekDates.filter(d=>hasPonctuelleAbsence(s.id,d)||isSuspended(s.id,d)).length;
    const proratedMin=mn*(7-blocked)/7;
    if(have < proratedMin-0.01) underMin.push({sid:s.id, name:fullName(s), have, min:mn, multi:isMultiSnack(s), blocked, proratedMin});
  });
  underMin.sort((a,b)=>(b.proratedMin-b.have)-(a.proratedMin-a.have));
  showMultiSolveReport(results, underMin);
}

  // Phase 3 AGRÉGÉE sur tous les snacks (transfert + rallonge + sureffectif + € rallonge/sureffectif + détails).

  const {sureffWarn, overflowWarn, interWarn, phase3Section}=buildPhase3Report(p3agg, true);

let _autofillRunning=false;
// Contexte multi-snack de l'overlay : {index,total,nom} pendant autoFillMultiWeek, sinon null. C'est une

function updateAutofillProgress(done,total,sub){

  if(_afMulti){

    if(sn){ sn.style.display='block'; sn.textContent=`Snack ${_afMulti.index}/${_afMulti.total} · ${_afMulti.nom}`; }

const _yield=()=>new Promise(r=>setTimeout(r,0));

// ═══════════════ SOLVEUR AUTO-FILL : contraintes + glouton MRV + réparation ═══════════════
// Source de vérité UNIQUE des contraintes de placement (réutilisée par l'auto-fill).
// Retourne null si OK, sinon {cle,label} de la 1re règle ACTIVE violée. Garantit, par construction,
// qu'aucun créneau écrit ne viole une règle (un seul point d'écriture, toujours gardé par checkPlacement).
function _ruleCtx(){
  const RG={}; (S.regles||[]).forEach(r=>RG[r.cle]=r);
  return {
    num:(c,d)=>{const r=RG[c];const v=r!=null?parseFloat(r.valeur):NaN;return isFinite(v)&&v>0?v:d;},
    on :(c,d)=>{const r=RG[c];return r?(r.active!==false):d;},
    raw:(c)=>RG[c],
  };
}
const _pmin=t=>{if(!t)return null;const[h,mi]=t.slice(0,5).split(':').map(Number);return h*60+mi;};
const _pdur=(d,f)=>{let a=_pmin(d),b=_pmin(f);if(a==null||b==null)return 0;if(b<=a)b+=1440;return b-a;};
// Fin d'un créneau en minutes ABSOLUES depuis 00:00 du jour de DÉBUT (fin ≤ début ⇒ +1440, service à
// cheval sur minuit). SOURCE UNIQUE : repos quotidien, amplitude et fin_2h_pas_matin en dépendent —
// les trois se trompaient de 14 h quand un service finissait après minuit (cf. CLAUDE.md).
function _finAbsM(deb,fin){ let a=_pmin(deb),b=_pmin(fin); if(a==null||b==null)return null; if(b<=a)b+=1440; return b; }
// Nom court d'un restaurant à partir de son id (« Raya Lobau » → « Lobau ») — utilisé par les messages
// de refus inter-snack, qui doivent nommer l'établissement où se trouve la donnée déclenchante.
function _restoNom(rid){ const r=(S.restos||[]).find(x=>x.id===rid); return (r&&r.nom)?String(r.nom).replace('Raya ','').trim():'autre restaurant'; }
// ── Heures hebdo d'un salarié pour la répartition auto-fill (calcul du « manque » vs heures_min) ──
// Multi-snack (est_multi, ou >1 restaurant dans snacks_priorites) : total TOUS restaurants de l'org
// (S.allCreneauxWeek), car il cumule ses heures sur plusieurs sites → son vrai manque restant.
// Mono-snack : uniquement le snack courant (S.creneaux), sa seule source d'heures possible.
// Lit toujours l'état À JOUR (rappelé à chaque candFor, après chaque pose).
function isMultiSnack(s){ const a=Array.isArray(s&&s.snacks_priorites)?s.snacks_priorites:null; return (a&&a.length>1)||!!(s&&s.est_multi); }
// Total MINUTES hebdo d'un salarié — SOURCE UNIQUE des heures cumulées : global tous snacks
// (S.allCreneauxWeek) pour un MULTI-snack, local (S.creneaux) pour un mono. Exclusion optionnelle du
// créneau en cours de remplacement (excludeSelf par restaurant_id+date+service) pour ne pas le compter
// deux fois. Utilisé par weekHoursOf ET par le blocage plafond inter-snack de checkPlacement.
function weekMinutesOf(sid, ex){
  const s=salById(sid);
  const src=(s&&isMultiSnack(s))?S.allCreneauxWeek:S.creneaux;
  return src.filter(c=>c.salarie_id===sid && c.heure_debut
      && !(ex && ex.excludeSelf && c.date===ex.date && c.service===ex.svc && c.restaurant_id===ex.restaurant_id))
    .reduce((a,c)=>a+_pdur(c.heure_debut,c.heure_fin),0);
}
function weekHoursOf(sid){ return weekMinutesOf(sid)/60; }
// Heures déjà posées cette semaine sur les AUTRES snacks (hors snack courant) — pour l'annotation
// « +Xh ailleurs » de la grille et le détail par snack de la pop-up du nom. Même source (S.allCreneauxWeek)
// que le cumul inter-snack, jamais recalculé autrement.
function otherSnackHoursOf(sid){ return S.allCreneauxWeek.filter(c=>c.salarie_id===sid && c.restaurant_id!==SNACK.id && c.heure_debut).reduce((a,c)=>a+_pdur(c.heure_debut,c.heure_fin),0)/60; }
function otherSnackBreakdown(sid){
  const by={};
  S.allCreneauxWeek.filter(c=>c.salarie_id===sid && c.restaurant_id!==SNACK.id && c.heure_debut).forEach(c=>{ by[c.restaurant_id]=(by[c.restaurant_id]||0)+_pdur(c.heure_debut,c.heure_fin); });
  return Object.entries(by).map(([rid,mins])=>{ const r=S.restos.find(x=>x.id===rid); return {nom:(r?.nom||'?').replace('Raya ',''), h:mins/60}; }).sort((a,b)=>b.h-a.h);
}
const fmtH1=h=>(Math.round(h*10)/10).toString().replace('.',',');
// Plafond d'heures hebdo UNIFIÉ (en heures), source unique pour TOUS les calculs de plafond
// (blocage checkPlacement, tri candFor via checkPlacement, vérifications, récap coûts/heures).
// Priorité : heures_max (champ « Heures max / semaine » de la fiche) → plafond_heures → règle
// globale plafond_hebdo → 48h. heures_max doit RÉELLEMENT plafonner partout, pas seulement s'afficher.
function plafondOf(sal, rg){
  const hm=Number(sal&&sal.heures_max); if(hm>0) return hm;
  const ph=Number(sal&&sal.plafond_heures); if(ph>0) return ph;
  return (rg&&rg.num)?rg.num('plafond_hebdo',48):_ruleCtx().num('plafond_hebdo',48);
}
// Heures déjà posées par un salarié sur ses restaurants PLUS prioritaires que le snack courant (numéro
// de priorité STRICTEMENT < p) — pour la réserve de capacité (condition b : a-t-il déjà atteint son min
// sur ses snacks principaux ?). Lit S.allCreneauxWeek (état global À JOUR, correct même si le snack
// principal est traité APRÈS le secondaire : (b) est alors false et l'éligibilité repose sur (a)).
function hoursOnMorePrioritaryRestos(s, p){
  const a=Array.isArray(s&&s.snacks_priorites)?s.snacks_priorites:null; if(!a) return 0;
  const hi=new Set(a.filter(x=>x.priorite<p).map(x=>x.restaurant_id)); if(!hi.size) return 0;
  return S.allCreneauxWeek.filter(c=>c.salarie_id===s.id && c.heure_debut && hi.has(c.restaurant_id))
    .reduce((acc,c)=>acc+_pdur(c.heure_debut,c.heure_fin),0)/60;
}
// RÉSERVE DE CAPACITÉ PAR PRIORITÉ (règle métier) : un salarié multi n'est sélectionnable sur un snack qui
// n'est PAS sa priorité 1 QUE si (a) aucun candidat éligible dont c'est LA priorité 1 n'existe pour ce
// créneau (sinon on GARDE le multi pour son principal), OU (b) il a déjà atteint son heures_min sur ses
// restaurants plus prioritaires. Sinon il est écarté (renfort seulement). Empêche qu'un snack généré en
// premier n'aspire les multi des autres indépendamment de leur priorité. (a) garantit qu'on ne laisse
// JAMAIS un poste vide faute de primaire : sans candidat principal, le secondaire est admis en renfort.
// Retourne {kept, gated} (gated → motif 'reserve_principal' du rapport). Appliqué en phase 1 (candFor)
// ET en phase 2 (backfill Y) pour ne pas contourner la réserve via la réparation.
function snackPriorityGate(ids){
  const hasPrimary=ids.some(id=>snackPrioriteOf(salById(id),SNACK.id)===1);
  const kept=[], gated=[];
  for(const id of ids){
    const s=salById(id), p=snackPrioriteOf(s,SNACK.id);
    if(p<=1){ kept.push(id); continue; }                               // priorité 1 / snack principal : jamais gaté
    if(!hasPrimary || hoursOnMorePrioritaryRestos(s,p)>=(((s&&s.heures_min)||0)-0.01)) kept.push(id);
    else gated.push(id);
  }
  return {kept, gated};
}
// Non-nuisance (phase 3 GLOBALE) : le sureffectif d'un salarié ne doit PAS être posé sur un snack qui
// n'est pas sa priorité 1 tant qu'un poste RÉGULIER non comblé compatible (rôle + exp) existe sur un
// snack PLUS prioritaire pour lui (globalUnfilled = postes non comblés de TOUS les snacks après phases
// 1&2). Empêche qu'un bonus sur P2/P3 vole la capacité de son P1 qui a de vrais besoins (cas Hayatou).
function sureffBlockedByPriority(sid, snackId, globalUnfilled){
  const s=salById(sid), pHere=snackPrioriteOf(s,snackId);
  if(pHere<=1) return false;                                   // P1 (ou snack principal) : jamais bloqué
  return (globalUnfilled||[]).some(u=> snackPrioriteOf(s,u.snackId)<pHere
      && rolesOf(sid).includes(u.role) && (!u.exp || isExp(sid,u.role)));
}
// Tri des candidats pour un poste h (h.shift.{exp,role}) — PARTAGÉ par la phase 1 (candFor) et la
// phase 2 (réparation kick-chain) pour qu'elles priorisent à l'identique et ne divergent jamais :
//  (1) plus grand MANQUE vs heures_min ; (2) PRIORITÉ du snack pour le salarié (P1<P2<P3) — départage
//  DOMINANT (règle métier) ; (3) mono-snack avant multi ; (4) expérience ; (5) équilibrage fin par heures.
// Le plafond est déjà garanti par checkPlacement (qui a filtré la liste) → pas re-testé ici.
function sortCandidates(ids, h){
  const hw={}, lack={};
  ids.forEach(id=>{ const s=salById(id); const w=weekHoursOf(id); hw[id]=w; lack[id]=Math.max(0,((s&&s.heures_min)||0)-w); });
  return ids.slice().sort((a,b)=>{
    if(Math.abs(lack[a]-lack[b])>0.01) return lack[b]-lack[a];                                     // (1) manque
    const pa=snackPrioriteOf(salById(a),SNACK.id), pb=snackPrioriteOf(salById(b),SNACK.id);
    if(pa!==pb) return pa-pb;                                                                       // (2) priorité snack (DOMINANT)
    const mA=isMultiSnack(salById(a))?1:0, mB=isMultiSnack(salById(b))?1:0; if(mA!==mB) return mA-mB; // (3) mono>multi
    if(h.shift.exp){const ae=isExp(a,h.shift.role)?0:1,be=isExp(b,h.shift.role)?0:1;if(ae!==be)return ae-be;} // (4) exp
    if(Math.abs(hw[a]-hw[b])>1.5) return hw[a]-hw[b];                                               // (5) équilibrage heures
    return 0;
  });
}
// Seuils de la règle « fin tardive → pas de matin », nommés parce que le libellé du réglage disait « 2 h »
// alors que le code a toujours bloqué jusqu'à 03:00 — c'est le libellé qui était faux, pas le code.
// F2H_MAX_MIN : minutes APRÈS MINUIT jusqu'où une fin est réputée « tardive » (180 = 03:00).
