<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<!-- Anti-cache : évite qu'un navigateur serve une ancienne build (cause des "bugs corrigés qui reviennent") -->
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<script>(function(){var t=localStorage.getItem("eatime_theme");document.documentElement.setAttribute("data-theme",t==="light"?"light":"dark");})();</script>
<title>Raya — Planning</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../access.js?v=1"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jspdf-autotable@3.8.0/dist/jspdf.plugin.autotable.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root, [data-theme="dark"]{--gold:#c8a035;--gold-dim:#8a7028;--bg:#0b0b15;--card:#15151f;--surface:#1c1c28;--line:rgba(255,255,255,.06);--line-2:rgba(255,255,255,.12);--text:#e8e8ec;--muted:#7b7b8a;--ok:#3fb87f;--warn:#e0a93a;--bad:#c45a5a;--midi:rgba(200,160,53,.06);--soir:rgba(91,156,255,.05);--zoom:1}
[data-theme="light"]{--gold:#c8a035;--bg:#f5f5f7;--card:#ffffff;--surface:#f0f0f3;--line:rgba(0,0,0,.06);--line-2:rgba(0,0,0,.12);--text:#1a1a1f;--muted:#6b6b78;--ok:#2a8f5f;--warn:#b8841f;--bad:#b04444;--info:#4a7fbd}
html,body{height:100%}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,sans-serif;background:var(--bg);color:var(--text);font-size:13px;-webkit-font-smoothing:antialiased}
a{color:var(--gold);text-decoration:none}
.hidden{display:none!important}
input,select,button{font-family:inherit;color:var(--text)}
button{cursor:pointer;border:none;background:none}
.btn{padding:8px 14px;border-radius:8px;background:var(--gold);color:#1a1a1a;font-weight:600;font-size:12px;border:1px solid transparent}
.btn:disabled{opacity:.3;cursor:not-allowed}
.btn.ghost{background:transparent;color:var(--text);border-color:var(--line-2)}
.btn.ghost:hover{background:rgba(255,255,255,.04)}
/* Boutons icône seule de la barre d'outils */
.ic{width:38px;height:38px;display:inline-flex;align-items:center;justify-content:center;padding:0;border-radius:9px;background:transparent;border:1px solid var(--line-2);color:var(--text);font-size:17px;cursor:pointer;position:relative;transition:background .12s,border-color .12s}
.ic:hover{background:rgba(255,255,255,.06);border-color:var(--gold)}
.ic.accent{background:var(--gold);border-color:var(--gold);color:#1a1a1a}
.ic.accent:hover{filter:brightness(1.06)}
.ic[disabled]{opacity:.4;cursor:default}
/* Tooltip instantané au survol (le title natif est trop lent / parfois invisible) */
.ic[data-tip]::after{content:attr(data-tip);position:absolute;top:calc(100% + 7px);left:50%;transform:translateX(-50%);background:#1f1f2b;color:#fff;font-size:11px;font-weight:500;line-height:1.3;padding:5px 9px;border-radius:7px;white-space:nowrap;opacity:0;visibility:hidden;pointer-events:none;transition:opacity .12s;z-index:60;box-shadow:0 6px 18px rgba(0,0,0,.45);border:1px solid var(--line-2)}
.ic[data-tip]:hover::after{opacity:1;visibility:visible}
.ic[data-tip]::before{content:'';position:absolute;top:calc(100% + 1px);left:50%;transform:translateX(-50%);border:6px solid transparent;border-bottom-color:#1f1f2b;opacity:0;visibility:hidden;transition:opacity .12s;z-index:60}
.ic[data-tip]:hover::before{opacity:1;visibility:visible}
.ic .ic-badge{position:absolute;top:-5px;right:-5px;background:var(--bad);color:#fff;font-size:10px;min-width:16px;height:16px;padding:0 4px;border-radius:9px;font-weight:700;display:flex;align-items:center;justify-content:center}
.af-spin{width:44px;height:44px;border:4px solid var(--line-2);border-top-color:var(--gold);border-radius:50%;margin:0 auto;animation:afspin .8s linear infinite}
@keyframes afspin{to{transform:rotate(360deg)}}
.btn.sm{padding:5px 9px;font-size:11px}

.lock{position:fixed;inset:0;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;z-index:100}
.lock h1{color:var(--gold);font-size:22px}
.lock input{padding:13px 18px;border-radius:10px;border:1px solid var(--line-2);background:var(--surface);font-size:15px;text-align:center;width:260px;outline:none}
.err{color:var(--bad);font-size:12px;min-height:16px}

/* HEADER */
.header{display:flex;align-items:center;justify-content:space-between;padding:14px 24px;border-bottom:1px solid var(--line);background:var(--bg);position:sticky;top:0;z-index:20;flex-wrap:wrap;gap:12px}
.brand{color:var(--gold);font-weight:700;font-size:16px}
.brand small{color:var(--muted);font-weight:400;font-size:12px;margin-left:8px}
.h-actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.h-actions select{padding:7px 11px;border-radius:8px;border:1px solid var(--line-2);background:var(--surface);font-size:13px;outline:none}
.weeknav{display:flex;align-items:center;gap:6px;background:var(--surface);border:1px solid var(--line-2);border-radius:8px;padding:4px}
.weeknav button{padding:5px 10px;color:var(--text);font-size:14px}
.weeknav .wk{padding:4px 10px;font-weight:600;font-size:12px;color:var(--gold);min-width:180px;text-align:center}
.save-state{font-size:11px;color:var(--muted)}
.save-state.ok{color:var(--ok)}
.save-state.busy{color:var(--warn)}
.save-state.err{color:var(--bad)}

/* EFFECTIFS BAR */
.eff-wrap{padding:14px 24px;border-bottom:1px solid var(--line);background:var(--card);overflow-x:auto}
.eff-grid{display:grid;grid-template-columns:repeat(7,minmax(150px,1fr));gap:8px;min-width:1100px}
.eff-day{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 10px}
.eff-day h4{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin-bottom:6px;font-weight:600;display:flex;justify-content:space-between;align-items:center}
.dice{background:transparent;border:1px solid var(--line-2);border-radius:5px;padding:2px 7px;font-size:11px;cursor:pointer;color:var(--gold)}
.dice:hover{background:rgba(200,160,53,.12);border-color:var(--gold)}
.eff-svc{display:flex;justify-content:space-between;align-items:center;padding:3px 0;font-size:11.5px;gap:6px}
.eff-svc .lbl{color:var(--muted);min-width:32px}
.eff-svc .cnt{display:flex;gap:4px;font-family:monospace}
.eff-svc .cnt span{padding:1px 5px;border-radius:4px;font-weight:600;font-size:11px}
.cnt-ok{background:rgba(63,184,127,.18);color:var(--ok)}
.cnt-under{background:rgba(224,169,58,.18);color:var(--warn)}
.cnt-over{background:rgba(196,90,90,.18);color:var(--bad)}

/* GRID */
.grid-wrap{padding:16px 24px;overflow-x:auto}
table.plan{border-collapse:separate;border-spacing:0;background:var(--card);border:1px solid var(--line);border-radius:10px;overflow:hidden;min-width:calc(1500px * var(--zoom));font-size:max(calc(11.5px * var(--zoom)),9.5px)}
table.plan th,table.plan td{padding:max(calc(4px * var(--zoom)),2px) max(calc(5px * var(--zoom)),3px);border-bottom:1px solid var(--line);border-right:1px solid var(--line);text-align:center;vertical-align:middle;white-space:nowrap}
table.plan th{background:rgba(255,255,255,.02);color:var(--muted);font-weight:600;font-size:10.5px;text-transform:uppercase;letter-spacing:.04em;position:sticky;top:0;z-index:5}
table.plan th.dayhead{font-size:12px;color:var(--text);background:rgba(255,255,255,.04)}
table.plan th.midi{background:var(--midi)}
table.plan th.soir{background:var(--soir)}
table.plan td.salname{text-align:left;font-weight:600;background:var(--card);position:sticky;left:0;z-index:4;min-width:130px;border-right:2px solid var(--line-2)}
table.plan th.salhead{position:sticky;left:0;z-index:6;background:rgba(255,255,255,.02);min-width:130px;border-right:2px solid var(--line-2)}
table.plan td.midi{background:var(--midi)}
table.plan td.soir{background:var(--soir)}
table.plan td input{width:calc(56px * var(--zoom));min-width:42px;padding:2px 2px;border-radius:4px;border:1px solid transparent;background:transparent;color:var(--text);font-size:max(calc(11px * var(--zoom)),9px);font-family:monospace;text-align:center;outline:none;letter-spacing:-.3px}
table.plan td.selected{box-shadow:inset 0 0 0 2px var(--gold);background-color:rgba(200,160,53,.18)!important}
table.plan td.alt-block{background:repeating-linear-gradient(45deg,rgba(91,156,255,.10),rgba(91,156,255,.10) 6px,rgba(91,156,255,.18) 6px,rgba(91,156,255,.18) 12px);color:#5b9cff;font-weight:700;font-size:max(calc(10px * var(--zoom)),8px);cursor:not-allowed;user-select:none;letter-spacing:.02em}
table.plan td.salname{background:color-mix(in srgb, var(--scol,#15151f) 14%, var(--card));border-left:4px solid var(--scol,#444)}
table.plan td.midi{background:color-mix(in srgb, var(--scol,transparent) 10%, var(--midi))}
table.plan td.soir{background:color-mix(in srgb, var(--scol,transparent) 10%, var(--soir))}
table.plan td input::placeholder{color:rgba(255,255,255,.12)}
table.plan td.conflict{box-shadow:inset 0 0 0 1.5px var(--bad);background:rgba(196,90,90,.08)!important}
table.plan td.conflict input{color:var(--bad);font-weight:700}
table.plan td input:hover{border-color:var(--line-2)}
table.plan td input:focus{border-color:var(--gold);background:var(--surface)}
.role-c{color:#e8a06a;font-size:9px;margin-left:5px;font-weight:700}
.role-k{color:#e0c46a;font-size:9px;margin-left:5px;font-weight:700}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;vertical-align:middle}

/* CHECKS */
.checks{padding:10px 24px;border-top:1px solid var(--line);background:var(--card)}
.checks h3{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin-bottom:8px;font-weight:600}
.chk-list{display:flex;gap:10px;flex-wrap:wrap}
.chk{padding:5px 11px;border-radius:6px;font-size:11.5px;display:flex;align-items:center;gap:6px;background:var(--surface);border:1px solid var(--line)}
.chk.ok{border-color:rgba(63,184,127,.3);color:var(--ok)}
.chk.ko{border-color:rgba(196,90,90,.4);color:var(--bad)}
</style>
</head>
<body>

<div id="lock" class="lock hidden">
  <h1>Planning</h1>
  <div id="lockSub" style="color:var(--muted);font-size:13px;margin-bottom:6px">Connexion à ton compte</div>
  <div id="loginBlock" style="display:flex;flex-direction:column;gap:10px;align-items:center">
    <input type="email" id="loginEmail" placeholder="Email" autocomplete="email" style="width:260px;padding:11px 16px;border-radius:10px;border:1px solid var(--line-2);background:var(--surface);color:var(--text);font-size:14px;text-align:center;outline:none">
    <input type="password" id="loginPw" placeholder="Mot de passe" autocomplete="current-password" onkeydown="if(event.key==='Enter')login()" style="width:260px;padding:11px 16px;border-radius:10px;border:1px solid var(--line-2);background:var(--surface);color:var(--text);font-size:14px;text-align:center;outline:none">
    <button class="btn" onclick="login()" style="width:260px">Se connecter</button>
    <div style="color:var(--muted);font-size:12px">Pas de compte ? <a href="#" style="color:var(--gold)" onclick="showSignup();return false">Créer un compte</a></div>
  </div>
  <div id="signupBlock" style="display:none;flex-direction:column;gap:10px;align-items:center">
    <input type="text" id="signupName" placeholder="Nom complet" style="width:260px;padding:11px 16px;border-radius:10px;border:1px solid var(--line-2);background:var(--surface);color:var(--text);font-size:14px;text-align:center;outline:none">
    <input type="email" id="signupEmail" placeholder="Email" autocomplete="email" style="width:260px;padding:11px 16px;border-radius:10px;border:1px solid var(--line-2);background:var(--surface);color:var(--text);font-size:14px;text-align:center;outline:none">
    <input type="password" id="signupPw" placeholder="Mot de passe (8 caractères min)" autocomplete="new-password" style="width:260px;padding:11px 16px;border-radius:10px;border:1px solid var(--line-2);background:var(--surface);color:var(--text);font-size:14px;text-align:center;outline:none">
    <button class="btn" onclick="signup()" style="width:260px">Créer mon compte</button>
    <div style="color:var(--muted);font-size:12px">Déjà inscrit ? <a href="#" style="color:var(--gold)" onclick="showLogin();return false">Se connecter</a></div>
  </div>
  <div class="err" id="pwerr"></div>
  <a href="../" style="font-size:12px;color:var(--muted);margin-top:6px">← Portail</a>
</div>

<datalist id="t-list"></datalist>

<div id="app" class="hidden">
  <div class="header">
    <div class="brand">Raya <small>· Planning · <span id="ver" style="font-size:10px;color:var(--muted)"></span></small></div>
    <div class="h-actions">
      <select id="snackSel" onchange="onSnackChange()"></select>
      <div class="weeknav">
        <button onclick="navWeek(-1)">‹</button>
        <span class="wk" id="wkLabel">—</span>
        <button onclick="navWeek(1)">›</button>
        <button onclick="goToday()" title="Aujourd'hui">●</button>
      </div>
      <div class="weeknav" title="Zoom">
        <button onclick="setZoom(zoom-0.1)">−</button>
        <span class="wk" id="zLabel" style="min-width:50px;font-size:11px">100 %</span>
        <button onclick="setZoom(zoom+0.1)">+</button>
      </div>
      <span class="save-state" id="ss"></span>
      <div class="weeknav" title="Type de vue">
        <button id="vSal" onclick="setView('sal')" style="padding:5px 10px;font-size:11px">👥 Salarié</button>
        <button id="vPoste" onclick="setView('poste')" style="padding:5px 10px;font-size:11px">🪑 Poste</button>
      </div>
      <button class="ic" id="btnUndo" onclick="undo()" data-tip="Annuler (Ctrl+Z)" aria-label="Annuler" disabled>↶</button>
      <button class="ic" id="btnRedo" onclick="redo()" data-tip="Rétablir (Ctrl+Y)" aria-label="Rétablir" disabled>↷</button>
      <button class="ic" onclick="openDemandes()" data-tip="Demandes d'indisponibilités à valider" aria-label="Demandes d'indisponibilités">🔔<span id="demandesBadge" class="ic-badge" style="display:none"></span></button>
      <button class="ic accent" onclick="autoFillWeek()" data-tip="Auto-fill : remplir la semaine selon les dispos & règles" aria-label="Auto-fill">🎲</button>
      <button class="ic" onclick="openReglages()" data-tip="Réglages (effectifs, postes, règles)" aria-label="Réglages">⚙️</button>
      <button class="ic" onclick="openReport()" data-tip="Rapport réel vs prévu (pointages badgeuse × planning)" aria-label="Rapport réel vs prévu">📊</button>
      <button class="ic" onclick="document.getElementById('xlsxFile').click()" data-tip="Importer un planning Excel" aria-label="Import Excel">📥</button>
      <input type="file" id="xlsxFile" accept=".xlsx,.xlsm" style="display:none" onchange="handleImport(event)">
      <button class="ic" onclick="openPdfModal()" data-tip="Exporter le planning en PDF" aria-label="Export PDF">📄</button>
      <a href="../" class="ic" data-tip="Retour au portail" aria-label="Portail">🏠</a>
      <button class="ic" onclick="logout()" data-tip="Déconnexion" aria-label="Déconnexion">↩</button>
    </div>
  </div>

  <div class="eff-wrap"><div class="eff-grid" id="effGrid"></div></div>

  <div class="grid-wrap"><table class="plan" id="planTbl"></table></div>

  <div class="checks"><h3>Vérifications</h3><div class="chk-list" id="checks"></div></div>
</div>

<div id="pdfModal"></div>
<div id="shiftsModal"></div>
<div id="autofillOverlay" style="display:none;position:fixed;inset:0;z-index:500;background:rgba(10,10,14,.72);align-items:center;justify-content:center">
  <div style="background:var(--card);border:1px solid var(--line-2);border-radius:16px;padding:30px 38px;text-align:center;min-width:290px;box-shadow:0 20px 60px rgba(0,0,0,.5)">
    <div class="af-spin"></div>
    <div style="font-size:15px;font-weight:600;margin-top:18px">🎲 Génération du planning…</div>
    <div id="afSub" style="color:var(--muted);font-size:12.5px;margin-top:6px">Analyse des disponibilités</div>
    <div style="height:7px;background:var(--surface);border-radius:6px;margin-top:16px;overflow:hidden"><div id="afBar" style="height:100%;width:0;background:var(--gold);transition:width .25s"></div></div>
    <div style="color:var(--muted2);font-size:11px;margin-top:10px">Merci de patienter, ne ferme pas la page.</div>
  </div>
</div>
<div id="pdfHost" style="position:absolute;left:-9999px;top:0;background:#fff;color:#000;width:1400px;visibility:visible"></div>

<style>
.pdf-bg{position:fixed;inset:0;background:rgba(0,0,0,.65);display:flex;align-items:center;justify-content:center;z-index:200}
.pdf-modal{background:var(--card);border:1px solid var(--line-2);border-radius:12px;padding:22px;min-width:340px;max-width:460px}
.pdf-modal h3{font-size:16px;margin-bottom:14px}
.pdf-modal .snacks{display:flex;flex-direction:column;gap:8px;background:var(--surface);padding:12px;border-radius:8px;border:1px solid var(--line-2);margin-bottom:14px}
.pdf-modal label{display:flex;align-items:center;gap:8px;font-size:13px;cursor:pointer}
.pdf-modal .actions{display:flex;gap:10px;justify-content:flex-end}
/* Print grid (light theme) */
.pg{padding:24px;font-family:-apple-system,Arial,sans-serif;color:#111;page-break-after:always}
.pg:last-child{page-break-after:auto}
.pg h1{font-size:18px;margin-bottom:4px;color:#000}
.pg h2{font-size:13px;color:#666;font-weight:400;margin-bottom:14px}
.pg table{width:100%;border-collapse:collapse;font-size:10.5px}
.pg th,.pg td{border:1px solid #ccc;padding:4px 5px;text-align:center}
.pg th{background:#eee;font-weight:600;font-size:9.5px;text-transform:uppercase;letter-spacing:.03em;color:#444}
.pg td.salname{text-align:left;font-weight:600;background:#fafafa;min-width:130px}
.pg td.midi{background:#fff7e0}
.pg td.soir{background:#e6efff}
.pg .role{font-size:9px;color:#888;margin-left:5px}
.pg .legend{font-size:9.5px;color:#666;margin-top:12px}
</style>

<script>
const SUPA_URL='https://ynnqvtfayrdteqtgxeuk.supabase.co';
const SUPA_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InlubnF2dGZheXJkdGVxdGd4ZXVrIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzk4OTE1MTQsImV4cCI6MjA5NTQ2NzUxNH0._mfVAGexu7ew38UQk6adn42az4Gt_J3ePxR6O6wuWHc';
const sb=supabase.createClient(SUPA_URL,SUPA_KEY);
const VERSION='v0.26 · plafonds de fin suggérés depuis les heures d\'ouverture du restaurant';
let ME=null, ORG={};
let POPUP_ALERTS=localStorage.getItem('pl_popups')!=='0';

const JOURS=['Lundi','Mardi','Mercredi','Jeudi','Vendredi','Samedi','Dimanche'];
const JOURS_SH=['Lu','Ma','Me','Je','Ve','Sa','Di'];
let S={restos:[],salaries:[],roles:[],orgRoles:[],dispos:[],creneaux:[],allCreneauxWeek:[],effectifs:[],regles:[]};
let SNACK=null, MONDAY=null;
let CONFLICTS=new Set();
let VIEW_MODE=localStorage.getItem('pl_view')||'sal';
function setView(v){VIEW_MODE=v;localStorage.setItem('pl_view',v);render();}
function updateViewButtons(){
  const a=document.getElementById('vSal'),b=document.getElementById('vPoste');
  if(a)a.style.background=VIEW_MODE==='sal'?'rgba(200,160,53,.18)':'transparent';
  if(a)a.style.color=VIEW_MODE==='sal'?'var(--gold)':'var(--text)';
  if(b)b.style.background=VIEW_MODE==='poste'?'rgba(200,160,53,.18)':'transparent';
  if(b)b.style.color=VIEW_MODE==='poste'?'var(--gold)':'var(--text)';
}

// Shifts par défaut quand vagues non définies
function getShifts(jt,svc,role){
  const e=S.effectifs.find(x=>x.restaurant_id===SNACK.id&&x.jour_type===jt&&x.service===svc&&x.role===role);
  if(e && e.vagues && Array.isArray(e.vagues) && e.vagues.length) return e.vagues.map(v=>({deb:v.deb,fin:v.fin,exp:!!v.exp}));
  const [d,f]=DEF_TIME(svc);
  const n=e?(e.nb_cible||0):0;
  return Array(n).fill(0).map(()=>({deb:d,fin:f,exp:false}));
}
// ===== UNDO/REDO =====
let UNDO=[], REDO=[], _txn=null;
function beginTxn(){_txn=[];}
function endTxn(){if(_txn&&_txn.length){UNDO.push(_txn);if(UNDO.length>50)UNDO.shift();REDO=[];updateUndoBtns();}_txn=null;}
function recordAction(before,after){
  const entry={before:before?{...before}:null,after:after?{...after}:null};
  if(_txn)_txn.push(entry);
  else{UNDO.push([entry]);if(UNDO.length>50)UNDO.shift();REDO=[];updateUndoBtns();}
}
function updateUndoBtns(){
  const u=document.getElementById('btnUndo'),r=document.getElementById('btnRedo');
  if(u)u.disabled=!UNDO.length;
  if(r)r.disabled=!REDO.length;
}
async function applyAction(a,direction){
  // direction=1 (redo) -> apply after ; direction=-1 (undo) -> apply before
  const target=direction===1?a.after:a.before;
  const fallback=direction===1?a.before:a.after;
  if(target){
    await sb.from('planning_creneaux').upsert(target,{onConflict:'restaurant_id,salarie_id,date,service'});
  } else if(fallback){
    await sb.from('planning_creneaux').delete().eq('restaurant_id',fallback.restaurant_id).eq('salarie_id',fallback.salarie_id).eq('date',fallback.date).eq('service',fallback.service);
  }
}
async function undo(){
  if(!UNDO.length)return;setSS('busy','Annulation…');
  const batch=UNDO.pop();
  for(const a of [...batch].reverse()) await applyAction(a,-1);
  REDO.push(batch);await loadWeek();setSS('ok','↶ Annulé');updateUndoBtns();
}
async function redo(){
  if(!REDO.length)return;setSS('busy','Rétablissement…');
  const batch=REDO.pop();
  for(const a of batch) await applyAction(a,1);
  UNDO.push(batch);await loadWeek();setSS('ok','↷ Rétabli');updateUndoBtns();
}

function _toMin(t){if(!t)return null;const[h,m]=t.slice(0,5).split(':').map(Number);return h*60+m;}
function _overlap(a,b){
  let a1=_toMin(a.heure_debut),a2=a.heure_fin?_toMin(a.heure_fin):null;
  let b1=_toMin(b.heure_debut),b2=b.heure_fin?_toMin(b.heure_fin):null;
  if(a1==null||b1==null)return false;
  if(a2==null) a2=a1+30; if(b2==null) b2=b1+30;
  if(a2<=a1) a2+=24*60; if(b2<=b1) b2+=24*60;
  return a1<b2 && b1<a2;
}
function computeConflicts(){
  CONFLICTS.clear();
  for(const c of S.allCreneauxWeek){
    if(!c.heure_debut)continue;
    const others=S.allCreneauxWeek.filter(x=>x.salarie_id===c.salarie_id && x.date===c.date && x.restaurant_id!==c.restaurant_id && x.heure_debut);
    for(const o of others){
      if(_overlap(c,o)){ CONFLICTS.add(`${c.salarie_id}|${c.date}|${c.service}`); break; }
    }
  }
}
function updateConflictsUI(){
  computeConflicts();
  document.querySelectorAll('table.plan td[data-k]').forEach(td=>{
    td.classList.toggle('conflict', CONFLICTS.has(td.dataset.k));
  });
}
function describeConflict(sid,date){
  // pour message d'alerte
  const others=S.allCreneauxWeek.filter(x=>x.salarie_id===sid && x.date===date && x.restaurant_id!==SNACK.id && x.heure_debut);
  return others.map(o=>{const r=S.restos.find(x=>x.id===o.restaurant_id);return (r?.nom||'?').replace('Raya ','')+' '+o.service+' '+(o.heure_debut||'').slice(0,5)+'→'+(o.heure_fin||'').slice(0,5);}).join(' · ');
}

function normTime(v){if(!v)return '';v=String(v).trim().replace(/[^0-9:hH]/g,'').replace(/[hH]/,':');let m=v.match(/^(\d{1,2}):(\d{2})$/);if(m){const h=+m[1],mn=+m[2];if(h<24&&mn<60)return String(h).padStart(2,'0')+':'+String(mn).padStart(2,'0');}m=v.match(/^(\d{1,2})$/);if(m){const h=+m[1];if(h<24)return String(h).padStart(2,'0')+':00';}return null;}

function buildTimeList(){
  const opts=[];
  // 9h - 23h30 (créneaux midi+soir habituels), puis 00h - 03h (fermetures tardives)
  for(let h=9;h<24;h++){opts.push(`${String(h).padStart(2,'0')}:00`);opts.push(`${String(h).padStart(2,'0')}:30`);}
  for(let h=0;h<4;h++){opts.push(`${String(h).padStart(2,'0')}:00`);opts.push(`${String(h).padStart(2,'0')}:30`);}
  document.getElementById('t-list').innerHTML=opts.map(t=>`<option value="${t}">`).join('');
}

function getMonday(d){d=new Date(d);const day=d.getDay();const diff=day===0?-6:1-day;d.setDate(d.getDate()+diff);d.setHours(0,0,0,0);return d;}
function fmtDate(d){return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;}
function dateOfDay(i){const d=new Date(MONDAY);d.setDate(d.getDate()+i);return d;}
function wkRangeLabel(){const e=new Date(MONDAY);e.setDate(e.getDate()+6);return `Sem. ${MONDAY.toLocaleDateString('fr-FR',{day:'numeric',month:'short'})} → ${e.toLocaleDateString('fr-FR',{day:'numeric',month:'short'})}`;}

async function init(){
  MONDAY=getMonday(new Date());
  const{data:restos}=await sb.from('restaurants').select('*').eq('actif',true).order('nom');
  S.restos=restos||[];
  const gc=S.restos.find(r=>r.nom.toLowerCase().includes('grand cœur')||r.nom.toLowerCase().includes('grand coeur'));
  SNACK=gc||S.restos[0]||null;
  document.getElementById('snackSel').innerHTML=S.restos.map(r=>`<option value="${r.id}" ${r.id===SNACK?.id?'selected':''}>${r.nom}</option>`).join('');
  await loadWeek();
}

async function loadWeek(){
  const from=fmtDate(MONDAY), to=fmtDate(new Date(MONDAY.getTime()+7*86400000));
  const toIncl=fmtDate(new Date(MONDAY.getTime()+7*86400000)); // lundi suivant (pour la règle « veille » du dimanche)
  const[s,ro,d,cr,crAll,eff,reg,orr,alt]=await Promise.all([
    sb.from('salaries').select('*').order('nom'),
    sb.from('salarie_roles').select('*'),
    sb.from('salarie_dispos').select('*'),
    sb.from('planning_creneaux').select('*').eq('restaurant_id',SNACK.id).gte('date',from).lt('date',to),
    sb.from('planning_creneaux').select('*').gte('date',from).lt('date',to),
    sb.from('planning_effectifs').select('*'),
    sb.from('planning_regles').select('*'),
    sb.from('org_roles').select('*').eq('actif',true).order('ordre'),
    sb.from('alternance_jours').select('salarie_id,date,type').gte('date',from).lte('date',toIncl)
  ]);
  S.salaries=s.data||[];S.roles=ro.data||[];S.dispos=d.data||[];S.creneaux=cr.data||[];S.allCreneauxWeek=crAll.data||[];S.effectifs=eff.data||[];S.regles=reg.data||[];S.orgRoles=orr.data||[];
  S.altJours={}; (alt.data||[]).forEach(j=>S.altJours[`${j.salarie_id}|${j.date}`]=j.type);
  render();
}
// Type de jour CFA d'un salarié à une date ('ecole'|'examen'|'entreprise'|'vacances'|'ferie'|'repos') ou null
function altDayType(sid,date){ return (S.altJours||{})[`${sid}|${date}`]||null; }
function isAltBlocked(sid,date){ const t=altDayType(sid,date); return t==='ecole'||t==='examen'; }
function dayJourType(i){if(i<=2)return 'Lu-Me';if(i===3)return 'Je';if(i===4)return 'Ve';if(i===5)return 'Sa';return 'Di';}

const salById=id=>S.salaries.find(s=>s.id===id);
// Un salarié est "sur l'effectif" de la semaine affichée s'il n'est ni supprimé (absent) ni sorti AVANT cette semaine.
// → ses créneaux passés restent visibles dans leur semaine, mais il disparaît des semaines postérieures à sa sortie.
function onRoster(s){
  if(!s) return false; // supprimé : plus aucune ligne en base
  const ws=fmtDate(MONDAY);
  if(s.date_sortie) return s.date_sortie>=ws; // sorti : visible jusqu'à la semaine de sortie incluse
  return s.actif!==false;                     // sans date de sortie : visible si actif
}
const rolesOf=sid=>[...new Set(S.roles.filter(x=>x.salarie_id===sid).map(x=>x.role))];
const roleMain=sid=>{const r=rolesOf(sid);return r[0]||null;};
// ===== Rôles configurables + niveau =====
const roleNom=cle=>{const r=S.orgRoles.find(x=>x.cle===cle);return r?r.nom:cle;};
const roleCol=cle=>{const r=S.orgRoles.find(x=>x.cle===cle);return (r&&r.couleur)?r.couleur:'#8b94a3';};
const roleNiveau=(sid,cle)=>{const r=S.roles.find(x=>x.salarie_id===sid&&x.role===cle);return r?(r.niveau||'experimente'):'experimente';};
const isExp=(sid,cle)=>roleNiveau(sid,cle)==='experimente';
// Affectation multi-restos à priorité (fallback legacy snack_origine_id/est_multi pour les fiches non migrées)
function worksAt(s,rid){ const a=Array.isArray(s.snacks_priorites)?s.snacks_priorites:null; if(a&&a.length) return a.some(x=>x.restaurant_id===rid); return s.snack_origine_id===rid || !!s.est_multi; }
function snackPrioriteOf(s,rid){ const a=Array.isArray(s.snacks_priorites)?s.snacks_priorites:null; if(a&&a.length){ const m=a.find(x=>x.restaurant_id===rid); return m?m.priorite:99; } return s.snack_origine_id===rid?1:(s.est_multi?5:99); }
function escP(s){return (s||'').toString().replace(/[<>&"]/g,c=>({'<':'&lt;','>':'&gt;','&':'&amp;','"':'&quot;'}[c]));}
function escJS(s){return (s||'').toString().replace(/\\/g,'\\\\').replace(/'/g,"\\'");}
const DEF_TIME=svc=>svc==='midi'?['11:00','14:30']:['18:30','23:30'];
const fullName=s=>[s.prenom,s.nom].filter(Boolean).join(' ')||s.nom||'?';

// Renvoie, par rôle (cle), { cible, exp } d'après les effectifs configurés pour ce snack.
// Plus aucun rôle ni défaut hardcodé : si rien n'est configuré → 0.
function targetFor(dayIndex,service){
  const jt=dayJourType(dayIndex);
  const t={};
  S.orgRoles.forEach(r=>{
    const e=S.effectifs.find(x=>x.restaurant_id===SNACK.id && x.jour_type===jt && x.service===service && x.role===r.cle);
    t[r.cle]={cible:e?(e.nb_cible||0):0, exp:e?(e.nb_experimentes||0):0};
  });
  return t;
}

function getCreneau(sid,date,svc){return S.creneaux.find(c=>c.salarie_id===sid && c.date===date && c.service===svc);}

function renderEffectifs(){
  if(!S.orgRoles.length){
    document.getElementById('effGrid').innerHTML='<div style="padding:16px;color:var(--muted);font-size:12.5px;line-height:1.5">Aucun rôle défini.<br>Crée tes rôles dans <b>Gestion Salariés › ⚙ Rôles</b>, puis règle les effectifs ici.</div>';
    return;
  }
  const cls=(n,tgt)=>n===tgt?'cnt-ok':(n<tgt?'cnt-under':'cnt-over');
  const html=JOURS.map((j,i)=>{
    const date=fmtDate(dateOfDay(i));
    const svcHTML=['midi','soir'].map(svc=>{
      const t=targetFor(i,svc);
      const parts=S.orgRoles.map(r=>{
        const tgt=t[r.cle]||{cible:0,exp:0};
        if(!tgt.cible) return '';
        const assigned=S.creneaux.filter(c=>c.date===date&&c.service===svc&&c.role===r.cle&&c.heure_debut&&onRoster(salById(c.salarie_id)));
        const n=assigned.length;
        const ini=escP((r.nom||'?').trim().charAt(0).toUpperCase());
        // Expérimentés : groupé par horaire (exp présents vs requis), pour gérer plusieurs postes à la même heure
        const expByDeb={};
        getShifts(dayJourType(i),svc,r.cle).forEach(v=>{ if(v.exp) expByDeb[v.deb]=(expByDeb[v.deb]||0)+1; });
        let expMiss=0;
        Object.entries(expByDeb).forEach(([deb,req])=>{ const present=assigned.filter(x=>(x.heure_debut||'').slice(0,5)===deb&&isExp(x.salarie_id,r.cle)).length; expMiss+=Math.max(0,req-present); });
        const expBad=expMiss>0?` <span class="cnt-under" title="${expMiss} créneau(x) « expérimenté requis » non couvert(s)">★!${expMiss}</span>`:'';
        return `<span class="${cls(n,tgt.cible)}" title="${escP(r.nom)}"><span style="display:inline-block;width:7px;height:7px;border-radius:50%;background:${roleCol(r.cle)};margin-right:3px;vertical-align:middle"></span>${n}/${tgt.cible}${ini}</span>${expBad}`;
      }).filter(Boolean).join(' ');
      return `<div class="eff-svc"><span class="lbl">${svc==='midi'?'Midi':'Soir'}</span><span class="cnt">${parts||'<span style="color:var(--muted)">—</span>'}</span></div>`;
    }).join('');
    return `<div class="eff-day"><h4><span>${j} <span style="font-weight:400;color:var(--muted)">${dateOfDay(i).getDate()}</span></span><button class="dice" onclick="autoFillDay(${i})" title="Remplir auto ce jour">🎲</button></h4>${svcHTML}</div>`;
  }).join('');
  document.getElementById('effGrid').innerHTML=html;
}

function renderTable(){
  // salariés à afficher : sur l'effectif de la semaine ET (du snack OU déjà un créneau cette semaine)
  // onRoster exclut les sortis (semaines postérieures à leur date_sortie) et les supprimés → zéro ligne fantôme.
  const sidsWithCreneau=new Set(S.creneaux.map(c=>c.salarie_id));
  const list=S.salaries.filter(s=>onRoster(s) && (worksAt(s,SNACK.id) || sidsWithCreneau.has(s.id)))
    .sort((a,b)=>{const ra=roleMain(a.id),rb=roleMain(b.id);if(ra!==rb)return(ra||'z').localeCompare(rb||'z');return (a.nom||'').localeCompare(b.nom||'');});

  // header
  let thead='<thead><tr><th class="salhead">Salarié</th>';
  JOURS_SH.forEach((j,i)=>{thead+=`<th colspan="4" class="dayhead">${j} <span style="color:var(--muted);font-weight:400">${dateOfDay(i).getDate()}</span></th>`;});
  thead+='<th class="dayhead" rowspan="2" style="min-width:80px;background:rgba(200,160,53,.05)">Heures<br><small style="font-weight:400;color:var(--muted)">total / cible</small></th>';
  thead+='<th class="dayhead" rowspan="2" style="min-width:90px;background:rgba(63,184,127,.06)">Coût<br><small style="font-weight:400;color:var(--muted)">brut hebdo</small></th>';
  thead+='</tr><tr><th class="salhead"></th>';
  JOURS_SH.forEach(()=>{thead+='<th class="midi">M dbt</th><th class="midi">M fin</th><th class="soir">S dbt</th><th class="soir">S fin</th>';});
  thead+='</tr></thead>';

  let tbody='<tbody>';
  list.forEach((s,rowIdx)=>{
    const roleTag=rolesOf(s.id).map(cle=>`<span title="${escP(roleNom(cle))} · ${isExp(s.id,cle)?'expérimenté':'nouveau'}" style="background:${roleCol(cle)}22;color:${roleCol(cle)};border:1px solid ${roleCol(cle)}55;border-radius:5px;padding:0 4px;font-size:9.5px;font-weight:700;margin-left:3px;white-space:nowrap">${escP((roleNom(cle).charAt(0)||'').toUpperCase())}${isExp(s.id,cle)?'★':'🔰'}</span>`).join('');
    const col=s.couleur||'#666';
    tbody+=`<tr style="--scol:${col}"><td class="salname"><span class="dot" style="background:${col}"></span>${fullName(s)}${roleTag}</td>`;
    let colIdx=0;
    JOURS_SH.forEach((_,i)=>{
      const date=fmtDate(dateOfDay(i));
      // Jour d'école / examen CFA → cellule grisée non-cliquable (alternant indisponible)
      const adt=altDayType(s.id,date);
      if(adt==='ecole'||adt==='examen'){
        const ic=adt==='examen'?'📝':'🎓', lbl=adt==='examen'?'Examen':'École';
        tbody+=`<td colspan="4" class="alt-block" title="${lbl} CFA — alternant indisponible">${ic} ${lbl}</td>`;
        colIdx+=4; return;
      }
      ['midi','soir'].forEach(svc=>{
        const cr=getCreneau(s.id,date,svc)||{};
        const cls=svc;
        const hd=(cr.heure_debut||'').slice(0,5), hf=(cr.heure_fin||'').slice(0,5);
        const cellKey=`${s.id}|${date}|${svc}`;
        const isConf=CONFLICTS.has(cellKey);
        const c1=colIdx++,c2=colIdx++;
        tbody+=`<td class="${cls}${isConf?' conflict':''}" data-k="${cellKey}"><input type="text" list="t-list" inputmode="numeric" maxlength="5" placeholder="" value="${hd}" data-saved="${hd}" data-row="${rowIdx}" data-col="${c1}" data-sid="${s.id}" data-date="${date}" data-svc="${svc}" data-w="deb" onblur="saveCell('${s.id}','${date}','${svc}','deb',this)"></td>`;
        tbody+=`<td class="${cls}${isConf?' conflict':''}" data-k="${cellKey}"><input type="text" list="t-list" inputmode="numeric" maxlength="5" placeholder="" value="${hf}" data-saved="${hf}" data-row="${rowIdx}" data-col="${c2}" data-sid="${s.id}" data-date="${date}" data-svc="${svc}" data-w="fin" onblur="saveCell('${s.id}','${date}','${svc}','fin',this)"></td>`;
      });
    });
    // colonne récap heures
    const _toMin2=t=>{if(!t)return null;const[h,m]=t.slice(0,5).split(':').map(Number);return h*60+m;};
    const _dur2=(d,f)=>{let a=_toMin2(d),b=_toMin2(f);if(a==null||b==null)return 0;if(b<=a)b+=24*60;return b-a;};
    const totMin=S.creneaux.filter(c=>c.salarie_id===s.id).reduce((a,c)=>a+_dur2(c.heure_debut,c.heure_fin),0);
    const totH=totMin/60;
    const minH=s.heures_min||0, maxH=s.heures_max||s.plafond_heures||48;
    let recapCls='',recapColor='var(--text)';
    if(maxH && totH>maxH){recapCls='over';recapColor='var(--bad)';}
    else if(minH && totH<minH){recapCls='under';recapColor='var(--warn)';}
    else if(totH>0){recapCls='ok';recapColor='var(--ok)';}
    const range=minH||maxH?`<small style="color:var(--muted);font-weight:400;display:block;font-size:9.5px;margin-top:1px">${minH||0}–${maxH||'?'}h</small>`:'';
    tbody+=`<td class="rowHours" data-sid="${s.id}" style="background:rgba(200,160,53,.04);font-weight:700;color:${recapColor};text-align:center">${totH.toFixed(1)}h${range}</td>`;
    // colonne coût hebdo salarié (brut + chargé avec coef perso ou org)
    const taux=Number(s.taux_horaire_brut)||0;
    const coefOrg=Number(ORG.coef_charges)||1.420;
    const coefPerso=Number(s.coef_charges_perso);
    const coefEff=isFinite(coefPerso)&&coefPerso>0?coefPerso:coefOrg;
    const costBrut=totH*taux;
    const costChg=costBrut*coefEff;
    const costStr=taux>0?costBrut.toFixed(0)+' € <small style="color:var(--muted);font-weight:400">brut</small>':'<span style="color:var(--muted);font-weight:400">—</span>';
    const chgStr=taux>0?`<small style="color:var(--ok);font-weight:600;display:block;font-size:10.5px;margin-top:1px">${costChg.toFixed(0)} € chargé <span style="color:var(--muted);font-weight:400">×${coefEff.toFixed(3)}${coefPerso>0?'*':''}</span></small>`:'<small style="color:var(--warn);font-weight:400;display:block;font-size:9.5px;margin-top:1px">taux ?</small>';
    tbody+=`<td class="rowCost" data-sid="${s.id}" style="background:rgba(63,184,127,.04);font-weight:700;text-align:center;color:${costBrut>0?'var(--text)':'var(--muted)'}">${costStr}${chgStr}</td>`;
    tbody+='</tr>';
  });
  if(!list.length) tbody+='<tr><td colspan="32" style="text-align:center;padding:30px;color:var(--muted)">Aucun salarié pour ce snack</td></tr>';

  // ─── ligne FOOTER : coût par jour (brut) + total hebdo (brut + chargé somme individuelle)
  if(list.length){
    const _toMin3=t=>{if(!t)return null;const[h,m]=t.slice(0,5).split(':').map(Number);return h*60+m;};
    const _dur3=(d,f)=>{let a=_toMin3(d),b=_toMin3(f);if(a==null||b==null)return 0;if(b<=a)b+=24*60;return b-a;};
    const coefOrg=Number(ORG.coef_charges)||1.420;
    const tauxOf=sid=>{const ss=S.salaries.find(x=>x.id===sid);return Number(ss?.taux_horaire_brut)||0;};
    const coefOf=sid=>{const ss=S.salaries.find(x=>x.id===sid);const cp=Number(ss?.coef_charges_perso);return isFinite(cp)&&cp>0?cp:coefOrg;};
    // somme brut + chargé par salarié sur la semaine
    let totalBrutSem=0, totalChgSem=0;
    list.forEach(s=>{
      const tx=tauxOf(s.id),cf=coefOf(s.id);
      const minSal=S.creneaux.filter(c=>c.salarie_id===s.id).reduce((a,c)=>a+_dur3(c.heure_debut,c.heure_fin),0);
      const hSal=minSal/60;
      totalBrutSem += hSal*tx;
      totalChgSem  += hSal*tx*cf;
    });
    let footHTML='<tr style="background:rgba(63,184,127,.05);border-top:2px solid rgba(63,184,127,.3)"><td class="salname" style="font-weight:700;color:var(--ok)">💰 Coût brut / jour</td>';
    JOURS_SH.forEach((_,i)=>{
      const date=fmtDate(dateOfDay(i));
      let dayCost=0;
      S.creneaux.filter(c=>c.date===date&&onRoster(salById(c.salarie_id))).forEach(c=>{ dayCost += (_dur3(c.heure_debut,c.heure_fin)/60) * tauxOf(c.salarie_id); });
      footHTML+=`<td class="footDay" data-i="${i}" colspan="4" style="text-align:center;font-weight:700;color:${dayCost>0?'var(--ok)':'var(--muted)'};font-size:12px">${dayCost>0?dayCost.toFixed(0)+' €':'—'}</td>`;
    });
    footHTML+=`<td class="footBrut" style="text-align:center;font-weight:700;color:var(--ok);background:rgba(63,184,127,.1);font-size:13px">${totalBrutSem.toFixed(0)} €<br><small style="font-weight:400;color:var(--muted);font-size:9.5px">brut hebdo</small></td>`;
    footHTML+=`<td class="footChg" style="text-align:center;font-weight:700;color:var(--ok);background:rgba(63,184,127,.15);font-size:13px">${totalChgSem.toFixed(0)} €<br><small style="font-weight:400;color:var(--muted);font-size:9.5px">chargé (∑ indiv.)</small></td>`;
    footHTML+='</tr>';
    tbody+=footHTML;
  }

  tbody+='</tbody>';
  document.getElementById('planTbl').innerHTML=thead+tbody;
}

// Recalcule en place les coûts (lignes + footer/jour + totaux hebdo) SANS reconstruire les cellules éditables
// → réactivité temps réel à chaque ajout/modif/suppression de créneau, sans voler le focus du clavier.
function recomputeAggregates(){
  const tbl=document.getElementById('planTbl'); if(!tbl) return;
  const _toMin=t=>{if(!t)return null;const[h,m]=t.slice(0,5).split(':').map(Number);return h*60+m;};
  const _dur=(d,f)=>{let a=_toMin(d),b=_toMin(f);if(a==null||b==null)return 0;if(b<=a)b+=1440;return b-a;};
  const coefOrg=Number(ORG.coef_charges)||1.420;
  const tauxOf=sid=>{const ss=salById(sid);return Number(ss?.taux_horaire_brut)||0;};
  const coefOf=sid=>{const ss=salById(sid);const cp=Number(ss?.coef_charges_perso);return isFinite(cp)&&cp>0?cp:coefOrg;};
  const minOf=sid=>S.creneaux.filter(c=>c.salarie_id===sid).reduce((a,c)=>a+_dur(c.heure_debut,c.heure_fin),0);
  // Lignes : heures + coût par salarié
  tbl.querySelectorAll('td.rowHours').forEach(td=>{
    const sid=td.dataset.sid, s=salById(sid); if(!s) return;
    const totH=minOf(sid)/60, minH=s.heures_min||0, maxH=s.heures_max||s.plafond_heures||48;
    let color='var(--text)'; if(maxH&&totH>maxH)color='var(--bad)'; else if(minH&&totH<minH)color='var(--warn)'; else if(totH>0)color='var(--ok)';
    const range=minH||maxH?`<small style="color:var(--muted);font-weight:400;display:block;font-size:9.5px;margin-top:1px">${minH||0}–${maxH||'?'}h</small>`:'';
    td.style.color=color; td.innerHTML=`${totH.toFixed(1)}h${range}`;
  });
  tbl.querySelectorAll('td.rowCost').forEach(td=>{
    const sid=td.dataset.sid, s=salById(sid); if(!s) return;
    const totH=minOf(sid)/60, taux=Number(s.taux_horaire_brut)||0, coefEff=coefOf(sid), cp=Number(s.coef_charges_perso);
    const costBrut=totH*taux, costChg=costBrut*coefEff;
    const costStr=taux>0?costBrut.toFixed(0)+' € <small style="color:var(--muted);font-weight:400">brut</small>':'<span style="color:var(--muted);font-weight:400">—</span>';
    const chgStr=taux>0?`<small style="color:var(--ok);font-weight:600;display:block;font-size:10.5px;margin-top:1px">${costChg.toFixed(0)} € chargé <span style="color:var(--muted);font-weight:400">×${coefEff.toFixed(3)}${cp>0?'*':''}</span></small>`:'<small style="color:var(--warn);font-weight:400;display:block;font-size:9.5px;margin-top:1px">taux ?</small>';
    td.style.color=costBrut>0?'var(--text)':'var(--muted)'; td.innerHTML=`${costStr}${chgStr}`;
  });
  // Footer : coût par jour + totaux hebdo
  const sids=[...tbl.querySelectorAll('td.rowHours')].map(td=>td.dataset.sid);
  let totalBrut=0,totalChg=0;
  sids.forEach(sid=>{ const h=minOf(sid)/60; totalBrut+=h*tauxOf(sid); totalChg+=h*tauxOf(sid)*coefOf(sid); });
  tbl.querySelectorAll('td.footDay').forEach(td=>{
    const date=fmtDate(dateOfDay(+td.dataset.i)); let dc=0;
    S.creneaux.filter(c=>c.date===date&&onRoster(salById(c.salarie_id))).forEach(c=>{ dc+=(_dur(c.heure_debut,c.heure_fin)/60)*tauxOf(c.salarie_id); });
    td.style.color=dc>0?'var(--ok)':'var(--muted)'; td.innerHTML=dc>0?dc.toFixed(0)+' €':'—';
  });
  const fb=tbl.querySelector('td.footBrut'); if(fb) fb.innerHTML=`${totalBrut.toFixed(0)} €<br><small style="font-weight:400;color:var(--muted);font-size:9.5px">brut hebdo</small>`;
  const fc=tbl.querySelector('td.footChg'); if(fc) fc.innerHTML=`${totalChg.toFixed(0)} €<br><small style="font-weight:400;color:var(--muted);font-size:9.5px">chargé (∑ indiv.)</small>`;
}

function setSS(state,msg){const el=document.getElementById('ss');el.className='save-state '+state;el.textContent=msg;}

async function saveCell(sid,date,svc,which,el){
  const raw=el.value;
  const v=normTime(raw);
  if(v===null){setSS('err','Format invalide (HH:MM)');el.value=el.dataset.saved||'';return;}
  el.value=v;
  if(v===(el.dataset.saved||'')) return;
  const existing=getCreneau(sid,date,svc);
  const before=existing?{...existing}:null;
  const cr=existing?{...existing}:{salarie_id:sid,restaurant_id:SNACK.id,date,service:svc,role:roleMain(sid)||'cuisine'};
  if(which==='deb') cr.heure_debut=v||null; else cr.heure_fin=v||null;
  // Si vide des 2 côtés → suppression (aucune validation à faire)
  if(!cr.heure_debut && !cr.heure_fin){
    el.dataset.saved=v;
    setSS('busy','Enregistrement…');
    if(cr.id){
      const{error}=await sb.from('planning_creneaux').delete().eq('id',cr.id);
      if(error){setSS('err','Erreur: '+error.message);return;}
    }
    S.creneaux=S.creneaux.filter(c=>!(c.salarie_id===sid && c.date===date && c.service===svc));
    S.allCreneauxWeek=S.allCreneauxWeek.filter(c=>!(c.salarie_id===sid && c.date===date && c.service===svc && c.restaurant_id===SNACK.id));
    recordAction(before,null);
    setSS('ok','Enregistré ✓');renderEffectifs();renderChecks();updateConflictsUI();recomputeAggregates();return;
  }
  // ── Validation BLOQUANTE — même source de vérité que l'auto-fill (checkPlacement, mode manuel).
  //    Ne s'exécute que sur un créneau COMPLET (début ET fin). Une règle active enfreinte bloque
  //    la saisie ; le manager peut FORCER en dérogation (remplacement d'urgence) via une double
  //    confirmation + motif obligatoire, journalisée dans planning_derogations. Remplace l'ancien
  //    simple avertissement d'indispo (désormais capté par checkPlacement → cle 'indispo').
  let derog=null;
  if(cr.heure_debut && cr.heure_fin){
    const di=(new Date(date).getDay()+6)%7;
    const shift={deb:(cr.heure_debut||'').slice(0,5),fin:(cr.heure_fin||'').slice(0,5),role:cr.role,exp:false};
    const viol=checkPlacement(sid,shift,date,svc,di,{manual:true,excludeSelf:true});
    if(viol){
      const sal=S.salaries.find(s=>s.id===sid); const nm=[sal?.prenom,sal?.nom].filter(Boolean).join(' ')||sal?.nom||'?';
      if(!confirm(`⛔ Règle enfreinte : ${viol.label}\n\n${nm} · ${JOURS[di]} ${svc} ${shift.deb}→${shift.fin}\n\nCette saisie n'est pas conforme.\nForcer quand même en DÉROGATION (remplacement d'urgence) ?`)){
        el.value=el.dataset.saved||''; setSS('',''); return;
      }
      const motif=(prompt('Dérogation — motif obligatoire (ex. remplacement urgent) :','')||'').trim();
      if(!motif){ el.value=el.dataset.saved||''; setSS('err','Dérogation annulée : motif requis'); return; }
      derog={viol,motif};
    }
  }
  el.dataset.saved=v;
  setSS('busy','Enregistrement…');
  // upsert
  const payload={restaurant_id:SNACK.id,salarie_id:sid,date,service:svc,role:cr.role,heure_debut:cr.heure_debut,heure_fin:cr.heure_fin};
  const{data,error}=await sb.from('planning_creneaux').upsert(payload,{onConflict:'restaurant_id,salarie_id,date,service'}).select().single();
  if(error){setSS('err','Erreur: '+error.message);return;}
  S.creneaux=S.creneaux.filter(c=>!(c.salarie_id===sid && c.date===date && c.service===svc));S.creneaux.push(data);
  S.allCreneauxWeek=S.allCreneauxWeek.filter(c=>!(c.salarie_id===sid && c.date===date && c.service===svc && c.restaurant_id===SNACK.id));S.allCreneauxWeek.push(data);
  recordAction(before,data);
  if(derog) logDerogation(sid,date,svc,derog.viol,derog.motif);
  setSS('ok',derog?'Enregistré — dérogation ⚠':'Enregistré ✓');renderEffectifs();renderChecks();updateConflictsUI();recomputeAggregates();
  // Alerte si conflit avec un autre snack (sauf si popups désactivés)
  if(POPUP_ALERTS && CONFLICTS.has(`${sid}|${date}|${svc}`)){
    const sal=S.salaries.find(x=>x.id===sid);
    const det=describeConflict(sid,date);
    alert(`⚠ Conflit inter-snack\n\n${[sal?.prenom,sal?.nom].filter(Boolean).join(' ')} est déjà sur :\n${det}\n\nLes cellules en conflit sont marquées en rouge.`);
  }
}
// Journalise une dérogation manuelle. forced_by = utilisateur courant (imposé aussi par la RLS
// WITH CHECK). Best-effort : un échec de log ne bloque jamais l'enregistrement du créneau.
async function logDerogation(sid,date,svc,viol,motif){
  try{
    await sb.from('planning_derogations').insert({restaurant_id:SNACK.id,salarie_id:sid,date,service:svc,regle_cle:viol.cle,regle_label:viol.label,motif,forced_by:ME&&ME.id});
  }catch(e){ console.warn('[planning] journalisation dérogation échouée', e); }
}

let CHECKS=[];
function renderChecks(){
  CHECKS=[];
  const _rc=_ruleCtx();
  const toMin=t=>{if(!t)return null;const[h,m]=t.slice(0,5).split(':').map(Number);return h*60+m;};
  const dur=(deb,fin)=>{let a=toMin(deb),b=toMin(fin);if(a==null||b==null)return 0;if(b<=a)b+=24*60;return b-a;};
  const dayIdxOfDate=d=>(new Date(d).getDay()+6)%7;
  const nameOf=sid=>{const s=S.salaries.find(x=>x.id===sid);return [s?.prenom,s?.nom].filter(Boolean).join(' ')||s?.nom||'?';};

  // 1. Effectifs cibles — effectifs_exacts ON : tout écart (sous OU sur-effectif) est signalé ;
  //    OFF : seul le SOUS-effectif l'est (le sur-effectif est toléré).
  const _exact=_rc.on('effectifs_exacts',true);
  const eff=[], expMiss=[];
  for(let i=0;i<7;i++)for(const svc of ['midi','soir']){
    const t=targetFor(i,svc);const date=fmtDate(dateOfDay(i));
    S.orgRoles.forEach(r=>{
      const tgt=t[r.cle]||{cible:0};
      const assigned=S.creneaux.filter(c=>c.date===date&&c.service===svc&&c.role===r.cle&&c.heure_debut&&onRoster(salById(c.salarie_id)));
      const n=assigned.length;
      if(_exact ? (n!==tgt.cible) : (n<tgt.cible)) eff.push(`${JOURS[i]} ${svc} · ${r.nom} : ${n}/${tgt.cible}`);
      // Expérimenté requis : groupé PAR HORAIRE de début (plusieurs postes peuvent commencer à la même heure,
      // certains exp d'autres non → on compare le nombre d'expérimentés PRÉSENTS au nombre REQUIS à cet horaire).
      const expByDeb={};
      getShifts(dayJourType(i),svc,r.cle).forEach(v=>{ if(v.exp){ expByDeb[v.deb]=expByDeb[v.deb]||{n:0,fin:v.fin}; expByDeb[v.deb].n++; } });
      Object.entries(expByDeb).forEach(([deb,info])=>{
        const atDeb=assigned.filter(x=>(x.heure_debut||'').slice(0,5)===deb);
        const expPresent=atDeb.filter(x=>isExp(x.salarie_id,r.cle)).length;
        const missing=info.n-expPresent;
        if(missing>0) expMiss.push(`${JOURS[i]} ${svc} · ${r.nom} · poste ${deb}→${info.fin} : ${missing} expérimenté(s) requis non couvert(s)${atDeb.length>=info.n?' (postes tenus par des non-expérimentés)':''}`);
      });
    });
  }
  CHECKS.push({lbl:'Effectifs cibles',ok:eff.length===0,details:eff});
  CHECKS.push({lbl:'Expérimentés requis par poste',ok:expMiss.length===0,details:expMiss});

  // 2. Doublons inter-snack
  const conf=[];
  for(const c of S.allCreneauxWeek){
    if(!c.heure_debut || c.restaurant_id!==SNACK.id)continue;
    const others=S.allCreneauxWeek.filter(x=>x.salarie_id===c.salarie_id && x.date===c.date && x.restaurant_id!==c.restaurant_id && x.heure_debut && _overlap(c,x));
    if(others.length){
      const oList=others.map(o=>{const r=S.restos.find(x=>x.id===o.restaurant_id);return `${shortSnack(r?.nom||'')} ${o.service} ${(o.heure_debut||'').slice(0,5)}→${(o.heure_fin||'').slice(0,5)||'?'}`;}).join(' / ');
      conf.push(`${nameOf(c.salarie_id)} · ${JOURS[dayIdxOfDate(c.date)]} ${c.service} ${(c.heure_debut||'').slice(0,5)}→${(c.heure_fin||'').slice(0,5)||'?'} ↔ ${oList}`);
    }
  }
  CHECKS.push({lbl:'Pas de doublon inter-snack',ok:conf.length===0,details:conf});

  // 3. Coupure minimale (valeur de la règle coupure_min, comme checkPlacement — plus de 3h codé en dur)
  const coupMin=_rc.num('coupure_min',3);
  const coup=[];
  const bySD={};S.creneaux.forEach(c=>{const k=c.salarie_id+'|'+c.date;bySD[k]=bySD[k]||{};bySD[k][c.service]=c;});
  Object.entries(bySD).forEach(([k,svcs])=>{
    if(svcs.midi?.heure_fin && svcs.soir?.heure_debut){
      const diff=(toMin(svcs.soir.heure_debut)-toMin(svcs.midi.heure_fin))/60;
      if(diff>0 && diff<coupMin){const[sid,date]=k.split('|');coup.push(`${nameOf(sid)} · ${JOURS[dayIdxOfDate(date)]} : ${diff.toFixed(1)}h entre midi et soir`);}
    }
  });
  CHECKS.push({lbl:`Coupure ≥ ${coupMin}h`,ok:coup.length===0,details:coup});

  // 4. Jours de repos mini / semaine (valeur jour_off_min, comme checkPlacement — plus de « 7/7 » codé en dur)
  const offMin=_rc.num('jour_off_min',1);
  const noOff=[];
  const list=S.salaries.filter(s=>worksAt(s,SNACK.id));
  list.forEach(s=>{const d=new Set(S.creneaux.filter(c=>c.salarie_id===s.id && c.heure_debut).map(c=>c.date));const off=7-d.size;if(d.size>0 && off<offMin)noOff.push(`${nameOf(s.id)} : ${d.size} jours travaillés (${off} repos < ${offMin})`);});
  CHECKS.push({lbl:`≥ ${offMin} jour(s) off`,ok:noOff.length===0,details:noOff});

  // 5. Plafond heures (propriété salarié SINON règle plafond_hebdo — même logique que checkPlacement)
  const over=[];
  list.forEach(s=>{
    const plaf=(s.plafond_heures||_rc.num('plafond_hebdo',48))*60;
    const total=S.creneaux.filter(c=>c.salarie_id===s.id).reduce((a,c)=>a+dur(c.heure_debut,c.heure_fin),0);
    if(total>plaf) over.push(`${nameOf(s.id)} : ${(total/60).toFixed(1)}h > ${plaf/60}h`);
  });
  CHECKS.push({lbl:'Plafond heures hebdo',ok:over.length===0,details:over});

  // 5b. Heure de fin max (fin_semaine lun→jeu / fin_weekend ven+sam) — miroir a posteriori des
  //     plafonds durs de checkPlacement, pour que toute règle dure apparaisse aussi dans ce panneau.
  const finCap=[];
  S.creneaux.forEach(c=>{
    if(!c.heure_fin || !c.heure_debut) return;
    const cap=_endCapMin(_rc, dayIdxOfDate(c.date)); if(!cap) return;
    let endM=toMin(c.heure_fin), debM=toMin(c.heure_debut); if(endM==null||debM==null)return; if(endM<=debM)endM+=1440;
    if(endM>cap.capM) finCap.push(`${nameOf(c.salarie_id)} · ${JOURS[dayIdxOfDate(c.date)]} ${c.service} : fin ${(c.heure_fin||'').slice(0,5)} (au-delà du plafond ${cap.cle==='fin_semaine'?'lun→jeu':'ven & sam'})`);
  });
  CHECKS.push({lbl:'Heure de fin max (jour)',ok:finCap.length===0,details:finCap});

  // 6. Amplitude max consécutive (valeur amplitude_max, comme checkPlacement — plus de 12h codé en dur)
  const ampMax=_rc.num('amplitude_max',12);
  const amp=[];
  const bySD2={};S.creneaux.forEach(c=>{const k=c.salarie_id+'|'+c.date;bySD2[k]=bySD2[k]||{};bySD2[k][c.service]=c;});
  Object.entries(bySD2).forEach(([k,svcs])=>{
    const midi=svcs.midi, soir=svcs.soir;
    const blocs=[];
    const mkBloc=(c)=>{if(!c||!c.heure_debut)return null;let d=toMin(c.heure_debut),f=toMin(c.heure_fin);if(f==null)return null;if(f<=d)f+=24*60;return {d,f};};
    const m=mkBloc(midi),s=mkBloc(soir);
    if(m && s){
      // si pause ≥ 30 min entre fin midi et début soir → 2 blocs distincts
      const sStartAdj=s.d<m.f?s.d+24*60:s.d;
      const gap=sStartAdj-m.f;
      if(gap>=30) {blocs.push(m);blocs.push(s);} else {blocs.push({d:m.d,f:s.f<=m.d?s.f+24*60:s.f});}
    } else if(m) blocs.push(m);
    else if(s) blocs.push(s);
    for(const b of blocs){
      const a=b.f-b.d;
      if(a>ampMax*60){const[sid,date]=k.split('|');amp.push(`${nameOf(sid)} · ${JOURS[dayIdxOfDate(date)]} : ${(a/60).toFixed(1)}h consécutives`);}
    }
  });
  CHECKS.push({lbl:`Amplitude ≤ ${ampMax}h consécutives`,ok:amp.length===0,details:amp});

  // 7. Fin 2h → pas matin
  const fin2=[];
  Object.entries(bySD2).forEach(([k,svcs])=>{
    const soir=svcs.soir;if(!soir||!soir.heure_fin)return;
    const fm=toMin(soir.heure_fin);
    if(fm!=null && fm>=0 && fm<=180){
      const[sid,date]=k.split('|');const nd=fmtDate(new Date(new Date(date).getTime()+86400000));
      const nm=S.creneaux.find(c=>c.salarie_id===sid && c.date===nd && c.service==='midi' && c.heure_debut);
      if(nm && toMin(nm.heure_debut)<15*60) fin2.push(`${nameOf(sid)} · ${JOURS[dayIdxOfDate(date)]}→${JOURS[dayIdxOfDate(nd)]} : fin ${(soir.heure_fin||'').slice(0,5)} puis matin ${(nm.heure_debut||'').slice(0,5)}`);
    }
  });
  CHECKS.push({lbl:'Fin 2h → pas matin J+1',ok:fin2.length===0,details:fin2});

  // 8. Repos quotidien (fin soir J → matin J+1) — TOUJOURS contrôlé (obligation légale 11h).
  //    Fin de soir en absolu (≤ début ⇒ +24h) pour ne pas sous-estimer le repos quand le soir
  //    finit après minuit (ex. 00:30) — même correction que dans checkPlacement.
  {
    const reposMin=_rc.num('repos_quotidien_h',11)*60, reposBad=[];
    const finAbs=(deb,fin)=>{let a=toMin(deb),b=toMin(fin);if(a==null||b==null)return null;if(b<=a)b+=1440;return b;};
    Object.entries(bySD2).forEach(([k,svcs])=>{
      const soir=svcs.soir; if(!soir||!soir.heure_fin)return;
      const[sid,date]=k.split('|'); const nd=fmtDate(new Date(new Date(date).getTime()+86400000));
      const nm=S.creneaux.find(c=>c.salarie_id===sid && c.date===nd && c.service==='midi' && c.heure_debut);
      if(nm){ const se=finAbs(soir.heure_debut,soir.heure_fin); if(se==null)return; const g=(toMin(nm.heure_debut)+1440)-se; if(g<reposMin) reposBad.push(`${nameOf(sid)} · ${JOURS[dayIdxOfDate(date)]}→${JOURS[dayIdxOfDate(nd)]} : ${(g/60).toFixed(1)}h de repos (min ${reposMin/60}h)`); }
    });
    CHECKS.push({lbl:`Repos quotidien ≥ ${reposMin/60}h (légal)`,ok:reposBad.length===0,details:reposBad});
  }

  // 8b. Repos HEBDOMADAIRE ≥ 35h consécutives (24h hebdo + 11h quotidien accolés).
  //     Vérif réelle : on cherche le plus grand créneau de repos continu sur la semaine
  //     affichée (segments de travail fusionnés, en minutes depuis lundi 00:00, plus les
  //     bords de semaine). Un simple « 1 jour off » ne garantit pas toujours 35h.
  const repos35=[];
  const listW=S.salaries.filter(s=>onRoster(s) && worksAt(s,SNACK.id));
  listW.forEach(s=>{
    const segs=[];
    S.creneaux.filter(c=>c.salarie_id===s.id && c.heure_debut && c.heure_fin).forEach(c=>{
      const di=dayIdxOfDate(c.date); let a=di*1440+toMin(c.heure_debut), b=di*1440+toMin(c.heure_fin);
      if(b<=a)b+=1440; segs.push([a,b]);
    });
    if(!segs.length) return; // aucun créneau → semaine entièrement de repos, conforme
    segs.sort((x,y)=>x[0]-y[0]);
    const merged=[segs[0].slice()];
    for(let i=1;i<segs.length;i++){ const last=merged[merged.length-1]; if(segs[i][0]<=last[1]) last[1]=Math.max(last[1],segs[i][1]); else merged.push(segs[i].slice()); }
    let maxGap=merged[0][0];                       // repos du lundi 00:00 au 1er créneau
    maxGap=Math.max(maxGap, 10080-merged[merged.length-1][1]); // du dernier créneau au dimanche 24:00
    for(let i=1;i<merged.length;i++) maxGap=Math.max(maxGap, merged[i][0]-merged[i-1][1]);
    if(maxGap < 35*60) repos35.push(`${nameOf(s.id)} : plus long repos continu ${(maxGap/60).toFixed(1)}h (min 35h)`);
  });
  CHECKS.push({lbl:'Repos hebdomadaire ≥ 35h',ok:repos35.length===0,details:repos35});

  // 9. Alternance / CFA — aucun service sur jour école/examen + veille protégée
  if(S.altJours && Object.keys(S.altJours).length){
    const cfaViol=[];
    S.creneaux.forEach(c=>{
      if(!c.heure_debut) return;
      const ad=altDayType(c.salarie_id,c.date);
      if(ad==='ecole'||ad==='examen'){ cfaViol.push(`${nameOf(c.salarie_id)} · ${JOURS[dayIdxOfDate(c.date)]} : placé un jour ${ad==='examen'?'d\'EXAMEN':'d\'ÉCOLE'} CFA`); return; }
      const nd=fmtDate(new Date(new Date(c.date).getTime()+86400000)); const nextAd=altDayType(c.salarie_id,nd);
      if(nextAd==='ecole'||nextAd==='examen'){
        const r=_rc.raw(nextAd==='examen'?'fin_veille_examen':'fin_veille_ecole');
        const seuil=(r&&r.active===false)?null:((r&&r.valeur)||(nextAd==='examen'?'19:00':'22:00'));
        if(seuil){ const fm=toMin(c.heure_fin),dm=toMin(c.heure_debut); const late=(fm!=null&&dm!=null&&fm<=dm)||(fm!=null&&fm>toMin(seuil));
          if(late) cfaViol.push(`${nameOf(c.salarie_id)} · ${JOURS[dayIdxOfDate(c.date)]} : fin ${(c.heure_fin||'').slice(0,5)} la veille d'un ${nextAd==='examen'?'examen':'jour d\'école'} (seuil ${seuil})`); }
      }
    });
    CHECKS.push({lbl:'Alternance (école / veille)',ok:cfaViol.length===0,details:cfaViol});
  }

  // 10. Couverture continue (soft, activable) — pour chaque jour/service/rôle requis, les
  //     créneaux de ce rôle doivent couvrir sans trou la plage travaillée (≥15 min sans
  //     personne du rôle = trou). On suit la fin MAX courante pour tolérer les chevauchements.
  if(_rc.on('couverture_continue',false)){
    const gaps=[];
    for(let i=0;i<7;i++)for(const svc of ['midi','soir']){
      const date=fmtDate(dateOfDay(i)); const t=targetFor(i,svc);
      S.orgRoles.forEach(r=>{
        if(!((t[r.cle]||{}).cible)) return;
        const cre=S.creneaux.filter(c=>c.date===date&&c.service===svc&&c.role===r.cle&&c.heure_debut&&c.heure_fin&&onRoster(salById(c.salarie_id)))
          .map(c=>{let a=toMin(c.heure_debut),b=toMin(c.heure_fin);if(b<=a)b+=1440;return [a,b];}).sort((x,y)=>x[0]-y[0]);
        if(cre.length<2) return;
        let end=cre[0][1];
        for(let j=1;j<cre.length;j++){ if(cre[j][0]-end>=15){ gaps.push(`${JOURS[i]} ${svc} · ${r.nom} : trou de ${((cre[j][0]-end)/60).toFixed(1)}h dans la couverture`); break; } end=Math.max(end,cre[j][1]); }
      });
    }
    CHECKS.push({lbl:'Couverture continue',ok:gaps.length===0,details:gaps});
  }

  // 11. Départs échelonnés (soft, activable) — signale les « pics » de départ : ≥3 personnes
  //     qui finissent exactement à la même heure sur un même service.
  if(_rc.on('departs_echelonnes',false)){
    const pics=[];
    for(let i=0;i<7;i++)for(const svc of ['midi','soir']){
      const date=fmtDate(dateOfDay(i)); const byFin={};
      S.creneaux.filter(c=>c.date===date&&c.service===svc&&c.heure_fin&&onRoster(salById(c.salarie_id))).forEach(c=>{const f=(c.heure_fin||'').slice(0,5);byFin[f]=(byFin[f]||0)+1;});
      Object.entries(byFin).forEach(([f,n])=>{ if(n>=3) pics.push(`${JOURS[i]} ${svc} : ${n} départs simultanés à ${f}`); });
    }
    CHECKS.push({lbl:'Départs échelonnés',ok:pics.length===0,details:pics});
  }

  // 12. Temps partiel — heures complémentaires plafonnées (soft, activable). Proxy « temps
  //     partiel » = heures_max renseigné et < 35h (aucun champ dédié en base). Cap = heures_max
  //     × pct/100. Signalement seulement : heures_max n'est saisi que sur une partie des fiches.
  if(_rc.on('temps_partiel_max',false)){
    const pct=_rc.num('temps_partiel_max',140)/100, tp=[];
    listW.forEach(s=>{
      const base=Number(s.heures_max); if(!(base>0 && base<35)) return;
      const cap=base*pct;
      const h=S.creneaux.filter(c=>c.salarie_id===s.id).reduce((a,c)=>a+dur(c.heure_debut,c.heure_fin),0)/60;
      if(h>cap+1e-6) tp.push(`${nameOf(s.id)} : ${h.toFixed(1)}h > ${cap.toFixed(1)}h (contrat ${base}h × ${(pct*100).toFixed(0)}%)`);
    });
    CHECKS.push({lbl:'Heures compl. temps partiel',ok:tp.length===0,details:tp});
  }

  document.getElementById('checks').innerHTML=CHECKS.map((c,i)=>{
    const n=c.details.length;const hasD=n>0;
    return `<button class="chk ${c.ok?'ok':'ko'}" ${hasD?`onclick="showCheckDetails(${i})"`:''} style="${hasD?'cursor:pointer':'cursor:default'}">${c.ok?'✓':'⚠'} ${c.lbl}${n?` (${n})`:''}</button>`;
  }).join('');
}

function showCheckDetails(i){
  const c=CHECKS[i];if(!c||!c.details.length)return;
  document.getElementById('pdfModal').innerHTML=`
  <div class="pdf-bg" onclick="if(event.target===this)document.getElementById('pdfModal').innerHTML=''">
    <div class="pdf-modal" style="max-width:560px">
      <h3>${c.ok?'✓':'⚠'} ${c.lbl} <span style="color:var(--muted);font-weight:400;font-size:12px">(${c.details.length})</span></h3>
      <div style="max-height:60vh;overflow:auto;background:var(--surface);border:1px solid var(--line-2);border-radius:8px;padding:12px;font-size:12.5px;line-height:1.7">
        ${c.details.map(d=>`<div>• ${d}</div>`).join('')}

function renderPosteTable(){
  const fullName=s=>[s.prenom,s.nom].filter(Boolean).join(' ')||s.nom||'?';
  // Construire la liste des postes (svc, role, index) avec max sur la semaine
  const rows=[];
  for(const svc of ['midi','soir'])for(const _r of S.orgRoles){const role=_r.cle;
    let maxN=0;
    for(let i=0;i<7;i++){const s=getShifts(dayJourType(i),svc,role);if(s.length>maxN)maxN=s.length;}
    for(let k=0;k<maxN;k++)rows.push({svc,role,k});
  }
  // header : Poste | Lu | Ma | ... | Di
  let html='<thead><tr><th class="salhead">Poste</th>';
  JOURS_SH.forEach((j,i)=>html+=`<th class="dayhead">${j} <span style="color:var(--muted);font-weight:400">${dateOfDay(i).getDate()}</span></th>`);
  html+='</tr></thead><tbody>';

  if(!rows.length){
    html+='<tr><td colspan="8" style="text-align:center;padding:30px;color:var(--muted)">Aucun poste défini pour ce snack — configure les effectifs dans Réglages</td></tr></tbody>';
    document.getElementById('planTbl').innerHTML=html;return;
  }

  let lastGroup=null;
  for(const{svc,role,k}of rows){
    const groupLbl=svc==='midi'?'MIDI':'SOIR';
    const groupKey=svc+'-'+role;
    // Ligne d'en-tête de section quand le groupe change
    if(lastGroup!==groupKey){
      const roleLbl=roleNom(role);
      const groupColor=svc==='midi'?'rgba(232,160,106,.15)':'rgba(91,156,255,.12)';
      html+=`<tr><td colspan="8" style="background:${groupColor};padding:8px 14px;font-size:11px;font-weight:700;color:${svc==='midi'?'#e8a06a':'#5b9cff'};text-transform:uppercase;letter-spacing:.08em;border-top:2px solid var(--line)">${groupLbl} · ${roleLbl}</td></tr>`;
      lastGroup=groupKey;
    }
    const roleSym=roleNom(role);
    const bg=svc==='midi'?'rgba(232,160,106,.04)':'rgba(91,156,255,.04)';
    html+=`<tr><td class="salname" style="background:${bg}"><b>${roleSym} ${k+1}</b></td>`;
    for(let i=0;i<7;i++){
      const shifts=getShifts(dayJourType(i),svc,role);
      const shift=shifts[k];
      const date=fmtDate(dateOfDay(i));
      if(!shift){html+=`<td style="background:rgba(255,255,255,.015);text-align:center;color:var(--muted);font-size:11px">—</td>`;continue;}
      const matchingByOrder=S.creneaux.filter(c=>c.date===date&&c.service===svc&&c.role===role&&c.heure_debut).sort((a,b)=>(a.heure_debut||'').localeCompare(b.heure_debut||''));
      const cr=matchingByOrder[k]||null;
      const candidates=S.salaries.filter(s=>{
        if(s.actif===false)return false;
        if(!worksAt(s,SNACK.id))return false;
        if(!rolesOf(s.id).includes(role))return false;
        return true;
      }).sort((a,b)=>(a.nom||'').localeCompare(b.nom||''));
      const selSid=cr?cr.salarie_id:'';
      const selColor=cr?(S.salaries.find(s=>s.id===cr.salarie_id)?.couleur||''):'';
      const conflictKey=cr?`${cr.salarie_id}|${date}|${svc}`:'';
      const isConf=cr&&CONFLICTS.has(conflictKey);
      html+=`<td style="background:${selColor?selColor+'25':bg};${selColor?'border-left:3px solid '+selColor:''};${isConf?'box-shadow:inset 0 0 0 1.5px var(--bad);':''};padding:5px 6px">
        <select onchange="assignPosteCell('${date}','${svc}','${role}','${shift.deb}','${shift.fin}',this.value,'${cr?cr.id:''}')" style="width:100%;background:transparent;border:1px solid var(--line-2);color:var(--text);padding:4px 6px;border-radius:5px;font-size:11.5px;font-weight:600;cursor:pointer">
          <option value="">— vacant —</option>
          ${candidates.map(s=>`<option value="${s.id}" ${s.id===selSid?'selected':''}>${fullName(s)} ${isExp(s.id,role)?'★':'🔰'}</option>`).join('')}
        </select>
        <div style="color:var(--muted);font-size:10px;text-align:center;margin-top:3px;font-family:monospace">${shift.deb}→${shift.fin}</div>
      </td>`;
    }
    html+='</tr>';
  }
  html+='</tbody>';
  document.getElementById('planTbl').innerHTML=html;
}

async function assignPosteCell(date,svc,role,deb,fin,newSid,oldCreneauId){
  setSS('busy','Enregistrement…');
  beginTxn();
  // 1) Si l'ancien existait et qu'on change → supprimer (ou modifier)
  if(oldCreneauId){
    const oldCr=S.creneaux.find(c=>c.id===oldCreneauId);
    if(oldCr && (!newSid || newSid !== oldCr.salarie_id)){
      await sb.from('planning_creneaux').delete().eq('id',oldCreneauId);
      S.creneaux=S.creneaux.filter(c=>c.id!==oldCreneauId);
      S.allCreneauxWeek=S.allCreneauxWeek.filter(c=>c.id!==oldCreneauId);
      if(_txn)_txn.push({before:oldCr,after:null});
    }
  }
  // 2) Si nouveau salarié sélectionné → upsert
  if(newSid){
    const payload={restaurant_id:SNACK.id,salarie_id:newSid,role,date,service:svc,heure_debut:deb,heure_fin:fin};
    const{data,error}=await sb.from('planning_creneaux').upsert(payload,{onConflict:'restaurant_id,salarie_id,date,service'}).select().single();
    if(error){setSS('err','Erreur: '+error.message);endTxn();return;}
    S.creneaux=S.creneaux.filter(c=>!(c.salarie_id===newSid&&c.date===date&&c.service===svc));S.creneaux.push(data);
    S.allCreneauxWeek=S.allCreneauxWeek.filter(c=>!(c.salarie_id===newSid&&c.date===date&&c.service===svc&&c.restaurant_id===SNACK.id));S.allCreneauxWeek.push(data);
    if(_txn)_txn.push({before:null,after:data});
  }
  endTxn();
  setSS('ok','Enregistré ✓');
  render();
}

}

      } else if(!isBool) {
        valueInput=`<input type="text" value="${r.valeur||''}" onblur="saveRegle('${r.id}','valeur',this.value)" style="width:120px;padding:7px 10px;border-radius:6px;border:1px solid var(--line-2);background:var(--bg);color:var(--text);font-size:13px">`;
      }

      if(isBool && r.cle==='repos_quotidien'){

        html+=`<div style="display:flex;align-items:center;gap:14px;padding:12px 16px;border-top:1px solid var(--line)">
          <label style="display:flex;align-items:center;gap:10px;flex:1;cursor:not-allowed;opacity:.9">
            <input type="checkbox" checked disabled style="width:18px;height:18px;cursor:not-allowed">
            <span style="font-size:13.5px">${meta.lbl} <span style="color:var(--gold);font-size:11px;font-weight:600;border:1px solid var(--gold);border-radius:4px;padding:1px 6px;margin-left:6px">🔒 obligation légale</span></span>
          </label>
        </div>`;
      } else if(isBool){
        html+=`<div style="display:flex;align-items:center;gap:14px;padding:12px 16px;border-top:1px solid var(--line)">
          <label style="display:flex;align-items:center;gap:10px;flex:1;cursor:pointer">

            <span style="font-size:13.5px">${meta.lbl}</span>
          </label>
        </div>`;
      } else {
        // Règles à valeur — pas de case, juste le champ
        html+=`<div style="display:flex;align-items:center;gap:14px;padding:12px 16px;border-top:1px solid var(--line)">
          <span style="font-size:13.5px;flex:1">${meta.lbl}</span>
          <div>${valueInput}</div>
        </div>`;
      }
    });
  }
  html+='</div></div>';

  // === ALERTES & COMPORTEMENT ===
  html+=`<div style="margin-bottom:8px">
    <div style="font-size:14px;font-weight:600;margin-bottom:4px">Comportement</div>
    <div style="color:var(--muted);font-size:12px;margin-bottom:12px">Préférences d'affichage et notifications</div>

}

// Suggestion d'heure de fin (plafond) à partir de la fermeture du restaurant + marge (rangement/service).
const FIN_MARGE_MIN=30;
function suggestionFin(cle){
  const ferm = cle==='fin_weekend' ? SNACK.fermeture_weekend : SNACK.fermeture_semaine;
  if(!ferm) return null;
  const[h,m]=String(ferm).slice(0,5).split(':').map(Number);
  if(!isFinite(h)||!isFinite(m)) return null;
  let tot=(h*60+m+FIN_MARGE_MIN)%1440; if(tot<0)tot+=1440;
  return {ferm:String(ferm).slice(0,5), sug:String(Math.floor(tot/60)).padStart(2,'0')+':'+String(tot%60).padStart(2,'0')};
}
// Rendu des règles fin_semaine / fin_weekend dans Réglages.
// - Déjà configurée (valeur ≠ 00:00) : champ éditable normal (sauvegarde onblur, comme avant).
// - Jamais configurée (00:00/vide) + horaires du resto connus : champ PRÉ-REMPLI avec la suggestion,
//   mais SANS écriture auto — un bouton « Enregistrer » explicite est requis (jamais de save silencieux).
// - Jamais configurée + horaires inconnus : champ manuel + message renvoyant vers Paramètres > Restaurants.
function finRuleInput(r){
  const configured = r.valeur && r.valeur!=='00:00';
  const inpSt='padding:7px 10px;border-radius:6px;border:1px solid var(--line-2);background:var(--bg);color:var(--text);font-size:13px;font-weight:600';
  if(configured){
    return `<input type="time" value="${r.valeur}" onblur="saveRegle('${r.id}','valeur',this.value)" style="${inpSt}">`;
  }
  const inpId='finrule_'+r.id;
  const s=suggestionFin(r.cle);
  const saveBtn=`<button class="btn sm" onclick="saveFinRegle('${r.id}','${inpId}')" style="padding:6px 10px">Enregistrer</button>`;
  if(s){
    return `<div style="display:flex;flex-direction:column;gap:5px;align-items:flex-end">
      <div style="display:flex;gap:6px;align-items:center"><input type="time" id="${inpId}" value="${s.sug}" style="${inpSt};border-color:var(--gold)">${saveBtn}</div>
      <div style="color:var(--gold);font-size:10.5px;text-align:right">💡 Suggéré d'après la fermeture ${s.ferm} (+${FIN_MARGE_MIN} min) — <b>non enregistré</b></div>
    </div>`;
  }
  return `<div style="display:flex;flex-direction:column;gap:5px;align-items:flex-end">
    <div style="display:flex;gap:6px;align-items:center"><input type="time" id="${inpId}" value="" style="${inpSt}">${saveBtn}</div>
    <div style="color:var(--muted);font-size:10.5px;max-width:240px;text-align:right;line-height:1.5">Renseigne les heures d'ouverture de <b>${escP(SNACK.nom||'ce restaurant')}</b> dans <a href="../parametres/#restaurants" style="color:var(--gold)">Paramètres › Restaurants</a> pour obtenir une suggestion automatique.</div>
  </div>`;
}

async function saveShifts(){
  const{jt,svc,role,shifts,existingId}=SHIFTS_STATE;
  shifts.sort((a,b)=>(a.deb||'').localeCompare(b.deb||''));
  // Cibles : le jour-type actuel + ceux cochés "Appliquer aussi à"
  const others=[...document.querySelectorAll('.copy-jt:checked')].map(c=>c.value);
  const targets=[jt,...others];
  let savedCount=0;
  for(const targetJt of targets){
    const existing=S.effectifs.find(x=>x.restaurant_id===SNACK.id&&x.jour_type===targetJt&&x.service===svc&&x.role===role);
    const payload={restaurant_id:SNACK.id,jour_type:targetJt,service:svc,role,nb_cible:shifts.length,vagues:shifts};
    if(existing){
      const{error}=await sb.from('planning_effectifs').update(payload).eq('id',existing.id);
      if(error){alert('Erreur sur '+targetJt+': '+error.message);continue;}
      Object.assign(existing,payload);savedCount++;
    } else {
      const{data,error}=await sb.from('planning_effectifs').insert(payload).select().single();
      if(error){alert('Erreur sur '+targetJt+': '+error.message);continue;}
      S.effectifs.push(data);savedCount++;
    }
  }
  closeShiftsEditor();
  setSS('ok',`Postes enregistrés ✓ (${savedCount} jour-type${savedCount>1?'s':''})`);
  openReglages();
}
